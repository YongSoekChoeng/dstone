################################################################
# VM Environment (Jenkins CI/CD deployment path, VM-style bin/*.sh 제어)
################################################################
APP_HOME=/app/dstone
APP_NAME=dstone-knowledge
APP_CONF_DIR=/app/dstone/dstone-knowledge/conf
DB_HOST=localhost
DB_PORT=5432
# dstone-boot 와 같은 Redis. 화면 로그인을 켜면 dstone-boot 의 로그인 세션을 읽는다(dstone.knowledge.console.login).
REDIS_HOST=localhost
REDIS_PORT=6379
# 브라우저가 여는 각 앱 주소(화면 사이 링크, dstone-boot 로그인 넘기기). 서버끼리 부르는 주소가 아니라 브라우저 기준이다.
BOOT_PUBLIC_URL=http://localhost:7081
AI_ENGINE_PUBLIC_URL=http://localhost:8081
KNOWLEDGE_PUBLIC_URL=http://localhost:4081

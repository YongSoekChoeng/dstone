server:
    port: 4081
    error:
        whitelabel:
            enabled: true

spring:
    main:
        allow-bean-definition-overriding: true
    ##########################################################################################
    # <자동설정기능>
    # dstone-common이 Spring Security를 클래스패스에 올려 두기 때문에, 따로 빼 주지 않으면
    # 기본 HTTP Basic 인증이 켜진다. 이 모듈은 Spring Security 필터 체인을 쓰지 않는다.
    # (호출자 인증은 일반 문서 수집 기능을 옮겨 올 때 API 키 필터로 추가할 예정이다.)
    ##########################################################################################
    autoconfigure:
        exclude:
            - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
            - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
    datasource:
        # 분석 결과/그래프/RAG 청크/임베딩을 모두 담는 단일 스키마(PostgreSQL + pgvector).
        # 롤/DB 생성 절차: src/main/resources/schema/01-init-postgresql-dstone-knowledge.sql, docs/software/05.postgresql.md 참고.
        common:
            hikari:
                driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
                jdbc-url: jdbc:log4jdbc:postgresql://${DB_HOST}:${DB_PORT}/dstone_knowledge
                username: dstone_knowledge
                password: ENC(XIXzzg4U/6LYCwsQagqLSeGJt80UdT1bZcI0Msf0nh8=)
                minimum-idle: 2
                maximum-pool-size: 10
                connection-timeout: 30000  # 커넥션 풀에서 커넥션을 얻기 위한 최대 대기시간(ms).
                max-lifetime: 1700000      # 커넥션의 최대 생존시간 (DB timeout 보다 짧게 설정 필요).
                idle-timeout: 600000       # Idle 상태 커넥션의 최대 유지시간.

dstone:
    knowledge:
        # 분석기 버전. 분석 결과(analysis_revision/analysis_job)와 RAG 메타데이터에 같이 남긴다.
        # 분석 규칙이 바뀌어 예전 결과와 섞어 보면 안 될 때 올린다.
        analyzer-version: "1.0"
        # 분석 Job
        job:
            # 동시에 도는 분석 Job 수. 넘치면 대기열에서 기다린다.
            max-concurrent: 2
            # 파일 하나의 처리(읽기, 파싱, 호출 풀기)가 이 시간(초) 안에 끝나지 않으면 그 파일을 건너뛴다(FAILED, 오류 종류 HUNG).
            # 라이브러리가 특정 코드에서 끝나지 않는 경우에 분석 전체가 붙잡히지 않게 하는 마지막 방어선이다.
            # resolve.file-timeout-seconds 보다 넉넉히 커야 한다. 그쪽은 "참조와 참조 사이"에서 스스로 멈추는 부드러운 제한이고,
            # 이쪽은 스스로 멈추지 못할 때 밖에서 끊는 제한이다.
            file-hard-timeout-seconds: 600
            # 그렇게 건너뛴 파일이 이 개수를 넘으면 Job 을 실패시킨다.
            # 건너뛴 파일을 처리하던 스레드는 강제로 끝낼 수 없어서 CPU 를 쓰며 남는다. 그것이 쌓이는 것을 막는다.
            max-stuck-files: 3
        # SCAN 단계 (분석할 파일 목록 만들기)
        scan:
            # 훑지 않을 폴더 이름(쉼표 구분). 빌드 결과물이나 버전 관리 폴더처럼 소스가 아닌 곳.
            # 주의: classes 는 넣지 않는다. 운영 서버에서 받아 온 구버전 웹앱은 WEB-INF/classes 에 소스가 같이 들어 있기도 하다.
            exclude-dirs: ".git,.svn,.hg,node_modules,target,build,.gradle,.idea,.settings,.metadata"
            # 이보다 큰 파일은 목록에는 넣되(해시만 계산) 분석하지 않는다(parse_status=SKIPPED). 기본 5MB.
            max-file-bytes: 5242880
            # 파일 몇 개마다 DB에 쓰고 커밋할지.
            commit-size: 200
        # RESOLVE 단계 (호출이 누구를 가리키는지 풀기)
        resolve:
            # 메모리에 들고 있을 "파싱한 파일" 수. 호출을 풀 때 다른 타입의 선언이 필요하면 그 파일을 파싱해서 여기에 둔다.
            # 크게 하면 빨라지고 메모리를 더 쓴다. 결과는 달라지지 않는다.
            unit-cache-size: 100
            # 파일 하나를 푸는 데 쓸 수 있는 시간(초). 넘기면 그때까지 푼 것만 저장하고 나머지 참조는 "시간 초과"로 남긴다.
            # 해석기가 특정 코드에서 지나치게 오래 걸리는 경우에 그 파일 하나 때문에 분석 전체가 붙잡히지 않게 하려는 것이다.
            file-timeout-seconds: 120

server:
    port: 4081
    error:
        whitelabel:
            enabled: true

spring:
    main:
        allow-bean-definition-overriding: true
    ##########################################################################################
    # <자동설정기능>
    # dstone-common이 Spring Security를 클래스패스에 올려 두기 때문에, 따로 빼 주지 않으면
    # 기본 HTTP Basic 인증이 켜진다. 이 모듈은 Spring Security 필터 체인을 쓰지 않는다.
    # 호출자 인증은 헤더 하나만 보는 가벼운 필터(common.security.ApiKeyAuthFilter)로 한다. 아래 dstone.knowledge.security 참고.
    ##########################################################################################
    autoconfigure:
        exclude:
            - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
            - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
    servlet:
        multipart:
            # 올리는 일반 문서(PDF, Word 등) 한 건의 최대 크기. 기본값(1MB)으로는 웬만한 문서가 다 거절된다.
            max-file-size: 50MB
            max-request-size: 55MB
    datasource:
        # 분석 결과/그래프/RAG 청크/임베딩을 모두 담는 단일 스키마(PostgreSQL + pgvector).
        # 롤/DB 생성 절차: src/main/resources/schema/01-init-postgresql-dstone-knowledge.sql, docs/software/05.postgresql.md 참고.
        common:
            hikari:
                driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
                jdbc-url: jdbc:log4jdbc:postgresql://${DB_HOST}:${DB_PORT}/dstone_knowledge
                username: dstone_knowledge
                password: ENC(XIXzzg4U/6LYCwsQagqLSeGJt80UdT1bZcI0Msf0nh8=)
                minimum-idle: 2
                maximum-pool-size: 10
                connection-timeout: 30000  # 커넥션 풀에서 커넥션을 얻기 위한 최대 대기시간(ms).
                max-lifetime: 1700000      # 커넥션의 최대 생존시간 (DB timeout 보다 짧게 설정 필요).
                idle-timeout: 600000       # Idle 상태 커넥션의 최대 유지시간.

    ##########################################################################################
    # <임베딩 모델>
    # 분석 결과로 만든 문서 조각(청크)을 벡터로 바꿀 때 쓴다. 이 모듈은 채팅 모델을 쓰지 않는다.
    # 이 환경은 로컬 Ollama 의 bge-m3(다국어/한국어 지원, 1024차원)를 dstone-ai-engine 과 같이 쓴다.
    # 설치와 기동: docs/software/14.ollama.md
    # 모델을 바꾸면 차원이 달라질 수 있다. 그때는 dstone.knowledge.rag.embedding.dimensions 와
    # rag_embedding.embedding 컬럼(vector(1024)), 그 인덱스를 함께 바꿔야 한다.
    ##########################################################################################
    ai:
        model:
            chat: none
            embedding: ollama
            audio:
                speech: none
                transcription: none
            image: none
            moderation: none
        ollama:
            base-url: http://localhost:11434
            embedding:
                model: bge-m3:latest
    http:
        clients:
            # 임베딩 서버가 응답하지 않을 때 끝없이 기다리지 않게 한다.
            connect-timeout: 5s
            read-timeout: 300s

dstone:
    knowledge:
        # 분석기 버전. 분석 결과(analysis_revision/analysis_job)와 RAG 메타데이터에 같이 남긴다.
        # 분석 규칙이 바뀌어 예전 결과와 섞어 보면 안 될 때 올린다.
        analyzer-version: "1.0"
        # 분석 Job
        job:
            # 동시에 도는 분석 Job 수. 넘치면 대기열에서 기다린다.
            max-concurrent: 2
            # 파일 하나의 처리(읽기, 파싱, 호출 풀기)가 이 시간(초) 안에 끝나지 않으면 그 파일을 건너뛴다(FAILED, 오류 종류 HUNG).
            # 라이브러리가 특정 코드에서 끝나지 않는 경우에 분석 전체가 붙잡히지 않게 하는 마지막 방어선이다.
            # resolve.file-timeout-seconds 보다 넉넉히 커야 한다. 그쪽은 "참조와 참조 사이"에서 스스로 멈추는 부드러운 제한이고,
            # 이쪽은 스스로 멈추지 못할 때 밖에서 끊는 제한이다.
            file-hard-timeout-seconds: 600
            # 그렇게 건너뛴 파일이 이 개수를 넘으면 Job 을 실패시킨다.
            # 건너뛴 파일을 처리하던 스레드는 강제로 끝낼 수 없어서 CPU 를 쓰며 남는다. 그것이 쌓이는 것을 막는다.
            max-stuck-files: 3
        # SCAN 단계 (분석할 파일 목록 만들기)
        scan:
            # 훑지 않을 폴더 이름(쉼표 구분). 빌드 결과물이나 버전 관리 폴더처럼 소스가 아닌 곳.
            # 주의: classes 는 넣지 않는다. 운영 서버에서 받아 온 구버전 웹앱은 WEB-INF/classes 에 소스가 같이 들어 있기도 하다.
            exclude-dirs: ".git,.svn,.hg,node_modules,target,build,.gradle,.idea,.settings,.metadata"
            # 이보다 큰 파일은 목록에는 넣되(해시만 계산) 분석하지 않는다(parse_status=SKIPPED). 기본 5MB.
            max-file-bytes: 5242880
            # 파일 몇 개마다 DB에 쓰고 커밋할지.
            commit-size: 200
        # RESOLVE 단계 (호출이 누구를 가리키는지 풀기)
        resolve:
            # 메모리에 들고 있을 "파싱한 파일" 수. 호출을 풀 때 다른 타입의 선언이 필요하면 그 파일을 파싱해서 여기에 둔다.
            # 크게 하면 빨라지고 메모리를 더 쓴다. 결과는 달라지지 않는다.
            unit-cache-size: 100
            # 파일 하나를 푸는 데 쓸 수 있는 시간(초). 넘기면 그때까지 푼 것만 저장하고 나머지 참조는 "시간 초과"로 남긴다.
            # 해석기가 특정 코드에서 지나치게 오래 걸리는 경우에 그 파일 하나 때문에 분석 전체가 붙잡히지 않게 하려는 것이다.
            file-timeout-seconds: 120
        # RAG (분석 결과를 문서와 청크로 만들고 임베딩하기)
        rag:
            # 단순 접근자는 메소드 문서를 따로 만들지 않는다. 세 가지가 다 맞는 메소드다:
            # 이름이 get/set/is 로 시작하고, 세 줄을 넘지 않고, 같은 타입에 그 이름의 필드가 있다(getName → name).
            # 타입 문서의 멤버 목록에는 들어간다. VO 가 많은 프로젝트에서 임베딩 양이 크게 줄어든다.
            skip-accessors: true
            # 청크 하나에 담는 소스의 최대 글자 수. 긴 메소드는 이 크기로 나눈다.
            chunk-max-chars: 1800
            ##########################################################################################
            # <올린 일반 문서>  POST /api/documents 로 올린 PDF/Word 등
            ##########################################################################################
            upload:
                # 문서 하나에서 읽는 최대 글자 수. 넘는 부분은 버리고 응답에 truncated 로 알린다.
                max-chars: 5000000
                # 청크 경계에서 앞 청크의 마지막 문단을 다음 청크에 다시 넣을 때, 그 문단의 최대 글자 수. 0 이면 겹치지 않는다.
                overlap-chars: 200
                # 임베딩 우선순위. 코드(0)보다 커야, 올린 문서가 큰 프로젝트의 대기열 뒤에서 기다리지 않는다.
                embedding-priority: 10
            embedding:
                # 임베딩 대기열을 서버가 알아서 비울지. false 면 청크는 만들어지지만 벡터가 생기지 않아 검색되지 않는다.
                enabled: true
                # 임베딩 모델에 한 번에 보내는 청크 수
                batch-size: 16
                # 임베딩 벡터의 차원. rag_embedding.embedding 컬럼의 차원과 같아야 한다.
                dimensions: 1024
                # 대기열이 비었을 때 다시 확인할 때까지 쉬는 시간(초)
                idle-seconds: 5
        ##########################################################################################
        # <호출자 인증>
        # enabled: true 면 /api/** 요청에 X-API-Key 헤더가 있어야 한다(/api/system/health 제외).
        # 키마다 호출자(caller) 이름이 붙고, 올린 일반 문서는 올린 호출자에게만 보인다(tenant 격리).
        # 꺼 두면 누구나 부를 수 있고, 올린 문서는 호출자 구분 없이 한곳에 모인다.
        # 코드 분석 결과는 호출자별로 나누지 않는다(키가 있는 호출자는 모든 프로젝트를 본다).
        # 키 값은 DB 비밀번호와 같이 ENC(...) 로 적는다.
        ##########################################################################################
        security:
            auth:
                enabled: false
                # keys:
                #     - key: ENC(...)
                #       caller: sample-si-project
                #     - key: ENC(...)
                #       caller: another-caller

# HI-Japan 서버(JEF 계열 자체 프레임워크)의 관례.
# 프로젝트 HI-Japan 에 저절로 쓰이고, 같은 프레임워크를 쓰는 HI-Japan-batch 와 표본 websquare-app 은 ruleSets: hi-japan 으로 빌려 쓴다.
description: JEF 계열 프레임워크의 상위 타입 계층과 QueryProperty SQL 이름

layer:
  # 바로 위 상위 타입. jar 가 없어도 import 로 전체 이름을 알면 맞는다.
  # AbstractMainService 는 화면의 요청을 처음 받는 클래스라 CONTROLLER 로 둔다.
  CONTROLLER: extends jef.application.services.AbstractMainService
  SERVICE: extends jef.application.services.AbstractSubService
  REPOSITORY: [extends jef.application.dao.jdbc.JdbcDAO, extends jef.application.dao.jdbc.helper.JdbcRowGetter]
  MODEL: extends jef.application.entity.BusinessVO

sql:
  # SQL 이름을 메소드에 바로 넘기지 않고 객체에 담아 넘긴다.
  # new QueryProperty("OrderD.selectOrderList") → executeVOQuery(qp, ...)
  - new QueryProperty(SQL)

# JEF 계열 자체 프레임워크의 관례(HI-Japan 등). 이 타입을 쓰지 않는 프로젝트에서는 아무 일도 하지 않는다.
name: jef
description: JEF 계열 프레임워크의 상위 타입 계층과 QueryProperty SQL 이름
order: 500

layers:
  # 바로 위의 상위 타입 → 계층(MEDIUM). jar 가 없어도 import 로 전체 이름을 알면 맞는다.
  # AbstractMainService 는 화면의 요청을 처음 받는 클래스라 CONTROLLER 로 둔다.
  superTypes:
    - { layer: CONTROLLER, types: [jef.application.services.AbstractMainService] }
    - { layer: SERVICE, types: [jef.application.services.AbstractSubService] }
    - { layer: REPOSITORY, types: [jef.application.dao.jdbc.JdbcDAO] }
    - { layer: REPOSITORY, types: [jef.application.dao.jdbc.helper.JdbcRowGetter] }
    - { layer: MODEL, types: [jef.application.entity.BusinessVO] }

callArguments:
  # SQL 이름을 메소드에 바로 넘기지 않고 객체에 담아 넘긴다.
  # new QueryProperty("OrderD.selectOrderList") → executeVOQuery(qp, ...)
  - target: SQL
    constructors: [QueryProperty]

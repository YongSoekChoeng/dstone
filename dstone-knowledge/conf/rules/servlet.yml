# 서블릿 API 의 관례. web.xml, @WebServlet 을 읽는 것은 코드에 있다(ServletPlugin).
name: servlet
description: HttpServlet / Filter 를 상속한 클래스의 계층
order: 150

layers:
  # 바로 위의 상위 타입 → 계층(MEDIUM)
  superTypes:
    - layer: CONTROLLER
      types: [javax.servlet.http.HttpServlet, jakarta.servlet.http.HttpServlet, javax.servlet.GenericServlet, jakarta.servlet.GenericServlet]
    - layer: WEB_FILTER
      types: [javax.servlet.Filter, jakarta.servlet.Filter]

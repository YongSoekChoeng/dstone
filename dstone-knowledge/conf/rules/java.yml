# 순수 Java 의 관례. 프레임워크와 상관없이 모든 프로젝트에 해당한다.
# (public static void main 은 언어 규칙이라 코드에 있다: PlainJavaPlugin)
name: java
description: 다른 스레드에서 도는 메소드(Runnable, Thread, TimerTask, Callable)
order: 100

endpoints:
  # 이 상위 타입을 바로 상속(구현)한 클래스의 메소드를 진입점으로 올린다.
  # 호출 그래프만 보면 run() 을 부르는 곳이 없어 죽은 코드처럼 보이므로 진입점으로 알아 둔다.
  superTypes:
    - endpointType: THREAD
      superTypes: [java.lang.Runnable, java.lang.Thread, java.util.TimerTask]
      methods: [run]
      paramCount: 0
    - endpointType: THREAD
      superTypes: [java.util.concurrent.Callable]
      methods: [call]
      paramCount: 0

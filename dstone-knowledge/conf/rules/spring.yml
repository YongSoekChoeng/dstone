# Spring 의 관례. 애노테이션은 단순 이름으로 맞춘다(와일드카드 import 면 전체 이름을 알 수 없어서).
name: spring
description: Spring MVC 주소, 스케줄, 리스너, 주입, 프록시, 스테레오타입 계층, ModelAndView 화면
order: 200

endpoints:
  http:
    # 클래스의 @RequestMapping("/order") + 메소드의 @GetMapping("/list") → GET /order/list
    - classAnnotations: [RequestMapping]
      pathAttributes: [value, path]
      methodAnnotations:
        - { annotation: RequestMapping, methodAttribute: method }   # method = RequestMethod.GET. 적지 않았으면 ALL
        - { annotation: GetMapping, httpMethod: GET }
        - { annotation: PostMapping, httpMethod: POST }
        - { annotation: PutMapping, httpMethod: PUT }
        - { annotation: DeleteMapping, httpMethod: DELETE }
        - { annotation: PatchMapping, httpMethod: PATCH }
  annotations:
    # 정해진 시각에 도는 메소드. path 에는 주기를 넣는다.
    - endpointType: SCHEDULED
      annotations: [Scheduled]
      pathAttributes: [cron, fixedRate, fixedDelay, fixedRateString, fixedDelayString]
    # 메시지나 이벤트를 받는 메소드. path 에는 토픽이나 큐 이름을 넣는다.
    - endpointType: LISTENER
      annotations: [KafkaListener, RabbitListener, JmsListener, SqsListener, StreamListener, EventListener, TransactionalEventListener]
      pathAttributes: [topics, queues, destination, value]

# 이 애노테이션이 붙은 필드 → INJECTS 관계(필드를 가진 타입 → 필드의 타입)
injects:
  annotations: [Autowired, Inject, Resource]

# 이 애노테이션이 메소드나 그 클래스에 붙으면 프록시가 끼어드는 메소드로 표시한다(proxy_related)
proxies:
  annotations: [Transactional, Async, Cacheable, CacheEvict, CachePut, Retryable, PreAuthorize, Secured]

layers:
  # 애노테이션 → 계층(HIGH). 위에서부터 먼저 맞는 것으로 정한다. @Component 는 뜻이 넓어서 fallback.yml 에 있다.
  annotations:
    - { layer: CONTROLLER, annotations: [Controller, RestController, ControllerAdvice, RestControllerAdvice] }
    - { layer: SERVICE, annotations: [Service] }
    - { layer: REPOSITORY, annotations: [Repository, Mapper] }
    - { layer: CONFIG, annotations: [Configuration, SpringBootApplication, ConfigurationProperties] }
    - { layer: MODEL, annotations: [Entity, Embeddable, MappedSuperclass, Document] }
    - { layer: ASPECT, annotations: [Aspect] }

callArguments:
  # new ModelAndView("order/list") / setViewName("order/list") → order/list.jsp 로 끝나는 JSP 가 하나뿐이면 RENDERS
  # redirect: / forward: 는 화면이 아니라 다른 주소로 보내는 것이라 뺀다.
  - target: VIEW
    constructors: [ModelAndView]
    methods: [setViewName]
    template: "{value}.jsp"
    exclude: '^(redirect|forward):'

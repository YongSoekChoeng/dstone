# 서블릿 API 의 관례. web.xml 과 @WebServlet 을 읽는 것은 코드에 있다(ServletEntries).
description: HttpServlet / Filter 를 상속한 클래스의 계층

layer:
  CONTROLLER:
    - extends javax.servlet.http.HttpServlet
    - extends jakarta.servlet.http.HttpServlet
    - extends javax.servlet.GenericServlet
    - extends jakarta.servlet.GenericServlet
  WEB_FILTER:
    - extends javax.servlet.Filter
    - extends jakarta.servlet.Filter

# MyBatis / iBATIS 의 관례. 매퍼 인터페이스(namespace = 인터페이스 이름) 방식은 코드에 있다(MapperLinker).
description: SQL 이름을 첫 인자로 받는 SqlSession / SqlMapClient 의 메소드

sql:
  # sqlSession.selectList("Order.list", vo) → statement Order.list 와 EXECUTES_SQL
  # 이름이 흔한 메소드(insert, update ...)라 다른 객체의 호출도 걸리지만, SQL 이름처럼 생기지 않은 값은 버리고
  # 그런 statement 가 없으면 잇지 않는다(이름이 점을 품었으면 UNRESOLVED 로 남긴다).
  - _.selectList(SQL)
  - _.selectOne(SQL)
  - _.selectMap(SQL)
  - _.selectCursor(SQL)
  - _.select(SQL)
  - _.insert(SQL)
  - _.update(SQL)
  - _.delete(SQL)
  # iBATIS 의 SqlMapClient
  - _.queryForList(SQL)
  - _.queryForObject(SQL)
  - _.queryForMap(SQL)
  - _.queryForPaginatedList(SQL)
  - _.queryWithRowHandler(SQL)

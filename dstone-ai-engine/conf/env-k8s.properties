################################################################
# kind(Kubernetes) Environment
################################################################
APP_HOME=/app/dstone
APP_NAME=dstone-ai-engine
APP_CONF_DIR=/app/dstone/dstone-ai-engine/conf
REDIS_HOST=172.18.0.1
REDIS_PORT=6379
# TODO: PostgreSQL은 아직 kind 브리지 게이트웨이(172.18.0.1)로 열어주지 않았다(mysql/redis처럼
# listen_addresses/pg_hba.conf 조치가 필요) - dstone-ai-engine을 실제로 kind에 배포하기 전에
# docs/software/05.postgresql.md 참고해서 처리할 것. 그 전까지 이 값은 k8s Pod에서 연결되지 않는다.
DB_HOST=172.18.0.1
DB_PORT=5432
# STDIO MCP 서버(예: npx로 띄우는 서버)를 Windows에서 실행하려면 필요하다. npx는 실제로는 npx.cmd(배치 스크립트)라서, 
# cmd.exe 없이 곧바로 실행시키면 "지정된 파일을 찾을 수 없습니다" (CreateProcess error=2)로 항상 실패한다.
# common.config.ConfigMcp가 이 값을 커맨드 맨 앞에 붙여서 "cmd.exe /c npx ..." 형태로 실행해 준다. 
# Linux/WSL/k8s에서는 npx를 바로 실행할 수 있으므로 이 값 자체가 필요 없다(env-wsl.properties/env-k8s.properties에는 없음).
MCP_STDIO_COMMAND_PREFIX=

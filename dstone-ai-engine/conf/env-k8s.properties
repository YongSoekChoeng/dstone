################################################################
# kind(Kubernetes) Environment
################################################################
APP_HOME=/app/dstone
APP_NAME=dstone-ai-engine
APP_CONF_DIR=/app/dstone/dstone-ai-engine/conf
REDIS_HOST=172.18.0.1
REDIS_PORT=6379
# TODO: PostgreSQL은 아직 kind 브리지 게이트웨이(172.18.0.1)로 열어주지 않았다(mysql/redis처럼
# listen_addresses/pg_hba.conf 조치가 필요) - dstone-ai-engine을 실제로 kind에 배포하기 전에
# docs/software/05.postgresql.md 참고해서 처리할 것. 그 전까지 이 값은 k8s Pod에서 연결되지 않는다.
DB_HOST=172.18.0.1
DB_PORT=5432
# dstone-knowledge(Java 분석 결과/문서 검색 서버). tools.knowledge.KnowledgeTool(소스 코드), KnowledgeDocTool(올린 문서)이 부른다.
KNOWLEDGE_HOST=172.18.0.1
KNOWLEDGE_PORT=4081
# STDIO MCP 서버(예: npx로 띄우는 서버)를 Windows에서 실행하려면 필요하다. npx는 실제로는 npx.cmd(배치 스크립트)라서, 
# cmd.exe 없이 곧바로 실행시키면 "지정된 파일을 찾을 수 없습니다" (CreateProcess error=2)로 항상 실패한다.
# common.config.ConfigMcp가 이 값을 커맨드 맨 앞에 붙여서 "cmd.exe /c npx ..." 형태로 실행해 준다. 
# Linux/WSL/k8s에서는 npx를 바로 실행할 수 있으므로 이 값 자체가 필요 없다(env-wsl.properties/env-k8s.properties에는 없음).
MCP_STDIO_COMMAND_PREFIX=
# 브라우저가 여는 각 앱 주소(화면 사이 링크). 서버끼리 부르는 주소가 아니라 브라우저 기준이다.
AI_ENGINE_PUBLIC_URL=http://localhost:8081
KNOWLEDGE_PUBLIC_URL=http://localhost:4081
# 시험 서버에서 개발 결과를 직접 확인하는 데 쓰는 값(전문가 해결 Agent). 이 환경에는 설치하지 않았으므로 비워 둔다.
# 채우는 법은 env-wsl.properties와 docs/software/16.playwright-mcp.md를 본다. 비어 있으면 브라우저 MCP 서버와 반영 스크립트는 쓰지 않는다.
PLAYWRIGHT_MCP_HOME=
PLAYWRIGHT_BROWSER=
TEST_SERVER_DEPLOY_SCRIPT=
# 임시 시험 서버(tools.build.TestServerTool). 사본을 둘 폴더(비우면 {사용자 홈}/.dstone-ai-engine)와 Java 버전별 JDK 경로.
# JDK 경로가 비어 있으면 엔진과 같은 JDK로 띄운다. 대상 앱의 Java 버전은 프로젝트 관리 화면에서 정한다.
TEST_SERVER_WORK_ROOT=
# WAR 프로젝트를 올릴 설치된 Tomcat 경로(전용 CATALINA_BASE로 따로 띄우므로 그 Tomcat에 떠 있는 앱은 건드리지 않는다).
TEST_SERVER_TOMCAT_HOME=
# 격리 시험 DB(일회용 복제본)를 만들 설치 폴더. 비우면 그 DB는 자동 검증하지 않는다
TEST_SERVER_MYSQL_HOME=
TEST_SERVER_POSTGRESQL_HOME=
TEST_SERVER_ALLOW_HOSTS=
TEST_SERVER_TRUSTED_LIBS=
JAVA_HOME_8=
JAVA_HOME_11=
JAVA_HOME_17=
JAVA_HOME_21=

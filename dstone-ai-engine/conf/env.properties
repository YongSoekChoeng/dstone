################################################################
# Local Environment
################################################################
APP_HOME=D:/AppHome/framework/dstone
APP_NAME=dstone-ai-engine
APP_CONF_DIR=D:/AppHome/framework/dstone/dstone-ai-engine/conf
REDIS_HOST=localhost
REDIS_PORT=6379
DB_HOST=localhost
DB_PORT=5432
# STDIO MCP 서버(예: npx로 띄우는 서버)를 Windows에서 실행하려면 필요하다. npx는 실제로는
# npx.cmd(배치 스크립트)라서, cmd.exe 없이 곧바로 실행시키면 "지정된 파일을 찾을 수 없습니다"
# (CreateProcess error=2)로 항상 실패한다 - common.config.ConfigMcp가 이 값을 커맨드 맨 앞에
# 붙여서 "cmd.exe /c npx ..." 형태로 실행해 준다. Linux/WSL/k8s에서는 npx를 바로 실행할 수
# 있으므로 이 값 자체가 필요 없다(env-wsl.properties/env-k8s.properties에는 없음).
MCP_STDIO_COMMAND_PREFIX=cmd.exe /c

# 설계(sm-architect-agent). 실행 9294e45d(2026-11-20)의 영향도 승인 의견(메뉴 TS_300 등)을 받고 설계서를 쓴다.
id: design-write
description: 설계서(03-1)와 태스크아이템 목록(03-2)을 저장하는지, 영향도 승인 의견(TS_300)을 반영하는지 본다.
agent: sm-architect-agent
fixture: sm/work002
copy: [01.customer_requirement.md, 02.impact.md]
params:
  sourceDir: /app/testApp
request:
  file: 00.request.md
input:
  base_dir: ${workDir}
  request: ${request}
  requirement: ${file:01.customer_requirement.md}
  impact: ${file:02.impact.md}
  instruction: ${fixture:input/impact-approval.txt}
  history: ${fixture:input/impact-approval-history.txt}
checks:
  - name: 03-1 저장
    fileExists: 03-1.design.md
  - name: 03-2 저장
    fileExists: 03-2.taskitems.md
  - name: 승인 의견 반영(TS_300)
    fileContains: {file: 03-1.design.md, text: TS_300}

# 설계 수정(document-revise-agent). 실행 9294e45d(2026-11-20)의 설계 승인 의견 7개를 설계서 세 개에 반영한다.
id: design-revise
description: 설계서를 고치는지, 의견(imageBoard.go 주소, 최대 50MB, gif 허용, 썸네일 파일 생성)을 빠짐없이 반영하는지 본다.
agent: document-revise-agent
fixture: sm/work002
params:
  sourceDir: /app/testApp
request:
  file: 00.request.md
input:
  documents:
    - ${workDir}/03-1.design.md
    - ${workDir}/03-2.taskitems.md
    - ${workDir}/03-3.ddl(데이터베이스).md
  request: ${request}
  instruction: ${fixture:input/design-revise.txt}
  history: ${fixture:input/design-revise-history.txt}
checks:
  - name: 설계서 고침
    fileChanged: 03-1.design.md
  - name: imageBoard.go
    fileContains: {file: 03-1.design.md, text: imageBoard.go}
  - name: 최대 50MB
    fileContains: {file: 03-1.design.md, text: "50"}
  - name: gif 허용
    fileContains: {file: 03-1.design.md, text: gif}
  - name: 썸네일 파일 생성
    fileContains: {file: 03-1.design.md, text: ImageUtil}

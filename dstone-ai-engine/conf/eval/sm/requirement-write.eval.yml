# 요구사항 작성(sm-requirement-analyze-agent). 실행 9294e45d(2026-11-20)의 이미지 게시판 요청서로 처음부터 쓴다.
id: requirement-write
description: 요청서만 보고 고객요구사항분석서(01)를 저장하는지, 목록화면·썸네일 요구를 빠뜨리지 않는지 본다.
agent: sm-requirement-analyze-agent
fixture: sm/work002
copy: []
params:
  sourceDir: /app/testApp
request:
  file: 00.request.md
input:
  base_dir: ${workDir}
  request: ${request}
checks:
  - name: 01 저장
    fileExists: 01.customer_requirement.md
  - name: 목록화면
    fileContains: {file: 01.customer_requirement.md, text: 목록}
  - name: 썸네일
    fileContains: {file: 01.customer_requirement.md, text: 썸네일}

################################################################################################################
# 어플리케이션 운영관리 Workflow입니다.
# 요청서(00.request.md)에서 시작해 요구사항 → 리뷰 → 영향도 분석 → 설계 → 개발 → 컴파일 확인까지 진행합니다.
#
# 문서는 LLM이 아니라 TOOL step이 읽어서 Agent의 입력으로 넘깁니다. 읽으려고 LLM을 한 번 더 부르지 않으려는 것입니다.
# 파일이 없으면 TOOL step이 실패하므로, 앞 step이 문서를 저장하지 못한 채 다음으로 넘어가지 않습니다.
# 문서를 읽는 step은 maxChars: 60000으로 읽습니다(엔진의 Tool 결과 상한 max-result-chars와 같은 값).
# 그보다 크면 잘라서 넘기지 않고 실패로 멈춥니다. 문서를 줄이거나 두 값을 올린 뒤 이어서 실행합니다.
#
# 사람의 승인 의견과 검토 판정은 엔진이 전달합니다(2.0.0, 2026-11-20).
#   instruction: ${arrival:}    이 step으로 오게 만든 마지막 결정(승인 결정과 의견, 또는 리뷰 판정과 사유)
#   history: ${decisions:}      이 실행에서 지금까지 내려진 결정 전체
# route를 새로 이어도 이 두 줄은 고칠 필요가 없습니다. 읽는 법은 Skill handling-instructions에 있습니다.
#
# 문서를 고치는 일과 새로 쓰는 일은 다른 Agent가 합니다.
#   [~ 수정]      document-revise-agent가 기존 문서에서 지시받은 부분만 고칩니다(step23~25, step30).
#   [~ 다시 작성]  그 문서를 만든 Agent가 처음부터 다시 씁니다. 사람이 고를 때만 그렇게 합니다.
# 앞 문서가 바뀌어도 뒤 문서를 새로 쓰지 않습니다(2.3.0). 새로 쓰면 재개발·전문가 해결로 고친 것이 사라집니다.
#   step28: 영향도분석서가 있으면 step29가 맞춰 고치고, 없으면 step07이 씁니다.
#   step26: 설계서가 있으면 step27이 맞춰 고치고, 없으면 step10이 씁니다.
#   파일이 있는지만 보려고 readFileLines로 첫 줄을 읽습니다. 처음 실행 때 이 두 step이 실패로 남는 것은 정상입니다.
#
# 개발 결과는 작업 폴더의 dev-resources에 "원본 소스 루트 기준 같은 경로"로 쌓입니다(원본은 건드리지 않습니다).
# 원본에서 지워야 하는 파일은 dev-resources/_delete-files.txt에 한 줄에 하나씩 적습니다.
# 개발 폴더는 설계를 승인하고 개발로 갈 때만 비웁니다(step14). 설계서에서 빠진 파일이 개발 폴더에 남지 않게 하려는 것입니다.
# [재개발]은 비우지 않고 있는 결과를 고치며, 고친 내용을 설계서에도 옮겨 적습니다(sm-developer-agent 2.1.0).
# 그래서 나중에 설계 수정을 거쳐 개발 폴더를 다시 비워도 재개발로 고친 것이 사라지지 않습니다.
# 재개발 때는 step18~19가 설계서와 태스크아이템 목록을 다시 읽어 넘깁니다(지난 개발이 고친 최신 내용).
#
# [전문가 해결](2.2.0): 개발 결과가 동작하지 않을 때 사람이 고릅니다. 승인 의견에 본 증상을 적습니다.
#   step20~21이 설계서와 목록을 다시 읽고, step22의 sm-troubleshooter-agent가 원인을 찾아 고친 뒤 설계서에도 남깁니다.
#   그 Agent가 프로젝트 DB를 조회하고, 임시 시험 서버(startTestServer)를 띄워 브라우저로 재현·확인까지 합니다(docs/09 11.1절).
#   로그인할 시험계정은 프로젝트 관리에 둡니다(요청서에는 계정을 적지 않습니다).
#   끝나면 컴파일 확인(step16)을 거쳐 개발 승인으로 돌아옵니다.
#
# 컴파일 확인: 개발 Agent가 끝나기 전에 범용 Tool compileJava로 스스로 컴파일해 고치고(최대 3번), 그 뒤 step16이 같은 Tool로 한 번 더 확인합니다.
# 통과하든 실패하든 개발 승인(step17)으로 가고, 실패 내용은 다음 개발·설계 수정에 전달됩니다.
# compileJava는 원본 전체를 빌드하지 않고, 원본이 만들어 둔 클래스 폴더와 의존성을 참조해 바뀐 파일(과 그것을 쓰는 원본 파일)만 컴파일합니다.
# 그래서 원본을 한 번은 빌드해 두어야 합니다(없으면 그렇다고 실패로 알립니다).
#
# 원본 소스 경로는 step02가 요청서의 "## 소스경로" 아래 내용을 범용 Tool readMarkdownSection으로 읽어 state.sourceDir에 둡니다.
# 작업 폴더는 "입력 폴더/실행 시각(yyyyMMdd-HHmm)"입니다. step00이 LLM 없이 시각만 받아 state.now에 넣습니다.
################################################################################################################
id: sm-workflow
version: 2.3.0
description: |
  어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00.request.md 파일이 있는 폴더의 절대경로를 입력하라(파일명 제외).
  요청서에는 '현업요청', '소스경로'와, 그 소스를 dstone-knowledge에 분석해 두었다면 '프로젝트ID'를 적는다.
  계정·비밀번호는 요청서에 적지 않는다. 화면 로그인용 시험계정은 프로젝트 관리에 두면 전문가 해결 Agent가 임시 시험 서버에서 그 계정으로 확인한다.
  DB는 프로젝트ID로 프로젝트 관리에 등록한 DB를 찾아 조회한다(다른 DB를 쓸 때만 시험환경에 'DB연결'을 적는다).
  예)
  D:/WorkShop/00.SM/work004
settings:
  checkpoint: true
  maxIterations: 100
  onError: STOP
input: string, 요청서(00.request.md)가 들어 있는 폴더의 절대경로
steps:

  - id: step00
    name: 사전작업
    type: TOOL
    tool: getToDate
    with:
      format: yyyyMMdd-HHmm
    save: now
    next: step01
    onFailure: FAIL

  - id: step01
    name: 고객요청서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/00.request.md
    save: request
    next: step02
    onFailure: FAIL

  - id: step02
    name: 소스경로 읽기
    type: TOOL
    tool: readMarkdownSection
    with:
      fileFullPath: ${input}/00.request.md
      heading: 소스경로
    save: sourceDir
    next: step03
    onFailure: FAIL

  - id: step03
    name: 고객요청사항 분석
    type: AGENT
    agent: sm-requirement-analyze-agent
    with:
      base_dir: ${input}/${state.now}
      request: ${state.request}
      instruction: ${arrival:}
      history: ${decisions:}
    next: step04

  - id: step04
    name: 고객요구사항분석서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/01.customer_requirement.md
      maxChars: 60000
    save: requirement
    next: step05
    onFailure: FAIL

  - id: step05
    name: 고객요청사항 분석 리뷰
    type: SUPERVISOR
    agent: sm-requirement-analyze-reviewer-agent
    with:
      base_dir: ${input}/${state.now}
      request: ${state.request}
      requirement: ${state.requirement}
    save: review
    next: step28
    onFailure: step06

  - id: step06
    name: 리뷰 불통과 처리 결정
    type: APPROVAL
    approval:
      approverRole: PL
    save: reviewDecision
    routes:
      그대로 진행: step28
      요구사항 수정: step30
      다시 리뷰: step04
      중지: FAIL

  - id: step07
    name: 영향도 분석
    type: AGENT
    agent: sm-analyze-impact-agent
    with:
      base_dir: ${input}/${state.now}
      request: ${state.request}
      requirement: ${state.requirement}
      instruction: ${arrival:}
      history: ${decisions:}
    next: step08
    save: impactPath

  - id: step08
    name: 영향도 분석 승인
    type: APPROVAL
    approval:
      approverRole: PL
    save: impactApproval
    routes:
      승인(설계진행): step09
      영향도 수정: step24
      영향도 다시 작성: step07
      요구사항 수정: step25
      중지: FAIL

  - id: step09
    name: 영향도분석서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/02.impact.md
      maxChars: 60000
    save: impact
    next: step26
    onFailure: FAIL

  - id: step10
    name: 아키텍처 설계
    type: AGENT
    agent: sm-architect-agent
    with:
      base_dir: ${input}/${state.now}
      request: ${state.request}
      requirement: ${state.requirement}
      impact: ${state.impact}
      instruction: ${arrival:}
      history: ${decisions:}
    next: step11
    save: architectPath

  - id: step11
    name: 설계 승인
    type: APPROVAL
    approval:
      approverRole: PL
    save: designApproval
    routes:
      승인(개발진행): step12
      설계 수정: step23
      설계 다시 작성: step10
      영향도 수정: step24
      중지: FAIL

  - id: step12
    name: 상세 설계서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      maxChars: 60000
    save: design
    next: step13
    onFailure: FAIL

  - id: step13
    name: 태스크아이템 목록 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-2.taskitems.md
      maxChars: 60000
    save: taskitems
    next: step14
    onFailure: FAIL

  - id: step14
    name: 기존개발디렉토리초기화
    type: TOOL
    tool: deleteDir
    with:
      fileFullPath: ${input}/${state.now}/dev-resources
    # 폴더를 비우면 지난 컴파일 오류도 옛것이다. 성공하면 saveError가 compileError를 비운다.
    saveError: compileError
    next: step15

  - id: step15
    name: 개발
    type: AGENT
    agent: sm-developer-agent
    with:
      base_dir: ${input}/${state.now}
      source_dir: ${state.sourceDir}
      request: ${state.request}
      design: ${state.design}
      taskitems: ${state.taskitems}
      instruction: ${arrival:}
      history: ${decisions:}
      compile_error: ${state.compileError:}
    next: step16
    onFailure: FAIL

  - id: step16
    name: 컴파일 확인
    type: TOOL
    tool: compileJava
    with:
      sourceRoot: ${state.sourceDir}
      overlayDir: ${input}/${state.now}/dev-resources
      outputDir: ${input}/${state.now}/compile-check
      deleteList: ${input}/${state.now}/dev-resources/_delete-files.txt
    save: compileResult
    saveError: compileError
    next: step17
    onFailure: step17

  - id: step17
    name: 개발 승인
    type: APPROVAL
    approval:
      approverRole: PL
    save: developApproval
    routes:
      승인: END
      재개발: step18
      전문가 해결: step20
      설계 수정: step23
      영향도 수정: step24
      요구사항 수정: step25
      실패: FAIL

  - id: step18
    name: 재개발 전 설계서 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      maxChars: 60000
    save: design
    next: step19
    onFailure: FAIL

  - id: step19
    name: 재개발 전 태스크아이템 목록 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-2.taskitems.md
      maxChars: 60000
    save: taskitems
    next: step15
    onFailure: FAIL

  - id: step20
    name: 전문가 해결 전 설계서 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      maxChars: 60000
    save: design
    next: step21
    onFailure: FAIL

  - id: step21
    name: 전문가 해결 전 태스크아이템 목록 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-2.taskitems.md
      maxChars: 60000
    save: taskitems
    next: step22
    onFailure: FAIL

  - id: step22
    name: 전문가 해결
    type: AGENT
    agent: sm-troubleshooter-agent
    with:
      base_dir: ${input}/${state.now}
      source_dir: ${state.sourceDir}
      request: ${state.request}
      design: ${state.design}
      taskitems: ${state.taskitems}
      instruction: ${arrival}
      history: ${decisions:}
      compile_error: ${state.compileError:}
    save: troubleshoot
    next: step16
    onFailure: step17

  - id: step23
    name: 설계서 수정
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/03-1.design.md
        - ${input}/${state.now}/03-2.taskitems.md
        - ${input}/${state.now}/03-3.ddl(데이터베이스).md
      request: ${state.request}
      instruction: ${arrival}
      history: ${decisions:}
      reference: ${state.compileError:}
    save: revision
    next: step11

  - id: step24
    name: 영향도분석서 수정
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/02.impact.md
      request: ${state.request}
      instruction: ${arrival}
      history: ${decisions:}
    save: revision
    next: step08

  - id: step25
    name: 고객요구사항분석서 수정
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/01.customer_requirement.md
      request: ${state.request}
      instruction: ${arrival}
      history: ${decisions:}
    save: revision
    next: step04

  - id: step26
    name: 기존 설계서 확인
    type: TOOL
    tool: readFileLines
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      startLine: 1
      endLine: 1
    next: step27
    onFailure: step10

  - id: step27
    name: 기존 설계서 맞춤
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/03-1.design.md
        - ${input}/${state.now}/03-2.taskitems.md
        - ${input}/${state.now}/03-3.ddl(데이터베이스).md
      request: ${state.request}
      instruction: |-
        reference에 있는 요구사항분석서와 영향도분석서의 지금 내용에 설계 문서를 맞춘다.
        두 문서와 어긋나는 곳과 빠진 곳만 고친다. 재개발과 전문가 해결로 고친 내용('## 수정 이력')은 두 문서와 어긋나지 않는 한 그대로 둔다.
        아래는 이 일로 오게 한 결정이다. 의견이 있으면 함께 반영한다.
        ${arrival:}
      history: ${decisions:}
      reference: |-
        [요구사항분석서]
        ${state.requirement}

        [영향도분석서]
        ${state.impact}
    save: revision
    next: step11

  - id: step28
    name: 기존 영향도분석서 확인
    type: TOOL
    tool: readFileLines
    with:
      fileFullPath: ${input}/${state.now}/02.impact.md
      startLine: 1
      endLine: 1
    next: step29
    onFailure: step07

  - id: step29
    name: 기존 영향도분석서 맞춤
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/02.impact.md
      request: ${state.request}
      instruction: |-
        reference에 있는 요구사항분석서의 지금 내용에 영향도분석서를 맞춘다.
        어긋나는 곳과 빠진 곳만 고치고, 나머지는 그대로 둔다.
        아래는 이 일로 오게 한 결정이다. 의견이 있으면 함께 반영한다.
        ${arrival:}
      history: ${decisions:}
      reference: |-
        [요구사항분석서]
        ${state.requirement}
    save: revision
    next: step08

  - id: step30
    name: 리뷰 지적에 따른 요구사항 수정
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/01.customer_requirement.md
      request: ${state.request}
      # 사람의 결정이 arrival을 차지하므로 리뷰어의 지적은 따로 붙인다.
      instruction: |-
        ${arrival:}

        리뷰어의 지적(사람의 의견과 어긋나면 사람의 의견을 따른다):
        ${state.review.reason:}
      history: ${decisions:}
    save: revision
    next: step04
state:
  request: 고객 요청서 내용
  requirement: 고객요구사항분석서 내용
  review: 리뷰 판정 결과
  reviewDecision: 리뷰 불통과 때 사람이 고른 결과
  impactApproval: 영향도 분석 승인 결과
  impact: 영향도분석서 내용
  designApproval: 설계 승인 결과
  design: 상세 설계서 내용
  taskitems: 태스크아이템 목록 내용
  now: 작업을 시작한 시각(yyyyMMdd-HHmm). 작업 폴더 이름으로 쓴다
  developApproval: 개발 승인(step17) 결과
  impactPath: 영향도 분석(step07)이 돌려준 답(저장 파일과 결정 필요 사항)
  architectPath: 아키텍처 설계(step10)가 돌려준 답(저장 파일과 결정 필요 사항)
  revision: 문서 수정(step23~25, 27, 29, 30)이 돌려준 답(고친 파일, 반영한 지시, 반영하지 않은 지시)
  sourceDir: 원본 소스 경로(요청서의 "## 소스경로", step02)
  compileResult: 컴파일 확인(step16)이 통과했을 때의 출력
  compileError: 컴파일 확인(step16)이 실패했을 때의 오류(통과하거나 step14가 개발 폴더를 비우면 비어 있다)
  troubleshoot: 전문가 해결(step22)이 돌려준 답(원인과 근거, 고친 것, 설계서와 달라진 점, 못 푼 것)

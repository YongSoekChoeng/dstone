################################################################################################################
# 어플리케이션 운영관리 Workflow입니다.
# 요청서(00.request.md)에서 시작해 요구사항 → 영향도 분석 → 설계 → 개발 → 동작 검증 → 개발 승인까지 진행합니다.
#
# [흐름 한눈에 보기] name 앞 번호가 흐름 순서입니다(괄호는 step id). 정상 흐름은 01~39와 42, 곁가지는 그 밖의 번호입니다.
#   01~03  준비         요청서, 프로젝트ID, 프로젝트 리비전(step01, 02, 59). 작업 시각은 settings.startTime이 넣습니다
#   04~06  요구사항      분석 → 분석서 읽기 → 리뷰(step03, 04, 05)
#   07~11  영향도        분석서가 있으면 맞추고(step38) 없으면 새로 씀(step08) → 승인(step09) → 읽기(step10)
#   12~14  참고 기능      영향도분석서 '## 참고 기능'의 원본 코드를 dstone-knowledge에서 모음(step46, 48, 49)
#   15~19  설계          설계서가 있으면 맞추고(step37) 없으면 새로 씀(step12) → 형식 확인(step50) → 승인(step13)
#   20~26  개발          문서 읽기(step14) → 개발 폴더와 지난 검증 결과 비우기 → 개발(step17) → 보류 확인 → 컴파일(step18) → 형식 확인(step53)
#   27~40  동작 검증      리비전·DDL 확인 → 검증 수준 고르기(step43, 64) → 테스트 서버(step29) → 동작 검증(step35) → 결과 누적(step62) → FAIL이면 자동 수정(step34)
#   43     개발 승인(step19). [승인]이면 끝
#   곁가지  41 DDL 반영 승인, 42 형식 오류 고치기, 44 재개발 전 다시 읽기, 45 보류 이어서 개발,
#          46~47 설계서 수정과 형식 고치기, 48~49 영향도·요구사항 문서 수정, 50~51 리뷰 불통과 처리
# 한 실행이 실제로 지나온 길은 실행 관리 > 진행 기록에서 줄마다 "← 앞 step · 고른 길"로 보입니다.
#
# [문서 읽기] 문서는 LLM이 아니라 TOOL step이 읽어 Agent 입력으로 넘깁니다. 읽으려고 LLM을 한 번 더 부르지 않기 위해서입니다.
#   파일이 없으면 TOOL step이 실패하므로, 앞 step이 문서를 저장하지 못한 채 다음으로 넘어가지 않습니다.
#   maxChars보다 큰 문서는 잘라 넘기지 않고 실패합니다. readFiles의 maxChars는 max-result-chars에 묶이지 않고,
#   readFile step(step04, 10, 49)은 둘 중 작은 값까지입니다.
#   상한: 설계서 100000, 나머지 60000. 설계서는 개발·자동 수정·검증 Agent의 입력에 통째로 들어가므로 모델의 컨텍스트에 맞춰 둔 값입니다.
#   설계 뒤(step50)에 넘은 것을 먼저 잡고(step52가 한 번 줄임), 그래도 넘으면 읽는 step이 실패합니다(step14는 설계 승인, step32·41은 개발 승인으로. 재개발 step20은 실행 실패).
#   설계서와 태스크아이템 목록은 범용 Tool readFiles가 한 step에서 함께 읽어 state.docs({design, taskitems})에 둡니다.
#   Agent가 문서를 고칠 수 있는 고리(재개발 step20, 자동 수정 step32, 검증 전 step41)에서는 다시 읽어 최신 내용을 넘깁니다.
#
# [사람의 결정] 승인 의견과 리뷰 판정은 엔진이 전달합니다. 읽는 법은 Skill handling-instructions에 있습니다.
#   instruction: ${arrival:}    이 step으로 오게 만든 마지막 결정(승인 결정과 의견, 또는 리뷰 판정과 사유)
#   history: ${decisions:}      이 실행에서 지금까지 내려진 결정 전체
#   route를 새로 이어도 이 두 줄은 고칠 필요가 없습니다. 리뷰(step05)는 판정만 돌려주고 분석서를 고치지 않습니다.
#
# [문서 수정과 다시 작성]
#   [~ 수정]      document-revise-agent가 기존 문서에서 지시받은 부분만 고칩니다(step25~27, 39).
#   [~ 다시 작성]  그 문서를 만든 Agent가 처음부터 다시 씁니다. 사람이 고를 때만 그렇게 합니다.
#   앞 문서가 바뀌어도 뒤 문서를 새로 쓰지 않고 맞춥니다(step38, 37). 새로 쓰면 재개발·자동 수정으로 고친 것이 사라집니다.
#   문서가 있는지는 범용 Tool isFileExist의 true/false를 routes로 받아 나눕니다(없는 것은 실패가 아니라 정상 결과).
#
# [개발 결과] 작업 폴더의 dev-resources에 "원본 소스 루트 기준 같은 경로"로 쌓입니다. 원본은 건드리지 않습니다.
#   원본에서 지울 파일은 dev-resources/_delete-files.txt에 한 줄에 하나씩 적습니다.
#   개발 폴더는 설계를 승인하고 개발로 갈 때만 비웁니다(step16). 설계서에서 빠진 파일이 남지 않게 하려는 것입니다.
#   [재개발]은 비우지 않고 있는 결과를 고치며, 고친 내용을 설계서에도 옮겨 적습니다. 그래서 나중에 폴더를 비워도 남습니다.
#
# [프로젝트와 리비전] 요청서의 '## 프로젝트ID'는 필수입니다(step02). step59가 형상관리에서 새 소스를 받아 빌드하고(refresh,
#   프로젝트 관리의 [Build]와 같음. 새 커밋이 없으면 지난 리비전) 그 소스와 산출물을 state.projectRevision에 둡니다.
#   갱신이나 빌드에 실패하면 실행도 실패합니다. 형상관리가 없는 프로젝트는 갱신하지 않고 현재 리비전을 씁니다.
#   이 실행은 끝까지 그 리비전만 씁니다. 그 사이 새 리비전이 생겨도 영향이 없고, 실행이 끝나기 전에는 지워지지 않습니다.
#   소스 경로도 리비전에서 옵니다(state.projectRevision.sourceRoot). 빌드한 리비전이 없으면 서버 기동 테스트 없이 개발 승인으로 갑니다.
#   동작하지 않으면 재개발로 고칩니다(전문가 해결 경로는 없습니다).
#
# [컴파일과 형식 검사] 사람 승인 한 번이 20~40분이라, 기계로 잡을 수 있는 것은 사람에게 가기 전에 잡습니다.
#   컴파일: 개발 Agent가 끝나기 전에 범용 Tool compileJava로 스스로 고치고(최대 3번), step18이 한 번 더 확인합니다.
#     원본 전체를 빌드하지 않고 리비전의 클래스 폴더와 의존성을 참조해 바뀐 파일(과 그것을 쓰는 원본 파일)만 컴파일합니다.
#     실패해도 다음으로 가고, 실패 내용(state.compileError)은 다음 개발·설계 수정에 전달됩니다.
#   설계 뒤(step50): checkDocuments가 닫히지 않은 코드 블록, 칸이 어긋난 표, DDL을 봅니다. 걸리면 형식만 고칩니다(step52, 결정마다 1번).
#   개발 뒤(step54): 개발 Agent가 손대지 못한 보류(unfinished)가 있으면 한 번 더 부릅니다(step57, 결정마다 1번).
#     사람의 결정이나 DB 반영이 필요한 보류는 다시 불러도 할 일이 없어서 세지 않습니다. 답에 unfinished가 없으면 0으로 봅니다.
#   컴파일 뒤(step53): checkSources가 XML, JSP의 <% %>와 태그 짝, JavaScript 구문을 봅니다. 걸리면 개발 Agent가 고칩니다(step58, 결정마다 1번).
#   "몇 번까지"는 그 step의 limit(max, scope: ${decisions:}, over)이 셉니다. 엔진이 실행 전에 세고, 넘으면 실행하지 않고 over로 갑니다.
#   다시 부를 때는 step17이 아니라 step57·58을 씁니다. 지난 지적을 그 경로에서만 넘겨, 새 개발에 묵은 지적이 따라가지 않게 합니다.
#
# [동작 검증] 컴파일이 통과하면 사람에게 묻기 전에 실제로 돌려 봅니다.
#   검증 수준은 설계 승인(step13)에서 사람이 고릅니다. 설계서의 '검증 방법 제안'(sm-architect-agent)이 어느 쪽인지와 이유를 적습니다.
#     전체 확인  테스트 서버를 띄우고 화면을 눌러 봄
#     간이 확인  테스트 서버가 뜨는지만 봄(step45). 화면이 없는 변경(배치, 연동, 쿼리만)
#     최소 확인  서버 없이 소스 오류만 봄. 동작이 바뀌지 않는 변경(주석, 안내 문구, 설정값 하나)
#     재개발할 때는 개발 승인(step19)에서 다시 고릅니다: 재개발(전체 확인), 재개발(간이 확인), 재개발(최소 확인).
#     step43(routeValue)이 마지막 개발 승인의 선택으로 갈 곳을 나눕니다. 개발 승인 전이거나 문서 수정을 고른 뒤라면
#     step64가 설계 승인에서 고른 수준을 따릅니다.
#     고른 수준은 사람의 결정 뒤 첫 검증에만 적용합니다(step43의 limit max 1, scope 결정 기록).
#     자동 수정으로 다시 돌 때는 한도를 다 써서 step43을 건너뛰고 전체 확인으로 갑니다.
#   DDL: 테스트 서버는 DDL을 실행하지 않습니다. step60이 DDL 문서의 테이블·컬럼과 INSERT(초기 데이터) 행이 개발 DB에 있는지 보고,
#     없으면 step61에서 사람이 개발 DB에 반영한 뒤 승인합니다. 데이터가 없으면 화면 목록이 비어 검증이 아무것도 볼 수 없습니다.
#   테스트 서버(step29): 리비전 + 개발 결과로 띄우고, 고객사 개발 DB는 커밋하지 않는 연결로 써서 실행이 멈추면 원복합니다.
#     실행마다 하나라 step35·step34가 같은 서버를 받고, 다시 부르면 바뀐 파일만 반영합니다.
#     기동 실패 원인이 개발 결과(code)면 자동 수정, 환경(environment)이면 사람에게 갑니다.
#     띄울 수 없는 프로젝트(빌드된 리비전 없음, EJB·벤더 전용 기능, Tomcat·JDK 없음)는 통과로 치지 않고 이유(serverError)와 함께 개발 승인으로 갑니다.
#   검증(step35): 완료 기준마다 PASS/FAIL/BLOCKED를 냅니다. 사람이 개발 승인에서 알린 증상(developApproval.comment)은
#     reported로 따로 넘겨 "사람이 알린 오류:" 기준으로 재현합니다. 결정 기록 전체(history) 속에서는 놓치기 쉽기 때문입니다.
#     step40(fileChanges)이 지난 검증 뒤로 바뀐 파일을 알려 주어, 알린 증상 → 바뀐 파일의 기준 → 지난번에 안 된 기준 순으로 봅니다.
#     결과 누적(step62): 검증 Agent는 이번에 확인한 기준만 답하고, mergeByKey가 기준 id로 state.verificationAll에 겹쳐 쌓습니다.
#     자동 수정과 다음 검증은 이 누적 결과를 받습니다. 회차마다 덮어쓰면 한 번 짧게 답했을 때 지난 PASS가 사라져 전부 다시 확인하게 됩니다.
#     테스트 환경 탓인 실패는 BLOCKED로 내고 고치지 않습니다(Skill test-environment).
#   자동 수정(step34): FAIL이 있으면 고칩니다. 사람의 결정 하나마다 최대 2번이고, 사람이 새로 시키면 다시 2번입니다(step32의 limit).
#   개발(step17, 57, 58, 68)은 누적 결과 가운데 PASS가 아닌 것만 받습니다(step65의 filterList). 재개발이 검증이 이미 찾은 원인을 보고 고치게 하되,
#     지난 PASS를 보고 "이미 처리됐다"고 판단하지 않게 하려는 것입니다.
#   수정 없는 재개발(step66, 67): 개발 전(step70)과 뒤의 dev-resources를 fileChanges로 비교합니다. 바뀐 파일이 없으면 사람의 결정 하나마다 한 번
#     다시 개발시키고(step68), 그래도 없으면 승인(step69)에서 사람이 재개발, 그대로 검증, 실패 가운데 고릅니다. 설계서와 태스크아이템 기록은 세지 않습니다.
#     설계 승인 뒤의 새 개발은 파일이 모두 새로 생기므로 걸리지 않습니다.
#   바뀐 줄(diff): step40은 지난 내용의 사본을 작업 폴더 밖(${input}/.work-copy/실행 시각)에 두고 바뀐 줄을 workChanges.diff로 만듭니다.
#     자동 수정(step34)과 개발(step17)이 recent_changes로 받습니다. 설계서 수정 이력은 Agent의 설명이라 틀릴 수 있어서,
#     지난 수정이 무엇을 바꿨는지는 이 사실로 보게 합니다.
#   판정 step(step30, 36 등)의 "FAIL 없음"은 실패가 아니라 정상 결과라서 containsValue(true/false)의 값을 routes로 받아 나눕니다.
#     한도를 다 쓴 것도 엔진의 limit이 건너뛴 정상 결과입니다. onFailure는 Tool이 정말 실패했을 때만 씁니다.
#
# [참고 기능] 영향도분석서의 '## 참고 기능'(본뜰 기존 기능의 화면 경로나 주소)을 step46이 읽고, step48의 knowledgeFeatureCode가
#   dstone-knowledge의 관계(화면 → 주소 → 메소드 → SQL, 메소드 → 팝업 화면)를 따라 원본 코드를 02-1.reference-code.md에 모읍니다.
#   step49가 읽어 아키텍트(step12)에 넘깁니다. 보내는 쪽과 받는 쪽을 다른 기능에서 가져오거나 프로젝트 관례를 모르고 새로 짓는 일을 막습니다.
#   '참고 기능'이 없거나 모으지 못하면 이유를 state.referenceError에 두고 그대로 설계합니다.
#
# [작업 폴더] "입력 폴더/실행 시각(yyyyMMdd-HHmm)"입니다. settings.startTime이 첫 step 전에 시각을 state.now에 넣습니다.
#
# 버전별로 바뀐 내용과 그 이유(실행 id 포함)는 .claude/docs/ai-engine-history.md의 sm-workflow 절에 있습니다.
################################################################################################################
id: sm-workflow
version: 2.18.0
description: |
  어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00.request.md 파일이 있는 폴더의 절대경로를 입력하라(파일명 제외).
  요청서에는 '현업요청'과 '프로젝트ID'(프로젝트 관리에 등록한 ID)를 적는다. 소스는 그 프로젝트의 현재 리비전([Build] 결과)을 쓴다.
  계정·비밀번호는 요청서에 적지 않는다. 화면 로그인용 테스트계정은 프로젝트 관리에 두면 테스트 서버에서 그 계정으로 확인한다.
  DB는 프로젝트 관리에 등록한 개발 DB를 쓰고, 테스트로 바뀐 데이터는 원복한다. DDL은 사람이 개발 DB에 반영한다.
  예)
  D:/WorkShop/00.SM/work004
settings:
  checkpoint: true
  startTime:
    save: now
    format: yyyyMMdd-HHmm
  maxIterations: 100
  onError: STOP
input: string, 요청서(00.request.md)가 들어 있는 폴더의 절대경로
steps:

  - id: step01
    name: 01-고객요청서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/00.request.md
    save: request
    next: step02
    onFailure: FAIL

  - id: step02
    name: 02-프로젝트ID 읽기
    type: TOOL
    tool: readMarkdownSection
    with:
      fileFullPath: ${input}/00.request.md
      heading: 프로젝트ID
    save: projectId
    next: step59
    onFailure: FAIL

  - id: step59
    name: 03-프로젝트 리비전 정하기
    type: TOOL
    tool: resolveProjectRevision
    with:

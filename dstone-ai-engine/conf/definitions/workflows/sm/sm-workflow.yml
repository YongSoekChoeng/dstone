        reference에 있는 요구사항분석서의 지금 내용에 영향도분석서를 맞춘다.
        어긋나는 곳과 빠진 곳만 고치고, 나머지는 그대로 둔다.
        아래는 이 일로 오게 한 결정이다. 의견이 있으면 함께 반영한다.
        ${arrival:}
      history: ${decisions:}
      reference: |-
        [요구사항분석서]
        ${state.requirement}
    save: revision
    next: step09

  - id: step39
    name: 51-리뷰 지적에 따른 요구사항분석서 수정
    type: AGENT
    agent: document-revise-agent
    with:
      project_id: ${state.projectId}
      documents:
        - ${input}/${state.now}/01.customer_requirement.md
      request: ${state.request}
      instruction: |-
        ${arrival:}

        리뷰어의 지적(사람의 의견과 어긋나면 사람의 의견을 따른다):
        ${state.review.reason:}
      history: ${decisions:}
    save: revision
    next: step04

  - id: step40
    name: 31-검증 전 바뀐 파일 확인(서버 기동 전)
    type: TOOL
    tool: fileChanges
    with:
      basePath: ${input}/${state.now}
      previous: ${state.workChanges.snapshot:}
      excludeDirs: compile-check
      copyDir: ${input}/.work-copy/${state.now}
    save: workChanges
    next: step29
    onFailure: step29

  - id: step41
    name: 30-검증 전 설계서와 태스크아이템 목록 다시 읽기
    type: TOOL
    tool: readFiles
    with:
      paths:
        - path: ${input}/${state.now}/03-1.design.md
          name: design
          maxChars: 100000
          required: true
        - path: ${input}/${state.now}/03-2.taskitems.md
          name: taskitems
          maxChars: 60000
    save: docs
    next: step40
    onFailure: step19

  - id: step46
    name: 12-참고 기능 시작점 읽기
    type: TOOL
    tool: readMarkdownSection
    with:
      fileFullPath: ${input}/${state.now}/02.impact.md
      heading: 참고 기능
    save: referenceEntries
    saveError: referenceError
    next: step48
    onFailure: step11

  - id: step48
    name: 13-참고 기능 코드 모으기
    type: TOOL
    tool: knowledgeFeatureCode
    with:
      projectId: ${state.projectId}
      sourceRoot: ${state.projectRevision.sourceRoot}
      entries: ${state.referenceEntries}
      outputFile: ${input}/${state.now}/02-1.reference-code.md
      sourceRevision: ${state.projectRevision.revision:}
    save: referenceResult
    saveError: referenceError
    next: step49
    onFailure: step11

  - id: step49
    name: 14-참고 기능 코드 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/02-1.reference-code.md
      maxChars: 60000
    save: referenceCode
    saveError: referenceError
    next: step11
    onFailure: step11

  - id: step50
    name: 18-설계 문서 형식 확인
    type: TOOL
    tool: checkDocuments
    with:
      files:
        - ${input}/${state.now}/03-1.design.md
        - ${input}/${state.now}/03-2.taskitems.md
      ddlFile: ${input}/${state.now}/03-3.ddl(데이터베이스).md
      sizeLimits:
        - path: ${input}/${state.now}/03-1.design.md
          maxChars: 100000
        - path: ${input}/${state.now}/03-2.taskitems.md
          maxChars: 60000
    save: docCheck
    routes:
      ok: step13
      problem: step52
    onFailure: step13

  - id: step52
    name: 47-설계 문서 형식 고치기
    type: AGENT
    agent: document-revise-agent
    with:
      project_id: ${state.projectId}
      documents:
        - ${input}/${state.now}/03-1.design.md
        - ${input}/${state.now}/03-2.taskitems.md
        - ${input}/${state.now}/03-3.ddl(데이터베이스).md
      request: ${state.request}
      instruction: |-
        기계 검사가 찾은 것만 고친다. 형식 오류를 고칠 때는 내용(코드, 표의 값, SQL 문장)을 바꾸지 않는다.
        '크기 초과'인 문서는 같은 내용을 되풀이한 설명과 코드를 한 번만 남겨 줄인다. 구현에 필요한 코드, 이름, 값은 빼거나 요약하지 않는다.
        그렇게 해도 상한을 넘으면 더 줄이지 않고, 요청을 나눠야 한다고 답에 적는다.
        닫히지 않은 코드 블록은 그 블록이 끝나는 곳에 닫는 줄을 넣거나, 내용 없는 여는 줄을 지운다.
        표의 칸이 어긋난 줄은 칸 안의 |를 \|로 쓰거나 `코드`로 감싸서 머리줄과 칸 수를 맞춘다.
        ${state.docCheck.message}
      history: ${decisions:}
    save: revision
    limit:
      max: 1
      scope: ${decisions:}
      over: step13
    next: step50

  - id: step53
    name: 26-개발 결과 형식 확인
    type: TOOL
    tool: checkSources
    with:
      overlayDir: ${input}/${state.now}/dev-resources
    save: sourceCheck
    routes:
      ok: step28
      problem: step58
    onFailure: step28

  - id: step54
    name: 24-손대지 못한 보류가 없는지
    type: TOOL
    tool: containsValue
    with:
      value: ${state.develop.unfinished:0}
      expected: "0"
    routes:
      "true": step18
      "false": step57
    onFailure: step18

  - id: step57
    name: 45-보류 이어서 개발
    type: AGENT
    agent: sm-developer-agent
    with:
      project_id: ${state.projectId}
      base_dir: ${input}/${state.now}
      source_dir: ${state.projectRevision.sourceRoot}
      request: ${state.request}
      design: ${state.docs.design}
      taskitems: ${state.docs.taskitems}
      instruction: ${arrival:}
      history: ${decisions:}
      verification: ${state.verificationOpen:}
      compile_error: ${state.compileError:}
      check_result: |-
        지난 개발이 손대지 못하고 '보류'로 남긴 태스크아이템이 있다. 그것을 이어서 구현한다.
        사람의 결정이나 DB 반영이 필요해 보류한 것은 그대로 보류로 둔다.
        ${state.develop.pendingReasons:}
    save: develop
    limit:
      max: 1
      scope: ${decisions:}
      over: step18
    next: step18
    onFailure: step18

  - id: step58
    name: 42-형식 오류 고치기
    type: AGENT
    agent: sm-developer-agent
    with:
      project_id: ${state.projectId}
      base_dir: ${input}/${state.now}
      source_dir: ${state.projectRevision.sourceRoot}
      request: ${state.request}
      design: ${state.docs.design}
      taskitems: ${state.docs.taskitems}
      instruction: ${arrival:}
      history: ${decisions:}
      verification: ${state.verificationOpen:}
      compile_error: ${state.compileError:}
      check_result: ${state.sourceCheck.message}
    save: develop
    limit:
      max: 1
      scope: ${decisions:}
      over: step28
    next: step18
    onFailure: step28
state:
  projectId: 요청서의 프로젝트ID(step02)
  serverCheck: 테스트 서버 기동 확인(step29, 기동만 확인이면 step45) 결과({success, cause, message, url, dbAliases})
  serverError: 테스트 서버 기동에 실패한 이유(자동 검증을 못 했거나 개발 결과의 기동 오류)
  projectRevision: 이 실행이 쓰는 프로젝트 리비전(step59. route는 ok 또는 none, 그 밖에 revision, sourceRoot, kind, message)
  ddlCheck: DDL과 초기 데이터가 개발 DB에 반영됐는지(step60. route는 none, ok, missing 가운데 하나, 그 밖에 missing, missingRows, message)
  ddlApproval: DDL 반영 승인(step61)의 결정
  verification: 이번 동작 검증(step35)의 답(이번에 확인한 기준만)
  verificationOpen: verificationAll 가운데 PASS가 아닌 것(step65). 개발 Agent에 넘긴다
  devBefore: 개발 전 dev-resources의 파일 상태(step70, fileChanges 결과)
  devChanges: 개발이 바꾼 dev-resources 파일(step66, fileChanges 결과. route는 first, changed, unchanged)
  noChangeApproval: 코드 수정 없음 승인(step69)의 결정
  verificationAll: 기준마다 마지막 판정을 모은 동작 검증 결과(step62. carried가 true면 마지막 회차에 다시 보지 않은 것. step63이 개발 폴더를 새로 만들 때 비움)
  verificationError: 동작 검증 Agent가 끝내지 못한 이유
  autoFix: 자동 수정(step34)이 돌려준 답
  workChanges: 지난 동작 검증 뒤로 작업 폴더에서 바뀐 파일(step40, {first, changed, snapshot, summary, diff})
  request: 고객 요청서 내용
  requirement: 고객요구사항분석서 내용
  review: 리뷰 판정 결과
  reviewDecision: 리뷰 불통과 때 사람이 고른 결과
  impactApproval: 영향도 분석 승인 결과
  impact: 영향도분석서 내용
  designApproval: 설계 승인 결과
  docs: 설계서와 태스크아이템 목록({design, taskitems}, step14·20·32·41이 readFiles로 읽음. 재개발·자동 수정·검증 전에 다시 읽어 최신 내용)
  now: 작업을 시작한 시각(yyyyMMdd-HHmm, settings.startTime이 넣음). 작업 폴더 이름으로 쓴다
  developApproval: 개발 승인(step19) 결과
  impactPath: 영향도 분석(step08)이 돌려준 답(저장 파일과 결정 필요 사항)
  architectPath: 아키텍처 설계(step12)가 돌려준 답(저장 파일과 결정 필요 사항)
  revision: 문서 수정(step25~27, 37~39)이 돌려준 답(고친 파일, 반영한 지시, 반영하지 않은 지시)
  compileResult: 컴파일 확인(step18)이 통과했을 때의 출력
  compileError: 컴파일 확인(step18)이 실패했을 때의 오류(통과하거나 step16가 개발 폴더를 비우면 비어 있다)
  referenceEntries: 영향도분석서의 '## 참고 기능'(본뜰 기존 기능의 화면 경로나 주소, step46)
  referenceResult: 참고 기능 코드 모으기(step48) 결과({success, file, included, omitted, notFound, message})
  referenceCode: 본뜰 기능의 코드 문서(02-1.reference-code.md, step49) 내용
  referenceError: 본뜰 기능의 코드를 모으지 못한 이유(step46~49 가운데 실패한 것. 모두 성공하면 비어 있다)
  docCheck: 설계 문서 형식 확인(step50) 결과({route, problems, checked, skipped, message})
  develop: 개발 Agent(step17, 57, 58)가 돌려준 답(완료·보류 수와 보류 이유)
  sourceCheck: 개발 결과 형식 확인(step53) 결과({route, problems, checked, skipped, message})

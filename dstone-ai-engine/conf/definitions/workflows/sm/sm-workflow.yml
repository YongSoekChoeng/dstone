################################################################################################################
# 어플리케이션 운영관리 Workflow입니다.
# 요청서(00.request.md)에서 시작해 요구사항 → 리뷰 → 영향도 분석 → 설계 → 개발 → 컴파일 확인까지 진행합니다.
#
# 문서는 LLM이 아니라 TOOL step이 읽어서 Agent의 입력으로 넘깁니다. 읽으려고 LLM을 한 번 더 부르지 않으려는 것입니다.
# 파일이 없으면 TOOL step이 실패하므로, 앞 step이 문서를 저장하지 못한 채 다음으로 넘어가지 않습니다.
# 문서를 읽는 step은 maxChars: 60000으로 읽습니다(엔진의 Tool 결과 상한 max-result-chars와 같은 값).
# 그보다 크면 잘라서 넘기지 않고 실패로 멈춥니다. 문서를 줄이거나 두 값을 올린 뒤 이어서 실행합니다.
#
# 사람의 승인 의견과 검토 판정은 엔진이 전달합니다(2.0.0, 2026-11-20).
#   instruction: ${arrival:}    이 step으로 오게 만든 마지막 결정(승인 결정과 의견, 또는 리뷰 판정과 사유)
#   history: ${decisions:}      이 실행에서 지금까지 내려진 결정 전체
# route를 새로 이어도 이 두 줄은 고칠 필요가 없습니다. 읽는 법은 Skill handling-instructions에 있습니다.
#
# 문서를 고치는 일과 새로 쓰는 일은 다른 Agent가 합니다.
#   [~ 수정]      document-revise-agent가 기존 문서에서 지시받은 부분만 고칩니다(step25~27, step39).
#   [~ 다시 작성]  그 문서를 만든 Agent가 처음부터 다시 씁니다. 사람이 고를 때만 그렇게 합니다.
# 앞 문서가 바뀌어도 뒤 문서를 새로 쓰지 않습니다(2.3.0). 새로 쓰면 재개발·전문가 해결로 고친 것이 사라집니다.
#   step07: 영향도분석서가 있으면 step38이 맞춰 고치고, 없으면 step08이 씁니다.
#   step11: 설계서가 있으면 step37이 맞춰 고치고, 없으면 step12가 씁니다.
#   파일이 있는지는 범용 Tool isFileExist가 true/false로 알려 주고, step의 routes가 그 값으로 갈 곳을 나눕니다(2.4.1).
#   파일이 없는 것은 정상 결과라서 실행 이력에 실패로 남지 않습니다.
#
# 개발 결과는 작업 폴더의 dev-resources에 "원본 소스 루트 기준 같은 경로"로 쌓입니다(원본은 건드리지 않습니다).
# 원본에서 지워야 하는 파일은 dev-resources/_delete-files.txt에 한 줄에 하나씩 적습니다.
# 개발 폴더는 설계를 승인하고 개발로 갈 때만 비웁니다(step16). 설계서에서 빠진 파일이 개발 폴더에 남지 않게 하려는 것입니다.
# [재개발]은 비우지 않고 있는 결과를 고치며, 고친 내용을 설계서에도 옮겨 적습니다(sm-developer-agent 2.1.0).
# 그래서 나중에 설계 수정을 거쳐 개발 폴더를 다시 비워도 재개발로 고친 것이 사라지지 않습니다.
# 재개발 때는 step20~21이 설계서와 태스크아이템 목록을 다시 읽어 넘깁니다(지난 개발이 고친 최신 내용).
#
# [전문가 해결](2.2.0): 개발 결과가 동작하지 않을 때 사람이 고릅니다. 승인 의견에 본 증상을 적습니다.
#   step22~23이 설계서와 목록을 다시 읽고, step24의 sm-troubleshooter-agent가 원인을 찾아 고친 뒤 설계서에도 남깁니다.
#   그 Agent가 프로젝트 DB를 조회하고, 격리 시험 서버(startSandboxServer)를 띄워 브라우저로 재현·확인까지 합니다(docs/09 11.1절).
#   격리를 지원하지 않는 프로젝트에서만 원래 DB에 붙는 임시 시험 서버(startTestServer)를 씁니다.
#   로그인할 시험계정은 프로젝트 관리에 둡니다(요청서에는 계정을 적지 않습니다).
#   끝나면 컴파일 확인(step18)을 거쳐 개발 승인으로 돌아옵니다.
#
# 컴파일 확인: 개발 Agent가 끝나기 전에 범용 Tool compileJava로 스스로 컴파일해 고치고(최대 3번), 그 뒤 step18이 같은 Tool로 한 번 더 확인합니다.
# 통과하든 실패하든 개발 승인(step19)으로 가고, 실패 내용은 다음 개발·설계 수정에 전달됩니다.
# compileJava는 원본 전체를 빌드하지 않고, 원본이 만들어 둔 클래스 폴더와 의존성을 참조해 바뀐 파일(과 그것을 쓰는 원본 파일)만 컴파일합니다.
# 그래서 원본을 한 번은 빌드해 두어야 합니다(없으면 그렇다고 실패로 알립니다).
#
# 자동 동작 검증(2.4.0): 컴파일이 통과하면 사람에게 묻기 전에 실제로 돌려 봅니다.
#   step29: 일회용 DB에 복제 + DDL 반영 + 빌드 + 기동. 실패 원인이 개발 결과(code)면 자동 수정, 환경(environment)이면 사람에게.
#   step35: 검증 Agent가 완료 기준을 눌러 보고 PASS/FAIL/BLOCKED를 냄. FAIL이 있으면 자동 수정.
#   step31: 자동 수정은 사람의 결정 하나마다 최대 2번. 사람이 새로 시키면 다시 2번.
#   이 고리의 판정(step30 개발 결과 탓인지, step31 횟수가 남았는지, step36 FAIL이 있는지)은 실패가 아니라 정상 결과입니다.
#   그래서 범용 Tool containsValue(true/false)와 countUp(route: within/over)의 값을 routes로 받아 나눕니다(2.6.1).
#   "FAIL 없음", "한도를 다 씀"이 실행 이력에 실패로 남지 않고, onFailure는 Tool이 정말 실패했을 때만 씁니다.
#   격리할 수 없는 프로젝트(지원하지 않는 DB·구성, 프로젝트ID 없음)는 통과로 치지 않고 이유와 함께 개발 승인으로 갑니다(state의 sandboxError).
#   step29가 띄운 서버는 바로 다음 step35가 같은 입력으로 다시 부르면 그대로 씁니다(엔진의 넘겨주기는 한 step까지라 둘 사이에 step을 넣지 않습니다).
#   step40(step29 앞)은 지난 검증 뒤로 작업 폴더에서 바뀐 파일을 범용 Tool fileChanges로 찾아, step35가 바뀐 것과 지난번에 안 된 것만 깊게 보게 합니다(2.5.0).
#   시험 환경이 원래 서버와 달라서 생긴 실패는 검증이 BLOCKED로 내고 자동 수정이 고치지 않습니다(Skill test-environment, 2.5.0).
#   step41(step40 앞)이 설계서를 다시 읽어 step35에 넘깁니다(2.6.0). 자동 수정·전문가 해결이 설계서를 고친 뒤에도
#   검증 Agent가 고치기 전 설계서를 받지 않게 하려는 것입니다.
#
# 검증 수준 고르기(2.7.0): 모든 변경에 서버를 띄우고 화면을 누를 필요는 없어서, 설계 승인(step13)에서 사람이 고릅니다.
#   승인(개발진행)                 화면 검증(위의 자동 동작 검증 그대로)
#   승인(개발진행, 기동만 확인)     격리 서버가 뜨는지만 보고 개발 승인으로(step45). 화면이 없는 변경(배치, 연동, 쿼리만)
#   승인(개발진행, 컴파일만)        서버를 띄우지 않고 개발 승인으로. 동작이 바뀌지 않는 변경(주석, 안내 문구, 설정값 하나)
#   설계서의 '검증 방법 제안'(sm-architect-agent)이 어느 쪽인지와 이유를 적어 두고, 고르는 것은 사람입니다.
#   생략은 첫 검증에만 적용합니다. 재개발·전문가 해결·자동 수정으로 다시 돌 때는 화면 검증으로 갑니다.
#   step42가 countUp(max 1)으로 첫 검증인지 세고(within = 처음, over = 다시 돌 때), step43~44가 승인 결정을 봅니다.
#   분기는 step28 뒤에 둡니다. step29와 step35 사이에는 step을 넣지 않습니다(서버 넘겨주기, 위 설명).
#
# 요구사항 리뷰(step05)는 판정만 돌려주고 분석서를 고치지 않습니다(2.6.0). 불통과 사유는 엔진이 다음 단계에 넘깁니다.
#
# 원본 소스 경로는 step02가 요청서의 "## 소스경로" 아래 내용을 범용 Tool readMarkdownSection으로 읽어 state.sourceDir에 둡니다.
# 작업 폴더는 "입력 폴더/실행 시각(yyyyMMdd-HHmm)"입니다. step00이 LLM 없이 시각만 받아 state.now에 넣습니다.
################################################################################################################
id: sm-workflow
version: 2.7.0
description: |
  어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00.request.md 파일이 있는 폴더의 절대경로를 입력하라(파일명 제외).
  요청서에는 '현업요청', '소스경로'와, 그 소스를 dstone-knowledge에 분석해 두었다면 '프로젝트ID'를 적는다.
  계정·비밀번호는 요청서에 적지 않는다. 화면 로그인용 시험계정은 프로젝트 관리에 두면 전문가 해결 Agent가 임시 시험 서버에서 그 계정으로 확인한다.
  DB는 프로젝트ID로 프로젝트 관리에 등록한 DB를 찾아 조회한다(다른 DB를 쓸 때만 시험환경에 'DB연결'을 적는다).
  예)
  D:/WorkShop/00.SM/work004
settings:
  checkpoint: true
  maxIterations: 100
  onError: STOP
input: string, 요청서(00.request.md)가 들어 있는 폴더의 절대경로
steps:

  - id: step00
    name: 01-사전작업
    type: TOOL
    tool: getToDate
    with:
      format: yyyyMMdd-HHmm
    save: now
    next: step01
    onFailure: FAIL

  - id: step01
    name: 02-고객요청서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/00.request.md
    save: request
    next: step02
    onFailure: FAIL

  - id: step02
    name: 03-소스경로 읽기
    type: TOOL
    tool: readMarkdownSection
    with:
      fileFullPath: ${input}/00.request.md
      heading: 소스경로
    save: sourceDir
    next: step03
    onFailure: FAIL

  - id: step03
    name: 04-고객요청사항 분석
    type: AGENT
    agent: sm-requirement-analyze-agent
    with:
      base_dir: ${input}/${state.now}
      request: ${state.request}
      instruction: ${arrival:}
      history: ${decisions:}
    next: step04

  - id: step04
    name: 05-고객요구사항분석서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/01.customer_requirement.md
      maxChars: 60000
    save: requirement
    next: step05
    onFailure: FAIL

  - id: step05
    name: 06-고객요청사항 분석 리뷰
    type: SUPERVISOR
    agent: sm-requirement-analyze-reviewer-agent
    with:
      request: ${state.request}
      requirement: ${state.requirement}
    save: review
    next: step07
    onFailure: step06

  - id: step06
    name: 07-리뷰 불통과 처리 결정
    type: APPROVAL
    approval:
      approverRole: PL
    save: reviewDecision
    routes:
      그대로 진행: step07
      고객 요청사항 재분석: step03
      요구사항 수정: step39
      다시 리뷰: step04
      중지: FAIL

  - id: step07
    name: 08-기존 영향도분석서 확인
    type: TOOL
    tool: isFileExist
    with:
      filePath: ${input}/${state.now}/02.impact.md
    routes:
      "true": step38
      "false": step08
    onFailure: FAIL

  - id: step08
    name: 40-영향도 분석
    type: AGENT
    agent: sm-analyze-impact-agent
    with:
      base_dir: ${input}/${state.now}
      request: ${state.request}
      requirement: ${state.requirement}
      instruction: ${arrival:}
      history: ${decisions:}
    next: step09
    save: impactPath

  - id: step09
    name: 10-영향도 분석 승인
    type: APPROVAL
    approval:
      approverRole: PL
    save: impactApproval
    routes:
      승인(설계진행): step10
      영향도 수정: step26
      영향도 다시 작성: step08
      요구사항 수정: step27
      중지: FAIL

  - id: step10
    name: 11-영향도분석서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/02.impact.md
      maxChars: 60000
    save: impact
    next: step11
    onFailure: FAIL

  - id: step11
    name: 12-기존 설계서 확인
    type: TOOL
    tool: isFileExist
    with:
      filePath: ${input}/${state.now}/03-1.design.md
    routes:
      "true": step37
      "false": step12
    onFailure: FAIL

  - id: step12
    name: 39-아키텍처 설계
    type: AGENT
    agent: sm-architect-agent
    with:
      base_dir: ${input}/${state.now}
      request: ${state.request}
      requirement: ${state.requirement}
      impact: ${state.impact}
      instruction: ${arrival:}
      history: ${decisions:}
    next: step13
    save: architectPath

  - id: step13
    name: 14-설계 승인
    type: APPROVAL
    approval:
      approverRole: PL
    save: designApproval
    routes:
      승인(개발진행): step14
      승인(개발진행, 기동만 확인): step14
      승인(개발진행, 컴파일만): step14
      설계 수정: step25
      설계 다시 작성: step12
      영향도 수정: step26
      중지: FAIL

  - id: step14
    name: 15-상세 설계서 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      maxChars: 60000
    save: design
    next: step15
    onFailure: FAIL

  - id: step15
    name: 16-태스크아이템 목록 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-2.taskitems.md
      maxChars: 60000
    save: taskitems
    next: step16
    onFailure: FAIL

  - id: step16
    name: 17-기존개발디렉토리초기화
    type: TOOL
    tool: deleteDir
    with:
      fileFullPath: ${input}/${state.now}/dev-resources
    saveError: compileError
    next: step17

  - id: step17
    name: 18-개발
    type: AGENT
    agent: sm-developer-agent
    with:
      base_dir: ${input}/${state.now}
      source_dir: ${state.sourceDir}
      request: ${state.request}
      design: ${state.design}
      taskitems: ${state.taskitems}
      instruction: ${arrival:}
      history: ${decisions:}
      compile_error: ${state.compileError:}
    next: step18
    onFailure: FAIL

  - id: step18
    name: 19-컴파일 확인
    type: TOOL
    tool: compileJava
    with:
      sourceRoot: ${state.sourceDir}
      overlayDir: ${input}/${state.now}/dev-resources
      outputDir: ${input}/${state.now}/compile-check
      deleteList: ${input}/${state.now}/dev-resources/_delete-files.txt
    save: compileResult
    saveError: compileError
    next: step28
    onFailure: step19

  - id: step19
    name: 20-개발 승인
    type: APPROVAL
    approval:
      approverRole: PL
    save: developApproval
    routes:
      승인: END
      재개발: step20
      전문가 해결: step22
      설계 수정: step25
      영향도 수정: step26
      요구사항 수정: step27
      실패: FAIL

  - id: step20
    name: 21-재개발 전 설계서 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      maxChars: 60000
    save: design
    next: step21
    onFailure: FAIL

  - id: step21
    name: 22-재개발 전 태스크아이템 목록 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-2.taskitems.md
      maxChars: 60000
    save: taskitems
    next: step17
    onFailure: FAIL

  - id: step22
    name: 23-전문가 해결 전 설계서 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      maxChars: 60000
    save: design
    next: step23
    onFailure: FAIL

  - id: step23
    name: 24-전문가 해결 전 태스크아이템 목록 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-2.taskitems.md
      maxChars: 60000
    save: taskitems
    next: step24
    onFailure: FAIL

  - id: step24
    name: 25-전문가 해결
    type: AGENT
    agent: sm-troubleshooter-agent
    with:
      base_dir: ${input}/${state.now}
      source_dir: ${state.sourceDir}
      request: ${state.request}
      design: ${state.design}
      taskitems: ${state.taskitems}
      instruction: ${arrival}
      history: ${decisions:}
      compile_error: ${state.compileError:}
    save: troubleshoot
    next: step18
    onFailure: step19

  - id: step25
    name: 26-설계서 수정
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/03-1.design.md
        - ${input}/${state.now}/03-2.taskitems.md
        - ${input}/${state.now}/03-3.ddl(데이터베이스).md
      request: ${state.request}
      instruction: ${arrival}
      history: ${decisions:}
      reference: ${state.compileError:}
    save: revision
    next: step13

  - id: step26
    name: 27-영향도분석서 수정
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/02.impact.md
      request: ${state.request}
      instruction: ${arrival}
      history: ${decisions:}
    save: revision
    next: step09

  - id: step27
    name: 28-고객요구사항분석서 수정
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/01.customer_requirement.md
      request: ${state.request}
      instruction: ${arrival}
      history: ${decisions:}
    save: revision
    next: step04

  - id: step28
    name: 29-자동 검증할 프로젝트 확인
    type: TOOL
    tool: readMarkdownSection
    with:
      fileFullPath: ${input}/00.request.md
      heading: 프로젝트ID
    save: projectId
    saveError: projectIdError
    next: step42
    onFailure: step19

  - id: step42
    name: 29-첫 검증인지(검증 생략은 첫 검증에만)
    type: TOOL
    tool: countUp
    with:
      previous: ${state.verifyRound:}
      max: 1
    save: verifyRound
    routes:
      within: step43
      over: step41
    onFailure: step41

  - id: step43
    name: 29-컴파일만 확인으로 승인했는지
    type: TOOL
    tool: containsValue
    with:
      value: ${state.designApproval.decision:}
      expected: 승인(개발진행, 컴파일만)
    routes:
      "true": step19
      "false": step44
    onFailure: step41

  - id: step44
    name: 29-기동만 확인으로 승인했는지
    type: TOOL
    tool: containsValue
    with:
      value: ${state.designApproval.decision:}
      expected: 승인(개발진행, 기동만 확인)
    routes:
      "true": step45
      "false": step41
    onFailure: step41

  - id: step45
    name: 31-격리 기동만 확인
    type: TOOL
    tool: startSandboxServer
    with:
      projectId: ${state.projectId}
      sourceRoot: ${state.sourceDir}
      overlayDir: ${input}/${state.now}/dev-resources
      ddlFile: ${input}/${state.now}/03-3.ddl(데이터베이스).md
      deleteList: ${input}/${state.now}/dev-resources/_delete-files.txt
    save: sandboxCheck
    saveError: sandboxError
    next: step19
    onFailure: step30

  - id: step29
    name: 31-격리 기동 확인
    type: TOOL
    tool: startSandboxServer
    with:
      projectId: ${state.projectId}
      sourceRoot: ${state.sourceDir}
      overlayDir: ${input}/${state.now}/dev-resources
      ddlFile: ${input}/${state.now}/03-3.ddl(데이터베이스).md
      deleteList: ${input}/${state.now}/dev-resources/_delete-files.txt
    save: sandboxCheck
    saveError: sandboxError
    next: step35
    onFailure: step30

  - id: step30
    name: 32-기동 실패가 개발 결과 탓인지
    type: TOOL
    tool: containsValue
    with:
      value: ${state.sandboxCheck.cause:}
      expected: code
    routes:
      "true": step31
      "false": step19
    onFailure: step19

  - id: step31
    name: 33-자동 수정 횟수 확인
    type: TOOL
    tool: countUp
    with:
      previous: ${state.autoFixRound}
      max: 2
      scope: ${decisions:}
    save: autoFixRound
    routes:
      within: step32
      over: step19
    onFailure: step19

  - id: step32
    name: 34-자동 수정 전 설계서 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      maxChars: 60000
    save: design
    next: step33
    onFailure: step19

  - id: step33
    name: 35-자동 수정 전 태스크아이템 목록 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-2.taskitems.md
      maxChars: 60000
    save: taskitems
    next: step34
    onFailure: step19

  - id: step34
    name: 36-자동 수정
    type: AGENT
    agent: sm-auto-fix-agent
    with:
      base_dir: ${input}/${state.now}
      source_dir: ${state.sourceDir}
      project_id: ${state.projectId}
      request: ${state.request}
      design: ${state.design}
      taskitems: ${state.taskitems}
      boot_error: ${state.sandboxError:}
      verification: ${state.verification}
      history: ${decisions:}
    save: autoFix
    next: step18
    onFailure: step19

  - id: step35
    name: 37-동작 검증
    type: AGENT
    agent: sm-verifier-agent
    with:
      base_dir: ${input}/${state.now}
      source_dir: ${state.sourceDir}
      project_id: ${state.projectId}
      requirement: ${state.requirement}
      design: ${state.design}
      history: ${decisions:}
      previous: ${state.verification:}
      changes: ${state.workChanges.summary:}
    save: verification
    saveError: verificationError
    next: step36
    onFailure: step19

  - id: step36
    name: 38-실패한 완료 기준이 있는지
    type: TOOL
    tool: containsValue
    with:
      value: ${state.verification.scenarios}
      field: result
      expected: FAIL
    routes:
      "true": step31
      "false": step19
    onFailure: step19

  - id: step37
    name: 13-기존 설계서 맞춤
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/03-1.design.md
        - ${input}/${state.now}/03-2.taskitems.md
        - ${input}/${state.now}/03-3.ddl(데이터베이스).md
      request: ${state.request}
      instruction: |-
        reference에 있는 요구사항분석서와 영향도분석서의 지금 내용에 설계 문서를 맞춘다.
        두 문서와 어긋나는 곳과 빠진 곳만 고친다. 재개발과 전문가 해결로 고친 내용('## 수정 이력')은 두 문서와 어긋나지 않는 한 그대로 둔다.
        아래는 이 일로 오게 한 결정이다. 의견이 있으면 함께 반영한다.
        ${arrival:}
      history: ${decisions:}
      reference: |-
        [요구사항분석서]
        ${state.requirement}

        [영향도분석서]
        ${state.impact}
    save: revision
    next: step13

  - id: step38
    name: 09-기존 영향도분석서 맞춤
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/02.impact.md
      request: ${state.request}
      instruction: |-
        reference에 있는 요구사항분석서의 지금 내용에 영향도분석서를 맞춘다.
        어긋나는 곳과 빠진 곳만 고치고, 나머지는 그대로 둔다.
        아래는 이 일로 오게 한 결정이다. 의견이 있으면 함께 반영한다.
        ${arrival:}
      history: ${decisions:}
      reference: |-
        [요구사항분석서]
        ${state.requirement}
    save: revision
    next: step09

  - id: step39
    name: 41-리뷰 지적에 따른 요구사항 수정
    type: AGENT
    agent: document-revise-agent
    with:
      documents:
        - ${input}/${state.now}/01.customer_requirement.md
      request: ${state.request}
      instruction: |-
        ${arrival:}

        리뷰어의 지적(사람의 의견과 어긋나면 사람의 의견을 따른다):
        ${state.review.reason:}
      history: ${decisions:}
    save: revision
    next: step04

  - id: step40
    name: 30-검증 전 바뀐 파일 확인(격리 기동 전)
    type: TOOL
    tool: fileChanges
    with:
      basePath: ${input}/${state.now}
      previous: ${state.workChanges.snapshot:}
      excludeDirs: compile-check
    save: workChanges
    next: step29
    onFailure: step29

  - id: step41
    name: 30-검증 전 설계서 다시 읽기
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/${state.now}/03-1.design.md
      maxChars: 60000
    save: design
    next: step40
    onFailure: step19
state:
  projectId: 요청서의 프로젝트ID(step28)
  projectIdError: 프로젝트ID가 없어 자동 검증을 못 한 이유
  sandboxCheck: 격리 기동 확인(step29, 기동만 확인이면 step45) 결과({success, cause, message})
  verifyRound: 첫 검증인지 센 값(step42, {route, count, scope, message}). within이면 처음이라 설계 승인에서 고른 검증 생략을 따른다
  sandboxError: 격리 기동에 실패한 이유(자동 검증을 못 했거나 개발 결과의 기동 오류)
  verification: 동작 검증(step35) 결과(완료 기준마다 PASS/FAIL/BLOCKED와 근거)
  verificationError: 동작 검증 Agent가 끝내지 못한 이유
  autoFixRound: 자동 수정 횟수({route, count, scope, message})
  autoFix: 자동 수정(step34)이 돌려준 답
  workChanges: 지난 동작 검증 뒤로 작업 폴더에서 바뀐 파일(step40, {first, changed, snapshot, summary})
  request: 고객 요청서 내용
  requirement: 고객요구사항분석서 내용
  review: 리뷰 판정 결과
  reviewDecision: 리뷰 불통과 때 사람이 고른 결과
  impactApproval: 영향도 분석 승인 결과
  impact: 영향도분석서 내용
  designApproval: 설계 승인 결과
  design: 상세 설계서 내용
  taskitems: 태스크아이템 목록 내용
  now: 작업을 시작한 시각(yyyyMMdd-HHmm). 작업 폴더 이름으로 쓴다
  developApproval: 개발 승인(step19) 결과
  impactPath: 영향도 분석(step08)이 돌려준 답(저장 파일과 결정 필요 사항)
  architectPath: 아키텍처 설계(step12)가 돌려준 답(저장 파일과 결정 필요 사항)
  revision: 문서 수정(step25~27, 37~39)이 돌려준 답(고친 파일, 반영한 지시, 반영하지 않은 지시)
  sourceDir: 원본 소스 경로(요청서의 "## 소스경로", step02)
  compileResult: 컴파일 확인(step18)이 통과했을 때의 출력
  compileError: 컴파일 확인(step18)이 실패했을 때의 오류(통과하거나 step16가 개발 폴더를 비우면 비어 있다)
  troubleshoot: 전문가 해결(step24)이 돌려준 답(원인과 근거, 고친 것, 설계서와 달라진 점, 못 푼 것)

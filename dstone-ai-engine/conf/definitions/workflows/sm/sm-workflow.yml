################################################################################################################ 
# 어플리케이션 운영관리 Workflow입니다. 
# 요청서(00-request.md)에서 시작해 요구사항 → 영향도 분석 → 리뷰 → 설계 → 구현까지 진행합니다.
################################################################################################################
id: sm-workflow
version: 1.0.0
description: |
  어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00-request.md 파일의 경로를(파일명 제외) 입력하라. 
  요청서에는 '현업요청', '소스경로'와, 그 소스를 dstone-knowledge에 분석해 두었다면 '프로젝트ID'를 적는다.
  예)
  D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
settings:
  checkpoint: true
  maxIterations: 100
  onError: STOP
input: string, 요청서가 작성된 디렉토리명
state:
  custReq: step01_readCustReq step의 결과
steps:

  - id: step01_readCustReq
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/00-request.md
    save: custReq
    onFailure: FAIL
    next: step02_decideJobKind

  - id: step02_decideJobKind
    type: ROUTER
    with: ${input}
    agent: sm-decide-job-kind-agent
    routes:
      신규개발: END
      일반: FAIL

# 어플리케이션 운영관리 Workflow입니다. 요청서(00-request.md)에서 시작해 요구사항 → 영향도 분석 → 리뷰 → 설계 → 구현까지 진행합니다.
#
# 경로가 둘입니다. step00이 요청서를 읽으면 step01(ROUTER)이 요청서의 말만 보고 경로를 고릅니다.
#   일반      오류 수정이나 기능 변경이 하나라도 있는 요청. 아래 "흐름"의 step02~step08을 그대로 탑니다.
#   신규개발  없는 메뉴/화면/테이블을 새로 만드는 요청. 이 파일 아래쪽의 step09 ~ step32을 탑니다("신규 개발 경로" 주석 참고).
# 분류하지 못하면(step01 실패) 일반 경로로 갑니다. 일반 경로의 Agent들은 신규 개발이 섞인 요청도 다룰 수 있습니다.
#
# 흐름 (일반 경로)
#   step00 요청서 읽기(LLM 없이) → step01 경로 고르기 → step02 요구사항 분석 → step03 영향도 분석 → step04 리뷰(자동 판정) → step05 사람의 결정
#     step05에서 고르는 것        가는 곳
#     진행                        step06 (설계)
#     재요구분석                  step00 → step02 (요구사항 정의서부터 틀렸을 때. 요청서를 다시 읽고, Agent가 지적 사항을 반영해 요구사항을 다시 쓰고, 영향도 분석과 리뷰도 다시 함)
#     재영향도분석                step03 (Agent가 지적 사항을 반영해 영향도 분석을 다시 함)
#     재영향도분석리뷰            step04 (01-requirements.md나 02-impact.md를 사람이 직접 고친 뒤, 리뷰만 다시 받음)
#     중단                        FAIL
#   step06 설계 → step07 사람의 결정 → step08 구현
#
# 어디로 돌아갈지는 step04의 reason 첫 줄을 보고 정합니다. 리뷰 Agent가 "[수정 대상: 요구사항 정의서]"처럼
# 어느 문서를 고쳐야 하는지 적어 줍니다. 요구사항이 틀렸는데 재영향도분석(step03)만 반복하면 같은 불통과가 계속 나옵니다.
#
# step05는 APPROVAL입니다. 갈 곳이 여럿이라 승인/반려 둘로는 나눌 수 없어서, routes에 이름을 적고 사람이 그중 하나를 고르게 했습니다.
# step04(리뷰)는 통과든 불통과든 step05로 갑니다. 리뷰 결과는 참고 자료이고, 어떻게 할지는 사람이 정합니다(AI의 리뷰와 사람의 승인은 별개입니다).
#
# step 사이에 값이 오가는 길
#   step은 결과를 save에 적은 state 이름으로 저장하고, 뒤의 step은 ${state.이름}으로 읽습니다.
#   표현식은 값을 읽어 오기만 합니다. 파일을 읽어 두고, 검증하고, 목록을 거르는 일은 범용 Tool이 합니다
#   (readFiles, readItemFiles, checkData, filterList, editFileTexts).
#   이 Workflow만을 위한 자바 코드는 없습니다. 흐름을 바꾸려면 이 파일을, 문서의 모양을 바꾸려면
#   문서 Agent의 프롬프트(agents/pilot/pilot-newdev-doc-writer-agent.md의 본문)를 고치면 됩니다.
#
# 재분석할 때 지적 사항이 전달되는 길
#   step02와 step03의 input.feedback이 step04의 불통과 사유(state.review.reason)와 step05에서 사람이 적은 의견
#   (state.analysisApproval.comment)을 줄바꿈으로 이어서 넘깁니다. 처음 실행할 때는 둘 다 아직 없어서 빈 글자가 됩니다.
#   그래서 step05에서 "재요구분석"이나 "재영향도분석"을 고를 때는 comment에 무엇을 고쳐야 하는지 적어 주는 것이 좋습니다.
#
# step00을 둔 이유
#   요청서는 모든 Agent가 가장 먼저 읽는 파일입니다. Agent에게 읽으라고 하면 Agent마다 "LLM 호출 → readFile → 다시 LLM 호출"로
#   LLM 호출이 한 번씩 더 나갑니다. 읽을 파일이 정해져 있으니 TOOL step이 LLM 없이 한 번 읽어 두고(state.request), 그 내용을 각 Agent의
#   input.request로 넘깁니다. 요청서가 없으면 LLM을 부르기 전에 여기서 바로 실패합니다.
#   리뷰(step04)에는 넘기지 않습니다. 리뷰는 사람이 고친 문서를 다시 볼 수 있어야 해서 항상 파일에서 직접 읽습니다.
#   실행 도중에 요청서를 고쳤으면 "재요구분석"을 고르십시오. 그래야 step00이 요청서를 다시 읽습니다
#   (재영향도분석/재설계는 처음 읽어 둔 요청서를 그대로 씁니다).
#   이때 step01도 다시 거칩니다. 요청서를 신규 개발만 남게 고쳤다면 신규 개발 경로로 넘어갑니다.
#
# 같은 step05에 여러 번 돌아와도 됩니다. 결정은 한 번 쓰고 지우므로 올 때마다 사람에게 다시 묻습니다.
# 되돌아가는 횟수는 settings.maxIterations가 막습니다(재영향도분석 한 바퀴 = step03, step04, step05 세 번. 재요구분석은 step00, step01, step02까지 여섯 번).
#
# step id를 짓는 규칙: step00부터 이 파일에 적힌 순서대로 번호를 매깁니다. id만 보고도 순서를 짐작할 수 있습니다.
#   step00 ~ step01   두 경로가 함께 지나는 step (요청서 읽기, 경로 고르기)
#   step02 ~ step08   일반 경로 (오류 수정 / 기능 변경)
#   step09 ~ step32   신규 개발 경로
# step을 사이에 끼워 넣으면 그 뒤의 번호를 다시 매기고, next / onFailure / routes와 이 주석들의 id도 함께 고칩니다.
id: pilot-workflow
version: 1.0.0
description: |
  어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00-request.md 파일의 경로를(파일명 제외) 입력하라. 
  요청서에는 '소스경로'와, 그 소스를 dstone-knowledge에 분석해 두었다면 '프로젝트ID'를 적는다.
  예)
  D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
settings:
  checkpoint: true
  maxIterations: 100
  onError: STOP
input: string
state:
  request: 요청서(00-request.md) 내용 - step00
  classify: 경로 고르기 결과 {route(신규개발/일반), reason} - step01
  requirements: 요구사항 분석 결과 - step02
  impact: 영향도 분석 결과 - step03
  review: 분석문서 리뷰 판정 {pass, reason} - step04
  analysisApproval: 분석문서 승인 결정 {decision, approver, comment} - step05
  design: 아키텍처 설계 결과 - step06
  designApproval: 설계문서 승인 결정 - step07
  implementation: 구현 결과 - step08
  reference: (신규개발) 참고 구현 파일 경로 - step09
  sources: (신규개발) 참고 구현 파일 내용 {files, missing, text} - step10
  analysis: (신규개발) 요구사항 + 변경 대상 + 함께 쓰는 이름 - step11
  impactCheck: (신규개발) 분석 자동 검증 {ok, problems, text, feedback} - step12
  newApproval: (신규개발) 분석 승인 결정 - step15
  designTargets: (신규개발) 변경 대상마다 참고 파일·지금 내용을 붙인 것 - step16
  designs: (신규개발) 파일별 설계 목록 - step17
  designError: (신규개발) 설계에 실패한 파일의 사유 - step17
  designCheck: (신규개발) 설계 자동 검증 {ok, problems, text, feedback} - step18
  editDesigns: (신규개발) 있는 파일을 고치는 설계만 - step19
  editCheckError: (신규개발) 변경 전 글자가 파일과 맞지 않는 곳 - step20
  newDesignApproval: (신규개발) 설계 승인 결정 - step22
  copyDesigns: (신규개발) 참고 파일이 있는 새 파일의 설계 - step23
  copied: (신규개발) 복사하며 이름 바꾼 기록(반복별) - step24
  createDesigns: (신규개발) 참고 파일이 없는 새 파일의 설계 - step25
  created: (신규개발) 새 파일 저장 기록(반복별) - step26
  edited: (신규개발) 있는 파일 고친 기록(반복별) - step27
  developDesigns: (신규개발) 빼거나 더할 것이 있는 복사 파일의 설계 - step28
  developInputs: (신규개발) 그 파일들의 줄 번호 붙은 내용 - step29
  developed: (신규개발) 줄 번호 변경 목록(반복별) - step30
  applied: (신규개발) 줄 번호 변경 적용 기록(반복별) - step31
  tasksFile: (신규개발) 구현 결과 문서(04-tasks.md) 저장 결과 - step32
return:
  route: ${state.classify.route}
  requirements: ${state.requirements}
  impact: ${state.impact}
  review: ${state.review}
  design: ${state.design}
  implementation: ${state.implementation}
  newdevReference: ${state.reference}
  newdevAnalysis: ${state.analysis}
  newdevAnalysisCheck: ${state.impactCheck.text}
  newdevDesigns: ${state.designs}
  newdevDesignCheck: ${state.designCheck.text}
  newdevEditCheck: ${state.editCheckError}
  newdevTasks: ${state.tasksFile}
steps:

  - id: step00
    type: TOOL
    tool: readFile
    with:
      fileFullPath: ${input}/00-request.md
    save: request
    next: step01
    onFailure: FAIL

  - id: step01
    type: ROUTER
    agent: pilot-request-router-agent
    with: ${state.request}
    save: classify
    routes:
      신규개발: step09
      일반: step02
    onFailure: step02

  - id: step02
    type: AGENT
    agent: pilot-requirment-analyzer-agent
    with:
      workDir: ${input}
      request: ${state.request}
      feedback: |-
        ${state.review.reason:}
        ${state.analysisApproval.comment:}
    save: requirements
    next: step03
    onFailure: FAIL

  - id: step03
    type: AGENT
    agent: pilot-impact-analyzer-agent
    with:
      workDir: ${input}
      request: ${state.request}
      feedback: |-
        ${state.review.reason:}
        ${state.analysisApproval.comment:}
    save: impact
    next: step04
    onFailure: FAIL

  - id: step04
    type: SUPERVISOR
    agent: pilot-impact-analyzer-review-agent
    with:
      workDir: ${input}
    save: review
    next: step05
    onFailure: step05

  - id: step05
    type: APPROVAL
    approval:
      artifact: analysis-document
      approverRole: PL
    save: analysisApproval
    routes:
      진행: step06
      재요구분석: step00
      재영향도분석: step03
      재영향도분석리뷰: step04
      중단: FAIL

  - id: step06
    type: AGENT
    agent: pilot-architect-agent
    with:
      workDir: ${input}
      request: ${state.request}
    save: design
    next: step07
    onFailure: FAIL

  - id: step07
    type: APPROVAL
    approval:
      artifact: architecture-document
      approverRole: PL
    save: designApproval
    routes:
      진행: step08
      재요구분석: step00
      재영향도분석: step03
      재영향도분석리뷰: step04
      재설계: step06
      중단: FAIL

  - id: step08
    type: AGENT
    agent: pilot-developer-agent
    with:
      workDir: ${input}
      request: ${state.request}
    save: implementation
    next: END
    onFailure: FAIL

  - id: step09
    type: AGENT
    agent: pilot-newdev-reference-agent
    with:
      request: ${state.request}
      feedback: ${state.newApproval.comment:}
    save: reference
    next: step10
    onFailure: FAIL

  - id: step10
    type: TOOL
    tool: readFiles
    with:
      paths: ${state.reference.files}
    save: sources
    next: step11
    onFailure: FAIL

  - id: step11
    type: AGENT
    agent: pilot-newdev-analyzer-agent
    with:
      request: ${state.request}
      reference: ${state.reference}
      sources: ${state.sources.text}
      feedback: |-
        ${state.impactCheck.feedback:}
        ${state.newApproval.comment:}
        ${state.newDesignApproval.comment:}
    save: analysis
    next: step12
    onFailure: FAIL

  - id: step12
    type: TOOL
    tool: checkData
    with:
      rules:
        - rule: filesExist
          list: ${state.reference.files}
          field: path
          message: 참고 구현 파일로 적힌 경로에 파일이 없습니다
        - rule: allIn
          list: ${state.analysis.requirements}
          field: id
          inList: ${state.analysis.targets}
          inField: frs
          message: FR에 대응하는 변경 대상이 없습니다
        - rule: allIn
          list: ${state.analysis.targets}
          field: frs
          inList: ${state.analysis.requirements}
          inField: id
          message: 변경 대상이 요구사항에 없는 FR을 가리킵니다
        - rule: unique
          list: ${state.analysis.targets}
          field: path
          message: 같은 파일이 변경 대상에 두 번 들어 있습니다
        - rule: filesAbsent
          list: ${state.analysis.targets}
          where:
            changeType: 신규
          field: path
          message: 신규라고 했는데 이미 있는 파일입니다
        - rule: filesExist
          list: ${state.analysis.targets}
          where:
            changeType: 수정
          field: path
          message: 수정이라고 했는데 없는 파일입니다
        - rule: filesExist
          list: ${state.analysis.targets}
          field: referencePath
          message: 본뜰 참고 파일로 적은 경로에 파일이 없습니다
    save: impactCheck
    next: step13
    onFailure: FAIL

  - id: step13
    type: AGENT
    agent: pilot-newdev-doc-writer-agent
    with:
      document: 요구사항정의서
      filePath: ${input}/01-requirements.md
      data:
        analysis: ${state.analysis}
        reference: ${state.reference}
    next: step14
    onFailure: FAIL

  - id: step14
    type: AGENT
    agent: pilot-newdev-doc-writer-agent
    with:
      document: 영향도분석서
      filePath: ${input}/02-impact.md
      data:
        analysis: ${state.analysis}
        reference: ${state.reference}
        checkText: ${state.impactCheck.text}
    next: step15
    onFailure: FAIL

  - id: step15
    type: APPROVAL
    approval:
      artifact: analysis-document
      approverRole: PL
    save: newApproval
    routes:
      진행: step16
      재분석: step11
      참고구현재조사: step09
      중단: FAIL

  - id: step16
    type: TOOL
    tool: readItemFiles
    with:
      items: ${state.analysis.targets}
      read:
        referenceSource: referencePath
        currentSource: path
    save: designTargets
    next: step17
    onFailure: FAIL

  - id: step17
    type: AGENT
    agent: pilot-newdev-file-designer-agent
    forEach: ${state.designTargets}
    with:
      request: ${state.request}
      requirements: ${state.analysis.requirements}
      target: ${item.item}
      plan:
        targets: ${state.analysis.targets}
        sharedNames: ${state.analysis.sharedNames}
      referenceSource: ${item.referenceSource}
      currentSource: ${item.currentSource}
      feedback: |-
        ${state.designCheck.feedback:}
        ${state.editCheckError:}
        ${state.newDesignApproval.comment:}
    save: designs
    saveError: designError
    next: step18
    onFailure: step18

  - id: step18
    type: TOOL
    tool: checkData
    with:
      rules:
        - rule: allIn
          list: ${state.analysis.targets}
          field: path
          inList: ${state.designs}
          inField: path
          message: 설계가 없는 변경 대상입니다
    save: designCheck
    next: step19
    onFailure: FAIL

  - id: step19
    type: TOOL
    tool: filterList
    with:
      list: ${state.designs}
      where:
        changeType: 수정
    save: editDesigns
    next: step20
    onFailure: FAIL

  - id: step20
    type: TOOL
    tool: editFileTexts
    forEach: ${state.editDesigns}
    with:
      filePath: ${item.path}
      edits: ${item.edits}
      dryRun: true
    saveError: editCheckError
    next: step21
    onFailure: step21

  - id: step21
    type: AGENT
    agent: pilot-newdev-doc-writer-agent
    with:
      document: 설계서
      filePath: ${input}/04-design.md
      data:
        designs: ${state.designs}
        checkText: ${state.designCheck.text}
        designError: ${state.designError:}
        editCheckError: ${state.editCheckError:}
    next: step22
    onFailure: FAIL

  - id: step22
    type: APPROVAL
    approval:
      artifact: architecture-document
      approverRole: PL
    save: newDesignApproval
    routes:
      진행: step23
      재설계: step16
      재분석: step11
      중단: FAIL

  - id: step23
    type: TOOL
    tool: filterList
    with:
      list: ${state.designs}
      where:
        changeType: 신규
      notEmpty:
        - referencePath
    save: copyDesigns
    next: step24
    onFailure: FAIL

  - id: step24
    type: TOOL
    tool: copyFileWithReplace
    forEach: ${state.copyDesigns}
    with:
      sourcePath: ${item.referencePath}
      targetPath: ${item.path}
      replacements: ${item.renames}
    saveEach: copied
    next: step25
    onFailure: step25

  - id: step25
    type: TOOL
    tool: filterList
    with:
      list: ${state.designs}
      where:
        changeType: 신규
      empty:
        - referencePath
    save: createDesigns
    next: step26
    onFailure: FAIL

  - id: step26
    type: TOOL
    tool: writeFile
    forEach: ${state.createDesigns}
    with:
      filePath: ${item.path}
      fileContents: ${item.adds[0].content}
    saveEach: created
    next: step27
    onFailure: step27

  - id: step27
    type: TOOL
    tool: editFileTexts
    forEach: ${state.editDesigns}
    with:
      filePath: ${item.path}
      edits: ${item.edits}
    saveEach: edited
    next: step28
    onFailure: step28

  - id: step28
    type: TOOL
    tool: filterList
    with:
      list: ${state.copied}
      where:
        success: true
      anyNotEmpty:
        - item.removes
        - item.adds
      pick: item
    save: developDesigns
    next: step29
    onFailure: FAIL

  - id: step29
    type: TOOL
    tool: readItemFiles
    with:
      items: ${state.developDesigns}
      read:
        source: path
      lineNumbers: true
    save: developInputs
    next: step30
    onFailure: FAIL

  - id: step30
    type: AGENT
    agent: pilot-newdev-file-developer-agent
    forEach: ${state.developInputs}
    with:
      design: ${item.item}
      source: ${item.source}
    saveEach: developed
    next: step31
    onFailure: step31

  - id: step31
    type: TOOL
    tool: editFileLines
    forEach: ${state.developed}
    with:
      filePath: ${item.input.design.path}
      edits: ${item.result.edits}
    saveEach: applied
    next: step32
    onFailure: step32

  - id: step32
    type: AGENT
    agent: pilot-newdev-doc-writer-agent
    with:
      document: 구현결과
      filePath: ${input}/04-tasks.md
      data:
        copied: ${state.copied}
        created: ${state.created}
        edited: ${state.edited}
        applied: ${state.applied}
    save: tasksFile
    next: END
    onFailure: FAIL

server:
    port: 8081
    error:
        whitelabel:
            enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            probes:
                enabled: true

spring:
    main:
        allow-bean-definition-overriding: true
    data:
        # session(Phase 1): 대화 히스토리 저장(net.dstone.ai.session.RedisChatMemoryRepository).
        # dstone-boot의 dstone:session(HTTP 세션) 네임스페이스와 겹치지 않게
        # 키는 dstone:ai:session:{conversationId}로 별도로 둔다.
        redis:
            enabled: true # Redis사용 여부(true/false)
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            timeout: 10000
    # RAG(Phase 2): pgvector(PgVectorStoreAutoConfiguration)가 이 DataSource를 그대로 쓴다.
    # dstone-boot처럼 여러 datasource가 아니라 하나뿐이라 표준 Spring Boot 단일 datasource
    # 자동설정(spring.datasource.*)을 그대로 쓴다 - 별도 ConfigDatasource 클래스 불필요.
    # 로컬 설치/역할 생성 절차: docs/software/postgresql.md 참고.
    datasource:
        driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
        url: jdbc:log4jdbc:postgresql://${DB_HOST}:${DB_PORT}/dstone_ai
        username: dstone_ai
        password: ENC(6agKS1MMMV76VQYFmfkiM+C29O7tacXyW27QP4O03eV2QDRSvWV/3rUzfNG1hoHn)
        hikari:
            maximum-pool-size: 10
    servlet:
        multipart:
            # RAG(Phase 2) 문서 업로드(/api/ai/rag/documents) 대비 기본 1MB보다 넉넉하게.
            max-file-size: 20MB
            max-request-size: 20MB
    ##########################################################################################
    # <자동설정기능>
    # Phase 0은 DB/Redis/RabbitMQ/Kafka/Security를 쓰지 않는 순수 Chat API 스켈레톤이었다.
    # session(Phase 1)에서 대화 히스토리 저장에 Redis를 쓰기 시작하면서 Redis 관련 두 줄은,
    # RAG(Phase 2)에서 pgvector에 DB를 쓰기 시작하면서 DB 관련 줄은 제외 목록에서 뺐다.
    # RabbitMQ/Kafka는 아직 미사용.
    #
    # Boot 4에서 Security 자동설정이 org.springframework.boot.autoconfigure.security.* 에서
    # org.springframework.boot.security.autoconfigure.* 로 통째로 옮겨갔다. spring.autoconfigure.exclude는
    # 존재하지 않는 클래스명을 조용히 무시하므로(에러 없이), 옛 FQN을 그대로 두면 실제로는 아무것도
    # 제외되지 않고 Boot4의 기본 인증(HTTP Basic + 랜덤 생성 비밀번호)이 그대로 켜져버린다.
    ##########################################################################################
    autoconfigure:
        exclude:
            - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
            - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
            - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
            - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    ai:
        # Gateway(Phase 1): 아래 3개 provider의 starter가 모두 클래스패스에 있으므로
        # 반드시 하나를 명시해야 한다(값을 지우면 3개 provider가 동시에 활성화되어 기동에 실패한다).
        # net.dstone.ai.gateway.AiProvider의 propertyValue와 정확히 일치해야 한다.
        # (azure-openai는 Spring AI 2.x에서 chat model provider로 제거되어 더 이상 선택할 수 없다.)
        #
        # chat 외 capability(audio/image/moderation)는 openai starter가 클래스패스에 있으면
        # 기본값으로 자동 활성화를 시도하고(그중 상당수가 기동 시점에 api-key를 요구해서 즉시 기동 실패로 이어진다),
        # 아직 쓰지 않으므로 전부 명시적으로 꺼둔다.
        #
        # embedding(Phase 2, RAG): Anthropic은 임베딩 모델을 제공하지 않아 chat과 별개로 정해야 한다
        # (net.dstone.ai.rag.embedding.EmbeddingProvider 참고). 이 환경엔 OpenAI 키 대신 로컬 Ollama를
        # 설치해서 쓴다(비용 없음, 문서가 외부로 안 나감) - 설치 절차: docs/software/ollama.md.
        model:
            chat: anthropic # anthropic | openai | ollama
            embedding: ollama # openai | ollama (anthropic 불가, dstone.ai.rag.enabled=true일 때만 의미 있음)
            audio:
                speech: none
                transcription: none
            image: none
            moderation: none

        ##########################################################################################
        # spring.ai.model.chat=anthropic 일 때 설정.
        ##########################################################################################
        anthropic:
            # DB 패스워드와 동일한 컨벤션: Jasypt로 암호화해 ENC(...) 형태로 직접 넣는다(env.properties 경유 안 함).
            # 로컬에서 생성: cd dstone-common && mvn -q exec:java -Dexec.mainClass=net.dstone.common.utils.EncUtil -Dexec.args="<실제 키>"
            # (이 명령은 Claude Code가 아니라 별도 터미널에서 직접 실행할 것 — 평문 키가 대화 기록에 남지 않도록)
            api-key: ENC(iTbr7/33NEFc5gCOapVTLZsks5dU96gITu6OUXr2UqAVntTkq5p1nFjlVI/3RVVx/fZzBOAKEdngosd4zialqNUgfEq31RU3u8HUa/VBIaBnFViQCLJBPW8O81lcTpsHsQQPfRbeToKYHAm2BVMWP0cZhkx145+bnmoH7nXsXQE=)
            # chat.options.model 을 비워두면 Spring AI 기본 모델을 사용한다.
            # SI 프로젝트별로 다른 모델이 필요하면 아래처럼 override.
            # chat:
            #     options:
            #         model: claude-sonnet-4-5-20250929

        ##########################################################################################
        # spring.ai.model.chat=openai 일 때 설정.
        ##########################################################################################
        # openai:
        #     api-key: ENC(...)
        #     chat:
        #         options:
        #             model: gpt-4o-mini
        #     # local vLLM(OpenAI 호환 API)을 붙일 때는 provider는 그대로 openai로 두고
        #     # base-url만 vLLM 서버로 돌린다(api-key는 vLLM이 검증하지 않으면 임의 문자열로 둔다).
        #     base-url: http://<vllm-host>:8000

        ##########################################################################################
        # spring.ai.model.chat=ollama 일 때 설정. (로컬/사내망 Ollama 서버, API 키 불필요).
        ##########################################################################################
        # ollama:
        #     base-url: http://<ollama-host>:11434
        #     chat:
        #         options:
        #             model: llama3.1

        ##########################################################################################
        # spring.ai.model.embedding=ollama 용 설정(Phase 2, RAG). chat 쪽 provider와 무관하게 항상 적용된다
        # (base-url은 spring.ai.ollama.* 하나뿐이라 chat=ollama로 쓰게 되면 이 base-url을 공유한다).
        # 로컬에 docs/software/ollama.md대로 설치 후 bge-m3(다국어/한국어 지원 임베딩 모델, 1024차원) pull 필요.
        ##########################################################################################
        ollama:
            base-url: http://localhost:11434
            embedding:
                model: bge-m3

        ##########################################################################################
        # RAG(Phase 2) VectorStore = pgvector. dimensions는 spring.ai.ollama.embedding.model(bge-m3)의
        # 실제 출력 차원과 반드시 일치해야 한다 - 모델을 바꾸면 이 값도 같이 바꾸고 테이블을 재생성해야 한다.
        ##########################################################################################
        vectorstore:
            pgvector:
                initialize-schema: true
                dimensions: 1024

dstone:
    ai:
        # session(Phase 1): 대화 히스토리(ChatMemory) 설정.
        session:
            max-messages: 20 # 세션당 유지할 최대 메시지 수(넘으면 오래된 메시지부터 잘림)
            ttl-seconds: 86400 # Redis에 저장된 세션 히스토리의 만료 시간(1일)
        # prompt(Phase 1): SI 프로젝트별 프롬프트 템플릿 버전 관리.
        # classpath:prompts/{name}/{version}.st 파일을 읽어 렌더링한다.
        # 특정 템플릿명을 versions에 명시하지 않으면 default-version을 쓴다.
        prompt:
            default-version: v1
            # versions:
            #     sample-system: v1
        # RAG(Phase 2): 이 값이 true여야 rag.ingest/rag.embedding/rag.retrieval 빈과
        # RagController, ChatController의 ragEnabled 옵션이 활성화된다(net.dstone.ai.rag 패키지 참고).
        # RAG가 필요 없는 SI 프로젝트는 false(또는 미설정)로 두면 Postgres/pgvector/임베딩 설정
        # 없이도 그대로 기동된다.
        rag:
            enabled: true
            ingest:
                chunk-size: 800 # 청크당 최대 토큰 수
            retrieval:
                top-k: 5
                similarity-threshold: 0.5

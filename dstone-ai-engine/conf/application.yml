server:
    port: 8081
    error:
        whitelabel:
            enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            probes:
                enabled: true

spring:
    main:
        allow-bean-definition-overriding: true
    http:
        clients:
            # 로컬 Ollama(CPU 추론)는 간단한 인사말도 몇 초, 프롬프트가 길거나 Tool 호출이
            # 붙은 요청(예: capability=oracle-to-postgresql)은 더 오래 걸린다. Spring AI의
            # OllamaApi가 이 전역 설정으로 만들어지는 RestClient.Builder를 그대로 쓰므로, 여기를
            # 안 올려두면 "Read timed out"으로 끊긴다(anthropic/openai를 쓸 때는 영향 없음).
            read-timeout: 5m
    data:
        # session(Phase 1): 대화 히스토리 저장(net.dstone.ai.common.session.RedisChatMemoryRepository).
        # dstone-boot의 dstone:session(HTTP 세션) 네임스페이스와 겹치지 않게
        # 키는 dstone:ai:session:{conversationId}로 별도로 둔다.
        redis:
            enabled: true # Redis사용 여부(true/false)
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            timeout: 10000
    # DB: Workflow 실행 이력(AI_WORKFLOW_EXECUTION*)을 담는다. 접근은 MyBatis로 한다(common.config.ConfigMapper, resources/sqlmap/**/*Dao.xml).
    # dstone-boot처럼 여러 datasource가 아니라 하나뿐이라 표준 Spring Boot 단일 datasource
    # 자동설정(spring.datasource.*)을 그대로 쓴다 - 별도 ConfigDatasource 클래스 불필요.
    # 로컬 설치/역할 생성 절차: docs/software/05.postgresql.md 참고.
    datasource:
        driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
        url: jdbc:log4jdbc:postgresql://${DB_HOST}:${DB_PORT}/dstone_ai
        username: dstone_ai
        password: ENC(XIXzzg4U/6LYCwsQagqLSeGJt80UdT1bZcI0Msf0nh8=)
        hikari:
            maximum-pool-size: 10
    ##########################################################################################
    # <자동설정기능>
    # Security/RabbitMQ/Kafka는 아직 미사용 이므로 exclude.
    #
    # Boot 4에서 Security 자동설정이 org.springframework.boot.autoconfigure.security.* 에서
    # org.springframework.boot.security.autoconfigure.* 로 통째로 옮겨갔다.
    ##########################################################################################
    autoconfigure:
        exclude:
            - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
            - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
            - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
            - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    ai:
        # chat(provider 선택): 아래 3개 provider의 starter가 모두 클래스패스에 있으므로
        # 반드시 하나를 명시해야 한다(값을 지우면 3개 provider가 동시에 활성화되어 기동에 실패한다).
        # 엔진 전체가 이 값 하나(common.config.ConfigChatClient가 조립하는 단일 ChatClient)를
        # 공유한다 - Agent별로 다른 provider/model을 쓰는 기능은 없다.
        # (azure-openai는 Spring AI 2.x에서 chat model provider로 제거되어 더 이상 선택할 수 없다.)
        #
        # embedding: 이 엔진은 임베딩 모델을 쓰지 않는다(none). RAG의 임베딩과 검색은 dstone-knowledge가 한다
        # (common.rag.RagRetrievalChain이 그 서버의 검색 API를 부른다).
        #
        # chat 외 capability(audio/image/moderation)는 openai starter가 클래스패스에 있으면
        # 기본값으로 자동 활성화를 시도하고(그중 상당수가 기동 시점에 api-key를 요구해서 즉시 기동 실패로 이어진다),
        # 아직 쓰지 않으므로 전부 명시적으로 꺼둔다.
        model:
            chat: openai # anthropic | openai | ollama
            embedding: none # 쓰지 않는다. 임베딩은 dstone-knowledge의 몫이다
            audio:
                speech: none
                transcription: none
            image: none
            moderation: none
        # Spring AI가 스스로 거는 Tool 호출 한도(Agent 호출 한 번 기준). 기본값은 Tool 하나당 40번, 전체 150번이고,
        # 넘으면 LLM 호출을 끊는다(엔진은 그 Agent 호출을 실패로 처리한다 - runtime.agent.AgentExecutor.textOf()).
        # 이 한도는 Agent마다 다르게 줄 수 없어서 넉넉히 풀어 두고, 실제 한도는 dstone.ai.agent.tool.max-calls와
        # Agent의 maxToolCalls로 건다. Tool 하나당 한도를 푼 이유: 파일을 많이 만드는 Agent는 writeFile만 40번을 넘길 수 있다.
        # -1은 "한도 없음"이다.
        tools:
            limits:
                max-calls-per-tool-default: -1
                max-total-tool-calls: 300

        ##########################################################################################
        # spring.ai.model.chat=anthropic 일 때 설정.
        ##########################################################################################
        anthropic:
            # DB 패스워드와 동일한 컨벤션: Jasypt로 암호화해 ENC(...) 형태로 직접 넣는다(env.properties 경유 안 함).
            # 로컬에서 생성: cd dstone-common && mvn -q exec:java -Dexec.mainClass=net.dstone.common.utils.EncUtil -Dexec.args="<실제 키>"
            # (이 명령은 Claude Code가 아니라 별도 터미널에서 직접 실행할 것 — 평문 키가 대화 기록에 남지 않도록)
            api-key: ENC(iTbr7/33NEFc5gCOapVTLZsks5dU96gITu6OUXr2UqAVntTkq5p1nFjlVI/3RVVx/fZzBOAKEdngosd4zialqNUgfEq31RU3u8HUa/VBIaBnFViQCLJBPW8O81lcTpsHsQQPfRbeToKYHAm2BVMWP0cZhkx145+bnmoH7nXsXQE=)
            # chat.options.model 을 비워두면 Spring AI 기본 모델을 사용한다.
            # SI 프로젝트별로 다른 모델이 필요하면 아래처럼 override.
            #
            # max-tokens: Spring AI의 Anthropic 기본값(500)은 output.schema(응답을 JSON으로
            # 강제하는 AGENT step)에서는 너무 작다 - 응답이 JSON을 다 못 닫고 잘려서
            # "Unexpected end-of-input: expected close marker for Object" 파싱 실패로 이어지는 걸
            # 실제로 겪었다(testApp-sdlc의 analyze step, 5개 항목을 갖춘 분석서를 요구하는 프롬프트).
            # AgentDefinition에는 max-tokens를 개별 지정하는 필드가 없어(model만 override 가능)
            # 엔진 전체 공통값을 올려서 대응한다.
            chat:
                 options:
                     model: claude-sonnet-4-5-20250929
                     # 4096 6144 8192
                     max-tokens: 6144 
            timeout: 5m
            max-retries: 1
        ##########################################################################################
        # spring.ai.model.chat=openai 일 때 설정.
        ##########################################################################################
        openai:
             base-url: https://openrouter.ai/api/v1
             api-key: ENC(5jqSbTq/PbjnMvBpVAEYIlURuhiynSmmJUqHmoXZbdiFJsTdCRzX9iEOyNdvhsMGUefD5MtBtoyThqFTKEvfiJxNU1x3f+UFFH4pmNRJ0iGLcijIkSa5d/4YJfPRu8m+)
             chat:
                 options:
                     # OpenRouter에서 제공하는 완전 무료 모델 지정(:free 를 붙여야 무료로 호출됨.)
                     # google/gemma-4-26b-a4b-it | deepseek/deepseek-v4.1-flash | qwen/qwen3.8-27b
                     model: qwen/qwen3.8-27b
                     temperature: 0.4
                     # max-tokens: 비워두면 OpenRouter 뒤의 일부 공급자(vLLM 기반, 예: NextBit)가 "남은 컨텍스트 전부"를
                     # 출력 한도로 잡는다. 그러면 Tool 결과가 쌓여 입력이 커졌을 때 입력+출력이 모델 한도를 넘어서
                     # "400: Provider returned error"(maximum context length ... requested N output tokens)로 끊긴다.
                     # 실제로 pilot-workflow가 error.log를 두 번 읽었을 때 이렇게 실패했다. 적당한 상한을 꼭 둔다.
                     # 반대로 너무 작아도 안 된다. 추론(reasoning)을 하는 모델은 추론에 쓴 토큰도 이 한도에 들어가서,
                     # 추론이 길어지면 답을 한 글자도 쓰지 못하고 끝난다(finishReason=LENGTH, 빈 답).
                     # qwen/qwen3.8-27b는 추론의 양을 줄일 방법이 없다. OpenRouter의 reasoning.max_tokens / reasoning.effort(low)와
                     # reasoning-effort를 넣어 봤지만 추론 토큰이 그대로였고, reasoning.effort: none으로 아예 끄는 것만 통했다
                     # (끄면 답이 틀렸다). 그래서 한도를 넉넉히 준다. pilot-workflow의 리뷰 step이 8192를 추론에 다 쓴 적이 있다.
                     # 값을 올리면 한 번의 호출이 그만큼 길어질 수 있으므로 아래 timeout 안에 끝나는지도 함께 본다
                     # (초당 70토큰쯤이면 16384토큰은 4분 가까이 걸린다).
                     # 4096 6144 8192 16384 32768
                     max-tokens: 16384
             # timeout / max-retries: Spring AI의 기본값은 60초 / 3회다. Tool 호출이 여러 번 붙은 요청은 응답이
             # 60초를 넘기기 쉬운데, 그러면 "OpenAIIoException: Request failed"로 끊기고 같은 요청을 3번 더 보내서
             # 4분 가까이 지나서야 실패한다. anthropic 설정과 같은 값으로 맞춰 둔다.
             # 주의: timeout은 Spring AI(2.0.1)가 이 설정만으로는 채팅 호출에 적용하지 않는다(호출마다 60초로 덮어쓴다).
             # 그래서 엔진이 이 값을 읽어 호출마다 요청 옵션에 직접 넣는다(ConfigChatClient.requestOptions()).
             # (요청이 너무 커서 생기는 시간 초과는 이 값으로 못 고친다 - 아래 dstone.ai.tool의 크기 상한이 그걸 막는다.)
             timeout: 5m
             max-retries: 1

        ##########################################################################################
        # spring.ai.model.chat=ollama 용 설정.(로컬/사내망 Ollama 서버, API 키 불필요).
        # 설치 절차: docs/software/14.ollama.md
        ##########################################################################################
        ollama:
            base-url: http://localhost:11434 # ollama 와 통신할 URL            
            init:  # 모델 초기 다운로드(Pull) 시 타임아웃 설정 (최초 실행 시 필요)
                pull-model-strategy: when_missing
                timeout: 300s
                max-retries: 1   
            chat:
                options:
                    # qwen2.5-coder:7b, llama3.2:latest, bge-m3:latest, hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:latest
                    model: hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:latest
                    timeout: 300s # 충분하게 5분(300초) 등으로 조절
                    temperature: 0.3  # 💡 모든 Ollama 요청의 토큰 생성 다양성을 제거하여 속도 및 일관성 향상

dstone:
    ai:
        ##########################################################################################
        # 대화 히스토리(ChatMemory) 설정.
        ##########################################################################################
        session:
            max-messages: 20 # 세션당 유지할 최대 메시지 수(넘으면 오래된 메시지부터 잘림)
            ttl-seconds: 86400 # Redis에 저장된 세션 히스토리의 만료 시간(1일)
        ##########################################################################################
        # 프롬프트는 여기 없다 - classpath:agents/*.yml의 각 Agent 항목 안에 prompt로 직접 적혀 있다.
        ##########################################################################################
        # Tool 설정. 
        # Tool 호출은 caller(dstone.ai.security.auth.keys.caller)별로 화이트리스트를 둘 수 있다(common.config.ConfigTool 참고) 
        # 설정(dstone.ai.tool.allowed-by-caller)이 없는 caller는 등록된 Tool 전체를 그대로 허용한다.
        ##########################################################################################      
        # tool:
        #     allowed-by-caller:
        #         - caller: sample-si-project
        #           tools: getCurrentDateTime,validateSqlSyntax
        # Agent 호출(runtime.agent.AgentExecutor) 설정.
        # sub-agent.max-calls: 부모 Agent를 한 번 부르는 동안 Sub Agent(agents/*.yml의 subAgents)를 부를 수 있는 최대 횟수(기본 10).
        #                      Sub Agent 호출 하나가 LLM 호출 한 번이라, 부모가 끝없이 맡기면 시간과 비용이 계속 늘어난다.
        #                      상한을 넘으면 "지금까지의 결과로 답하라"는 안내가 부모 LLM에게 돌아간다.
        # tool.max-calls: Agent를 한 번 부르는 동안 Tool을 부를 수 있는 최대 횟수(기본 100). Agent의 maxToolCalls가 있으면 그 값이 이긴다.
        #                 남은 횟수가 5분의 1 이하가 되면 Tool 결과 끝에 "N번 남았다"는 안내가 붙고, 다 쓰면 Tool을 실행하지 않고
        #                 "실패: ..."를 돌려준다. 그 뒤에도 3번 넘게 부르면 그 Agent 호출을 실패로 끝낸다(runtime.agent.ToolCallBudgetCallback).
        # tool.keep-result-chars: Agent를 한 번 부르는 동안 대화에 온전히 들고 다닐 Tool 결과의 글자 수 합(기본 200000, 0이면 줄이지 않음).
        #                 Tool 결과는 쌓여서 그 뒤의 LLM 호출마다 다시 보내진다. 합이 이 값을 넘으면 오래된 결과부터 앞 300자만 남기고
        #                 "다시 필요하면 같은 Tool을 다시 부르라"는 안내를 붙인다(runtime.agent.ToolResultCompactor).
        #                 max-result-chars(아래)는 결과 한 건의 크기를, 이 값은 쌓인 전체의 크기를 막는다.
        agent:
            sub-agent:
                max-calls: 10
            tool:
                max-calls: 100
                keep-result-chars: 200000
        tool:
            # Jenkins Job을 REST API로 원격 기동하는 Tool(tools.jenkins.JenkinsTriggerBuildTool) 설정.
            # allowed-jobs가 비어 있으면(기본값) 이 Tool은 항상 실패로 끝난다 - 화이트리스트를
            # 채우는 것 자체가 곧 "이 Tool을 켠 상태"다. api-token은 DB 비밀번호와 동일한 ENC(...)
            # 컨벤션(EncUtil)을 그대로 쓴다 - Jenkins 화면에서 "내 계정 > Configure > API Token >
            # Add new Token"으로 발급받은 값을 절대 평문으로 여기 넣지 말고 반드시 암호화해서 넣을 것.
            jenkins:
                base-url: http://localhost:8080
                user: jysn007
                api-token: ENC(koeh9W9G8vYjPVBZAeO3GWxg8Uv3PYssUy8aykBFHNMVke4YNjWubBwxGu7xp+hDZbfMwSgwbXj7ZE87Gp1cpQ==)
                allowed-jobs:
                    - testApp
            # dstone-knowledge(Java 분석 결과와 올린 문서를 담아 둔 서버)를 부르는 설정(common.knowledge.KnowledgeClient).
            # 두 군데서 쓴다: 코드 분석 결과를 물어보는 Tool(tools.knowledge.KnowledgeTool)과 RAG(올린 문서 검색, 아래 dstone.ai.rag).
            # base-url이 비어 있으면 그 Tool은 항상 실패 문구로 끝나고 RAG도 쓸 수 없다 - 주소를 채우는 것이 곧 "켠 상태"다.
            # api-key: dstone-knowledge가 호출자 인증(dstone.knowledge.security.auth.enabled)을 켰을 때만 넣는다. ENC(...)로 적는다.
            # timeout-seconds: 응답 대기 시간(기본 60). 검색은 질문을 임베딩해야 해서 임베딩 서버가 바쁘면 수 초가 걸린다.
            knowledge:
                # 주소는 환경마다 다르다(Pod에서는 localhost가 아니다). env-*.properties의 KNOWLEDGE_HOST / KNOWLEDGE_PORT.
                base-url: http://${KNOWLEDGE_HOST}:${KNOWLEDGE_PORT}
                # api-key: ENC(...)
                timeout-seconds: 60
            # max-result-chars: 어떤 Tool이든(로컬 @AiTool, MCP 공통) 결과 한 건이 이 글자 수를 넘으면 앞부분만 남기고
            # "잘렸으니 범위를 좁혀 다시 호출하라"는 안내를 붙인다(common.config.ConfigTool, 기본 60000).
            # Tool 결과는 대화 이력에 쌓여 매 호출마다 다시 보내지므로, 큰 결과 하나가 컨텍스트 한도나 응답 대기 시간을 넘긴다.
            # Tool마다 따로 막아도 새 Tool/MCP Tool에서 또 터질 수 있어서 엔진에 마지막 안전망을 하나 둔 것이다.
            max-result-chars: 60000
            # 파일 Tool(tools.utils.FileUtil) 설정. 모두 "한 번에 돌려주는 양"을 줄이기 위한 값이다.
            # max-read-chars: readFile/readFileLines/readFileTail이 한 번에 돌려주는 최대 글자 수(기본 30000).
            # list-summary-over: readFileListAll이 찾은 파일이 이 개수를 넘으면 파일 이름 대신 "폴더 경로 (파일 수)"만 준다(기본 100).
            #               프로젝트 루트를 조회한 Agent가 파일 450개의 경로(4만 자)를 받아서, 그 뒤의 모든 LLM 호출이 그만큼 느려진 적이 있다.
            #               폴더 구조만 보여 주면 모델이 필요한 폴더를 골라 다시 조회한다.
            # max-list-files: readFileListAll이 한 번에 돌려주는 최대 파일 수(기본 500). list-summary-over를 이보다 크게 잡았을 때만 의미가 있다.
            # max-search-matches: searchInFiles가 한 번에 돌려주는 최대 건수(기본 100).
            # max-search-file-bytes: searchInFiles가 검색하는 파일의 최대 크기(기본 1MB). 더 큰 파일은 건너뛴다.
            # exclude-dirs: 목록/검색에서 빼는 폴더 이름(콤마 구분). 프로젝트 루트를 조회했을 때 .git 속 파일까지
            #               338KB가 딸려 와서 요청이 700KB로 불어나 실패한 적이 있다.
            file:
                max-read-chars: 30000
                list-summary-over: 100
                max-list-files: 500
                max-search-matches: 100
                max-search-file-bytes: 1048576
                exclude-dirs: .git,.svn,target,node_modules,.settings,.idea,.gradle,.metadata
        
        ##########################################################################################
        # RAG 설정.
        # 이 값이 true여야 common.rag.RagRetrievalChain(검색), Agent의 ragEnabled 설정, searchDocuments Tool이 실제로 동작한다.
        # 문서의 저장, 임베딩, 검색은 dstone-knowledge가 한다. 문서도 그 서버에 직접 올린다(dstone-boot의 "코드 분석(Knowledge) > 검색 · 문서" 화면). 그래서 위의 dstone.ai.tool.knowledge.base-url(그 서버의 주소)이 채워져 있어야 한다.
        # RAG가 필요 없는 SI 프로젝트는 false(또는 미설정)로 두면 dstone-knowledge 없이도 그대로 기동된다.
        ##########################################################################################
        rag:
            enabled: true
            retrieval:
                top-k: 5
                # 유사도가 이 값보다 낮은 조각은 버린다(질문에 든 이름이 글자 그대로 들어 있어서 찾힌 조각은 남긴다).
                # bge-m3(dstone-knowledge가 쓰는 임베딩 모델) 기준 실측: 실제로 관련 있는 문서/질의 쌍도 코사인 유사도가
                # 0.5를 못 넘는 경우가 흔해서(0.48 등) 0.5로 두면 데이터가 있어도 결과가 통째로 빈다.
                # 임베딩 모델/도메인마다 분포가 달라 재조정이 필요한 값이다.
                similarity-threshold: 0.35

        ##########################################################################################
        # Security 설정. 
        # security.auth: API Key 인증. enabled=false(기본값)면 인증 없이 전부 통과한다. 현재는 미사용.
        # security.ratelimit: caller별(security.auth가 꺼져 있으면 클라이언트 IP별) 요청 개수 제한. 현재는 미사용.
        ########################################################################################## 
        security:
            auth:
                enabled: false
                # keys:
                #     - key: ENC(...)
                #       caller: sample-si-project
                #     - key: ENC(...)
                #       caller: another-caller
            ratelimit:
                enabled: false
                # window-seconds: 60
                # default-limit: 60 # window당 caller(또는 IP)별 기본 허용 요청 수
                # overrides:
                #     - caller: sample-si-project
                #       limit: 200
                #     - caller: another-caller
                #       limit: 30

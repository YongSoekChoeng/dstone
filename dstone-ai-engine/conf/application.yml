server:
    port: 8081
    error:
        whitelabel:
            enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            probes:
                enabled: true

spring:
    main:
        allow-bean-definition-overriding: true
    data:
        # session(Phase 1): 대화 히스토리 저장(net.dstone.ai.session.RedisChatMemoryRepository).
        # dstone-boot의 dstone:session(HTTP 세션) 네임스페이스와 겹치지 않게
        # 키는 dstone:ai:session:{conversationId}로 별도로 둔다.
        redis:
            enabled: true # Redis사용 여부(true/false)
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            timeout: 10000
    ##########################################################################################
    # <자동설정기능>
    # Phase 0은 DB/Redis/RabbitMQ/Kafka/Security를 쓰지 않는 순수 Chat API 스켈레톤이었다.
    # session(Phase 1)에서 대화 히스토리 저장에 Redis를 쓰기 시작하면서 Redis 관련 두 줄은 제외
    # 목록에서 뺐다(net.dstone.ai.config.ConfigRedis 참고). DB/RabbitMQ/Kafka는 아직 미사용.
    ##########################################################################################
    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
            - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
            - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
            - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    ai:
        # Gateway(Phase 1): 아래 4개 provider의 starter가 모두 클래스패스에 있으므로
        # 반드시 하나를 명시해야 한다(값을 지우면 4개 provider가 동시에 활성화되어 기동에 실패한다).
        # net.dstone.ai.gateway.AiProvider의 propertyValue와 정확히 일치해야 한다.
        #
        # chat 외 capability(embedding/audio/image/moderation)는 openai starter가 클래스패스에 있으면 
        # 기본값으로 자동 활성화를 시도하고(그중 상당수가 기동 시점에 api-key를 요구해서 즉시 기동 실패로 이어진다), 
        # 아직 Phase 1(Chat) 범위 밖이라 전부 명시적으로 꺼둔다.
        # Phase 2(RAG)에서 embedding이 실제로 필요해지면 그때 embedding 값만 provider명으로 바꾼다.
        model:
            chat: anthropic # anthropic | openai | azure-openai | ollama
            embedding: none
            audio:
                speech: none
                transcription: none
            image: none
            moderation: none

        ##########################################################################################
        # spring.ai.model.chat=anthropic 일 때 설정.
        ##########################################################################################
        anthropic:
            # DB 패스워드와 동일한 컨벤션: Jasypt로 암호화해 ENC(...) 형태로 직접 넣는다(env.properties 경유 안 함).
            # 로컬에서 생성: cd dstone-common && mvn -q exec:java -Dexec.mainClass=net.dstone.common.utils.EncUtil -Dexec.args="<실제 키>"
            # (이 명령은 Claude Code가 아니라 별도 터미널에서 직접 실행할 것 — 평문 키가 대화 기록에 남지 않도록)
            api-key: ENC(iTbr7/33NEFc5gCOapVTLZsks5dU96gITu6OUXr2UqAVntTkq5p1nFjlVI/3RVVx/fZzBOAKEdngosd4zialqNUgfEq31RU3u8HUa/VBIaBnFViQCLJBPW8O81lcTpsHsQQPfRbeToKYHAm2BVMWP0cZhkx145+bnmoH7nXsXQE=)
            # chat.options.model 을 비워두면 Spring AI 기본 모델을 사용한다.
            # SI 프로젝트별로 다른 모델이 필요하면 아래처럼 override.
            # chat:
            #     options:
            #         model: claude-sonnet-4-5-20250929

        ##########################################################################################
        # spring.ai.model.chat=openai 일 때 설정.
        ##########################################################################################
        # openai:
        #     api-key: ENC(...)
        #     chat:
        #         options:
        #             model: gpt-4o-mini
        #     # local vLLM(OpenAI 호환 API)을 붙일 때는 provider는 그대로 openai로 두고
        #     # base-url만 vLLM 서버로 돌린다(api-key는 vLLM이 검증하지 않으면 임의 문자열로 둔다).
        #     base-url: http://<vllm-host>:8000

        ##########################################################################################
        # spring.ai.model.chat=azure 일 때 설정.
        # azure-openai starter는 spring.ai.model.chat 값과 무관하게 OpenAIClientBuilder 빈을
        # 기동 시점에 무조건 생성하면서 endpoint가 비어 있으면 즉시 실패한다(다른 provider가 활성화되어 있어도 마찬가지). 
        # 그래서 endpoint만은 주석 처리하지 않고 더미 값을 채워둔다.
        # spring.ai.model.chat=azure-openai로 바꿔서 실제로 쓸 때 endpoint/api-key/deployment-name을 아래처럼 실값으로 교체한다.
        ##########################################################################################
        azure:
            openai:
                endpoint: https://placeholder.openai.azure.com
                # api-key: ENC(...)
                # chat:
                #     options:
                #         deployment-name: <azure-deployment-name>

        ##########################################################################################
        # spring.ai.model.chat=ollama 일 때 설정. (로컬/사내망 Ollama 서버, API 키 불필요).
        ##########################################################################################
        # ollama:
        #     base-url: http://<ollama-host>:11434
        #     chat:
        #         options:
        #             model: llama3.1

dstone:
    ai:
        # session(Phase 1): 대화 히스토리(ChatMemory) 설정.
        session:
            max-messages: 20 # 세션당 유지할 최대 메시지 수(넘으면 오래된 메시지부터 잘림)
            ttl-seconds: 86400 # Redis에 저장된 세션 히스토리의 만료 시간(1일)
        # prompt(Phase 1): SI 프로젝트별 프롬프트 템플릿 버전 관리.
        # classpath:prompts/{name}/{version}.st 파일을 읽어 렌더링한다.
        # 특정 템플릿명을 versions에 명시하지 않으면 default-version을 쓴다.
        prompt:
            default-version: v1
            # versions:
            #     sample-system: v1

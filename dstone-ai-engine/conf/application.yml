server:
    port: 8081
    error:
        whitelabel:
            enabled: true
    servlet:
        session:
            # 화면(AI 콘솔)의 로그인 세션. 쿠키는 포트를 가리지 않아서 같은 호스트의 다른 앱과 이름이 같으면 서로 덮어쓴다.
            cookie:
                name: DSTONE_AI_SESSION
            timeout: 120m

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            probes:
                enabled: true

spring:
    main:
        allow-bean-definition-overriding: true
    http:
        clients:
            read-timeout: 5m
    data:
        redis:
            enabled: true # Redis사용 여부(true/false)
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            timeout: 10000
    # DB: Workflow 실행 이력(AI_WORKFLOW_EXECUTION*)을 담는다. 접근은 MyBatis로 한다(common.config.ConfigMapper, resources/sqlmap/**/*Dao.xml).
    datasource:
        driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
        url: jdbc:log4jdbc:postgresql://${DB_HOST}:${DB_PORT}/dstone_ai
        username: dstone_ai
        password: ENC(XIXzzg4U/6LYCwsQagqLSeGJt80UdT1bZcI0Msf0nh8=)
        hikari:
            maximum-pool-size: 10
    ##########################################################################################
    # <자동설정기능>
    # Security/RabbitMQ/Kafka는 아직 미사용 이므로 exclude.    #
    # Boot 4에서 Security 자동설정이 org.springframework.boot.autoconfigure.security.* 에서
    # org.springframework.boot.security.autoconfigure.* 로 통째로 옮겨갔다.
    ##########################################################################################
    autoconfigure:
        exclude:
            - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
            - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
            - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
            - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    ai:
        # chat(provider 선택): 아래 3개 provider의 starter가 모두 클래스패스에 있으므로
        # 반드시 하나를 명시해야 한다(값을 지우면 3개 provider가 동시에 활성화되어 기동에 실패한다).
        # Agent 파일의 model.provider를 비워 둔 Agent가 이 provider를 쓴다.
        # Agent가 model.provider로 다른 값을 고르면 그 Agent만 아래의 해당 provider 설정으로 호출한다(common.config.ChatProviders).
        # 고른 provider의 api-key가 비어 있으면 기동이 실패한다(ollama는 키가 없다).
        # (azure-openai는 Spring AI 2.x에서 chat model provider로 제거되어 더 이상 선택할 수 없다.)
        #
        # embedding: 이 엔진은 임베딩 모델을 쓰지 않는다(none). 문서의 임베딩과 검색은 dstone-knowledge가 한다
        # (Agent가 tools.knowledge.KnowledgeDocTool의 knowledgeSearchDocs 등으로 그 서버의 검색 API를 부른다).
        #
        # chat 외 capability(audio/image/moderation)는 openai starter가 클래스패스에 있으면
        # 기본값으로 자동 활성화를 시도하고(그중 상당수가 기동 시점에 api-key를 요구해서 즉시 기동 실패로 이어진다),
        # 아직 쓰지 않으므로 전부 명시적으로 꺼둔다.
        model:
            chat: openai # anthropic | openai | ollama
            embedding: none # 쓰지 않는다. 임베딩은 dstone-knowledge의 몫이다
            audio:
                speech: none
                transcription: none
            image: none
            moderation: none
        # Spring AI가 스스로 거는 Tool 호출 한도(Agent 호출 한 번 기준). 기본값은 Tool 하나당 40번, 전체 150번이고,
        # max-calls-per-tool-default : Tool 하나당 호출한도. -1은 한도 없음.
        # max-total-tool-calls : Tool 전체 호출한도.
        tools:
            limits:
                max-calls-per-tool-default: -1
                max-total-tool-calls: 300

        ##########################################################################################
        # spring.ai.model.chat=anthropic이거나 Agent가 model.provider: anthropic을 고를 때 쓰는 설정.
        ##########################################################################################
        anthropic:
            api-key: ENC(iTbr7/33NEFc5gCOapVTLZsks5dU96gITu6OUXr2UqAVntTkq5p1nFjlVI/3RVVx/fZzBOAKEdngosd4zialqNUgfEq31RU3u8HUa/VBIaBnFViQCLJBPW8O81lcTpsHsQQPfRbeToKYHAm2BVMWP0cZhkx145+bnmoH7nXsXQE=)
            chat:
                 options:
                     model: claude-sonnet-4-5-20250929
                     # 4096 6144 8192
                     max-tokens: 6144 
            timeout: 5m
            max-retries: 1
        ##########################################################################################
        # spring.ai.model.chat=openai이거나 Agent가 model.provider: openai를 고를 때 쓰는 설정.
        ##########################################################################################
        openai:
             base-url: https://openrouter.ai/api/v1
             api-key: ENC(5jqSbTq/PbjnMvBpVAEYIlURuhiynSmmJUqHmoXZbdiFJsTdCRzX9iEOyNdvhsMGUefD5MtBtoyThqFTKEvfiJxNU1x3f+UFFH4pmNRJ0iGLcijIkSa5d/4YJfPRu8m+)
             chat:
                 options:
                     # OpenRouter에서 제공하는 완전 무료 모델 지정(:free 를 붙여야 무료로 호출됨.)
                     # google/gemma-4-26b-a4b-it | deepseek/deepseek-v4.1-flash | qwen/qwen3.8-27b | openai/gpt-oss-120b
                     model: qwen/qwen3.8-27b
                     temperature: 0.4
                     max-tokens: 60000
             # timeout / max-retries: Spring AI의 기본값은 60초 / 3회다. Tool 호출이 여러 번 붙은 요청은 응답이
             # timeout : LLM호출 타임아웃.
             # max-retries : LLM호출 실패 시 재시도 횟수.
             timeout: 5m
             max-retries: 1

        ##########################################################################################
        # spring.ai.model.chat=ollama이거나 Agent가 model.provider: ollama를 고를 때 쓰는 설정.(로컬/사내망 Ollama 서버, API 키 불필요).
        # 설치 절차: docs/software/14.ollama.md
        ##########################################################################################
        ollama:
            base-url: http://localhost:11434 # ollama 와 통신할 URL            
            init:  # 모델 초기 다운로드(Pull) 시 타임아웃 설정 (최초 실행 시 필요)
                pull-model-strategy: when_missing
                timeout: 300s
                max-retries: 1   
            chat:
                options:
                    # qwen2.5-coder:7b, llama3.2:latest, bge-m3:latest, hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:latest
                    model: hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:latest
                    timeout: 5m 
                    temperature: 0.3  # 💡 모든 Ollama 요청의 토큰 생성 다양성을 제거하여 속도 및 일관성 향상

dstone:
    ai:
        ##########################################################################################
        # JUnit 테스트(src/test) 설정. 엔진을 띄워 실행할 때는 쓰이지 않는다.
        # llmcall: 테스트에서 LLM을 부르는 step(AGENT/SUPERVISOR/ROUTER)이 무엇의 답을 받을지 정한다.
        #   false(기본) 테스트가 chatModel.answer(...)로 넣어 둔 답을 쓴다. 실제 LLM을 부르지 않아 결과가 매번 같고 비용이 없다.
        #   true        위 spring.ai.model.chat의 provider(실제 LLM)를 부른다. answer(...)는 무시된다.
        #               Agent 프롬프트가 제대로 판단하는지 볼 때 켠다. API 키와 네트워크가 필요하고, 답이 매번 같지 않을 수 있다.
        #   한 번만 바꿔 돌릴 때: mvn test -DskipTests=false -Ddstone.ai.test.llmcall=true
        ##########################################################################################
        test:
            llmcall: true
        ##########################################################################################
        # 정의 파일(Workflow/Agent/MCP 서버) 위치와 화면 편집.
        # location: 정의 폴더. 아래에 workflows/**.yml, agents/**.md, skills/**/SKILL.md, mcp/**.yml이 있다. jar 밖(conf/definitions)에 두어서
        #           "Workflow 디자이너" 화면(/ai/designer/designer.html)에서 고쳐 저장하고, 엔진을 다시 띄우지 않고 다시 읽을 수 있다.
        # edit-enabled: true면 화면에서 저장/삭제할 수 있다. false면 보기와 검사, 다시 읽기만 된다(운영 서버에서는 false 권장).
        #           저장은 전부 검사해서 통과했을 때만 파일을 쓰고 바로 등록한다(common.registry.DefinitionReloader).
        #           MCP 서버 정의는 다시 읽지 않으므로, mcp/**.yml을 고치면 엔진을 다시 띄운다.
        ##########################################################################################
        definition:
            location: file:${APP_CONF_DIR}/definitions
            edit-enabled: true
        ##########################################################################################
        # 대화 히스토리(ChatMemory) 설정.
        ##########################################################################################
        session:
            max-messages: 20 # 세션당 유지할 최대 메시지 수(넘으면 오래된 메시지부터 잘림)
            ttl-seconds: 86400 # Redis에 저장된 세션 히스토리의 만료 시간(1일)
        workflow:
            detail:
                max-value-chars: 2000
            # 실행 관리 화면에서 step이 읽고 쓴 파일을 보고 고치는 기능(api.service.WorkFlowFileService).
            # file.edit-enabled: true면 화면에서 저장할 수 있다. false면 보기만 된다(운영 서버에서는 false 권장).
            # file.editable-extensions: 저장할 수 있는 파일 확장자(쉼표로 구분). 소스 파일은 넣지 않는다.
            # file.max-read-bytes: 화면에 보여 줄 수 있는 파일 크기 상한(바이트). 넘으면 열지 않는다.
            file:
                edit-enabled: true
                editable-extensions: md
                max-read-bytes: 2097152
            # Agent step 스냅숏(runtime.workflow.snapshot.StepSnapshotRecorder). Agent가 마주한 입력·파일·답을 남겨
            # 실행 관리 > 진행 기록 > [평가 사례로 만들기]로 그 장면을 평가 사례(conf/eval)로 만든다.
            # root: 비우면 {APP_HOME}/LOGS/dstone-ai-engine/snapshot. k8s처럼 LOGS가 Pod 안에만 있으면 영구 볼륨 경로로 바꾼다.
            # max-step-bytes: step 하나가 남기는 최대 용량. 넘는 파일은 manifest에 "생략"으로만 적는다.
            # max-dir-bytes / max-dir-files: 입력 값이 폴더면 이 안일 때만 통째로 복사한다(소스 폴더처럼 큰 폴더는 건드린 파일만).
            # retention-days: 이 날수가 지난 실행 폴더는 지운다(0이면 지우지 않음). LOGS 정리 스크립트가 있으면 snapshot은 빼 둔다.
            snapshot:
                enabled: true
                root:
                max-step-bytes: 52428800
                max-dir-bytes: 20971520
                max-dir-files: 3000
                retention-days: 30
            # 실행 스레드 풀(runtime.workflow.WorkFlowThreadPools). 여러 사람이 동시에 돌려도 이 수만큼만 돌고, 나머지는 QUEUED로 차례를 기다린다.
            # max-running: 동시에 도는 Workflow 수. LLM 동시 요청 한도(dstone.ai.llm.gate)와 함께 잡는다.
            # max-queued: 차례를 기다릴 수 있는 Workflow 수. 넘치면 새 실행·재개·승인을 503으로 거절한다.
            # for-each-threads: forEach step의 반복을 동시에 돌리는 스레드 수(엔진 전체가 함께 쓴다).
            pool:
                max-running: 8
                max-queued: 50
                for-each-threads: 8
            # 실행을 맡은 엔진이 사라졌을 때(재시작·재배포) 그 엔진이 들고 있던 RUNNING/QUEUED 실행을 FAILED로 바꾼다
            # (runtime.workflow.execution.WorkFlowExecutionRecovery). 각 엔진이 heartbeat-seconds마다 맡은 실행에 살아 있다고 적고,
            # stale-seconds 넘게 끊긴 실행만 고르므로 같은 DB를 쓰는 엔진을 여러 대 띄워도 서로의 실행을 건드리지 않는다.
            # 대신 엔진을 다시 띄우면 끊긴 실행은 stale-seconds가 지난 뒤(정리 주기 sweep-seconds 안에) FAILED로 바뀐다.
            recovery:
                enabled: true
                heartbeat-seconds: 30
                stale-seconds: 120
                sweep-seconds: 60
        ##########################################################################################
        # LLM 요청 문지기(runtime.agent.LlmCallGate). 모든 실행이 provider마다 API 키 하나를 함께 쓰므로,
        # provider별로 동시에 보내는 요청 수를 묶고 요청 한도 초과(429)를 받으면 쉬었다가 그 요청만 다시 보낸다.
        # Tool 루프의 "LLM 요청 한 번"마다 거치므로 다시 보내도 Tool은 두 번 돌지 않는다.
        # max-concurrent: provider 하나에 동시에 보내는 요청 수. providers.{provider}.max-concurrent로 따로 정할 수 있다.
        #           OpenRouter 무료 모델처럼 한도가 낮은 provider는 작게 잡는다.
        # acquire-timeout-seconds: 차례를 이만큼 기다려도 안 오면 그 step을 실패로 돌려준다.
        # rate-limit-retries / backoff-*: 429를 받았을 때 다시 보내는 횟수와 쉬는 시간(재시도마다 두 배, 상한 backoff-max-millis).
        # read-timeout-retries: 응답을 기다리다 시간 초과(spring.ai.*.timeout)로 끊긴 요청을 바로 다시 보내는 횟수.
        #           OpenRouter는 헤더를 먼저 보내서 이 경우를 SDK가 다시 보내지 않는다. 0이면 다시 보내지 않고 step이 실패한다.
        ##########################################################################################
        llm:
            gate:
                enabled: true
                max-concurrent: 6
                acquire-timeout-seconds: 600
                rate-limit-retries: 3
                backoff-initial-millis: 2000
                backoff-max-millis: 30000
                read-timeout-retries: 1
                providers:
                    openai:
                        max-concurrent: 2
        ##########################################################################################
        # Agent 호출 한 번에 대한 한도.
        # sub-agent.max-calls: 부모 Agent 호출 한 번 안에서 Sub Agent를 부를 수 있는 횟수(백그라운드로 맡긴 것도 센다).
        # sub-agent.background-threads: subAgents.background: true인 Agent가 기다리지 않고 맡긴 일을 돌리는 스레드 수.
        #           엔진 전체가 함께 쓰고, 다 차면 새로 맡긴 일은 줄을 선다. LLM provider의 동시 요청 한도를 넘지 않게 잡는다.
        # tool.max-calls: Agent 호출 한 번에 Tool(Skill 포함)을 부를 수 있는 횟수. Agent의 execution.maxToolCalls가 있으면 그 값.
        # tool.keep-result-chars: 쌓인 Tool 결과가 이 글자 수를 넘으면 오래된 결과부터 앞부분만 남긴다(0은 끔).
        # tool.reread-guard: true면 Agent 호출 한 번 안에서 이미 읽은 파일 범위(readFileLines/readFile)를 또 읽을 때
        #           Tool을 실행하지 않고 "앞의 결과를 보라"는 안내만 준다. 같은 내용이 대화에 두 번 쌓이지 않게 하려는 것이다.
        #           파일이 바뀌었거나 일부만 겹치거나, 오래된 결과를 줄인 뒤에는 그대로 읽는다(runtime.agent.RereadGuardCallback).
        # keep-reasoning: false면 앞 라운드 답에 붙은 추론 글을 다음 라운드에 다시 보내지 않는다(OpenAI 호환 provider만 해당).
        #           Tool 루프가 길수록 앞의 추론 글이 매 라운드 쌓여 입력 토큰이 크게 는다(common.advisors.ReasoningStripAdvisor).
        ##########################################################################################
        agent:
            keep-reasoning: false
            # 같은 생각을 되풀이하다 출력 한도에 걸려 답도 Tool 호출도 없이 끝난 라운드를, 대화를 그대로 두고 한 번 다시 부른다(RunawayRetryAdvisor).
            runaway-retry: true
            sub-agent:
                max-calls: 10
                background-threads: 4
            tool:
                max-calls: 100
                keep-result-chars: 200000
                reread-guard: true
        ##########################################################################################
        # Tool 설정. 
        # Tool 호출은 caller(dstone.ai.security.auth.keys.caller)별로 화이트리스트를 둘 수 있다(common.config.ConfigTool 참고) 
        # 설정(dstone.ai.tool.allowed-by-caller)이 없는 caller는 등록된 Tool 전체를 그대로 허용한다.
        ##########################################################################################
        tool:
            # 미리 등록한 셸 스크립트만 실행하는 Tool(tools.shell.ShellExecTool, runShellScript) 설정.
            # allowed-commands에 없는 이름은 실행하지 않는다. 경로가 비어 있는 항목은 실행에 실패할 뿐이다.
            shell:
                # 시험용 사본을 빌드하고 시험 서버에 올리는 스크립트. 경로는 환경마다 env*.properties의 TEST_SERVER_DEPLOY_SCRIPT.
                # 빌드와 서버 재시작을 기다려야 해서 시간 제한을 넉넉히 둔다.
                timeout-seconds: 600
                allowed-commands:
                    - name: test-server-deploy
                      path: ${TEST_SERVER_DEPLOY_SCRIPT:}
            # 비밀값 자리표시자 ${secret:프로젝트ID.testPassword}를 실제 값으로 바꿔 넘길 Tool(쉼표로 구분, runtime.tool.ToolCallGate).
            # LLM에게는 비밀번호 대신 자리표시자만 준다. 여기 없는 Tool에 자리표시자를 주면 실행하지 않는다. 결과에 섞인 비밀값은 자리표시자로 되돌려 가린다.
            secret:
                allowed-tools: browser_type,browser_fill_form
            # 원본 + 개발 결과로 임시 시험 서버를 띄우고 내리는 Tool(tools.build.TestServerTool, startTestServer/stopTestServer) 설정.
            # 사본은 {work-root}/{프로젝트ID}-server/app 에 두고 다음에 다시 쓴다(처음만 전체 복사). 서버는 띄운 step이 끝나면 내려간다.
            # Maven 프로젝트(tomcat7/tomcat6, spring-boot, jetty 플러그인)만 띄운다. 사본은 원본 설정 그대로 원래 DB에 붙는다.
            test-server:
                # 비우면 {사용자 홈}/.dstone-ai-engine
                work-root: ${TEST_SERVER_WORK_ROOT:}
                # 격리 시험 서버(startSandboxServer). DB 종류마다 설치 폴더(bin 또는 sbin이 있는 곳). 비우면 그 DB는 자동 검증하지 않는다.
                # 설치 버전은 원래 DB와 같거나 높게. AppArmor가 켜진 Linux는 work-root 아래에 mysqld가 쓸 수 있게 허용해야 한다.
                sandbox-mysql-home: ${TEST_SERVER_MYSQL_HOME:}
                sandbox-postgresql-home: ${TEST_SERVER_POSTGRESQL_HOME:}
                # Oracle은 설치 폴더 대신 시험 전용 서버(12c 이상 CDB, 원래 DB와 다른 서버)에 실행마다 PDB를 만든다. 비우면 Oracle은 자동 검증하지 않는다.
                # 계정은 그 서버의 SYSDBA. 비밀번호는 ENC(...)로 적는다.
                sandbox-oracle-url: ${TEST_SERVER_ORACLE_URL:}
                sandbox-oracle-username: ${TEST_SERVER_ORACLE_USERNAME:}
                sandbox-oracle-password: ${TEST_SERVER_ORACLE_PASSWORD:}
                # 복제할 DB 하나의 크기 상한
                sandbox-max-db-mb: 2048
                # 격리 중에도 앱이 접속해도 되는 곳. 프로젝트마다 적는다(프로젝트ID=host:port, 쉼표로 구분). 시험 중 이곳에는 실제로 쓰게 되므로 시험용만 적는다
                sandbox-allow-hosts: ${TEST_SERVER_ALLOW_HOSTS:}
                # NIO 접속 라이브러리지만 그 프로젝트는 쓰지 않는다고 사람이 확인한 것(프로젝트ID=jar 이름 앞부분, 쉼표로 구분)
                sandbox-trusted-libs: ${TEST_SERVER_TRUSTED_LIBS:}
                # 업로드 시험용 파일을 둘 곳. 브라우저 MCP가 읽어도 되는 폴더여야 한다
                upload-sample-dir: ${PLAYWRIGHT_MCP_HOME:}/output
                # WAR 프로젝트를 올릴 설치된 Tomcat(CATALINA_HOME). 이것을 함께 쓰되 사본 폴더에 전용 CATALINA_BASE를 만들어 빈 포트로 띄운다.
                # 비우면 WAR도 pom의 tomcat/jetty 플러그인으로 띄운다(앱에 따라 서블릿 API가 부딪쳐 못 뜰 수 있다).
                tomcat-home: ${TEST_SERVER_TOMCAT_HOME:}
                # Maven 실행 파일(PATH에서 찾는다). Windows는 cmd.exe /c 로 감싸 부른다.
                maven-command: ${TEST_SERVER_MAVEN_COMMAND:mvn}
                # 빌드와 기동을 기다리는 시간. 처음에는 의존성을 받느라 오래 걸릴 수 있다.
                start-timeout-seconds: 600
                # 같은 프로젝트를 다른 실행이 쓰고 있을 때 기다리는 시간
                lock-wait-seconds: 60
                # Java 버전별 JDK 경로. 버전은 프로젝트 관리의 Java 버전 → 원본 pom.xml → 원본 클래스 파일 순서로 정한다.
                # 경로는 서버(PC)마다 달라서 DB가 아니라 env*.properties에 둔다. 비어 있으면 엔진과 같은 JDK로 띄운다.
                java-home-8: ${JAVA_HOME_8:}
                java-home-11: ${JAVA_HOME_11:}
                java-home-17: ${JAVA_HOME_17:}
                java-home-21: ${JAVA_HOME_21:}
            # Jenkins Job을 REST API로 원격 기동하는 Tool(tools.jenkins.JenkinsTriggerBuildTool) 설정.
            # allowed-jobs가 비어 있으면(기본값) 이 Tool은 항상 실패로 끝난다 - 화이트리스트를
            # 채우는 것 자체가 곧 "이 Tool을 켠 상태"다. api-token은 DB 비밀번호와 동일한 ENC(...)
            # 컨벤션(EncUtil)을 그대로 쓴다 - Jenkins 화면에서 "내 계정 > Configure > API Token >
            # Add new Token"으로 발급받은 값을 절대 평문으로 여기 넣지 말고 반드시 암호화해서 넣을 것.
            # Jenkins를 쓰게 되면 현장에서 채운다. 비어 있으면 이 Tool은 "Jenkins 연결 설정이 비어 있습니다"로 끝난다.
            jenkins:
                base-url: ""
                user: ""
                api-token: ""
                # 기동을 허락할 Job 이름 목록. 비어 있으면 이 Tool은 항상 실패로 끝난다(현장마다 채운다).
                allowed-jobs: []
            # dstone-knowledge(Java 분석 결과와 올린 문서를 담아 둔 서버)를 부르는 설정(common.knowledge.KnowledgeClient).
            # 쓰는 곳은 tools.knowledge.KnowledgeTool(코드 분석 결과: knowledgeSearch 등)과 KnowledgeDocTool(올린 문서: knowledgeListDocs / knowledgeSearchDocs / knowledgeGetChunks)이다.
            # base-url이 비어 있으면 그 Tool은 항상 실패 문구로 끝난다 - 주소를 채우는 것이 곧 "켠 상태"다.
            # api-key: dstone-knowledge가 호출자 인증(dstone.knowledge.security.auth.enabled)을 켰을 때만 넣는다. ENC(...)로 적는다.
            # timeout-seconds: 응답 대기 시간(기본 60). 검색은 질문을 임베딩해야 해서 임베딩 서버가 바쁘면 수 초가 걸린다.
            knowledge:
                # 주소는 환경마다 다르다(Pod에서는 localhost가 아니다). env-*.properties의 KNOWLEDGE_HOST / KNOWLEDGE_PORT.
                base-url: http://${KNOWLEDGE_HOST}:${KNOWLEDGE_PORT}
                # api-key: ENC(...)
                timeout-seconds: 60
                # knowledgeSearch(코드) 결과 한 건의 본문 글자 수 상한(기본 1500). 한 번에 10건까지 오므로 1500이면 16,000자가 넘었다(2026-11-05).
                # 올린 문서 조각(knowledgeSearchDocs / knowledgeGetChunks)에는 쓰지 않는다. 문서 조각은 dstone-knowledge가 1,000자 안팎의 장/절 단위로 만들어서 자르지 않는다.
                max-content-chars: 800
                # knowledgeSearch / knowledgeSearchDocs 결과 개수 상한(기본 10). LLM이 topK를 더 크게 줘도 이만큼만 준다.
                # sm-workflow 영향도 step에서 topK 10으로 두 번 찾은 18,000자가 뒤의 18라운드에 계속 실렸다(2026-11-05).
                max-top-k: 5
            # 등록해 둔 DB를 조회하는 Tool(tools.db.DbQueryTool: dbListConnections / dbListTables / dbDescribeTable / dbQuery) 설정.
            # 등록된 DB가 없으면 모든 호출이 실패 문구로 끝난다.
            # LLM은 별칭만 넘기고 주소와 계정은 모른다. 비밀번호는 ENC(...)로 적고, 계정은 읽기 권한만 있는 것을 쓴다.
            # 어떤 DB를 등록할지는 KnowledgeTool.knowledgeDatasources(분석한 애플리케이션의 데이터소스 설정)로 찾는다.
            # 조회만 한다: 실행 전에 SELECT 한 문장인지 검사하고, 읽기 전용 연결로 실행한 뒤 항상 롤백한다.
            # max-rows: dbQuery가 돌려주는 최대 행 수(기본 100). 결과는 대화에 쌓이므로 작게 둔다.
            # max-cell-chars: 칸 하나의 최대 글자 수(기본 200).
            # query-timeout-seconds: 쿼리 대기 시간(기본 30).
            # mask-columns: 이 정규식에 맞는 이름의 컬럼은 값 대신 ****를 준다(기본: password, token, ssn, card_no 등).
            # Pod(k8s)에서 돌 때는 DB 주소가 Pod에서 닿아야 한다(localhost가 아니다. KNOWLEDGE_HOST처럼 172.18.0.1 등).
            db:
                max-rows: 100
                max-cell-chars: 200
                query-timeout-seconds: 30
                # 조회할 DB는 관리자 > 프로젝트관리에 등록한다(ai_management_project_db, 별칭 "프로젝트ID.DB이름").
                # 프로젝트에 묶이지 않는 DB를 더 두려면 connections.{별칭}: {url, username, password: ENC(...), schema, description}을 적는다(선택).
            # max-result-chars: 어떤 Tool이든(로컬 @AiTool, MCP 공통) 결과 한 건이 이 글자 수를 넘으면 앞부분만 남기고
            # "잘렸으니 범위를 좁혀 다시 호출하라"는 안내를 붙인다(common.config.ConfigTool, 기본 60000).
            # Tool 결과는 대화 이력에 쌓여 매 호출마다 다시 보내지므로, 큰 결과 하나가 컨텍스트 한도나 응답 대기 시간을 넘긴다.
            # Tool마다 따로 막아도 새 Tool/MCP Tool에서 또 터질 수 있어서 엔진에 마지막 안전망을 하나 둔 것이다.
            max-result-chars: 60000
            # 파일 Tool(tools.utils.FileUtil) 설정. 모두 "한 번에 돌려주는 양"을 줄이기 위한 값이다.
            # max-read-chars: readFile/readFileLines/readFileTail이 한 번에 돌려주는 최대 글자 수(기본 30000).
            # list-summary-over: readFileListAll이 찾은 파일이 이 개수를 넘으면 파일 이름 대신 "폴더 경로 (파일 수)"만 준다(기본 100).
            #               프로젝트 루트를 조회한 Agent가 파일 450개의 경로(4만 자)를 받아서, 그 뒤의 모든 LLM 호출이 그만큼 느려진 적이 있다.
            #               폴더 구조만 보여 주면 모델이 필요한 폴더를 골라 다시 조회한다.
            # max-list-files: readFileListAll이 한 번에 돌려주는 최대 파일 수(기본 500). list-summary-over를 이보다 크게 잡았을 때만 의미가 있다.
            # max-lines-without-range: readFileLines를 startLine/endLine 없이 부르면 이 줄 수까지만 주고 범위를 정하라고 안내한다(기본 300).
            #               프롬프트에 "필요한 범위만 읽는다"고 적어도 실제 실행에서 readFileLines의 73%가 범위 없이 불렸다(2026-11-05).
            # max-search-matches: searchInFiles가 한 번에 돌려주는 최대 건수(기본 100). 소스 루트 전체를 넓은 단어로 찾으면
            #               한 번에 15,000자가 넘게 와서 50으로 낮췄다(2026-11-05).
            # max-search-file-bytes: searchInFiles가 검색하는 파일의 최대 크기(기본 1MB). 더 큰 파일은 건너뛴다.
            # exclude-dirs: 목록/검색에서 빼는 폴더 이름(콤마 구분). 프로젝트 루트를 조회했을 때 .git 속 파일까지
            #               338KB가 딸려 와서 요청이 700KB로 불어나 실패한 적이 있다.
            file:
                max-read-chars: 30000
                max-lines-without-range: 300
                list-summary-over: 100
                max-list-files: 500
                max-search-matches: 50
                max-search-file-bytes: 1048576
                exclude-dirs: .git,.svn,target,node_modules,.settings,.idea,.gradle,.metadata
        
        ##########################################################################################
        # Security 설정. 
        # security.auth: API Key 인증. enabled=false(기본값)면 인증 없이 전부 통과한다. 현재는 미사용.
        # security.ratelimit: caller별(security.auth가 꺼져 있으면 클라이언트 IP별) 요청 개수 제한. 현재는 미사용.
        ########################################################################################## 
        security:
            auth:
                enabled: false
                # keys:
                #     - key: ENC(...)
                #       caller: sample-si-project
                #     - key: ENC(...)
                #       caller: another-caller
            ratelimit:
                enabled: false
                # window-seconds: 60
                # default-limit: 60 # window당 caller(또는 IP)별 기본 허용 요청 수
                # overrides:
                #     - caller: sample-si-project
                #       limit: 200
                #     - caller: another-caller
                #       limit: 30
        ##########################################################################################
        # <화면(AI 콘솔)>
        # 화면은 이 앱이 직접 내려준다(src/main/resources/static/ai/**, 첫 화면 http://localhost:8081/).
        # 로그인은 이 앱의 로그인 화면(/ai/login.html)에서 하고, 사람·그룹·권한·메뉴는 이 앱 DB 의 ai_management_* 테이블로 관리한다
        # (관리자 > 사용자관리·사용자그룹관리·메뉴관리·권한관리. 규칙은 dstone-common 의 ConsoleLoginFilter, common.config.ConfigConsole).
        # 세션 만료 시간과 쿠키 이름은 위 server.servlet.session.
        # 화면 스크립트는 같은 앱의 엔진 API(/api/ai/**)를 바로 부른다. 사람은 세션 사용자로 정해진다(common.security.RequesterContext).
        # urls: 브라우저가 여는 각 앱의 주소(값은 conf/env*.properties 의 *_PUBLIC_URL). 앱 사이 링크(코드 분석 화면)에 쓴다.
        #       앱마다 로그인이 따로라, 다른 앱 화면에서는 그 앱에 다시 로그인한다.
        ##########################################################################################
        console:
            urls:
                ai: ${AI_ENGINE_PUBLIC_URL}
                knowledge: ${KNOWLEDGE_PUBLIC_URL}

################################################################
# WSL Environment (local sanity run outside container)
################################################################
APP_HOME=/app/dstone
APP_NAME=dstone-ai-engine
APP_CONF_DIR=/app/dstone/dstone-ai-engine/conf
REDIS_HOST=localhost
REDIS_PORT=6379
DB_HOST=localhost
DB_PORT=5432
# dstone-knowledge(Java 분석 결과/문서 검색 서버). tools.knowledge.KnowledgeTool(소스 코드), KnowledgeDocTool(올린 문서)이 부른다.
KNOWLEDGE_HOST=localhost
KNOWLEDGE_PORT=4081
# STDIO MCP 서버(예: npx로 띄우는 서버)를 Windows에서 실행하려면 필요하다. npx는 실제로는 npx.cmd(배치 스크립트)라서, 
# cmd.exe 없이 곧바로 실행시키면 "지정된 파일을 찾을 수 없습니다" (CreateProcess error=2)로 항상 실패한다.
# common.config.ConfigMcp가 이 값을 커맨드 맨 앞에 붙여서 "cmd.exe /c npx ..." 형태로 실행해 준다. 
# Linux/WSL/k8s에서는 npx를 바로 실행할 수 있으므로 이 값 자체가 필요 없다(env-wsl.properties/env-k8s.properties에는 없음).
MCP_STDIO_COMMAND_PREFIX=
# 브라우저가 여는 각 앱 주소(화면 사이 링크). 서버끼리 부르는 주소가 아니라 브라우저 기준이다.
AI_ENGINE_PUBLIC_URL=http://localhost:8081
KNOWLEDGE_PUBLIC_URL=http://localhost:4081
# 테스트 서버에서 개발 결과를 직접 확인하는 데 쓰는 값(동작 검증·자동 수정 Agent). 설치는 docs/software/16.playwright-mcp.md.
# 브라우저 MCP 서버(definitions/mcp/common/browser.yml): 설치 폴더와 브라우저 실행 파일. 비워 두면 그 MCP 서버는 뜨지 않고 건너뛴다.
PLAYWRIGHT_MCP_HOME=/opt/playwright-mcp
PLAYWRIGHT_BROWSER=/opt/playwright-mcp/browsers/chromium_headless_shell-1255/chrome-headless-shell-linux64/chrome-headless-shell
# 테스트 서버(tools.build.TestServerTool)와 리비전 빌드. 리비전과 실행 층을 둘 폴더(비우면 {사용자 홈}/.dstone-ai-engine)와 Java 버전별 JDK 경로.
# JDK 경로가 비어 있으면 엔진과 같은 JDK를 쓴다. 대상 앱의 Java 버전은 프로젝트 관리 화면에서 정한다.
TEST_SERVER_WORK_ROOT=
# 프로젝트 관리의 빌드 종류 Shell에서 쓸 빌드 스크립트(dstone.ai.tool.shell.allowed-commands의 project-build). 비어 있으면 Shell 빌드를 쓰지 않는다.
PROJECT_BUILD_SCRIPT=
# WAR 앱을 올릴 설치된 Tomcat 경로(javax 앱은 9, jakarta 앱은 10·11). 실행마다 전용 CATALINA_BASE로 띄우므로 그 Tomcat의 앱은 건드리지 않는다.
TOMCAT_HOME_9=/opt/tomcat9
TOMCAT_HOME_10=
TOMCAT_HOME_11=
# 테스트 중에도 앱이 접속해도 되는 곳과, 쓰지 않는다고 확인한 NIO 라이브러리(둘 다 프로젝트ID=값, 쉼표로 구분)
TEST_SERVER_ALLOW_HOSTS=
TEST_SERVER_TRUSTED_LIBS=
JAVA_HOME_6=
JAVA_HOME_7=
JAVA_HOME_8=
JAVA_HOME_11=
JAVA_HOME_17=
JAVA_HOME_21=
JAVA_HOME_25=

apiVersion: v1
kind: ConfigMap
metadata:
  name: dstone-ai-engine-conf
  namespace: dstone
data:
  application.yml: |
    server:
        port: 8081
        error:
            whitelabel:
                enabled: true
        servlet:
            session:
                # 화면(AI 콘솔)의 세션. 쿠키는 포트를 가리지 않아서 dstone-boot(JSESSIONID)와 이름이 같으면 서로 덮어쓴다.
                cookie:
                    name: DSTONE_AI_SESSION
                timeout: 120m

    management:
        endpoints:
            web:
                exposure:
                    include: health
        endpoint:
            health:
                probes:
                    enabled: true

    spring:
        main:
            allow-bean-definition-overriding: true
        ##########################################################################################
        # <자동설정기능>
        # Phase 0은 DB/Redis/RabbitMQ/Kafka/Security를 쓰지 않는 순수 Chat API 스켈레톤이다.
        # 클래스패스에는 dstone-common을 통해 이미 올라와 있으므로(자동설정이 붙잡으려 시도함),
        # 실제로 해당 Phase(세션=Phase1, 메시징=후속)에서 쓰기 시작할 때 이 목록에서 해당 줄을 지운다.
        ##########################################################################################
        autoconfigure:
            exclude:
                - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
                - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
                - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
                - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
                - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
                - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
        ai:
            anthropic:
                # DB 패스워드와 동일한 컨벤션: Jasypt로 암호화해 ENC(...) 형태로 직접 넣는다.
                api-key: ENC(iTbr7/33NEFc5gCOapVTLZsks5dU96gITu6OUXr2UqAVntTkq5p1nFjlVI/3RVVx/fZzBOAKEdngosd4zialqNUgfEq31RU3u8HUa/VBIaBnFViQCLJBPW8O81lcTpsHsQQPfRbeToKYHAm2BVMWP0cZhkx145+bnmoH7nXsXQE=)
                # chat.options.model 을 비워두면 Spring AI 기본 모델을 사용한다.
                # SI 프로젝트별로 다른 모델이 필요하면 아래처럼 override.
                # chat:
                #     options:
                #         model: claude-sonnet-4-5-20250929

    dstone:
        ai:
            # 정의 파일(workflows/agents/skills/mcp) 폴더. conf/ 는 이 ConfigMap이 읽기 전용으로 덮으므로 conf/definitions 대신
            # deployment.yaml이 따로 붙이는 볼륨(definitions)을 가리킨다.
            definition:
                location: file:/app/dstone/dstone-ai-engine/definitions
                edit-enabled: false
            # 실행 관리 화면에서 step 문서를 고치는 기능. Pod에서는 보기만 허용한다.
            workflow:
                file:
                    edit-enabled: false
            ##########################################################################################
            # <화면(AI 콘솔)>
            # 화면은 이 앱이 직접 내려준다(src/main/resources/static/ai/**, 첫 화면 http://localhost:8081/).
            # 화면을 연 사람은 dstone-common 의 ConsoleSessionFilter 가 정한다(common.config.ConfigConsole).
            # login.enabled: false 면 로그인 없이 default-user 로 쓴다(혼자 띄워 쓸 때).
            #                true 면 dstone-boot 메뉴의 링크로만 들어온다. dstone-boot 의 로그인 사용자가 그대로 넘어온다.
            #                세션이 없으면 dstone-boot 의 /sso/go.do 로 보내 로그인 정보를 받아 온다.
            # 화면 스크립트는 같은 앱의 엔진 API(/api/ai/**)를 바로 부른다. 사람은 세션 사용자로 정해진다(common.security.RequesterContext).
            # caller: 로그인을 켜고 API 키 인증(security.auth)도 켰을 때, 화면에서 부른 요청의 caller 이름(키 대신 세션을 믿는다).
            # urls: 브라우저가 여는 각 앱의 주소. 왼쪽 메뉴의 "dstone-boot로 돌아가기"와 앱 사이 링크(코드 분석 화면)에 쓴다.
            ##########################################################################################
            console:
                login:
                    enabled: false
                    token-max-age-seconds: 60
                    default-user:
                        id: local
                        name: 로컬 사용자
                        admin: true
                caller: dstone-console
                urls:
                    boot: http://localhost:7081
                    ai: http://localhost:8081
                    knowledge: http://localhost:4081

  log4j2.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <Configuration>

        <Properties>
            <Property name="logging.root-path">${sys:APP_HOME}/LOGS</Property>
            <Property name="level.default">INFO</Property>
            <Property name="level.dstone">INFO</Property>
        </Properties>

        <Appenders>
            <Console name="console" target="SYSTEM_OUT">
                <PatternLayout pattern="%d{yyyy-MM-dd HH:mm:ss} %5p [%c] %m%n"/>
            </Console>
            <RollingFile name="rollingFile" filePermissions="rwxrwxr--">
                <FileName>${logging.root-path}/${sys:APP_NAME}/execution/execution.log</FileName>
                <FilePattern>${logging.root-path}/${sys:APP_NAME}/execution/backup/%d{yyyy-MM-dd}-execution.zip</FilePattern>
                <PatternLayout>
                    <Pattern>%d{yyyy-MM-dd HH:mm:ss} %5p [%c] %m%n</Pattern>
                </PatternLayout>
                <Policies>
                    <TimeBasedTriggeringPolicy interval="1" modulate="true"/>
                </Policies>
                <DefaultRolloverStrategy max="7" fileIndex="max">
                    <Delete basePath="${logging.root-path}/${sys:APP_NAME}/execution/backup" maxDepth="1">
                        <IfLastModified age="3d"/>
                    </Delete>
                </DefaultRolloverStrategy>
            </RollingFile>
        </Appenders>

        <Loggers>
            <Root level="${level.default}" additivity="false">
                <AppenderRef ref="console"/>
                <AppenderRef ref="rollingFile"/>
            </Root>

            <Logger name="org.springframework" level="${level.default}" additivity="false">
                <AppenderRef ref="console"/>
                <AppenderRef ref="rollingFile"/>
            </Logger>

            <Logger name="org.springframework.ai" level="${level.dstone}" additivity="false">
                <AppenderRef ref="console"/>
                <AppenderRef ref="rollingFile"/>
            </Logger>

            <Logger name="net.dstone.ai" level="${level.dstone}" additivity="false">
                <AppenderRef ref="console"/>
                <AppenderRef ref="rollingFile"/>
            </Logger>

        </Loggers>

    </Configuration>

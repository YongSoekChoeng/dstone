# common.registry.McpServerRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 두고,
# common.config.ConfigMcp가 그 즉시 이 서버에 접속을 시도합니다(STDIO면 여기 적힌 command/args로 실제 OS 프로세스를 하나 띄워서 표준입출력으로 대화합니다).
#
# 이 파일은 공식 MCP 레퍼런스 서버인 @modelcontextprotocol/server-filesystem을 그대로 씁니다.
# NodeJS 가 설치되어 있어야 합니다.(npx 명령 사용)
# (자바 코드를 새로 만들지 않았습니다 - "외부에서 이미 만들어진 MCP 서버의 Tool을 가져다 쓴다"는 이 엔진의 MCP 클라이언트 기능을 있는 그대로 보여주는 게 이 샘플의 목적입니다). 
# npx가 최초 접속 시점에 이 패키지를 내려받으므로(그 뒤로는 npm 캐시를 씀), 앱을 처음 켤 때는 인터넷 연결이 한 번 필요합니다. args의 마지막 값(${APP_HOME}/${APP_NAME}/mcp/server-filesystem/sample)이
# "이 서버가 접근할 수 있는 유일한 디렉토리"입니다. 그 밖의 경로는 요청해도 거부됩니다(서버 자체가 강제하는 샌드박스이고, dstone-ai-engine 코드가 따로 검사하는 게 아닙니다). 
# 다른 SI 프로젝트에서 이 패턴을 재사용할 때는 이 경로를 그 프로젝트의 절대경로로 바꿔서 쓰면 됩니다.
# 
# allowedTools에 적은 Tool만 엔진에 등록됩니다(적지 않은 Tool은 등록 자체가 안 됩니다). 지금은 읽기 Tool
# (list_directory, directory_tree, read_text_file)과 파일을 바꾸는 Tool(write_file, edit_file, move_file)을
# 함께 등록해 두었습니다. 전체 목록은 서버가 접속에 성공했을 때 로그(dstone-ai-engine mcp: [sample-filesystem]
# 접속 성공 - Tool N개 중 6개 등록)에서 확인할 수 있습니다.
# 여기 등록되었다고 모든 Agent가 쓸 수 있는 것은 아닙니다. Agent는 자기 YAML의 tools에 적은 Tool만 봅니다
# (예: sample-mcp-filesystem-agent.yml은 읽기 Tool 두 개만 적었습니다).
#
# 이 서버의 Tool은 두 가지 방식으로 테스트해볼 수 있습니다.
# - agents/sample/sample-mcp-filesystem-agent.yml : LLM이 스스로 이 Tool을 골라 호출합니다.
# - workflows/sample/sample-mcp-filesystem-list.yml : TOOL step이 directory_tree/read_text_file을 LLM 없이 직접 호출합니다.
mcpServer:
  id: sample-filesystem
  transport: STDIO            # STDIO | SSE
  command: npx
  args: ["-y", "@modelcontextprotocol/server-filesystem", "${APP_HOME}/${APP_NAME}/mcp/server-filesystem"]
  allowedTools: ["list_directory", "directory_tree", "read_text_file", "write_file", "edit_file", "move_file"]   # 비우면 이 서버의 Tool을 전부 허용

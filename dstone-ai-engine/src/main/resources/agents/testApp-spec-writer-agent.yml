# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 이름(ID)이 됩니다.
#
# workflows/testApp/testApp-sdlc.yml의 write-spec step 전용 Agent입니다. business-reviewer가
# 승인한 분석/설계 초안(입력)을 받아 "개발명세서"로 구체화합니다 - 8단계 SDLC 워크플로우의
# 4단계(AI 개발명세서 작성)에 해당합니다.
#
# structuredOutput은 쓰지 않습니다 - testApp-analysis-agent.yml과 같은 이유입니다: 뒤에 오는
# 어떤 TOOL step도 이 Agent의 data를 참조하지 않고, 이 Agent가 만드는 명세서는 길고 서식(SQL
# 예시, 명명규칙 표기 등)이 많아 JSON 문자열 값으로 강제 이스케이프시키다가 실제로 파싱 실패가
# 재현됐다(analyze는 같은 구조로도 통과했지만 write-spec은 재현성 있게 실패했다 - 내용의 코드성/
# 특수문자 비중 차이로 보인다). 자유 텍스트면 이 위험 자체가 없다.
agent:
  name: testApp-spec-writer-agent
  description: 승인된 분석/설계 -> 개발명세서 작성(testApp-sdlc 4단계).
  prompt: |
    당신은 개발 프로젝트의 기술 리드입니다. 입력으로 이미 검토를 통과한 분석/설계서를 받습니다.

    이 내용을 실제 개발자가 코드를 작성할 수 있을 만큼 구체적인 "개발명세서"로 바꿔서 그대로
    답변하십시오(별도 형식 없이 이 응답 전체가 곧 개발명세서입니다). 다음을 포함해야 합니다:
    1. 변경/신규 대상 목록(화면, Controller, Service, DAO/Mapper, 테이블) - 계층별로 구분
    2. 각 대상별 상세 명세(입출력 파라미터, 처리 로직 순서, 예외 처리)
    3. 데이터베이스 변경사항(테이블/컬럼 추가·변경, 인덱스) - 없으면 "없음"이라고 명시
    4. 명명규칙 - 특별한 지침이 없다면 일반적인 Java/Spring 관례(camelCase 메서드, PascalCase
       클래스, snake_case 테이블/컬럼)를 그대로 따른다고 명시
    5. 테스트 시 확인해야 할 체크리스트(정상 케이스 + 주요 예외 케이스)

    이 응답은 이후 소스 생성 단계가 그대로 이어받아 쓰는 원본 자료이므로 요약하지 말고 완전한
    문서로 작성하십시오.

    입력 문장 끝에 "[승인] ..." 같은 대괄호 표시가 덧붙어 있을 수 있습니다 - 이는 워크플로우의
    승인 이력이 자동으로 덧붙는 것일 뿐이므로 명세 내용으로 취급하지 말고 참고만 하십시오.
  toolsEnabled: false
  ragEnabled: false # 5절 참고 - 표준 문서 적재 후 true로 전환 예정
  # allowedCallers를 비워두는 이유는 testApp-analysis-agent.yml과 동일함(인증이 꺼져 있는 동안은
  # 비워둬야 함).

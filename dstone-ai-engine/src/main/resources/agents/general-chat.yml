# Agent 하나를 정의한다. 파일명이 곧 agent 이름(ID)이다 - 파일명과 agent.name이 다르면 로딩 시 헷갈리니 반드시 맞춘다.
# 프롬프트는 이 파일 안에 직접 적는다 - agent 하나의 정의(설명/프롬프트/RAG여부/툴여부)가 파일 하나로 완결된다.
#
# 이름/{role} 프롬프트 토큰/toolsEnabled=true/ragEnabled=false는 그대로 유지해야 한다 - dstone-boot의
# ai/service/ChatService.java가 AGENT="general-chat"을 하드코딩하고 있고, 채팅 화면에서 RAG/Tool을
# 요청별로 켜고 끄는(ChatRequest.ragEnabled()/toolsEnabled() override) 것도 이 Agent 기본값(toolsEnabled
# 켜짐/ragEnabled 꺼짐)을 전제로 한다. 이름이나 {role} 토큰을 바꾸면 기존 채팅 화면이 깨진다.
agent:
  name: general-chat
  description: 일반 대화용 기본 Agent. dstone-boot 채팅 화면이 사용한다.
  prompt: |
    당신은 {role} 역할을 맡은 AI 어시스턴트입니다.
    답변은 항상 한국어로, 간결하게 합니다.
  toolsEnabled: true
  ragEnabled: false

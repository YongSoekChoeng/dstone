# common.registry.AgentRegistry가 기동 시 이 파일을 읽어 이름으로 등록한다.
# promptName은 src/main/resources/prompts/{promptName}/{version}.st와 매칭된다.
agents:

  - name: general-chat
    promptName: sample-system
    toolsEnabled: true
    ragEnabled: false

  - name: sql-analysis-agent
    promptName: oracle-sql-analyzer
    toolsEnabled: false
    ragEnabled: false

  - name: sql-conversion-agent
    promptName: oracle-sql-converter
    toolsEnabled: false
    ragEnabled: false

  - name: sql-fix-agent
    promptName: oracle-sql-reviewer
    toolsEnabled: true
    ragEnabled: false

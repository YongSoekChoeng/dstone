# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 id가 됩니다.
#
# workflows/testApp/testApp-sdlc.yml의 analyze step 전용 Agent입니다. 현업의 요청사항 원문(자유
# 텍스트)을 입력받아 "분석/설계 초안"을 작성합니다 - 8단계 SDLC 워크플로우의 2단계(AI 분석/설계)에
# 해당합니다.
#
# structuredOutput은 쓰지 않습니다(자유 텍스트 응답) - 처음에는 분석 초안을 primaryText/data(JSON)로
# 받게 만들었으나, 뒤에 오는 어떤 TOOL step도 이 Agent의 data를 {analyze.키} 형태로 참조하지 않아서
# (구조화된 값이 실제로 필요한 곳이 없음) 굳이 JSON으로 강제할 이유가 없었다. 오히려 이 Agent가 만드는
# 문서는 길고 마크다운 서식(헤더, 목록, 예시 코드블록)이 많아서, 그 전체를 JSON 문자열 값 하나로
# 올바르게 이스케이프해서 담으라고 강제했더니 실제로 LLM이 이스케이프를 놓쳐 JSON이 깨지는 경우가
# 재현됐다(예: "Unexpected character ('`')..." 파싱 실패). 자유 텍스트로 바꾸면 이런 파싱 실패
# 자체가 있을 수 없다 - AGENT step은 structuredOutput이 아니면 항상 성공으로 취급된다.
agent:
  id: testApp-analysis-agent
  description: 요청사항 원문 -> 분석/설계 초안 작성(testApp-sdlc 2단계).
  prompt: |
    당신은 소프트웨어 개발 프로젝트의 시니어 분석/설계 담당자입니다. 입력으로 현업(업무 담당자)이
    작성한 개발 요청사항 원문을 받습니다.

    다음 내용을 포함하는 "분석/설계서" 초안을 한국어로 작성해서 그대로 답변하십시오(별도 형식 없이
    이 응답 전체가 곧 분석/설계서입니다):
    1. 요청 배경/목적 요약
    2. 현재 상태(As-Is) 추정과 변경이 필요한 이유
    3. 제안 설계(To-Be) - 화면/API/데이터/배치 등 영향받는 영역별로 구분
    4. 예상 영향 범위(연관 화면, 테이블, 배치, 외부 연동)
    5. 확인이 필요한 질문(요청사항만으로 판단하기 어려운 부분이 있다면)

    이 응답은 이후 개발명세서 작성 단계가 그대로 이어받아 쓰는 원본 자료이므로, 요약하지 말고 위
    5개 항목을 갖춘 완전한 문서로 작성하십시오.

    입력 문장 끝에 "[승인] ..." 또는 "[반려] ..." 같은 대괄호 표시가 덧붙어 있을 수 있습니다 -
    이는 이 워크플로우의 승인 이력이 자동으로 덧붙는 것일 뿐이므로, 분석 대상 요청사항으로 취급하지
    말고 참고만 하십시오.
  toolsEnabled: false
  # ragEnabled는 착수 후 testApp 프로젝트의 개발표준/기존 설계문서를 실제로 적재한 뒤 true로 전환한다
  # (docs/temp/dongyang-plan.md 5절 참고) - 지금은 아직 적재된 문서가 없으므로 false로 둔다.
  ragEnabled: false
  # allowedCallers를 비워둔다: 지금 이 엔진은 dstone.ai.security.auth.enabled=false(인증 꺼짐)라서
  # caller가 항상 null로 들어오는데, allowedCallers를 채워두면 AgentRegistry.resolve()가 "caller가
  # null이면 무조건 거부"로 판단해 이 Agent 자체를 영원히 호출할 수 없게 만들어 버린다(자기 자신을
  # 걸어 잠그는 설정이 된다). 나중에 caller별 API Key 인증을 켤 때 같이 채워 넣을 것.

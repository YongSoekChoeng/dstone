agent:
  id: testApp-agent-02
  description: 2단계 agent 분석/설계서 리뷰.
  prompt: |
    당신은 소프트웨어 개발 프로젝트의 리뷰어입니다. 
    입력으로 분석/설계 담당자가 작성한 분석/설계서를 받습니다.

    분석/설계서의 내용을 확인하고 리뷰를 작성합니다.
    리뷰의 결과는 진행난이도, 투입인력, 진행예상기간 등을 포함한 종합의견 입니다.
    최대한 상세한 의견을 내되 향후 계획이 포함되어야 합니다.
  input: 
    schema: 
      type: object
      properties:
        1. 요청 배경/목적 요약: list<string>
        2. 현재 상태(As-Is): list<string>
        3. 제안 설계(To-Be): list<string>
        4. 예상 영향 범위: list<string>
        5. 확인이 필요한 질문: list<string>
      required: [1. 요청 배경/목적 요약, 2. 현재 상태(As-Is), 3. 제안 설계(To-Be)]  
  output: string
  toolsEnabled: false
  ragEnabled: false
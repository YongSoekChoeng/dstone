# Agent 하나를 정의한다. 파일명이 곧 agent 이름(ID)이다.
#
# onFailure 루프 전용 Agent 예시다. workflows/loop-retry-until-valid.yml에서 TOOL
# step(validateSqlSyntax)이 실패하면 이 Agent로 왔다가 다시 TOOL step으로 되돌아간다({previous}
# 토큰에는 validateSqlSyntax가 남긴 실패 사유 텍스트가 그대로 들어온다 - runtime.status.StepOutput.failure()
# 참고). 몇 번을 되돌아가도 고치지 못하면 WorkFlowDefinition.maxIterations가 전체 실행을 강제 종료시킨다.
agent:
  name: fix-agent
  description: onFailure 루프 전용 - 이전 TOOL step(validateSqlSyntax)이 남긴 문법 오류 사유를 보고 SQL을 고친다.
  prompt: |
    입력으로 "직전에 검증에 실패한 SQL 문법 오류 사유" 텍스트를 받습니다. 그 사유를 근거로 원래
    의도를 최대한 살려 문법상 올바른 단일 SQL 문 하나로 고쳐서, 그 SQL 문만 출력하십시오(설명,
    인사말, 마크다운 코드펜스는 출력하지 마십시오). 원문 SQL을 알 수 없으면 "SELECT 1"을 출력하십시오.
  toolsEnabled: false
  ragEnabled: false

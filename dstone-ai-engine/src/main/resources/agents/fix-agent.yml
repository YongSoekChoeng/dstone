# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 이름(ID)이 됩니다.
#
# 이 Agent는 "실패하면 되돌아가서 다시 시도하는 흐름(onFailure 루프)"을 보여주기 위한 예시입니다.
# workflows/loop-retry-until-valid.yml에서 이렇게 쓰입니다: 먼저 TOOL step(validateSqlSyntax)이
# SQL 문법을 검사하는데, 만약 문법이 틀려서 검사에 실패하면 이 fix-agent로 넘어옵니다. 이때
# {previous} 토큰 자리에는 validateSqlSyntax가 남긴 "왜 실패했는지"에 대한 설명 텍스트가 그대로
# 들어옵니다(runtime.status.StepOutput.failure() 참고). fix-agent는 그 설명을 보고 SQL을 고친
# 뒤, 다시 TOOL step으로 돌아가 검사를 받습니다.
#
# 이 과정을 몇 번이고 반복할 수 있지만, WorkFlowDefinition.maxIterations에 정해둔 횟수를 넘어서면
# Workflow 전체가 강제로 종료됩니다 - 고치고 검사하는 루프가 끝없이 돌지 않도록 막아주는 안전장치입니다.
agent:
  name: fix-agent
  description: onFailure 루프 전용 - 이전 TOOL step(validateSqlSyntax)이 남긴 문법 오류 사유를 보고 SQL을 고친다.
  prompt: |
    입력으로 "직전에 검증에 실패한 SQL 문법 오류 사유" 텍스트를 받습니다. 그 사유를 근거로 원래
    의도를 최대한 살려 문법상 올바른 단일 SQL 문 하나로 고쳐서, 그 SQL 문만 출력하십시오(설명,
    인사말, 마크다운 코드펜스는 출력하지 마십시오). 원문 SQL을 알 수 없으면 "SELECT 1"을 출력하십시오.
  toolsEnabled: false
  ragEnabled: false

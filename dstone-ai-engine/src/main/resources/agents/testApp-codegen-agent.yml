# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 이름(ID)이 됩니다.
#
# workflows/testApp/testApp-sdlc.yml의 generate-code step 전용 Agent입니다. PL이 승인한
# 개발명세서(입력)를 받아 "기본 소스 초안"을 생성합니다 - 8단계 SDLC 워크플로우의 5단계(AI 기본
# 소스 생성)에 해당합니다.
#
# structuredOutput은 쓰지 않습니다 - testApp-analysis-agent.yml과 같은 이유이되, 이 Agent가 특히
# 더 위험하다: 실제 Java 소스 코드(따옴표/역슬래시/줄바꿈이 잔뜩 섞인) 여러 개를 하나의 JSON 문자열
# 값으로 완벽하게 이스케이프해서 담으라고 강제하는 것 자체가 파싱 실패를 부르기 쉽다. 자유 텍스트로
# 응답하면 이런 이스케이프 문제 자체가 생기지 않는다 - 코드는 그냥 평범한 마크다운 코드펜스로
# 감싸서 사람이 읽거나 복사해 쓰기 좋게 쓰면 된다.
#
# 지금 엔진에는 LLM이 만든 코드를 실제 파일/Git 브랜치에 자동으로 쓰는 Tool이 없다(신뢰할 수 없는
# 자동 커밋은 보안 검토 없이 넣지 않기로 함 - docs/temp/dongyang-plan.md 6절 참고). 그래서 1차
# 버전은 "코드 산출물을 텍스트로 만들어 사람이 검토·적용"하는 안전한 방식으로 동작한다 - 이 Agent가
# 만든 결과물은 dev-submit/code-review 승인 절차를 거친 뒤에도 여전히 텍스트일 뿐이며, 개발자가
# 그 내용을 직접 프로젝트(예: testApp)에 반영해야 한다.
agent:
  name: testApp-codegen-agent
  description: 승인된 개발명세서 -> 기본 소스 초안 생성(testApp-sdlc 5단계). 실제 파일 반영은 개발자가 직접 한다.
  prompt: |
    당신은 Java/Spring 백엔드 개발자입니다. 입력으로 이미 검토를 통과한 개발명세서를 받습니다.

    이 명세서를 그대로 구현하는 기본 소스 초안을 작성해서 그대로 답변하십시오(별도 형식 없이 이
    응답 전체가 곧 소스 초안입니다). 다음 형식을 지키십시오:
    1. 파일마다 "### 파일: <상대경로>" 제목을 붙이고, 그 아래에 ```java (또는 해당 언어) 코드
       펜스로 전체 파일 내용을 담으십시오. 파일이 여러 개면 이 형식을 파일 수만큼 반복하십시오.
    2. 각 파일 코드 앞에, 그 파일이 명세서의 어느 항목을 구현한 것인지 한 줄로 적으십시오.
    3. 마지막에 "### 개발자 확인 필요" 항목으로, 자동 생성만으로는 확신할 수 없어 사람이 반드시
       검토해야 하는 부분(예: 기존 코드와의 통합 지점, 트랜잭션 경계, 권한 체크)을 목록으로
       정리하십시오.
    4. 이 초안은 실제 프로젝트에 자동으로 반영되지 않습니다 - 코드를 만들어낼 뿐, 파일 시스템이나
       Git에 접근하지 마십시오(애초에 그럴 수단이 주어지지 않습니다).

    입력 문장 끝에 "[승인] ..." 같은 대괄호 표시가 덧붙어 있을 수 있습니다 - 이는 워크플로우의
    승인 이력이 자동으로 덧붙는 것일 뿐이므로 명세 내용으로 취급하지 말고 참고만 하십시오.
  toolsEnabled: false
  ragEnabled: false # 5절 참고 - 표준/기존 소스 문서 적재 후 true로 전환 예정
  # allowedCallers를 비워두는 이유는 testApp-analysis-agent.yml과 동일함(인증이 꺼져 있는 동안은
  # 비워둬야 함).

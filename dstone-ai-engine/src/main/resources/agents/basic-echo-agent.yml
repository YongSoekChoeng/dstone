# Agent 하나를 정의한다. 파일명이 곧 agent 이름(ID)이다.
#
# AGENT step 자체의 가장 기본적인 동작("Workflow가 Agent 하나를 호출해서 응답을 그대로 다음/최종
# 결과로 흘려보낸다")만 확인하기 위한 전용 Agent다. workflows/agent-basic-echo.yml이 이 Agent를 쓴다.
# 프롬프트에 템플릿 토큰을 하나도 쓰지 않으므로 variables 없이 message만 보내도 항상 렌더링이
# 성공하고, toolsEnabled=false라 tool-calling과도 얽히지 않는다 - "AGENT step 하나 호출"이라는
# 최소 동작만 확인하고 싶을 때 쓴다(tool-calling 자체는 agents/tool-demo-agent.yml +
# workflows/agent-tool-calling.yml이 따로 다룬다).
agent:
  name: basic-echo-agent
  description: AGENT step 자체의 기본 동작 확인 전용 - 프롬프트 템플릿 변수도, Tool도 전혀 쓰지 않는다.
  prompt: |
    당신은 짧고 명확하게 한국어로 답하는 AI 어시스턴트입니다.
  toolsEnabled: true
  ragEnabled: false

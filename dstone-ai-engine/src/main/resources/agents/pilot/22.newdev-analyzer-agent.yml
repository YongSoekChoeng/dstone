# 신규 개발 경로에서 요구사항 정의와 구성 정의(무엇을 새로 만들고 무엇을 고칠지)를 한 번의 호출로 끝내는 Agent입니다.
#
# Tool이 없습니다. 참고 구현의 파일 내용은 Workflow가 미리 읽어서 input.sources로 넣어 줍니다(newPack step).
# 그래서 LLM 호출은 한 번입니다. 예전에는 요구사항 Agent와 영향도 Agent가 각각 Tool 루프를 돌며 같은 파일을 열었습니다.
#
# 문서를 쓰지 않습니다. 구조화된 데이터(output)만 내고, 01-requirements.md / 02-impact.md는 Workflow의 TOOL step이
# 그 데이터를 틀에 맞춰 만듭니다. 긴 문서를 writeFile 인자로 쓰면 그것도 출력 토큰이라 한도(max-tokens)에 걸렸습니다.
# 그래서 이 prompt에는 [긴 문서 저장], [파일 Tool 사용 규칙], [조회 한도]가 없습니다.
#
# [완료조건]도 없습니다. "FR마다 변경 대상이 있는가", "수정할 파일이 실제로 있는가" 같은 것은 Workflow가 코드로 확인하고
# (newExist, newCheck step), 걸린 것만 feedback으로 돌려줍니다.
#
# prompt 안에 중괄호를 쓰지 않습니다. 중괄호는 엔진이 input 필드로 채우는 변수 자리라서, input에 없는 이름이면 호출이 실패합니다.
agent:
  id: pilot-newdev-analyzer-agent
  description: 신규 개발 - 요구사항과 구성(층별로 신규/수정/필요 없음, 변경 대상 파일)을 한 번에 정의한다. 문서가 아니라 데이터를 낸다.
  prompt: |
    [역할] 너는 고객의 업무를 이해하는 애플리케이션 아키텍트다. 새로 만들 기능의 요구사항을 정의하고,
      참고 구현을 층별로 짚어 무엇을 새로 만들고 무엇을 고쳐야 하는지 정한다. 코드는 쓰지 않는다.
    [컨텍스트]
    - request: 고객의 요청서.
    - reference: 앞 단계가 고른 참고 구현(기능 이름, 흐름, 파일 목록).
    - sources: 참고 구현의 파일 내용. "===== 파일: 절대경로 =====" 줄 아래가 그 파일의 내용이다. 네가 볼 수 있는 소스는 이것이 전부다.
    - feedback: 비어 있지 않으면 다시 작성하라는 요청이다. 자동 검증에 걸린 것과 승인자의 의견이 들어 있다.
      지적받은 것만 고치고, 지적받지 않은 것은 앞서 낸 결과와 같게 유지하라.
    [판단 기준: 요구사항]
    - 요청서에 적힌 메뉴/기능을 하나도 빼지 말고 scope에 담고, 메뉴/기능마다 FR을 하나 이상 만든다. FR 번호는 FR-01부터 붙인다.
    - 인수 조건(given / when / then)은 사용자가 화면에서 확인할 수 있는 결과로 적는다. 어느 파일을 어떻게 만든다는 말은 적지 않는다.
    - 요청에 없는 내용을 가정으로 채우지 마라. 사람만 답할 수 있는 것(업무 규칙, 우선순위, 범위)은 questions에 담는다.
    [판단 기준: 구성]
    - 참고 구현이 가진 층을 하나씩 짚는다: 화면, Controller, Service, DAO, VO, 쿼리 파일, 테이블, 메뉴 등록, 설정 등록.
      층마다 새 기능에 필요한지 정하고 layers에 담는다(신규 / 수정 / 필요 없음과 그 이유).
    - 신규: 새 파일을 만든다. 경로와 이름은 참고 구현의 폴더와 이름 규칙을 그대로 따라 정한다.
    - 수정: 이미 있는 파일에 덧붙이거나 고친다. 테이블 생성 스크립트와 메뉴 등록 데이터처럼 여러 기능이 한 파일을 함께 쓰면 수정이다.
    - 필요 없음: 쿼리 파일을 읽어 들이는 설정이 파일 이름 패턴으로 되어 있으면 등록할 것이 없다. 그 사실을 이유에 적는다.
    - 신규나 수정으로 정한 층마다 targets에 변경 대상 파일을 하나씩 담는다. 같은 파일을 두 번 담지 마라.
    - 요청서가 빼라고 한 것(예: 수정/삭제 기능)이 참고 구현의 어느 메서드, 쿼리, 화면 요소에 해당하는지 짚어 그 파일의 change에 적는다.
    - 수정 대상의 path와 모든 referencePath는 sources의 "===== 파일:" 줄에 적힌 경로를 글자 그대로 옮겨 적는다.
      sources에 없는 파일을 고쳐야 한다고 판단되면 targets에 넣지 말고 questions에 적어라(내용을 보지 못한 파일은 설계할 수 없다).
    - sources에서 확인한 것만 사실로 적는다. "가능성이 높다", "추정된다", "검토 필요" 같은 말로 사실을 대신하지 마라.
    - change에는 무엇을 어떻게 만들거나 바꾸는지 하나로 정해서 적는다. "A 하거나 B 한다"처럼 고르지 않은 채로 적지 마라.
    - 요구사항에 없는 개선(리팩터링, 성능 개선)을 넣지 마라.
    - 여러 파일이 함께 쓰는 이름은 여기서 정해 sharedNames에 담는다: 새 테이블 이름, URL, 쿼리 namespace와 쿼리ID,
      패키지, 클래스 이름, 메서드 이름, 화면 파일 이름. 다음 단계는 파일마다 따로 설계하므로, 여기에 없는 이름은 파일마다 다르게 지어질 수 있다.
      새 테이블의 컬럼은 하나도 빼지 말고 컬럼마다 한 건씩 담는다(what은 컬럼, 참고 구현의 컬럼을 그대로 쓰는 것도 담는다).
      화면, 쿼리, VO, 테이블 생성문이 모두 이 컬럼 목록을 따른다.
      이름은 참고 구현의 이름 규칙을 따른다. 사람이 정해야 하는 것(컬럼을 더 둘지 등)은 하나로 정해 적고 questions에도 담는다.
  input:
    schema:
      type: object
      properties:
        request:   { type: string, description: 요청서(00-request.md)의 내용 }
        reference: { type: object, description: 참고 구현(pilot-newdev-reference-agent의 결과) }
        sources:   { type: string, description: 참고 구현 파일들의 내용 }
        feedback:  { type: string, description: 다시 작성할 때 반영할 지적 사항. 처음이면 빈 글자 }
      required: [request, sources]
  output:
    schema:
      type: object
      properties:
        background:
          type: string
          description: 배경과 목적(3줄 이내)
        scope:
          type: array
          description: 요청서에 적힌 메뉴/기능. 하나도 빼지 않는다
          items:
            type: object
            properties:
              item: { type: string, description: 요청서의 메뉴/기능 }
              frs:  { type: array, items: { type: string }, description: 이 메뉴/기능을 다루는 FR 번호 }
            required: [item, frs]
        requirements:
          type: array
          description: 기능 요구사항
          items:
            type: object
            properties:
              id:    { type: string, description: "FR 번호. FR-01, FR-02 ..." }
              title: { type: string, description: 요구사항 한 줄 }
              given: { type: string, description: 인수 조건의 전제 }
              when:  { type: string, description: 인수 조건의 사용자 행동 }
              then:  { type: string, description: 인수 조건의 기대 결과(화면에서 확인할 수 있는 것) }
            required: [id, title, then]
        nonFunctional:
          type: array
          items: { type: string }
          description: 비기능 요구사항(없으면 빈 배열)
        outOfScope:
          type: array
          items: { type: string }
          description: 범위 제외 항목(없으면 빈 배열)
        layers:
          type: array
          description: 참고 구현의 층별 판단
          items:
            type: object
            properties:
              layer:         { type: string, description: "화면 / Controller / Service / DAO / VO / 쿼리 파일 / 테이블 / 메뉴 등록 / 설정 등록" }
              referencePath: { type: string, description: 참고 구현에서 이 층에 해당하는 파일의 절대경로 }
              symbol:        { type: string, description: "참고 구현의 클래스.메서드, 쿼리ID, 테이블명" }
              decision:      { type: string, enum: [신규, 수정, 필요 없음] }
              reason:        { type: string, description: 그렇게 정한 이유 한 줄 }
            required: [layer, decision]
        targets:
          type: array
          description: 변경 대상 파일. 파일 하나에 한 건
          items:
            type: object
            properties:
              path:          { type: string, description: 만들거나 고칠 파일의 절대경로 }
              changeType:    { type: string, enum: [신규, 수정] }
              referencePath: { type: string, description: 신규 파일이 본뜰 참고 파일의 절대경로. 본뜰 파일이 없으면 빈 글자 }
              change:        { type: string, description: "무엇을 만들거나 바꾸는지. 참고 구현과 달라지는 점(바뀌는 이름, 빼는 메서드/쿼리/화면 요소)을 함께 적는다" }
              frs:           { type: array, items: { type: string }, description: 이 변경이 해결하는 FR 번호 }
            required: [path, changeType, change, frs]
        sharedNames:
          type: array
          description: 여러 파일이 함께 쓰는 이름. 파일별 설계가 이 이름을 그대로 쓴다
          items:
            type: object
            properties:
              what:  { type: string, description: "무엇의 이름인지(테이블, 컬럼, URL, 쿼리 namespace, 쿼리ID, 패키지, 클래스, 메서드, 화면 파일)" }
              name:  { type: string, description: 새 기능에서 쓸 이름 }
              from:  { type: string, description: 참고 구현에서 이에 해당하는 이름. 없으면 빈 글자 }
            required: [what, name]
        impacts:
          type: array
          items: { type: string }
          description: "영향 받는 기존 기능, 호출자, DB 객체(없으면 빈 배열)"
        risks:
          type: array
          items: { type: string }
          description: 위험 요소와 회귀 테스트가 필요한 기존 기능(없으면 빈 배열)
        questions:
          type: array
          items: { type: string }
          description: 사람만 답할 수 있는 질문(없으면 빈 배열)
      required: [scope, requirements, layers, targets, sharedNames]
  # 추론을 껐다. 재 본 것(2026-10-08, OpenRouter qwen/qwen3.8-27b, testApp의 "FAQ 신규" 요청, 입력 3만 2천 자):
  # 기본 동작은 응답 제한 5분을 넘겨 실패했고(Error reading response ... timeout), none은 66초에 끝났으며 그 결과는 자동 검증에서
  # "문제 없음"이었다. 조사는 앞 단계가 끝냈고 여기서는 주어진 내용을 정해진 모양으로 옮기는 일이라 추론 없이도 됐다.
  # 이 모델은 low/medium이 듣지 않고 none만 듣는다(conf/application.yml의 max-tokens 주석). 다른 모델로 바꾸면 다시 재 본다.
  reasoning: none
  ragEnabled: false

# 신규 개발 경로의 설계 Agent입니다. 파일 하나의 설계만 합니다.
# Workflow의 forEach step(newDesign)이 변경 대상 파일마다 새 대화로 한 번씩 부릅니다.
# 요청이 커지면 호출 수가 늘 뿐, 한 번의 호출이 다루는 크기는 그대로입니다(예전에는 요청이 커지면 한 대화가 커졌습니다).
#
# Tool이 없습니다. 본뜰 참고 파일의 내용(referenceSource)과 고칠 파일의 지금 내용(currentSource)은 Workflow가 넣어 줍니다.
#
# 문서를 쓰지 않습니다. 파일 하나의 설계를 데이터로 내고, 04-design.md는 Workflow의 TOOL step이 그 데이터를 모아 만듭니다.
# "변경 전이 실제 파일에 있는가"도 Workflow가 코드로 확인합니다(newDesignCheck step). 그래서 [완료조건]이 없습니다.
#
# 새 파일의 전체 내용을 적지 않게 한 이유는 그대로입니다. 전체를 적으면 설계가 길어지고 개발 Agent가 같은 내용을 한 번 더 씁니다.
# 그래서 "참고 파일 + 달라지는 점 + 본뜰 수 없는 내용"만 받습니다.
agent:
  id: pilot-newdev-file-designer-agent
  description: 신규 개발 - 변경 대상 파일 하나의 설계를 데이터로 낸다(신규는 이름 바꿈/빼는 것/더하는 것, 수정은 변경 전/변경 후).
  prompt: |
    [역할] 너는 이 시스템의 애플리케이션 아키텍트다. 파일 하나에 대해, 개발자가 그대로 따라 구현할 수 있는 설계를 낸다. 코드를 고치지 않는다.
    [컨텍스트]
    - target: 이번에 설계할 파일 하나(경로, 신규/수정, 무엇을 만들거나 바꾸는지, 해결하는 FR).
    - plan: 이번 요청의 변경 대상 파일 전체와 그 파일들이 함께 쓰는 이름(sharedNames). 다른 파일은 다른 호출이 따로 설계한다.
    - requirements: 기능 요구사항 전체. target이 해결하는 FR의 인수 조건을 여기서 확인한다.
    - referenceSource: 신규 파일이 본뜰 참고 파일의 내용. 비어 있으면 본뜰 파일이 없다는 뜻이다.
    - currentSource: 수정할 파일의 지금 내용. 신규 파일이면 비어 있다.
    - request: 고객의 요청서.
    - feedback: 비어 있지 않으면 다시 설계하라는 요청이다. 여러 파일의 지적이 함께 들어 있으니, 이 파일(target의 경로)에 대한 것만 반영하라.
    [판단 기준: 신규 파일] target의 changeType이 신규일 때. 파일 전체를 적지 마라. 아래 세 가지만 낸다.
    - renames: 참고 파일의 이름 가운데 새 파일에서 바뀌는 것을 빠짐없이 "참고 → 신규"로 적는다
      (패키지, 클래스, 메서드, URL, 쿼리ID, 쿼리 namespace, 테이블, 컬럼, 화면 제목, 파일 안에서 가리키는 다른 파일의 이름).
      개발 단계는 이 표대로 글자를 바꾼다. 다른 이름의 일부로 들어 있는 짧은 글자를 from에 적으면 엉뚱한 곳까지 바뀌므로, 바뀔 곳에만 들어맞게 길게 적어라.
      from은 낱말 단위가 아니라 파일의 모든 곳에서 글자 그대로 바뀐다. title, name, content, id처럼 다른 뜻으로도 쓰이는 낱말을 혼자 적지 마라
      (컬럼 title을 바꾸려고 title을 적으면 화면 부품의 title 속성까지 바뀐다). 그런 이름은 따옴표나 앞뒤 글자까지 붙여서 그 뜻으로 쓰인 곳에만 들어맞게 적어라.
    - removes: 참고 파일에서 빼는 것(메서드, 쿼리, 버튼이나 입력란 같은 화면 요소). 무엇인지 이름으로 짚어 적는다.
    - adds: 참고 파일에서 가져올 수 없어서 글자 그대로 넣어야 하는 내용(새로 쓰는 쿼리, 새 컬럼의 처리 등)과 넣을 자리.
    - 여기에 적지 않은 부분은 참고 파일과 똑같이 만들어진다. 본뜰 파일이 없으면 adds에 파일 전체 내용을 적는다.
    [판단 기준: 수정 파일] target의 changeType이 수정일 때. edits에 바꿀 곳을 하나씩 낸다.
    - before는 currentSource에서 글자 그대로 옮긴다(들여쓰기와 줄바꿈까지). 기억이나 추정으로 적지 마라.
      그 파일에서 정확히 한 곳에만 들어맞도록, 필요하면 앞뒤 줄을 포함해 넉넉히 잡는다. 다만 20줄을 넘기지 마라.
    - after는 before를 바꾼 모습 전체다. 사이에 줄을 끼워 넣는 변경이면 before의 줄들을 그대로 두고 그 사이에 새 줄을 넣어 적는다.
    - 파일 끝에 덧붙이는 변경(예: 스크립트 파일 끝에 테이블 생성문 추가)은 append를 true로 하고 before는 비우고 after에 덧붙일 내용을 적는다.
    - currentSource 끝에 "앞 N자만 반환했습니다" 안내가 있으면 파일 전체를 본 것이 아니다. 이때는 파일 끝에 덧붙이는 변경만 낼 수 있다.
      보이지 않는 부분을 고쳐야 하면 edits에 넣지 말고 questions에 적어라.
    [판단 기준: 공통]
    - 다른 파일과 맞물리는 이름(테이블, 컬럼, URL, 쿼리 namespace, 쿼리ID, 패키지, 클래스, 메서드, 화면 파일)은 plan의 sharedNames에 적힌 것을 글자 그대로 쓴다.
      거기에 없는 이름을 새로 지어내지 마라. 꼭 필요한데 없으면 참고 구현의 이름을 그대로 두고 questions에 적어라.
    - 망설임이나 검토 과정을 결과에 적지 마라. 정한 것만 적는다. 바뀌지 않는 이름은 renames에 넣지 마라.
    - 기존 소스의 이름 규칙, 들여쓰기, 주석 방식을 따른다. 요구사항에 없는 개선(리팩터링, 이름 정리)을 넣지 마라.
    - 요청서가 직접 요구한 테이블 신설은 설계에 넣는다. 컬럼은 참고 구현의 테이블을 따르고, 사람이 정해야 하는 것(더 필요한 컬럼 등)만 questions에 담는다.
    - 새 라이브러리 도입처럼 요청에 없는 구조 변경은 확정하지 말고 questions에 담아라.
    - verify에는 이 파일의 변경이 맞게 들어갔는지 확인하는 방법을 "그렇다/아니다"로 답할 수 있게 적는다.
  input:
    schema:
      type: object
      properties:
        request:         { type: string, description: 요청서(00-request.md)의 내용 }
        requirements:    { type: array, description: 기능 요구사항 전체 }
        target:          { type: object, description: 이번에 설계할 변경 대상 파일 하나 }
        plan:            { type: object, description: 변경 대상 파일 전체(targets)와 함께 쓰는 이름(sharedNames) }
        referenceSource: { type: string, description: 본뜰 참고 파일의 내용. 없으면 빈 글자 }
        currentSource:   { type: string, description: 수정할 파일의 지금 내용. 신규 파일이면 빈 글자 }
        feedback:        { type: string, description: 다시 설계할 때 반영할 지적 사항. 처음이면 빈 글자 }
      required: [target]
  output:
    schema:
      type: object
      properties:
        path:
          type: string
          description: 설계한 파일의 절대경로. target의 path를 그대로 적는다
        changeType:
          type: string
          enum: [신규, 수정]
        referencePath:
          type: string
          description: 본뜰 참고 파일의 절대경로. target의 referencePath를 그대로 적는다. 없으면 빈 글자
        summary:
          type: string
          description: 이 파일에서 하는 일 한두 줄
        renames:
          type: array
          description: 신규 파일 - 참고 파일에서 바뀌는 이름
          items:
            type: object
            properties:
              from: { type: string, description: 참고 파일에 있는 글자 }
              to:   { type: string, description: 새 파일에서 쓸 글자 }
              what: { type: string, description: "무엇의 이름인지(클래스, 메서드, URL, 쿼리ID, 테이블 등)" }
            required: [from, to]
        removes:
          type: array
          items: { type: string }
          description: 신규 파일 - 참고 파일에서 빼는 것
        adds:
          type: array
          description: 신규 파일 - 참고 파일에 없어서 글자 그대로 넣는 내용
          items:
            type: object
            properties:
              where:   { type: string, description: 넣을 자리 }
              content: { type: string, description: 넣을 내용(글자 그대로) }
            required: [where, content]
        edits:
          type: array
          description: 수정 파일 - 바꿀 곳
          items:
            type: object
            properties:
              location: { type: string, description: "위치(쿼리ID, 클래스.메서드, 무엇의 아래)" }
              before:   { type: string, description: 지금 파일에서 글자 그대로 옮긴 변경 전. 파일 끝에 덧붙이면 빈 글자 }
              after:    { type: string, description: 변경 후. 파일 끝에 덧붙이면 덧붙일 내용 }
              append:   { type: boolean, description: 파일 끝에 덧붙이는 변경이면 true }
              reason:   { type: string, description: 이유 한 줄 }
            required: [location, after]
        frs:
          type: array
          items: { type: string }
          description: 이 파일의 변경이 해결하는 FR 번호
        verify:
          type: string
          description: 이 파일의 변경을 확인하는 방법
        questions:
          type: array
          items: { type: string }
          description: 결정이 필요한 사항(없으면 빈 배열)
      required: [path, changeType, summary]
  # 추론을 껐다. 재 본 것(2026-10-08, OpenRouter qwen/qwen3.8-27b): 파일 하나에 10~21초였다.
  # 끄고 보니 결과에 망설임을 적거나 다른 파일과 다른 컬럼 이름을 지어내는 일이 있어서, 이름은 plan의 sharedNames를 따르게 했다.
  reasoning: none
  ragEnabled: false

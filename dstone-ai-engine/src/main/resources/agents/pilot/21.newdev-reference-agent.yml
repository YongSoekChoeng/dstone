# 신규 개발 경로의 첫 Agent입니다. "무엇을 본떠 만들지"(참고 구현)를 고르고, 그 기능을 이루는 파일의 경로만 모읍니다.
#
# 파일 내용은 읽지 않습니다. 이 Agent가 낸 경로 목록(files)을 Workflow의 TOOL step(newPack)이 LLM 없이 한꺼번에 읽어 두고,
# 뒤의 Agent들은 그 내용을 input으로 받습니다. 예전에는 요구사항, 영향도, 리뷰, 설계, 개발 Agent가 참고 구현의 같은 파일을
# 각자 다시 열었습니다(신규 FAQ 요청 한 건에 조회 91번, 20분).
#
# prompt에 [조회 한도]를 적지 않았습니다. 횟수는 엔진이 셉니다(maxToolCalls). 한도가 가까워지면 엔진이 Tool 결과 끝에
# "N번 남았다"고 알려 주고, 다 쓰면 Tool을 실행하지 않습니다.
agent:
  id: pilot-newdev-reference-agent
  description: 신규 개발 - 참고 구현을 고르고 그 파일 경로를 모은다(파일 내용은 읽지 않는다).
  prompt: |
    [역할] 너는 신규 개발 요청에서 "무엇을 본떠 만들지"를 정하는 조사자다.
      참고할 기존 기능(참고 구현) 하나를 고르고, 그 기능을 이루는 파일의 경로를 모은다. 파일 내용은 읽지 않는다. 다음 단계가 한꺼번에 읽는다.
    [컨텍스트]
    - 입력의 request가 고객의 요청서다. 요청서의 '소스경로'가 소스의 루트다. 소스는 이 경로 아래에서만 찾아라.
    - 요청서에 '프로젝트ID'가 있으면 knowledge Tool의 projectId로 그 값을 준다. 없으면 knowledge Tool을 쓰지 말고 searchInFiles로 찾아라.
    - feedback이 비어 있지 않으면 다시 조사하라는 요청이다. 거기 적힌 지적(없는 파일, 빠진 층, 다른 참고 구현)을 반영하라.
    [판단 기준]
    - 참고 구현: 요청서가 "무엇과 유사하게"라고 가리킨 기존 기능이다. 가리킨 것이 없으면 가장 비슷한 기존 기능 하나를 고른다.
    - 찾는 순서: knowledgeSearch에 그 기능의 이름을 적어 한 번 묻고 Controller 메서드 하나를 고른다.
      그 methodId로 knowledgeCallees를 한 번 부르면 Service, DAO, 쿼리ID, 테이블, 화면이 한 번에 나온다.
      거기서 경로가 나오지 않은 파일만 클래스명이나 파일명으로 searchInFiles 해서 찾는다.
    - 함께 찾을 것(searchInFiles): 참고 구현의 테이블 생성문이 든 스크립트(테이블명), 메뉴가 등록된 파일(참고 구현의 URL이나 메뉴명),
      쿼리 파일을 읽어 들이는 설정(쿼리 파일명의 끝부분이나 mapperLocations).
    - 이미 있는지: 새로 만들 기능의 이름(한글이나 영문 하나)으로 searchInFiles를 한 번 해서 같은 기능의 코드가 이미 있는지 본다.
    - files에는 Tool 결과에 나온 실제 파일만 절대경로로 담는다. 경로를 짐작해서 적지 마라.
      Tool이 준 경로가 소스 루트 기준의 상대경로면 소스경로를 앞에 붙이고, 맞는지 확실하지 않으면 isFileExist로 확인하라.
    - 같은 경로를 두 번 담지 마라. 참고 구현과 그 등록에 꼭 필요한 파일만 12개 이내로 담는다.
    - 신뢰도 LOW인 호출 관계는 이름만 보고 짐작한 것이므로 쓰지 마라. Tool이 "실패:"로 답하면 같은 호출을 되풀이하지 말고 searchInFiles로 찾아라.
    - 같은 글자로 두 번 검색하지 마라.
  input:
    schema:
      type: object
      properties:
        request:  { type: string, description: 요청서(00-request.md)의 내용 }
        feedback: { type: string, description: 다시 조사할 때 반영할 지적 사항. 처음이면 빈 글자 }
      required: [request]
  output:
    schema:
      type: object
      properties:
        sourceRoot:
          type: string
          description: 요청서의 소스경로
        featureName:
          type: string
          description: 새로 만들 기능의 이름
        existing:
          type: string
          description: "같은 기능이 이미 있는지 확인한 결과. 무슨 글자로 어디를 찾았고 무엇이 나왔는지"
        referenceName:
          type: string
          description: 참고 구현의 기능 이름
        entry:
          type: string
          description: "참고 구현의 흐름을 한 줄로: 화면 → URL → Controller.메서드 → 쿼리ID → 테이블"
        files:
          type: array
          description: 참고 구현을 이루는 파일과 그 기능이 등록된 파일
          items:
            type: object
            properties:
              layer:
                type: string
                description: "층. 화면 / Controller / Service / DAO / VO / 쿼리 파일 / 테이블 생성 스크립트 / 메뉴 등록 / 설정 등록 가운데 하나"
              path:
                type: string
                description: 파일의 절대경로
              note:
                type: string
                description: "이 파일에서 참고 구현에 해당하는 것(클래스.메서드, 쿼리ID, 테이블명, 등록 줄의 글자)"
            required: [layer, path]
        questions:
          type: array
          items: { type: string }
          description: 사람만 답할 수 있는 질문(없으면 빈 배열)
      required: [sourceRoot, featureName, referenceName, files]
  tools: [knowledgeSearch, knowledgeFindMethods, knowledgeCallees, searchInFiles, readFileListAll, isFileExist]
  # 엔진이 세는 Tool 호출 한도. 정상이면 6~8번(이미 있는지 1, 참고 구현 2, 등록된 곳 3~5)으로 끝난다.
  maxToolCalls: 15
  # reasoning을 적지 않았다(모델 기본 동작). 이 Agent는 Tool 결과를 보고 다음에 무엇을 찾을지 정해야 해서 추론이 필요하다.
  # 재 본 것(2026-10-08, OpenRouter qwen/qwen3.8-27b, testApp의 "FAQ 신규" 요청): 기본 동작은 Tool 7번, 4분 42초에 파일 9개를
  # 빠짐없이 찾았고, none으로 끄니 같은 조회를 되풀이하다 한도 15번을 다 쓰고 실패했다.
  ragEnabled: false

# 신규 개발 경로의 구현 Agent입니다. 복사해 둔 새 파일 하나에서 "빼는 것"과 "더하는 것"을 줄 번호로 정합니다.
# Workflow의 forEach step(newDevelop)이 파일마다 새 대화로 한 번씩 부릅니다.
#
# 이 Agent는 파일을 고치지 않습니다. Tool이 없습니다. "몇 번째 줄부터 몇 번째 줄을 지운다 / 바꾼다 / 뒤에 넣는다"를
# 한 번에 답하고(edits), 그 목록을 Workflow의 newApply step(editFileLines)이 LLM 없이 적용합니다.
#
# 이 Agent가 하지 않는 일 (Workflow의 TOOL step이 LLM 없이 합니다)
# - 참고 파일을 복사하면서 이름 바꿈 표대로 글자를 바꾸는 일: newCopy step(copyFileWithReplace)
# - 복사한 파일을 줄 번호와 함께 읽는 일: newRead step(readFileLines). 그 내용이 source로 들어옵니다.
# - edits를 파일에 적용하는 일: newApply step(editFileLines)
# - 이미 있는 파일을 고치는 일(변경 전 → 변경 후, 파일 끝에 덧붙이기): newEdit / newAppend step(replaceInFile / appendFile)
# - 본뜰 파일이 없는 새 파일을 설계가 적어 준 내용 그대로 저장하는 일: newCreate step(writeFile)
# 그래서 이 Agent는 복사한 새 파일 가운데 빼거나 더할 것이 있는 파일에만 불립니다.
#
# 왜 Tool을 주지 않는가 (2026-10-08에 같은 요청, 같은 파일 6개로 재 본 결과. OpenRouter qwen/qwen3.8-27b)
# - writeFile을 준 때: 파일 전체를 인자로 다시 썼다. 그 인자도 출력 토큰이라 긴 파일은 한도에 걸렸다.
# - replaceInFile을 주고 추론을 끈 때: 같은 호출을 되풀이했다(다 끝내고도 같은 파일을 다시 읽기, 실패한 oldText를 그대로 다시 보내기,
#   import를 지웠다 되살리기). 6개 가운데 3~4개가 Tool 호출 한도 30번을 다 썼다.
# - replaceInFile을 주고 추론을 켠 때: 4개는 됐지만 파일 하나에 4~5분이 걸렸고, 하나는 추론만으로 출력 토큰 한도를 다 썼고, 하나는 7분을 넘겼다.
# 줄 번호로 답하게 하면 옮겨 적을 글자가 없어서 답이 짧고, 주어진 자료를 정리하는 일이라 추론을 꺼도 된다.
agent:
  id: pilot-newdev-file-developer-agent
  description: 신규 개발 - 복사해 둔 새 파일 하나에서 뺄 줄과 넣을 내용을 줄 번호로 정한다.
  prompt: |
    [역할] 너는 이 프로젝트의 시니어 개발자다. 주어진 설계대로 새 파일 하나를 완성하려면 어느 줄을 어떻게 바꿔야 하는지 정한다. 파일은 네가 고치지 않는다. 네가 낸 변경 목록을 Workflow가 적용한다.
    [컨텍스트]
    - design: 이 파일의 설계다. renames(이름 바꿈)는 파일에 이미 적용됐다. 다시 하지 마라.
    - source: 파일의 지금 내용이다. 줄마다 앞에 "줄번호: "가 붙어 있다. 번호와 콜론과 그 뒤의 공백 한 칸은 파일 내용이 아니다.
    [할 일] design의 removes(빼는 것)와 adds(더하는 것)를 source에 적용하는 변경을 edits에 담아라.
    - 지울 때: action은 delete. startLine부터 endLine까지의 줄을 지운다.
      메서드나 쿼리를 지울 때는 그 위의 주석과 어노테이션부터 닫는 줄까지, 그리고 뒤따르는 빈 줄 하나까지 한 구간으로 잡는다.
      지우는 것만 쓰던 import 줄도 지운다. 남는 코드가 쓰는 것(메서드, 필드, import)은 지우지 마라.
    - 바꿀 때: action은 replace. startLine부터 endLine까지의 줄을 newText로 바꾼다. newText에는 바뀐 뒤의 줄 전체를 들여쓰기까지 적는다.
      줄의 일부만 빼거나(목록의 한 항목, 쉼표) 내용을 고칠 때 쓴다. 지운 뒤에 쉼표나 괄호의 짝이 맞는지 살펴라.
    - 넣을 때: action은 insertAfter. startLine 줄의 뒤에 newText를 넣는다(맨 앞에 넣으려면 0). adds의 content는 글자 그대로 쓰고, 들여쓰기는 앞뒤 줄에 맞춘다.
    [줄 번호 규칙] 이것을 어기면 이 파일의 변경은 하나도 적용되지 않는다.
    - 줄 번호는 모두 source에 보이는 번호다. 앞의 변경 때문에 번호가 밀리는 것을 계산하지 마라. Workflow가 계산한다.
    - startText에는 startLine 줄의 내용을, endText에는 endLine 줄의 내용을 source에서 그대로 옮겨 적어라(줄번호는 빼고). Workflow가 이것으로 번호를 확인한다.
    - 구간끼리 겹치면 안 된다. 붙어 있는 줄들을 지울 때는 한 구간으로 합쳐라.
      한 줄은 한 항목에만 들어간다. 어떤 줄을 고치면서 그 이웃 줄을 지울 때는 delete와 replace로 나누지 말고, 그 줄들을 모두 덮는 replace 하나로 적어라.
    - newText에 줄번호를 넣지 마라.
    [제약]
    - 설계에 적히지 않은 부분은 건드리지 않는다. 빈 줄이나 들여쓰기를 다듬는 변경을 넣지 마라.
    - 설계에 없는 개선(리팩터링, 이름 변경, 정리)을 넣지 마라.
    - 설계대로 할 수 없는 항목은 edits에 넣지 말고 questions에 이유를 적어라.
    [답변]
    - edits에는 변경 목록을 담는다. 바꿀 것이 없으면 빈 배열이다.
    - summary에는 뺀 것과 더한 것을 3줄 이내로 적는다. 컴파일과 실행은 해 보지 않았으므로 했다고 적지 마라.
    - questions에는 결정이 필요한 사항과 하지 못한 항목의 이유를 담는다(없으면 빈 배열).
  input:
    schema:
      type: object
      properties:
        design: { type: object, description: 이 파일의 설계(pilot-newdev-file-designer-agent의 결과 한 건) }
        source: { type: string, description: "복사한 파일의 지금 내용. 줄마다 '줄번호: 내용' 모양이다" }
      required: [design, source]
  output:
    schema:
      type: object
      properties:
        edits:
          type: array
          description: 줄 번호로 적은 변경 목록(없으면 빈 배열)
          items:
            type: object
            properties:
              action:    { type: string, enum: [delete, replace, insertAfter] }
              startLine: { type: integer, description: "시작 줄 번호. insertAfter면 이 줄의 뒤에 넣는다(맨 앞은 0)" }
              endLine:   { type: integer, description: 끝 줄 번호(이 줄 포함). insertAfter에는 적지 않는다 }
              startText: { type: string, description: startLine 줄의 내용(source에서 그대로. 줄번호 제외) }
              endText:   { type: string, description: endLine 줄의 내용(source에서 그대로. 줄번호 제외) }
              newText:   { type: string, description: replace와 insertAfter에서 넣을 줄들. delete에는 적지 않는다 }
              what:      { type: string, description: 무엇을 왜 바꾸는지 한 줄 }
            required: [action, startLine, startText]
        summary:   { type: string, description: 뺀 것과 더한 것(3줄 이내) }
        questions: { type: array, items: { type: string }, description: 결정이 필요한 사항과 하지 못한 항목의 이유(없으면 빈 배열) }
      required: [edits, summary]
  # 추론을 껐다. Tool 없이 주어진 자료(설계와 소스)를 변경 목록으로 정리하는 일이라 꺼도 된다(분석, 파일별 설계 Agent와 같다).
  reasoning: none
  ragEnabled: false

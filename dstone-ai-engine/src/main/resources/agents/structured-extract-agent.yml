# Agent 하나를 정의한다. 파일명이 곧 agent 이름(ID)이다.
#
# structuredOutput: true로 호출될 AGENT step 전용 Agent 예시다. runtime.status.StepPayload(primaryText,
# data) 스키마로 응답을 받으므로, 여기서는 "이 프롬프트가 어떤 data 키를 채워야 하는지"만 안내하면 된다
# (structuredOutput 여부/스키마 자체는 StepDefinition.structuredOutput 쪽에서 강제되지, 이 Agent
# 정의에는 별도 필드가 없다 - 같은 Agent라도 호출하는 step이 structuredOutput=false면 그냥 자유
# 텍스트 응답으로 취급된다). workflows/structured-output-chain.yml의 extract step이 이 Agent를 쓰고,
# 다음 TOOL step이 {extract.sql} 토큰으로 data.sql을 참조한다.
agent:
  name: structured-extract-agent
  description: structuredOutput=true AGENT step 전용 - 입력 문장에서 SQL 문 하나를 추출해 data.sql로 돌려준다.
  prompt: |
    입력 문장 안에 SQL 문이 섞여 있으면 그 SQL 문 하나를 있는 그대로(수정하지 말고) 추출해서
    data 맵의 "sql" 키에 담으십시오. SQL 문이 없으면 sql 값으로 "SELECT 1"을 넣으십시오.
    primaryText에는 무엇을 추출했는지 한 줄로 요약한 한국어 문장을 담으십시오.
  toolsEnabled: false
  ragEnabled: false

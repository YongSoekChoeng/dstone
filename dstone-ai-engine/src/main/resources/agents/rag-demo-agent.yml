# Agent 하나를 정의한다. 파일명이 곧 agent 이름(ID)이다.
#
# ragEnabled=true Agent 예시다. runtime.agent.AgentExecutor.buildSpec()이 4단계에서
# common.rag.RagRetrievalChain.buildAdvisor(caller, ragTopK, ragSimilarityThreshold,
# ragAllowEmptyContext)로 만든 RetrievalAugmentationAdvisor를 붙여서, 질의와 관련된 문서 청크를 검색해
# "[참고자료]" 블록으로 프롬프트에 끼워 넣는다(common.rag.RagRetrievalChain.CONTEXT_PROMPT_TEMPLATE 참고).
#
# 이 Agent를 의미 있게 테스트하려면 먼저 dstone-boot "문서 임베딩 관리" 화면(POST /api/ai/embed/documents)
# 으로 문서를 하나 이상 적재해야 한다 - dstone.ai.rag.enabled=false거나(기본값) 적재된 문서가 없으면
# ragAllowEmptyContext=true라서 실패하지는 않고, 그냥 검색된 참고자료 없이 일반 답변만 나온다.
agent:
  name: rag-demo-agent
  description: RAG(검색-증강) Advisor 적용 확인용 Agent. 먼저 문서를 적재해야 참고자료가 실제로 붙는다.
  prompt: |
    당신은 적재된 문서를 참고해서 질문에 답하는 AI 어시스턴트입니다.
    프롬프트에 [참고자료] 블록이 함께 주어지면 그 내용을 근거로 답하고, 어느 부분을 참고했는지
    간단히 언급하십시오. [참고자료]가 비어 있거나 없으면 일반 지식으로 답하되, 참고자료 없이
    답한다는 점을 밝히십시오.
    답변은 항상 한국어로 합니다.
  toolsEnabled: false
  ragEnabled: true
  ragTopK: 3
  ragSimilarityThreshold: 0.3
  ragAllowEmptyContext: true

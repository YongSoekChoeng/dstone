# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 id가 됩니다.
#
# 이 Agent는 Workflow의 ROUTER step 전용으로 만들어진 예시입니다. ROUTER step은 "여러 갈래 중
# 어디로 갈지"를 LLM에게 직접 고르게 하는 step인데, 이 Agent가 바로 그 "고르는 역할"을 맡습니다.
# 내부적으로는 runtime.agent.AgentExecutor.callForEntity(..., RouteDecision.class)라는 메서드로
# 호출되며, 자유롭게 쓴 텍스트가 아니라 runtime.agent.RouteDecision이라는 정해진 형태(route와
# reason 두 값)로 응답을 받습니다.
#
# 여기서 중요한 규칙이 하나 있습니다: route 값은 그 step을 정의한 StepDefinition.routes에 미리
# 적어둔 이름표와 정확히 똑같아야 합니다. workflows/router-multiway.yml에서는 이 Agent를
# "billing"(결제 문의), "technical"(기술 문의), "other"(기타 문의) 세 갈래로 쓰고 있습니다.
# RouteDecision이라는 데이터 구조 자체는 route 자리에 어떤 문자열이 와야 하는지 전혀 모르기
# 때문에, 아래 prompt 안에서 이 세 이름표를 직접 알려주고 있는 것입니다.
agent:
  id: sample-router-classifier-agent
  description: ROUTER step 전용 - 문의를 billing/technical/other 세 갈래 중 하나로 분류한다.
  prompt: |
    당신은 고객 문의를 아래 세 갈래 중 정확히 하나로 분류하는 라우터입니다.

    - billing: 결제, 요금, 환불, 청구서 관련 문의
    - technical: 오류, 장애, 사용법, 버그 관련 문의
    - other: 위 두 가지에 해당하지 않는 모든 문의

    route에는 반드시 billing/technical/other 중 하나만 그대로 적으십시오(다른 문자열은 허용되지
    않습니다). reason에는 왜 그렇게 분류했는지 한국어로 한 줄 적으십시오.
  toolsEnabled: false
  ragEnabled: false

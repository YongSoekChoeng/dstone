# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 id가 됩니다.
#
# 이 Agent는 AGENT step 중에서도 structuredOutput: true로 설정된 step 전용 예시입니다.
# structuredOutput: true가 붙은 step은 자유롭게 쓴 텍스트 대신, runtime.status.StepPayload라는
# 정해진 형태(primaryText와 data 두 값)로 응답을 받습니다. 그래서 이 파일에서는 "이 Agent가
# data 맵의 어떤 키를 채워야 하는지"만 prompt 안에서 알려주면 됩니다.
#
# 참고로 structuredOutput은 Agent 정의(이 파일)가 아니라 Workflow의 StepDefinition 쪽에 있는
# 설정입니다. 즉 같은 Agent라도, 이 Agent를 부르는 step이 structuredOutput: false로 되어 있으면
# 그냥 평범한 자유 텍스트 응답으로 취급됩니다.
#
# workflows/structured-output-chain.yml의 extract라는 step이 바로 이 Agent를 사용합니다. 그리고
# 그 다음에 오는 TOOL step은 {extract.sql}이라는 토큰으로, 이 Agent가 채워 넣은 data.sql 값을
# 그대로 가져다 씁니다.
agent:
  id: sample-structured-extract-agent
  description: structuredOutput=true AGENT step 전용 - 입력 문장에서 SQL 문 하나를 추출해 data.sql로 돌려준다.
  prompt: |
    입력 문장 안에 SQL 문이 섞여 있으면 그 SQL 문 하나를 있는 그대로(수정하지 말고) 추출해서
    data 맵의 "sql" 키에 담으십시오. SQL 문이 없으면 sql 값으로 "SELECT 1"을 넣으십시오.
    primaryText에는 무엇을 추출했는지 한 줄로 요약한 한국어 문장을 담으십시오.
  toolsEnabled: false
  ragEnabled: false

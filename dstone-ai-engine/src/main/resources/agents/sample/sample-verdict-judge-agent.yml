# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 id가 됩니다.
#
# 이 Agent는 SUPERVISOR step 전용 예시입니다. 호출하는 방식 자체는 일반 AGENT step과 같지만,
# 실제로는 runtime.agent.AgentExecutor.callForVerdict()로 호출되기 때문에, 자유롭게 쓴 텍스트
# 대신 정해진 형식인 runtime.agent.Verdict(pass, reason)로 응답을 받습니다. Spring AI가 이
# Verdict의 JSON 스키마를 프롬프트에 자동으로 끼워 넣고, LLM의 응답을 그 스키마에 맞춰
# 해석해 줍니다. workflows/supervisor-verdict-gate.yml에서 이 Agent를 가져다 씁니다.
agent:
  id: sample-verdict-judge-agent
  description: SUPERVISOR step 전용 - 주어진 텍스트를 pass/fail + 이유로 판정한다.
  prompt: |
    당신은 앞 단계에서 나온 텍스트가 "안녕"이라는 단어를 포함하는지만 엄격히 검사하는 검수자입니다.
    포함하면 통과(pass=true)로, 포함하지 않으면 실패(pass=false)로 판정하고, 어떤 근거로 그렇게
    판단했는지 reason에 한국어로 간단히 적으십시오.
  toolsEnabled: false
  ragEnabled: false

# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 이름(ID)이 됩니다.
#
# 이 Agent는 toolsEnabled: true로 설정되어 있어서, 등록된 Tool들 중에서 어떤 걸 쓸지 LLM 스스로
# 판단해서 호출할 수 있습니다("tool-calling"이라고 부르는 동작입니다). 여기서 말하는 Tool은
# tools 패키지 아래에 있는 자바 코드들이고, common.config.ConfigTool이라는 클래스가 서버가
# 켜질 때 이 Tool들을 자동으로 찾아서 등록해 둡니다. workflows/agent-tool-calling.yml이 바로 이
# Agent를 사용해서, "LLM이 정말로 알아서 Tool을 골라 호출하는지"를 확인합니다.
#
# 아래 prompt 안에는 각 Tool의 이름과 언제 쓰는지를 미리 안내해 두었습니다. 사실 각 Tool의
# 진짜 설명은 자바 코드의 @Tool(description=...) 안에 이미 있어서 이렇게 안 적어도 동작은
# 하지만, 여기서도 한 번 더 안내해 두면 "어떤 메시지를 보내면 어떤 Tool이 불릴지" 미리 짐작하기
# 쉬워서 테스트하기 편합니다.
#
# 각 Tool이 실제로 성공하는지는 Tool마다 다릅니다.
# - getCurrentDateTime(sample.DateTimeTool)과 validateSqlSyntax(sql.SqlSyntaxTool)는 별도 설정
#   없이 항상 바로 동작합니다.
# - httpGet(http.HttpCallTool), runShellScript(shell.ShellExecTool), runPythonScript
#   (python.PythonExecTool) 이 세 가지는 안전을 위해 "허용 목록(화이트리스트)"에 등록된 것만
#   실행할 수 있습니다. conf/application.yml의 dstone.ai.tool.http.allowed-hosts /
#   .shell.allowed-commands / .python.allowed-scripts 목록이 비어 있으면(기본값이 비어 있습니다)
#   무조건 "실패: ..."라는 결과를 돌려줍니다. 이건 오류가 아니라 "허용된 게 없으니 막는다"는
#   의도된 안전장치이므로, LLM이 이 Tool을 골라서 호출은 했는데 결과가 실패로 나와도 정상입니다.
# - searchDocuments(rag.RagSearchTool)는 dstone.ai.rag.enabled=true로 RAG 기능이 켜져 있고,
#   실제로 검색될 문서가 미리 적재되어 있어야 결과를 얻을 수 있습니다.
agent:
  name: sample-tool-demo-agent
  description: 등록된 로컬 Tool을 LLM이 스스로 골라 호출하는 tool-calling 루프 확인용 Agent.
  prompt: |
    당신은 아래 Tool을 상황에 맞게 골라 호출할 수 있는 AI 어시스턴트입니다. 사용자가 굳이 Tool 이름을
    말하지 않아도, 질문 내용에 맞는 Tool이 있으면 먼저 호출해서 그 결과를 근거로 답하십시오.

    - getCurrentDateTime: 지금 날짜/시간을 물어보면 호출합니다.
    - validateSqlSyntax: SQL 문 하나의 문법이 올바른지 검증해 달라고 하면 호출합니다.
    - searchDocuments: 적재된 문서에서 특정 내용을 찾아 달라고 하면 호출합니다.
    - httpGet: 특정 URL의 내용을 가져와 달라고 하면 호출합니다.
    - runShellScript / runPythonScript: 등록된 스크립트를 실행해 달라고 하면 scriptName을 그대로 넘겨
      호출합니다.

    Tool 호출 결과가 "실패:"로 시작하면 그 이유를 그대로 사용자에게 알려주십시오 - 임의로 답을
    지어내지 마십시오.

    답변은 항상 한국어로 합니다.
  toolsEnabled: true
  ragEnabled: false

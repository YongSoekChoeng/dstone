# 이 파일 하나가 Agent 하나를 정의합니다. Agent의 id는 아래 agent.id 값입니다.
#
# 이 Agent는 "실패하면 되돌아가서 다시 시도하는 흐름(onFailure 루프)"을 보여주기 위한 예시입니다.
# workflows/sample/sample-loop-retry-until-valid.yml의 fix step이 이 Agent를 씁니다. 먼저 TOOL
# step(validate, validateSqlSyntax)이 SQL 문법을 검사하고, 실패하면 fix step으로 넘어옵니다.
# fix step의 input 템플릿이 "검증에 실패한 SQL"({{steps.validate.input.sql}})과 "실패 사유"
# ({{steps.validate.error}})를 채워서 이 Agent에게 사용자 메시지로 보내줍니다.
#
# 고친 SQL을 어떤 모양으로 돌려줄지는 이 파일이 아니라 fix step의 output.schema({sql: string})가
# 정합니다. 그래서 이 prompt는 "어떻게 고칠지"만 설명합니다. 고친 SQL은 다시 validate로 돌아가
# 검사를 받고, 이 루프가 끝없이 돌지 않도록 Workflow의 maxIterations가 막아줍니다.
agent:
  id: sample-fix-agent
  description: onFailure 루프 전용 - 검증에 실패한 SQL과 그 사유를 보고 SQL을 고친다.
  prompt: |
    입력으로 [검증에 실패한 SQL]과 [실패 사유]를 받습니다. 실패 사유를 근거로 원래 의도를 최대한
    살려서, 문법상 올바른 단일 SQL 문 하나로 고치십시오. 고칠 방법을 알 수 없으면 "SELECT 1"로
    답하십시오.
  toolsEnabled: false
  ragEnabled: false

# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 id가 됩니다.
#
# 이 Agent는 RAG(검색으로 찾은 문서를 근거로 답하는 기능, ragEnabled: true)가 실제로 동작하는
# 모습을 보여주기 위한 예시입니다. 동작 원리는 이렇습니다: 이 Agent를 호출하면
# runtime.agent.AgentExecutor.buildSpec()이라는 메서드가 요청을 조립하는 4단계에서
# common.rag.RagRetrievalChain.buildAdvisor(...)를 호출해 "검색 결과를 프롬프트에 끼워 넣어주는
# 기능(RetrievalAugmentationAdvisor)"을 함께 붙입니다. 그러면 질문과 관련 있는 문서 조각을 미리
# 검색해서, "[참고자료]"라는 이름표를 붙여 프롬프트 안에 함께 넣어줍니다(정확히 어떤 형식으로
# 넣는지는 common.rag.RagRetrievalChain.CONTEXT_PROMPT_TEMPLATE를 보면 알 수 있습니다).
#
# 이 Agent를 제대로 테스트해 보려면, 먼저 검색될 문서가 있어야 합니다. dstone-boot의 "문서 임베딩
# 관리" 화면(또는 POST /api/ai/embed/documents API)으로 문서를 하나 이상 올려두세요. 만약 RAG
# 기능 자체가 꺼져 있거나(dstone.ai.rag.enabled=false, 기본값입니다) 아직 올려둔 문서가 없어도
# 에러가 나지는 않습니다 - 아래 ragAllowEmptyContext: true 설정 덕분에, 참고할 자료를 못 찾으면
# 그냥 참고자료 없이 일반적인 답변만 하고 넘어갑니다.
agent:
  id: sample-rag-demo-agent
  description: RAG(검색-증강) Advisor 적용 확인용 Agent. 먼저 문서를 적재해야 참고자료가 실제로 붙는다.
  prompt: |
    당신은 적재된 문서를 참고해서 질문에 답하는 AI 어시스턴트입니다.
    프롬프트에 [참고자료] 블록이 함께 주어지면 그 내용을 근거로 답하고, 어느 부분을 참고했는지
    간단히 언급하십시오. [참고자료]가 비어 있거나 없으면 일반 지식으로 답하되, 참고자료 없이
    답한다는 점을 밝히십시오.
    답변은 항상 한국어로 합니다.
  toolsEnabled: false
  ragEnabled: true
  ragTopK: 3
  ragSimilarityThreshold: 0.3
  ragAllowEmptyContext: true

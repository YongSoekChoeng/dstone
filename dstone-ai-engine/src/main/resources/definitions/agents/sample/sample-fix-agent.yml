# 이 파일 하나가 Agent 하나를 정의합니다. Agent의 id는 아래 agent.id 값입니다.
#
# 이 Agent는 "실패하면 되돌아가서 다시 시도하는 흐름(onFailure 루프)"을 보여주기 위한 예시입니다.
# workflows/sample/sample-loop-retry-until-valid.yml의 fix step이 이 Agent를 씁니다. 먼저 TOOL
# step(validate, validateSqlSyntax)이 SQL 문법을 검사하고, 실패하면 fix step으로 넘어옵니다.
#
# 입출력 계약을 둘 다 object로 선언한 예시이기도 합니다.
# - input: {sql, error}. fix step이 input을 맵으로 적어서 "검증에 실패한 SQL"("${state.failedSql}")과
#   "실패 사유"("${state.validateError}")를 채워 넣습니다. 엔진이 이 맵을 아래 input 스키마로 검사한 뒤
#   JSON 글자로 바꿔 LLM에게 사용자 메시지로 보냅니다. (프롬프트 파일 안에는 중괄호를 쓰지 않습니다 - prompt의
#   {이름}은 Spring AI PromptTemplate이 변수 자리로 읽기 때문에, JSON 예시를 적으면 기동은 되지만 호출할 때 실패합니다.)
# - output: {sql}. LLM은 이 모양의 JSON으로만 답해야 하고, 고친 SQL은 fix step이 state.fixed에 저장하고 "${state.fixed.sql}"로 꺼냅니다.
#   LLM이 설명이나 코드펜스를 덧붙여도 sql 값만 깔끔하게 다음 step으로 넘어갑니다.
# 고친 SQL은 다시 validate로 돌아가 검사를 받고, 이 루프가 끝없이 돌지 않도록 Workflow의 maxIterations가 막아줍니다.
agent:
  id: sample-fix-agent
  version: "1.0.0"
  description: onFailure 루프 전용 - 검증에 실패한 SQL과 그 사유를 보고 SQL을 고친다.
  prompt:
    system: prompts/sample-fix-agent/v1.st
  input:
    schema: schemas/sample-fix-agent.input.schema.json
  output:
    format: JSON
    schema: schemas/sample-fix-agent.output.schema.json
    validation: STRICT

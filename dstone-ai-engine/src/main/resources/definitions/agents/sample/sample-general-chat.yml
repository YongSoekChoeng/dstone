# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 id가 됩니다. 그래서 파일
# 이름과 아래 agent.id 값은 반드시 똑같이 맞춰야 합니다 - 다르면 나중에 로딩될 때 헷갈립니다.
# 이 Agent에게 시킬 시스템 프롬프트도 바로 이 파일 안에 함께 적습니다. 즉 Agent 하나에 필요한
# 정보(설명, 프롬프트, RAG를 쓸지, Tool을 쓸지)가 이 파일 하나로 전부 정리되어 있습니다.
#
# ⚠️ 이 파일은 다른 곳에서 이미 쓰이고 있으므로, 아래 값들은 함부로 바꾸면 안 됩니다.
# dstone-boot의 채팅 화면(ai/service/ChatService.java)이 "sample-general-chat"이라는 Agent id를 코드
# 안에 그대로 박아두고 호출하고 있습니다. 그래서:
# - agent.id 값을 "sample-general-chat"이 아닌 다른 값으로 바꾸면, 채팅 화면이 더 이상 이 Agent를
#   찾지 못해 동작하지 않게 됩니다.
# - 프롬프트 안의 {role} 토큰을 지우면, 채팅 화면이 매번 role 값을 채워서 보내주고 있는데 그 값을
#   쓸 자리가 없어져 버립니다. 이 Agent는 input이 string이라 {role}을 채울 input 필드가 없으므로, 채팅 API처럼
#   variables로 role을 넘겨주는 곳에서만 씁니다. Workflow에서 역할을 바꿔 가며 부르고 싶다면 input을 object로
#   선언한 Agent를 씁니다(예: sample-role-reply-agent.yml - prompt 변수는 Agent가 받은 input 필드로 채워짐).
# - input/output을 선언하지 않았으므로 둘 다 string입니다(글자를 받아 글자로 답함).
# - tools.allowed: ["*"]도 그대로 두고, context(RAG)는 적지 않아야 합니다. "*"는 등록된 Tool을 전부 쓸 수 있다는 뜻으로,
#   무엇이든 물어볼 수 있는 범용 채팅 Agent라서 이렇게 열어 두었습니다(caller 화이트리스트는 그대로 적용됩니다).
#   채팅 화면의 Tool 체크박스(ChatRequest의 toolsEnabled)는 이 목록을 "이번 요청에 쓸지 말지"만 정합니다.
#   체크를 끄면 Tool 없이 답하고, 켜면 이 목록 그대로입니다. 여기 tools를 지우면 체크를 켜도 Tool이 붙지 않습니다.
#   업무용 Agent는 "*" 대신 실제로 쓰는 Tool 이름만 적으십시오(예: sample-tool-demo-agent.yml).
agent:
  id: sample-general-chat
  version: "1.0.0"
  description: 일반 대화용 기본 Agent. dstone-boot 채팅 화면이 사용한다.
  prompt:
    system: prompts/sample-general-chat/v1.st
  tools:
    allowed: ["*"]

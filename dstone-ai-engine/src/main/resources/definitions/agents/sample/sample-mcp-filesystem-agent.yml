# 이 파일 하나가 Agent 하나를 정의합니다. 파일 이름이 곧 이 Agent의 id가 됩니다.
#
# sample-tool-demo-agent.yml과 똑같은 tool-calling 패턴이지만, 여기서 LLM이 고르는 Tool
# (list_directory, read_text_file)은 자바로 직접 만든 @AiTool이 아니라 mcp/sample/
# sample-filesystem-mcp.yml에 정의된 외부 MCP 서버가 제공하는 Tool입니다. common.config.ConfigTool
# 입장에서는 둘이 완전히 똑같이 취급되기 때문에, Agent 쪽 설정(tools에 Tool 이름을 적는 것)은 로컬 Tool을
# 쓸 때와 다를 게 없습니다 - "MCP 서버 Tool도 로컬 Tool과 구분 없이 쓸 수 있다"는 걸 보여주는
# 것이 이 샘플의 목적입니다.
#
# 이 MCP 서버는 write_file/edit_file/move_file처럼 파일을 바꾸는 Tool도 등록해 두었지만, 이 Agent의 tools에는
# 읽기 Tool 두 개만 적었습니다. 그래서 이 Agent의 LLM은 파일을 바꾸는 Tool을 아예 볼 수 없습니다.
#
# mcp/server-filesystem 디렉토리 밖의 경로는 MCP 서버 자체가 거부하므로, 이 Agent에게 다른 경로를
# 읽어 달라고 해도 거부됩니다(모델이 스스로 그 사실을 알아서 판단하는 게 아니라, Tool 호출 자체가
# 에러를 돌려줍니다).
agent:
  id: sample-mcp-filesystem-agent
  version: "1.0.0"
  description: 외부 MCP 서버(공식 filesystem 레퍼런스 서버)가 제공하는 Tool을 LLM이 스스로 골라 호출하는지 확인용 Agent.
  prompt:
    system: prompts/sample-mcp-filesystem-agent/v1.st
  tools:
    allowed: [list_directory, read_text_file]

# 영향도 분석은 pilot Agent 중 소스를 가장 넓게 조사합니다. 그래서 넓은 조사는 Sub Agent
# (pilot-source-investigator-agent)에게 맡기고, 이 Agent는 돌아온 요약과 근거로 문서를 씁니다.
# 조사하면서 읽은 파일 내용이 이 Agent의 대화에 쌓이지 않아서 요청이 커지는 것을 막습니다.
# 변경 대상으로 적을 파일은 이 Agent가 직접 열어 확인합니다(그래서 tools에도 조회 Tool을 남겨 두었습니다).
#
# 이 문서의 핵심은 '원인'과 '변경 대상'입니다. "유효성 검증 검토 필요"처럼 무엇을 고칠지 알 수 없는 변경 대상이
# 나온 적이 있어서, 원인을 "무엇이 → 어디서 → 왜"로 먼저 적고 변경 대상에는 고칠 내용을 구체적으로 적게 했습니다.
#
# [원인 추적 절차]의 단계마다 어느 Tool을 먼저 쓰는지 적어 두었습니다(진입점, 호출 관계, 영향 범위는 knowledge Tool이 먼저).
# Tool 규칙을 절차와 따로 적어 두었을 때는 knowledge Tool을 쓰지 않고 파일만 뒤진 적이 있습니다(pilot-requirment-analyzer-agent.yml).
#
# 조사를 맡기는 횟수는 FR 수가 아니라 "조사할 대상의 수"로 정합니다. "FR마다 한 번씩 맡겨라"였을 때,
# 신규 FAQ 개발 요청의 FR 4개가 모두 같은 참고 구현(샘플게시판)을 가리켜서 같은 조사를 4번 맡겼습니다.
# 그리고 돌아온 것이 요약뿐이라, 줄 번호를 적으려고 같은 파일을 이 Agent가 다시 열었습니다(조회 26번, 12분).
# 그래서 요청 유형(요구사항 정의서의 요청 범위 표)에 따라 나눴습니다.
# - 신규 개발: 맡기지 않고 직접 엽니다. 참고 구현의 위치는 요구사항 정의서와 knowledgeCallees 한 번으로 이미 알 수 있고,
#   "무엇을 빼고 무엇을 바꿀지" 정하려면 어차피 그 파일들을 통째로 봐야 합니다. 맡겨 봤더니 Sub Agent가 3분을 쓰고도
#   발췌(구간 40줄)로는 모자라서 부모가 화면/Controller/Service 파일을 다시 열었습니다.
# - 오류 수정/기능 변경: 진입점이 다른 메뉴마다 맡기고, Sub Agent가 준 발췌(excerpts)는 다시 열지 않습니다.
#
# 신규 개발 FR에는 원인이 없습니다. "테이블 정의에 있는지 / 조회 결과에 있는지"를 모든 FR에 적으라는 완료조건은
# 오류 수정에만 맞는 것이어서, 유형별로 나눴습니다.
agent:
  id: pilot-impact-analyzer-agent
  version: "1.0.0"
  description: 영향도 분석 에이젼트. 요구사항 정의서를 읽고 원인과 영향받는 코드를 조사해 영향도 분석서(02-impact.md)를 만든다.
  prompt:
    system: prompts/pilot-impact-analyzer-agent/v1.st
  input:
    schema: schemas/pilot-impact-analyzer-agent.input.schema.json
  output:
    format: JSON
    schema: schemas/pilot-impact-analyzer-agent.output.schema.json
    validation: STRICT
  tools:
    allowed: [searchInFiles, readFileListAll, isFileExist, readFile, readFileLines, readFileTail, writeFile, appendFile, knowledgeSearch, knowledgeFindMethods, knowledgeCallers, knowledgeCallees, knowledgeTableUsage, knowledgeImpact]
  subAgents: [pilot-source-investigator-agent]
  execution:
    # prompt에 [조회 한도]를 적지 않는다. 횟수는 엔진이 센다. 남은 횟수가 5분의 1 이하가 되면 엔진이 Tool 결과 끝에
    # "N번 남았다, 지금 결과를 저장하라"고 알려 주고, 다 쓰면 Tool을 실행하지 않는다(runtime.agent.ToolCallBudgetCallback).
    # 예전 prompt의 "조회 25번 이내"에 문서를 저장하는 호출(writeFile, appendFile)을 더한 값이다.
    maxToolCalls: 32

# 프롬프트 파일 안의 중괄호는 엔진이 input 필드로 채우는 변수 자리입니다(여기서는 workDir 하나).
# input에 없는 이름을 중괄호로 적으면 호출할 때 "채울 값이 없다"로 실패하므로, 설명용 문구에는 중괄호를 쓰지 않습니다.
#
# 이 Agent만 실제 소스를 고칩니다. 파일 전체를 다시 쓰지 않고 바꿀 부분만 보냅니다(2026-10-08).
# - 이미 있는 파일: replaceInFile(변경 전, 변경 후). 정확히 한 곳에만 들어맞을 때 바뀌고, 아니면 아무것도 바뀌지 않습니다.
# - 새 파일: copyFileWithReplace로 참고 파일을 복사하면서 이름을 바꾸고, 빼는 것과 더하는 것만 replaceInFile로 고칩니다.
# 예전에는 writeFile로 파일 전체를 덮어썼습니다. 그 전체가 모델의 출력 토큰이라 300줄짜리 파일 하나로도 한도에 걸렸고,
# readFile이 큰 파일의 앞부분만 돌려줬을 때 그대로 덮어쓰면 뒷부분이 사라지는 위험도 있었습니다.
# 컴파일이나 실행을 해 볼 Tool이 없으므로, 검증하지 못했다는 사실을 summary에 밝히게 했습니다.
#
# 신규 개발만 있는 요청은 이 Agent를 거치지 않습니다. pilot-workflow의 신규 개발 경로는 파일마다
# pilot-newdev-file-developer-agent(24.newdev-file-developer-agent.yml)를 따로 부릅니다.
agent:
  id: pilot-developer-agent
  version: "1.0.0"
  description: 개발 에이젼트. 설계서와 태스크 목록대로 소스를 구현하고 태스크 목록에 완료 표시를 남긴다.
  prompt:
    system: prompts/pilot-developer-agent/v1.st
  input:
    schema: schemas/pilot-developer-agent.input.schema.json
  output:
    format: JSON
    schema: schemas/pilot-developer-agent.output.schema.json
    validation: STRICT
  tools:
    allowed: [searchInFiles, readFileListAll, isFileExist, readFile, readFileLines, readFileTail, replaceInFile, copyFileWithReplace, writeFile, appendFile, knowledgeSearch, knowledgeFindMethods, knowledgeCallers, knowledgeCallees, knowledgeTableUsage]
  execution:
    # knowledge Tool은 "위치 찾기"에만 쓰게 했다(prompt의 [knowledge Tool 사용 규칙]). 이 Agent가 소스를 고치는 순간부터
    # 미리 분석해 둔 결과는 낡은 것이 되고, 무엇을 어떻게 고칠지는 설계서(04-design.md)에 이미 적혀 있기 때문이다.
    # (예전 주석은 "주지 않는다"였는데 tools에는 들어 있었다. tools에 넣은 쪽을 따르고 쓰는 범위를 prompt에 적었다.
    #  아예 주지 않으려면 tools에서 knowledge* 다섯 개와 prompt의 그 문단, 프로젝트ID 줄을 함께 지운다.)
    #
    # 엔진이 세는 Tool 호출 한도. 다른 pilot Agent(32)보다 넉넉한 것은 파일마다 "읽기 → 쓰기(길면 이어 붙이기) → 다시 읽어 확인"으로
    # 서너 번씩 쓰기 때문이다. 남은 횟수가 5분의 1 이하가 되면 엔진이 Tool 결과 끝에 알려 준다(runtime.agent.ToolCallBudgetCallback).
    maxToolCalls: 60

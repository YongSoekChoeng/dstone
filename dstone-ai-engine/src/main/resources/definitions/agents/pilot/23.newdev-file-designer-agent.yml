# 신규 개발 경로의 설계 Agent입니다. 파일 하나의 설계만 합니다.
# Workflow의 forEach step(step17)이 변경 대상 파일마다 새 대화로 한 번씩 부릅니다.
# 요청이 커지면 호출 수가 늘 뿐, 한 번의 호출이 다루는 크기는 그대로입니다(예전에는 요청이 커지면 한 대화가 커졌습니다).
#
# Tool이 없습니다. 본뜰 참고 파일의 내용(referenceSource)과 고칠 파일의 지금 내용(currentSource)은 Workflow가 넣어 줍니다.
#
# 문서를 쓰지 않습니다. 파일 하나의 설계를 데이터로 내고, 04-design.md는 Workflow의 TOOL step이 그 데이터를 모아 만듭니다.
# "변경 전이 실제 파일에 있는가"도 Workflow가 코드로 확인합니다(step18 step). 그래서 [완료조건]이 없습니다.
#
# 새 파일의 전체 내용을 적지 않게 한 이유는 그대로입니다. 전체를 적으면 설계가 길어지고 개발 Agent가 같은 내용을 한 번 더 씁니다.
# 그래서 "참고 파일 + 달라지는 점 + 본뜰 수 없는 내용"만 받습니다.
agent:
  id: pilot-newdev-file-designer-agent
  version: "1.0.0"
  description: 신규 개발 - 변경 대상 파일 하나의 설계를 데이터로 낸다(신규는 이름 바꿈/빼는 것/더하는 것, 수정은 변경 전/변경 후).
  model:
    # 추론을 껐다. 재 본 것(2026-10-08, OpenRouter qwen/qwen3.8-27b): 파일 하나에 10~21초였다.
    # 끄고 보니 결과에 망설임을 적거나 다른 파일과 다른 컬럼 이름을 지어내는 일이 있어서, 이름은 plan의 sharedNames를 따르게 했다.
    reasoning: none
  prompt:
    system: prompts/pilot-newdev-file-designer-agent/v1.st
  input:
    schema: schemas/pilot-newdev-file-designer-agent.input.schema.json
  output:
    format: JSON
    schema: schemas/pilot-newdev-file-designer-agent.output.schema.json
    validation: STRICT

# 설계서는 다음 단계(pilot-developer-agent)가 그대로 따라 구현하는 문서입니다. 개발 Agent는 설계서와 태스크 목록만 보고
# 파일을 고치므로, "어느 파일의 어느 부분을 무엇으로 바꾸는지"가 설계서에 글자로 적혀 있어야 합니다.
# 그래서 변경마다 '변경 전'과 '변경 후'를 실제 소스에서 옮겨 적게 했습니다.
#
# 새 파일을 만드는 변경은 '변경 전'이 없습니다. 그렇다고 '변경 후'에 파일 전체를 적으면 설계서가 너무 길어지고
# (쓰는 데 오래 걸리고, 한 번에 쓸 수 있는 분량을 넘어 끊깁니다) 개발 Agent가 같은 내용을 한 번 더 씁니다.
# 그래서 새 파일은 "어느 파일을 본뜨는지"와 "달라지는 점"을 적고, 본뜰 수 없는 내용(테이블 생성문, 새 쿼리, 메뉴 등록)만 글자 그대로 적게 했습니다.
agent:
  id: pilot-architect-agent
  version: "1.0.0"
  description: 설계 에이젼트. 요구사항과 영향도 분석을 바탕으로 상세 설계서(04-design.md)와 태스크 목록(04-tasks.md)을 만든다.
  prompt:
    system: prompts/pilot-architect-agent/v1.st
  input:
    schema: schemas/pilot-architect-agent.input.schema.json
  output:
    format: JSON
    schema: schemas/pilot-architect-agent.output.schema.json
    validation: STRICT
  tools:
    allowed: [searchInFiles, readFileListAll, isFileExist, readFile, readFileLines, readFileTail, writeFile, appendFile, knowledgeSearch, knowledgeFindMethods, knowledgeCallers, knowledgeCallees, knowledgeTableUsage, knowledgeImpact]
  execution:
    # prompt에 [조회 한도]를 적지 않는다. 횟수는 엔진이 센다. 남은 횟수가 5분의 1 이하가 되면 엔진이 Tool 결과 끝에
    # "N번 남았다, 지금 결과를 저장하라"고 알려 주고, 다 쓰면 Tool을 실행하지 않는다(runtime.agent.ToolCallBudgetCallback).
    # 예전 prompt의 "조회 25번 이내"에 문서를 저장하는 호출(writeFile, appendFile)을 더한 값이다.
    maxToolCalls: 32

################################################################################################################ 
# 어플리케이션 운영관리 Workflow입니다. 
# 요청서(00-request.md)에서 시작해 요구사항 → 영향도 분석 → 리뷰 → 설계 → 구현까지 진행합니다.
################################################################################################################ 

workflow:
  id: sm-workflow
  version: "1.0.0"
  description: |
   어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00-request.md 파일의 경로를(파일명 제외) 입력하라. 
   요청서에는 '현업요청', '소스경로'와, 그 소스를 dstone-knowledge에 분석해 두었다면 '프로젝트ID'를 적는다.
   예)
   D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
  #####################################  
  #  ● workflow의 settings
  #    maxIterations: step 실행 횟수 상한
  #    checkpoint: step마다 상태 저장
  #      - true만 적을 수 있습니다. 엔진은 step이 끝날 때마다 실행 상태(state 포함)를 항상 DB에 저장하며, 끄는 기능이 없습니다.
  #      - false를 적으면 기동에 실패합니다.
  #      - 이 저장 덕분에 APPROVAL에서 멈췄다가 이어서 실행하거나, 서버가 재시작된 뒤 마지막 step부터 이어갈 수 있습니다.
  #    onError: 시스템 오류 시 동작
  #      - STOP만 적을 수 있습니다. step 실행 중 시스템 오류(예외)가 나면 실행 전체가 FAILED로 끝납니다.
  #      - 다른 값(CONTINUE 등)을 적으면 기동에 실패합니다.
  #      - step 실패 시 다른 곳으로 보내려면 settings가 아니라 그 step의 onFailure를 씁니다. 이것은 Agent 계약 위반(출력 형식 틀림 등)이나 Tool의 실패: 응답 같은 step 실패에 적용됩니다.
  #####################################    
  settings:
    checkpoint: true
    maxIterations: 100
    onError: STOP
  #####################################    
  #  ● workflow의 input
  #     * schema 를 표시.
  #     * 축약형
  #    - string : 글자
  #     - number : 숫자(소수 포함)
  #     - integer : 정수
  #     - boolean : true/false
  #     - object :  객체(필드 제한 없음)
  #     - array : 목록(항목 제한 없음)
  #     - list<타입> : 그 타입의 목록
  #     * 표준형 - JSON Schema를 그대로 표시.
  #####################################    
  input: string
  #####################################    
  #  ● workflow의 output
  #     * value 와 schema 를 표시. value 는 필수, schema 는 생략가능.
  #    * output 자체를 생략하면 state 자체가 최종결과가 됨.
  #####################################    
  output:
    value:
      route: "${state.classify.route}"
      #requirements: "${state.requirements}"
      #impact: "${state.impact}"
      #review: "${state.review}"
      #design: "${state.design}"
      #implementation: "${state.implementation}"
      #newdevReference: "${state.reference}"
      #newdevAnalysis: "${state.analysis}"
      #newdevAnalysisCheck: "${state.impactCheck.text}"
      #newdevDesigns: "${state.designs}"
      #newdevDesignCheck: "${state.designCheck.text}"
      #newdevEditCheck: "${state.editCheckError}"
      #newdevTasks: "${state.tasksFile}"
  steps:

  ##########################################################################################
  # step00. 작업구분 (신규 / 수정)
  ##########################################################################################
  
    # 요청서 읽기 (LLM을 부르지 않는다. 읽은 내용은 뒤의 Agent들이 input.request로 받는다)
    - id: step00_01_readReq
      type: TOOL
      tool: readFile
      input: 
        fileFullPath: "${input}/00-request.md"
      output:   
        result: "state.request"
      next: step00_02_decideJobKind
      onFailure: FAIL
    
    - id: step00_02_decideJobKind
      type: AGENT
      agent: sm-decide-job-kind-agent
      input: "${state.request}"
      output:   
        result: "state.classify.route"
      next: END
      onFailure: FAIL  
  
# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 TOOL step이 실패하면 AGENT step(fix)으로 넘어갔다가 다시 TOOL step으로 되돌아가는
# onFailure 루프를 확인해보기 위한 테스트 전용 Workflow입니다. 핵심은 onFailure에 목록상 앞에 있는
# step의 id를 적으면 루프가 만들어진다는 것과, settings.maxIterations가 그 루프가 끝없이 돌지 않도록 막아준다는
# 것입니다.
#
# 동작 흐름
# 1) validate: 검사할 SQL로 ${state.fixed.sql:${input}}을 씁니다(앞의 값이 없으면 콜론 뒤의 값).
#    - 처음 실행될 때는 fix가 아직 돈 적이 없어서 state.fixed가 없으므로 요청의 input(SQL 글자)을 씁니다.
#    - fix를 거쳐 되돌아왔을 때는 fix가 저장한 state.fixed.sql(고친 SQL)을 씁니다.
#    validate는 자기가 실제로 검사한 SQL(input.sql)과 실패 사유(error)를 state에 저장해 둡니다.
# 2) fix: validate가 실패하면 실행됩니다. sample-fix-agent는 input/output을 둘 다 object로 선언한 Agent라서
#    input을 맵({sql, error})으로 적습니다 - 실패한 SQL(${state.checkedSql})과 실패 사유
#    (${state.validateError})를 채워 넣고, 고친 SQL을 {sql} 모양으로 돌려받아 state.fixed에 저장합니다.
# 3) 성공하면 Workflow의 output(${state.checkedSql}) - 최종적으로 검증을 통과한 SQL - 을 돌려줍니다.
#
# maxIterations=6이면 validate(실패) → fix → validate(성공)처럼 고쳐 쓰기가 몇 번 더 걸려도 여유가 있습니다.
# 끝내 못 고치면 "최대 실행 횟수 초과"로 FAILED가 되는 것도 이 Workflow로 확인할 수 있습니다.
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-loop-retry-until-valid
#   input     : SELECT * FORM member WHERE id = 1
# ("FORM"은 "FROM"을 일부러 잘못 쓴 오타입니다 - fix가 이 오타를 고치고 나면 validate를 통과하면서
# 성공(DONE)으로 끝납니다)
workflow:
  id: sample-loop-retry-until-valid
  version: "1.0.0"
  description: TOOL 검증 실패 -> AGENT 수정 -> TOOL 재검증, onFailure 루프 + maxIterations 상한 확인용 Workflow.
  input: string
  settings:
    maxIterations: 6
  output:
    value: "${state.checkedSql}"
  steps:

    - id: validate
      type: TOOL
      tool: validateSqlSyntax
      input:
        sql: "${state.fixed.sql:${input}}"
      output:
        input.sql: "state.checkedSql"
        error: "state.validateError"
      next: END
      onFailure: fix

    - id: fix
      type: AGENT
      agent: sample-fix-agent
      input:
        sql: "${state.checkedSql}"
        error: "${state.validateError}"
      output:
        result: "state.fixed"
      next: validate

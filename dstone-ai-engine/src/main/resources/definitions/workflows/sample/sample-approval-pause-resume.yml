# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 APPROVAL step이 실행을 잠시 멈췄다가 다시 이어가는 동작을 눈으로 직접 확인해보기
# 위한 테스트 전용 Workflow입니다. LLM이나 Tool을 전혀 호출하지 않고 APPROVAL step 하나만으로
# 이루어져 있어서, API 비용이나 네트워크 연결 없이도 바로 돌려볼 수 있습니다.
# 최종 결과는 사람이 내린 결정({decision, approver, comment}, state.approval)입니다.
# 고를 수 있는 결정은 routes에 적은 APPROVED / REJECTED 두 가지입니다.
#
# 확인해보는 순서는 이렇습니다:
#   1. dstone-boot의 "Workflow 테스트" 화면에서 workflowId=sample-approval-pause-resume, input="승인 테스트"로
#      제출(submit)합니다 -> executionId가 바로 발급되고, 곧이어 status가 WAITING_APPROVAL(승인 대기)로 바뀝니다.
#   2. dstone-boot의 "관리자 > Workflow 실행 관리" 화면에서 상태를 WAITING_APPROVAL로 걸어두면 방금
#      만든 실행이 목록에 보입니다. 그 실행을 승인하거나 반려해봅니다.
#   3. APPROVED를 고르면 성공(status=DONE)으로, REJECTED를 고르면 실패(status=FAILED)로
#      끝납니다 - "Workflow 테스트" 화면으로 돌아가 같은 executionId로 상태를 다시 조회해보면
#      (또는 자동 폴링이 켜져 있다면 그대로) 이 최종 상태가 반영되어 있는 것을 볼 수 있습니다.
# API로 직접 확인해보고 싶다면(dstone-ai-engine 기준) 이렇게 호출하면 됩니다:
#   POST /api/ai/workflow/sample-approval-pause-resume/execute { "input": "승인 테스트" }
#     -> 응답 status가 WAITING_APPROVAL, executionId가 함께 온다.
#   GET /api/ai/workflow/executions?status=WAITING_APPROVAL
#   POST /api/ai/workflow/executions/{executionId}/decision { "decision": "APPROVED", "approver": "...", "comment": "..." }
#     (REJECTED는 comment가 꼭 있어야 합니다 - approval.requireCommentOnReject: true)
workflow:
  id: sample-approval-pause-resume
  version: "1.0.0"
  description: APPROVAL 스텝의 일시중단(WAITING_APPROVAL)/재개 동작 확인용 테스트 Workflow.
  input: string
  settings:
    checkpoint: true
    maxIterations: 5
    onError: STOP
  output:
    value: "${state.approval}"
  steps:

    - id: approve
      type: APPROVAL
      approval:
        artifact: sample-document
        approverRole: team-lead
        requireCommentOnReject: true
      output:
        result: "state.approval"
      routes:
        APPROVED: END
        REJECTED: FAIL

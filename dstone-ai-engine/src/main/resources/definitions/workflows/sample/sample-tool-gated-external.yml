# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 화이트리스트를 등록해야만 실제로 동작하는 위험한 Tool 3개(httpGet,
# runShellScript, runPythonScript)를 한 번씩 순서대로 호출해보는 테스트 전용 Workflow입니다.
# conf/application.yml에서 dstone.ai.tool.http.allowed-hosts / .shell.allowed-commands /
# .python.allowed-scripts가 전부 비어있는 상태(기본값)라면, 세 Tool 모두 "기본적으로 막혀있는"
# 상태라서 "실패: ..."를 돌려주는 것이 정상입니다(자세한 내용은 tools.http.HttpCallTool,
# tools.shell.ShellExecTool, tools.python.PythonExecTool 클래스의 주석을 참고하세요 - 이
# Tool들은 따로 켜고 끄는 on/off 플래그가 없고, 화이트리스트가 비어있는 것 자체가 곧 비활성
# 상태입니다).
#
# 그래서 이 Workflow는 개별 step이 실패하더라도 onFailure로 그냥 다음 step으로 넘어가도록
# 만들었습니다 - Workflow 전체의 성공/실패를 보려는 게 아니라, 세 Tool이 지금
# 화이트리스트 설정 기준으로 각각 통과했는지 실패했는지 확인해보는 것이 이 Workflow의 목적입니다.
# 최종 결과(output.value)는 세 Tool의 응답을 모은 맵이고, 실패한 Tool은 "실패: ..." 응답이 그대로 담깁니다
# (step의 output은 성공이든 실패든 저장됩니다).
# 화이트리스트를 채워 넣고(예: httpGet이면 dstone.ai.tool.http.allowed-hosts: ["example.com"]) 다시
# 호출해보면, 그 step만 성공으로 바뀌는 것을 확인할 수 있습니다.
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-tool-gated-external
#   input     : (아무 글자나 넣으면 됩니다 - 이 Workflow의 step들은 input을 쓰지 않습니다)
workflow:
  id: sample-tool-gated-external
  version: "1.0.0"
  description: httpGet/runShellScript/runPythonScript deny-by-default 확인용 Workflow. 화이트리스트 미설정 시 각 step이 실패하는 게 정상이다.
  input: string
  settings:
    maxIterations: 4
  output:
    value:
      http: "${state.http}"
      shell: "${state.shell}"
      python: "${state.python}"
  steps:

    - id: httpCheck
      type: TOOL
      tool: httpGet
      input:
        url: https://example.com
      output:
        result: "state.http"
      next: shellCheck
      onFailure: shellCheck

    - id: shellCheck
      type: TOOL
      tool: runShellScript
      input:
        scriptName: sample-script
        args: []
      output:
        result: "state.shell"
      next: pythonCheck
      onFailure: pythonCheck

    - id: pythonCheck
      type: TOOL
      tool: runPythonScript
      input:
        scriptName: sample-script
        args: []
      output:
        result: "state.python"
      next: END
      onFailure: END

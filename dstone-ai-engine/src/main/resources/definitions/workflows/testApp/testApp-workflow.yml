workflow:
  id: testApp-workflow
  version: "1.0.0"
  description: 테스트용 workflow
  # input: 읽을 문서의 전체 경로입니다.
  #   MCP filesystem 서버(definitions/mcp/sample/sample-filesystem-mcp.yml)가 허용한 폴더
  #   (${APP_HOME}/${APP_NAME}/mcp/server-filesystem) 안에 있어야 읽을 수 있습니다.
  #   예: D:/AppHome/framework/dstone/dstone-ai-engine/mcp/server-filesystem/testApp/dongyang-plan.md
  input: string
  settings:
    maxIterations: 10
  output:
    value: "${state.spec}"
  steps:

    # 문서를 LLM에게 "알아서 읽어라"라고 맡기지 않고, TOOL step으로 엔진이 직접 읽습니다.
    - id: read
      type: TOOL
      tool: readFile
      input:
        fileFullPath: "${input}"
      output:
        result: "state.document"
      next: step01
      onFailure: FAIL

    - id: step01
      type: AGENT
      agent: testApp-agent-01
      input: "${state.document}"
      output:
        result: "state.analysis"
      next: step02
      onFailure: FAIL

    - id: step02
      type: AGENT
      agent: testApp-agent-02
      input: "${state.analysis}"
      output:
        result: "state.spec"
      next: END
      onFailure: FAIL

# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# testApp 프로젝트를 대상으로 한 "승인형 AI SDLC" Workflow입니다(원래 요구사항은
# docs/temp/dongyang-plan.md 참고 - 8단계: 요청 접수 -> AI 분석/설계 -> 검수 -> AI 개발명세서
# 작성 -> PL 검토/승인 -> AI 기본 소스 생성 -> 개발자 제출 -> PL 최종 승인 -> Jenkins 파이프라인
# 기동). 이름은 원래 "dongyang-sdlc"였으나, 이 워크플로우가 실제로 겨냥하는 대상(테스트용 더미
# 프로젝트 testApp, Jenkins Job도 이름이 "testApp")과 맞춰 "testApp-sdlc"로 부른다.
#
# ## 원래 계획과 달라진 점 - 승인 반려 시 "루프백" 대신 "종료"
# dongyang-plan.md 3절의 원래 설계는 각 승인 게이트가 반려되면 앞선 AI 단계로 되돌아가 다시
# 시도하는 루프였다. 하지만 실제 엔진 구현을 확인해보면 이 루프는 안전하게 동작하지 않는다:
# runtime.step.ApprovalStepRunner는 승인/반려 결정을 variables.approvals.{stepId}에 저장하고,
# 이 값은 실행이 끝날 때까지 절대 지워지지 않는다(api.service.WorkFlowExecutionService.
# recordDecision 참고). 그래서 반려된 뒤 앞 단계로 루프백해서 같은 승인 step id를 다시 찾아가면,
# 그 step은 "아직 결정 안 됨"으로 보고 새로 멈추는 게 아니라 예전에 저장해 둔 반려 결정을 그대로
# 다시 읽어서 즉시 또 반려 처리해버린다 - 결국 maxIterations를 넘길 때까지 같은 반려가 자동으로
# 반복되다가 "최대 실행 횟수 초과"로 실패한다. docs/09.dstone-ai-engine.md의 샘플(§8)도 이런
# 이유로 승인 step의 onFailure를 전부 FAIL로 두고 있다 - 이 Workflow도 같은 원칙을 따른다.
#
# 실무적으로는 반려됐을 때 "그 자리에서 고쳐서 재시도"가 아니라, 반려 사유를 사람이 확인한 뒤
# (WorkFlowExecutionController의 decision 응답이나 이력 조회로 확인 가능) 요청사항 원문에 그
# 사유를 반영해서 새 실행(execute/submit)을 다시 시작하는 방식으로 처리한다. 승인 게이트가 많아질
# 다음 버전에서 "같은 실행을 이어서 고쳐 쓰는" 기능이 필요해지면, 그건 이 YAML 설계가 아니라
# ApprovalStepRunner 쪽에 재시도 시맨틱(예: step별 결정 이력을 리스트로 쌓아서 "가장 최근 것"이
# 아니라 "이번 방문 차례의 것"을 찾는 방식)을 추가하는 엔진 변경이 필요하다.
#
# ## caller 제한을 걸지 않은 이유
# 이 엔진은 지금 dstone.ai.security.auth.enabled=false(인증 꺼짐) 상태라 caller가 항상 null로
# 들어온다. allowedCallers를 채워두면 WorkFlowRegistry.resolve()가 "caller가 null이면 무조건
# 거부"로 판단해서 이 Workflow 자체를 영원히 실행할 수 없게 만들어 버린다(3개 Agent도 마찬가지
# 이유로 allowedCallers를 비워뒀다). 나중에 caller별 API Key 인증을 켤 때 같이 채워 넣을 것.
#
# ## 소스 자동 반영은 하지 않는다
# generate-code 단계는 코드를 "텍스트"로만 만든다(에이전트 정의의 comment 참고) - 실제 파일이나
# Git 브랜치에 쓰는 Tool은 없다. dev-submit 승인 게이트는 "개발자가 그 코드를 검토해서 실제
# testApp 프로젝트에 직접 반영하고, 다 됐으면 제출한다"는 사람의 행위를 감사 기록으로 남기는
# 역할일 뿐이다(승인 자체가 파일을 쓰는 것도, 검증하는 것도 아니다).
#
# ## dstone-boot "Workflow 테스트" 화면에서 실행하는 방법
#   workflowId: testApp-sdlc
#   message   : (현업 요청사항 원문 - 예: "회원 목록 화면에 가입일자 검색 조건을 추가해줘")
# 제출하면 즉시 WAITING_APPROVAL(design-review)로 멈춘다. "Workflow 실행 관리" 화면에서
# status=WAITING_APPROVAL로 걸어두면 보이고, 승인/반려를 내리면 다음 단계로 진행되거나(승인)
# 그 자리에서 종료된다(반려). 8단계를 전부 승인으로 통과하면 마지막에 Jenkins Job "testApp"
# 빌드가 실제로 기동된다(tools.jenkins.JenkinsTriggerBuildTool, conf/application.yml의
# dstone.ai.tool.jenkins.* 설정 참고) - 실행할 때마다 실제로 배포가 일어나는 것이므로, 테스트
# 목적이라면 code-review 단계에서 일부러 반려해서 Jenkins 기동 전에 멈추는 것도 방법이다.
#
# API로 직접 확인해보고 싶다면:
#   POST /api/ai/workflow/testApp-sdlc/submit { "message": "..." }
#   GET  /api/ai/workflow/executions?status=WAITING_APPROVAL
#   POST /api/ai/workflow/executions/{executionId}/decision
#        { "approved": true, "approver": "business-reviewer", "comment": "..." }
workflow:
  id: testApp-sdlc
  description: testApp 대상 승인형 AI SDLC(분석-검수-명세-승인-소스생성-제출-최종승인-Jenkins 기동).
  maxIterations: 10
  steps:

    - id: analyze
      type: AGENT
      ref: testApp-analysis-agent
      onSuccess: design-review
      onFailure: FAIL

    - id: design-review
      type: APPROVAL
      approverRole: "business-reviewer"
      onSuccess: write-spec
      onFailure: FAIL

    - id: write-spec
      type: AGENT
      ref: testApp-spec-writer-agent
      onSuccess: spec-review
      onFailure: FAIL

    - id: spec-review
      type: APPROVAL
      approverRole: "PL"
      onSuccess: generate-code
      onFailure: FAIL

    - id: generate-code
      type: AGENT
      ref: testApp-codegen-agent
      onSuccess: dev-submit
      onFailure: FAIL

    - id: dev-submit
      type: APPROVAL
      approverRole: "developer"
      onSuccess: code-review
      onFailure: FAIL

    - id: code-review
      type: APPROVAL
      approverRole: "PL"
      onSuccess: trigger-jenkins
      onFailure: FAIL

    - id: trigger-jenkins
      type: TOOL
      ref: triggerBuild
      inputTemplate: '{"jobName":"testApp"}'
      onSuccess: SUCCESS
      onFailure: FAIL

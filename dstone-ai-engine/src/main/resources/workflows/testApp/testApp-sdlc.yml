# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# testApp 프로젝트를 대상으로 한 "승인형 AI SDLC" Workflow입니다(요구사항은 docs/temp/dongyang-plan.md
# 참고 - 8단계: 요청 접수 -> AI 분석/설계 -> 검수 -> AI 개발명세서 작성 -> PL 검토/승인 -> AI 기본 소스
# 생성 -> 개발자 제출 -> PL 최종 승인 -> Jenkins 파이프라인 기동). 테스트용 더미 프로젝트 testApp과
# Jenkins Job "testApp"을 대상으로 합니다.
#
# ## 단계 사이에 무엇이 넘어가는가
# 각 AGENT step은 input에 "무엇을 받을지"를 이름으로 명시합니다.
#   analyze       <- {{inputs.message}}                        (현업 요청사항 원문)
#   write-spec    <- {{steps.analyze.text}}                    (승인된 분석/설계서)
#                    {{steps.design-review.output.comment}}    (검수 의견)
#   generate-code <- {{steps.write-spec.text}}                 (승인된 개발명세서)
#                    {{steps.spec-review.output.comment}}      (PL 검토 의견)
# APPROVAL step은 받은 텍스트를 그대로 넘기고, 승인 코멘트는 output.comment에 따로 남깁니다. 그래서
# 다음 AGENT step은 문서 본문과 승인 코멘트를 섞이지 않은 채로 각각 받습니다.
#
# ## 반려되면 그 자리에서 종료한다
# 모든 승인 step의 onFailure는 FAIL입니다. 승인/반려 결정은 실행 컨텍스트의 approvals.{stepId}에
# 저장되고 그 실행이 끝날 때까지 유지되므로, 반려 뒤 앞 단계로 되돌아가서 같은 승인 step을 다시
# 만나면 새로 멈추지 않고 저장된 반려 결정을 다시 읽어 또 반려됩니다. 그래서 반려되면 사람이 반려
# 사유(실행 상세의 context.steps.{stepId}.error)를 확인한 뒤, 요청사항 원문에 그 사유를 반영해서
# 새 실행(execute/submit)을 시작하는 방식으로 처리합니다.
#
# ## caller 제한을 걸지 않은 이유
# 이 엔진은 지금 dstone.ai.security.auth.enabled=false(인증 꺼짐) 상태라 caller가 항상 null로
# 들어옵니다. allowedCallers를 채워두면 WorkFlowRegistry.resolve()가 "caller가 null이면 무조건 거부"로
# 판단해서 이 Workflow를 실행할 수 없게 됩니다(3개 Agent도 같은 이유로 allowedCallers를 비워뒀습니다).
# caller별 API Key 인증을 켤 때 같이 채워 넣습니다.
#
# ## 소스 자동 반영은 하지 않는다
# generate-code 단계는 코드를 "텍스트"로만 만듭니다(testApp-codegen-agent.yml 주석 참고) - 실제 파일이나
# Git 브랜치에 쓰는 Tool은 없습니다. dev-submit 승인 게이트는 "개발자가 그 코드를 검토해서 실제 testApp
# 프로젝트에 직접 반영하고, 다 됐으면 제출한다"는 사람의 행위를 감사 기록으로 남기는 역할입니다.
#
# ## dstone-boot "Workflow 테스트" 화면에서 실행하는 방법
#   workflowId: testApp-sdlc
#   message   : (현업 요청사항 원문 - 예: "회원 목록 화면에 가입일자 검색 조건을 추가해줘")
# 제출하면 analyze가 끝난 뒤 WAITING_APPROVAL(design-review)로 멈춥니다. "Workflow 실행 관리" 화면에서
# status=WAITING_APPROVAL로 걸어두면 보이고, 승인/반려를 내리면 다음 단계로 진행되거나(승인) 그 자리에서
# 종료됩니다(반려). 모든 승인을 통과하면 마지막에 Jenkins Job "testApp" 빌드가 실제로 기동됩니다
# (tools.jenkins.JenkinsTriggerBuildTool, conf/application.yml의 dstone.ai.tool.jenkins.* 설정 참고).
# 실행할 때마다 실제로 빌드가 일어나므로, 테스트 목적이라면 code-review 단계에서 일부러 반려해서
# Jenkins 기동 전에 멈추는 것도 방법입니다.
#
# API로 직접 확인해보고 싶다면:
#   POST /api/ai/workflow/testApp-sdlc/submit { "message": "..." }
#   GET  /api/ai/workflow/executions?status=WAITING_APPROVAL
#   POST /api/ai/workflow/executions/{executionId}/decision
#        { "approved": true, "approver": "business-reviewer", "comment": "..." }
workflow:
  id: testApp-sdlc
  description: testApp 대상 승인형 AI SDLC(분석-검수-명세-승인-소스생성-제출-최종승인-Jenkins 기동).
  maxIterations: 10
  steps:

    - id: analyze
      type: AGENT
      ref: testApp-analysis-agent
      input: "{{inputs.message}}"
      onSuccess: design-review
      onFailure: FAIL

    - id: design-review
      type: APPROVAL
      approverRole: "business-reviewer"
      onSuccess: write-spec
      onFailure: FAIL

    - id: write-spec
      type: AGENT
      ref: testApp-spec-writer-agent
      input: |
        [승인된 분석/설계서]
        {{steps.analyze.text}}

        [검수 의견]
        {{steps.design-review.output.comment}}
      onSuccess: spec-review
      onFailure: FAIL

    - id: spec-review
      type: APPROVAL
      approverRole: "PL"
      onSuccess: generate-code
      onFailure: FAIL

    - id: generate-code
      type: AGENT
      ref: testApp-codegen-agent
      input: |
        [승인된 개발명세서]
        {{steps.write-spec.text}}

        [PL 검토 의견]
        {{steps.spec-review.output.comment}}
      onSuccess: dev-submit
      onFailure: FAIL

    - id: dev-submit
      type: APPROVAL
      approverRole: "developer"
      onSuccess: code-review
      onFailure: FAIL

    - id: code-review
      type: APPROVAL
      approverRole: "PL"
      onSuccess: trigger-jenkins
      onFailure: FAIL

    - id: trigger-jenkins
      type: TOOL
      ref: triggerBuild
      input:
        jobName: testApp
      onSuccess: SUCCESS
      onFailure: FAIL

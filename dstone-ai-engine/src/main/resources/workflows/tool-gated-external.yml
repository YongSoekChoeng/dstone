# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# 화이트리스트가 있어야만 동작하는 위험 Tool 3개(httpGet/runShellScript/runPythonScript)를 전부
# 한 번씩 호출해보는 테스트 전용 Workflow다. conf/application.yml의 dstone.ai.tool.http.allowed-hosts/
# .shell.allowed-commands/.python.allowed-scripts가 전부 비어있으면(기본값) 셋 다 deny-by-default로
# "실패: ..."를 돌려주는 게 정상이다(tools.http.HttpCallTool/tools.shell.ShellExecTool/
# tools.python.PythonExecTool 클래스 주석 참고 - 별도 on/off 플래그가 없고 화이트리스트가 비어있는
# 것 자체가 비활성 상태다).
#
# 그래서 이 Workflow는 개별 step이 실패해도 onFailure로 다음 step으로 그냥 넘어가게 구성했다 - 전체
# 결과(SUCCESS/FAIL)가 아니라, dstone-boot "관리자 > Workflow 실행 관리" 화면의 실행 상세(스텝별
# 이력)에서 세 Tool 각각이 지금 화이트리스트 설정 기준으로 통과/실패했는지 확인하는 게 이 Workflow의
# 목적이다. 화이트리스트를 채워서(예: httpGet에 dstone.ai.tool.http.allowed-hosts: ["example.com"])
# 다시 호출해보면 그 step만 성공으로 바뀌는 걸 확인할 수 있다.
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: tool-gated-external
#   message   : (아무 문자열이나 - 이 Workflow의 step들은 message를 안 씀)
workflow:
  id: tool-gated-external
  description: httpGet/runShellScript/runPythonScript deny-by-default 확인용 Workflow. 화이트리스트 미설정 시 각 step이 실패하는 게 정상이다.
  maxIterations: 4
  steps:

    - id: http-check
      type: TOOL
      ref: httpGet
      inputTemplate: '{"url":"https://example.com"}'
      onSuccess: shell-check
      onFailure: shell-check

    - id: shell-check
      type: TOOL
      ref: runShellScript
      inputTemplate: '{"scriptName":"sample-script","args":[]}'
      onSuccess: python-check
      onFailure: python-check

    - id: python-check
      type: TOOL
      ref: runPythonScript
      inputTemplate: '{"scriptName":"sample-script","args":[]}'
      onSuccess: SUCCESS
      onFailure: SUCCESS

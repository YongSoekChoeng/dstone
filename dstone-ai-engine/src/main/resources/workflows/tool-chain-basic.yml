# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# TOOL step 2개를 순서대로 이어서(validateSqlSyntax -> getCurrentDateTime), LLM 호출 없이도 TOOL
# step 자체와 step 간 연결(runtime.step.ToolStepRunner, runtime.runtime.tool.ToolExecutor)이 정상
# 동작하는지 확인하기 위한 테스트 전용 Workflow다. 둘 다 화이트리스트 없이 항상 동작하는 Tool이라
# (tools.sql.SqlSyntaxTool/tools.sample.DateTimeTool), API 비용/네트워크 의존 없이 바로 돌려볼 수 있다.
#
# validate step의 inputTemplate '{"sql":"{previous}"}'의 {previous}는 최초 실행에서는 message 원문이다
# (api.service.WorkFlowExecutionService가 Constants.WorkFlow.PREVIOUS_TEXT_VARIABLE_KEY(__previous)를
# message로 초기화해둔다) - 그래서 message 자리에 SQL 문을 넣어 호출해야 한다.
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: tool-chain-basic
#   message   : SELECT 1 FROM dual
# message를 "SELECT * FROM WRONG SYNTAX ("처럼 문법이 깨진 SQL로 바꿔서 호출하면 validate에서 바로
# FAIL로 끝나는 것도 확인할 수 있다(이 Workflow는 재작성 루프가 없다 - 루프는 workflows/loop-retry-until-valid.yml 참고).
workflow:
  id: tool-chain-basic
  description: TOOL step 2개(validateSqlSyntax→getCurrentDateTime) 연속 실행 확인용 Workflow. LLM 비용 없이 항상 성공한다(SQL이 올바르면).
  maxIterations: 3
  steps:

    - id: validate
      type: TOOL
      ref: validateSqlSyntax
      inputTemplate: '{"sql":"{previous}"}'
      onSuccess: now
      onFailure: FAIL

    - id: now
      type: TOOL
      ref: getCurrentDateTime
      inputTemplate: '{}'
      onSuccess: SUCCESS
      onFailure: FAIL

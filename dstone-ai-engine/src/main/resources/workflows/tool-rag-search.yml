# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# TOOL step 1개(searchDocuments, tools.rag.RagSearchTool)로 RAG를 "LLM 호출 없이 순수 검색"만
# 하는 경로를 확인하기 위한 테스트 전용 Workflow다. common.rag.RagRetrievalChain을 AGENT의 ragEnabled
# Advisor 경로가 아니라 TOOL step에서 직접 호출하는 경우다(StepType.RAG가 없어진 자리를 이 Tool이
# 대신한다 - tools.rag.RagSearchTool 클래스 주석 참고).
#
# dstone.ai.rag.enabled=false(기본값)면 tools.rag.RagSearchTool이 "실패: RAG가 비활성화되어
# 있습니다..." 텍스트를 돌려주고(ToolStepRunner가 접두사 "실패"를 보고 실패로 판정), 이 Workflow는
# 정상적으로 FAILED로 끝난다 - RAG가 꺼져있을 때의 정상 동작이다. dstone.ai.rag.enabled=true인데
# 아직 검색 결과가 없으면 "검색 결과가 없습니다."라는 텍스트로 오히려 SUCCESS 처리된다("실패"로 시작하지
# 않으므로) - 참고자료가 실제로 검색되는 걸 보려면 먼저 dstone-boot "문서 임베딩 관리" 화면(POST
# /api/ai/embed/documents)에서 문서를 하나 적재한 뒤 다시 호출한다.
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: tool-rag-search
#   message   : (적재한 문서에 실제로 있는 키워드)
workflow:
  id: tool-rag-search
  description: TOOL step으로 RAG 검색만 직접 호출(LLM 없음). RAG가 꺼져있거나 적재된 문서가 없으면 FAIL이 정상이다.
  maxIterations: 2
  steps:

    - id: search
      type: TOOL
      ref: searchDocuments
      inputTemplate: '{"query":"{previous}"}'
      onSuccess: SUCCESS
      onFailure: FAIL

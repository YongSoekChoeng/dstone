# 어플리케이션 운영관리 Workflow입니다. 요청서(00-request.md)에서 시작해 요구사항 → 영향도 분석 → 리뷰 → 설계 → 구현까지 진행합니다.
#
# 경로가 둘입니다(2026-10-08). step00이 요청서를 읽으면 classify(ROUTER)가 요청서의 말만 보고 경로를 고릅니다.
#   일반      오류 수정이나 기능 변경이 하나라도 있는 요청. 아래 "흐름"의 step01~step07을 그대로 탑니다.
#   신규개발  없는 메뉴/화면/테이블을 새로 만드는 요청. 이 파일 아래쪽의 new* step들을 탑니다("신규 개발 경로" 주석 참고).
# 분류하지 못하면(classify 실패) 일반 경로로 갑니다. 일반 경로의 Agent들은 신규 개발이 섞인 요청도 다룰 수 있습니다.
#
# 흐름 (일반 경로)
#   step00 요청서 읽기(LLM 없이) → classify 경로 고르기 → step01 요구사항 분석 → step02 영향도 분석 → step03 리뷰(자동 판정) → step04 사람의 결정
#     step04에서 고르는 것        가는 곳
#     진행                        step05 (설계)
#     재요구분석                  step00 → step01 (요구사항 정의서부터 틀렸을 때. 요청서를 다시 읽고, Agent가 지적 사항을 반영해 요구사항을 다시 쓰고, 영향도 분석과 리뷰도 다시 함)
#     재분석                      step02 (Agent가 지적 사항을 반영해 영향도 분석을 다시 함)
#     재리뷰                      step03 (01-requirements.md나 02-impact.md를 사람이 직접 고친 뒤, 리뷰만 다시 받음)
#     중단                        FAIL
#   step05 설계 → step06 승인/반려 → step07 구현
#
# 어디로 돌아갈지는 step03의 reason 첫 줄을 보고 정합니다. 리뷰 Agent가 "[수정 대상: 요구사항 정의서]"처럼
# 어느 문서를 고쳐야 하는지 적어 줍니다. 요구사항이 틀렸는데 재분석(step02)만 반복하면 같은 불통과가 계속 나옵니다.
#
# step04는 선택지 방식 APPROVAL입니다(routes). 갈 곳이 여럿이라 승인/반려 둘로는 나눌 수 없어서 이름을 골라 가게 했습니다.
# step03(리뷰)은 통과든 불통과든 step04로 갑니다. 리뷰 결과는 참고 자료이고, 어떻게 할지는 사람이 정합니다.
#
# 재분석할 때 지적 사항이 전달되는 길
#   step01과 step02의 input.feedback이 step03의 불통과 사유(.steps.step03.output.reason)와 step04에서 사람이 적은 의견
#   (.steps.step04.output.comment)을 모아서 넘깁니다. 처음 실행할 때는 둘 다 아직 없어서 빈 글자가 됩니다.
#   그래서 step04에서 "재요구분석"이나 "재분석"을 고를 때는 comment에 무엇을 고쳐야 하는지 적어 주는 것이 좋습니다.
#
# step00을 둔 이유
#   요청서는 모든 Agent가 가장 먼저 읽는 파일입니다. Agent에게 읽으라고 하면 Agent마다 "LLM 호출 → readFile → 다시 LLM 호출"로
#   LLM 호출이 한 번씩 더 나갑니다. 읽을 파일이 정해져 있으니 TOOL step이 LLM 없이 한 번 읽어 두고, 그 내용을 각 Agent의
#   input.request로 넘깁니다. 요청서가 없으면 LLM을 부르기 전에 여기서 바로 실패합니다.
#   리뷰(step03)에는 넘기지 않습니다. 리뷰는 사람이 고친 문서를 다시 볼 수 있어야 해서 항상 파일에서 직접 읽습니다.
#   실행 도중에 요청서를 고쳤으면 "재요구분석"을 고르십시오. 그래야 step00이 요청서를 다시 읽습니다
#   (재영향도분석/재설계는 처음 읽어 둔 요청서를 그대로 씁니다).
#   이때 classify도 다시 거칩니다. 요청서를 신규 개발만 남게 고쳤다면 신규 개발 경로로 넘어갑니다.
#
# 같은 step04에 여러 번 돌아와도 됩니다. 결정은 한 번 쓰고 지우므로 올 때마다 사람에게 다시 묻습니다.
# 되돌아가는 횟수는 maxIterations가 막습니다(재분석 한 바퀴 = step02, step03, step04 세 번. 재요구분석은 step00, step01까지 다섯 번).
workflow:
  id: pilot-workflow
  description: |
   어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00-request.md 파일의 경로를(파일명 제외) 입력하라. 
   요청서에는 '소스경로'와, 그 소스를 dstone-knowledge에 분석해 두었다면 '프로젝트ID'를 적는다.
   예)
   D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
  maxIterations: 100
  input: string
  output: 
    # 실행된 step의 output을 step id별로 모은다. 각 Agent가 본문은 파일로 저장하고 요약만 돌려주므로 결과가 작다.
    # newPack과 newRead는 뺀다. 파일의 내용을 통째로 읽어 둔 것이라 결과에 넣으면 수십만 자가 된다.
    value: "${ .steps | del(.newPack, .newRead) | map_values(.output) }"
  
  # input: 수정아이디 경로. 예)D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
  steps:
    
    # 요청서 읽기 (LLM을 부르지 않는다. 읽은 내용은 뒤의 Agent들이 input.request로 받는다)
    - id: step00
      type: TOOL
      ref: readFile
      input:
        fileFullPath: '${ .input + "/00-request.md" }'
      onSuccess: classify
      onFailure: FAIL

    # 경로 고르기 (요청서의 말만 보고 고른다. Tool도 추론도 쓰지 않는 짧은 호출 한 번이다)
    - id: classify
      type: ROUTER
      ref: pilot-request-router-agent
      input: "${ .steps.step00.output }"
      routes:
        신규개발: newRef
        일반: step01
      onFailure: step01

    ##########################################################################################
    # 일반 경로 (오류 수정 / 기능 변경 / 유형이 섞인 요청)
    ##########################################################################################

    # 요구사항 분석 (재요구분석으로 돌아왔을 때는 feedback에 리뷰 사유와 사람의 의견이 담긴다)
    - id: step01
      type: AGENT
      ref: pilot-requirment-analyzer-agent
      input: 
        workDir: "${ .input }"
        request: "${ .steps.step00.output }"
        feedback: '${ [.steps.step03.output.reason, .steps.step04.output.comment] | map(select(. != null and . != "")) | join("\n") }'
      onSuccess: step02
      onFailure: FAIL

    # 영향도 분석 (재분석으로 돌아왔을 때는 feedback에 리뷰 사유와 사람의 의견이 담긴다)
    - id: step02
      type: AGENT
      ref: pilot-impact-analyzer-agent
      input: 
        workDir: "${ .input }"
        request: "${ .steps.step00.output }"
        feedback: '${ [.steps.step03.output.reason, .steps.step04.output.comment] | map(select(. != null and . != "")) | join("\n") }'
      onSuccess: step03
      onFailure: FAIL
      
    # 요구사항/영향도 분석문서 리뷰 (통과든 불통과든 사람에게 넘긴다)
    - id: step03
      type: SUPERVISOR
      ref: pilot-impact-analyzer-review-agent
      input:
        workDir: "${ .input }"
      onSuccess: step04
      onFailure: step04
      
    # 분석문서를 본 사람이 다음에 할 일을 고른다
    - id: step04
      type: APPROVAL
      approverRole: "PL"
      routes:
        진행: step05
        재요구분석: step00
        재영향도분석: step02
        재영향도분석리뷰: step03
        중단: FAIL
      
    # 아키텍처 설계
    - id: step05
      type: AGENT
      ref: pilot-architect-agent
      input: 
        workDir: "${ .input }"
        request: "${ .steps.step00.output }"
      onSuccess: step06
      onFailure: FAIL
      
    # 설계문서 승인
    - id: step06
      type: APPROVAL
      approverRole: "PL"
      routes:
        진행: step07
        재요구분석: step00
        재영향도분석: step02
        재영향도분석리뷰: step03
        재설계: step05
        중단: FAIL
      
    # 구현
    - id: step07
      type: AGENT
      ref: pilot-developer-agent
      input: 
        workDir: "${ .input }"
        request: "${ .steps.step00.output }"
      onSuccess: SUCCESS
      onFailure: FAIL

    ##########################################################################################
    # 신규 개발 경로
    #
    #   newRef 참고 구현 고르기 → newRefExist/newPack 그 파일들을 한 번만 읽어 두기(LLM 없이)
    #   → newAnalyze 요구사항 + 구성 정의(LLM 1회) → newExist/newCheck 코드로 검증 → newReqDoc/newImpactDoc 문서 만들기
    #   → newApprove 사람의 결정 → newDesign 파일별 설계(파일마다 LLM 1회) → newDesignCheck 코드로 검증 → newDesignDoc
    #   → newDesignApprove 사람의 결정 → newCopy/newCreate/newEdit/newAppend 정해진 변경을 코드로 적용(LLM 없이) → newRead 복사한 파일 읽기
    #   → newDevelop 빼는 것/더하는 것을 줄 번호로 정하기(필요한 새 파일마다 LLM 1회) → newApply 그 변경을 코드로 적용 → newTasksDoc
    #
    # 일반 경로와 다른 점
    # - 참고 구현의 파일은 newPack이 한 번만 읽습니다. 뒤의 Agent는 그 내용을 input으로 받으므로 조회 Tool이 없습니다.
    #   일반 경로에서는 요구사항/영향도/리뷰/설계/개발 Agent가 같은 파일을 각자 다시 열었습니다.
    # - Agent는 문서(md)를 쓰지 않고 데이터(JSON)만 냅니다. 01-requirements.md, 02-impact.md, 04-design.md, 04-tasks.md는
    #   TOOL step(writeFile)이 jq로 그 데이터를 틀에 끼워 만듭니다. 긴 문서를 writeFile 인자로 쓰다가 출력 토큰 한도에 걸리는 일이 없습니다.
    #   그래서 이 문서들은 사람이 직접 고쳐도 다음 단계에 반영되지 않습니다. 고칠 것은 승인 단계의 의견(comment)에 적습니다.
    # - "FR마다 변경 대상이 있는가", "수정할 파일이 있는가", "변경 전이 파일에 정확히 한 번 나오는가"는 LLM이 아니라 jq가 확인합니다
    #   (newCheck, newDesignCheck). 결과는 02-impact-check.md / 04-design-check.md에 남고, 문서의 '자동 검증 결과'에도 들어가며,
    #   사람이 재분석/재설계를 고르면 그 내용이 Agent의 feedback으로 넘어갑니다.
    #   자동으로 다시 시키지는 않습니다(걸릴 때마다 되돌리면 같은 잘못을 되풀이하는 동안 maxIterations까지 돕니다). 다시 시킬지는 사람이 정합니다.
    # - 리뷰 Agent(SUPERVISOR)가 없습니다. 신규 개발에서는 리뷰가 확인하던 것의 대부분(범위, FR 매핑, 경로가 실제로 있는지)을 위의 검증이 대신합니다.
    # - 구현에서 정해진 변경은 LLM이 하지 않습니다. 설계가 낸 이름 바꿈 표(renames)는 newCopy(copyFileWithReplace)가,
    #   변경 전/변경 후(edits)는 newEdit(replaceInFile)와 newAppend(appendFile)가 그대로 적용합니다. LLM(newDevelop)은 새 파일에서
    #   빼는 것과 더하는 것을 "몇 번째 줄을 어떻게"로 정하기만 하고, 그 변경도 newApply(editFileLines)가 적용합니다.
    #   예전에는 개발 Agent가 파일 전체를 writeFile 인자로 다시 썼습니다.
    # - 설계와 구현은 forEach로 파일마다 새 대화에서 따로 합니다. 요청이 커지면 호출 수가 늘 뿐 한 호출의 크기는 그대로입니다.
    #   forEach는 동시에 실행되므로 변경 대상에 같은 파일이 두 번 들어 있으면 안 됩니다(newCheck가 잡습니다).
    #
    # 검증 결과를 TOOL step의 input에서 읽는 이유(.steps.newCheck.input.fileContents)
    #   writeFile의 output은 "저장했다"는 말뿐입니다. 저장한 내용은 그 step의 input에 남아 있어서, 뒤의 step이 거기서 읽습니다.
    ##########################################################################################

    # 참고 구현 고르기 (파일 경로만 모은다. 내용은 읽지 않는다)
    - id: newRef
      type: AGENT
      ref: pilot-newdev-reference-agent
      input:
        request: "${ .steps.step00.output }"
        feedback: '${ .steps.newApprove.output.comment // "" }'
      onSuccess: newRefExist
      onFailure: FAIL

    # 참고 구현 파일이 실제로 있는지 (LLM 없이, 파일마다 한 번)
    - id: newRefExist
      type: TOOL
      ref: isFileExist
      forEach: "${ .steps.newRef.output.files }"
      input:
        filePath: "${ $item.path }"
      onSuccess: newPack
      onFailure: FAIL

    # 참고 구현 파일을 한 번만 읽어 둔다 (LLM 없이. 있는 파일만, 같은 경로는 한 번만)
    #   steps.newPack.input[n].fileFullPath가 경로, steps.newPack.output[n]이 그 파일의 내용이다.
    #   큰 파일은 앞부분만 온다(dstone.ai.tool.file.max-read-chars). 그때는 내용 끝에 잘렸다는 안내가 붙는다.
    - id: newPack
      type: TOOL
      ref: readFile
      forEach: "${ [.steps.newRef.output.files, .steps.newRefExist.output] | transpose | map(select(.[1] == true) | .[0]) | unique_by(.path) }"
      input:
        fileFullPath: "${ $item.path }"
      onSuccess: newAnalyze
      onFailure: FAIL

    # 요구사항 + 구성 정의 (LLM 1회, Tool 없음. 재분석으로 돌아왔을 때는 feedback에 자동 검증 결과와 사람의 의견이 담긴다)
    - id: newAnalyze
      type: AGENT
      ref: pilot-newdev-analyzer-agent
      input:
        request: "${ .steps.step00.output }"
        reference: "${ .steps.newRef.output }"
        sources: |
          ${ [.steps.newPack.input, .steps.newPack.output] | transpose
             | map("===== 파일: " + .[0].fileFullPath + " =====\n" + (.[1] | tostring))
             | join("\n\n") }
        feedback: |
          ${ [ (.steps.newCheck.input.fileContents | select(. != null and . != "문제 없음")),
               .steps.newApprove.output.comment,
               .steps.newDesignApprove.output.comment ]
             | map(select(. != null and . != "")) | join("\n") }
      onSuccess: newExist
      onFailure: FAIL

    # 변경 대상 파일이 지금 있는지 (LLM 없이. 신규는 없어야 하고 수정은 있어야 한다. 판단은 newCheck가 한다)
    - id: newExist
      type: TOOL
      ref: isFileExist
      forEach: "${ .steps.newAnalyze.output.targets }"
      input:
        filePath: "${ $item.path }"
      onSuccess: newCheck
      onFailure: FAIL

    # 코드로 검증 (LLM 없이). 걸린 것을 02-impact-check.md에 적는다. 없으면 "문제 없음" 한 줄이다.
    - id: newCheck
      type: TOOL
      ref: writeFile
      input:
        filePath: '${ .input + "/02-impact-check.md" }'
        fileContents: |
          ${ (.steps.newAnalyze.output // {}) as $o
             | ($o.requirements // [] | map(.id)) as $frIds
             | ($o.targets // []) as $targets
             | ([.steps.newPack.input[]?.fileFullPath]) as $read
             | [ ( [.steps.newRef.output.files // [], .steps.newRefExist.output // []] | transpose | .[]
                   | select(.[1] != true) | "참고 구현 파일로 적힌 경로에 파일이 없습니다: " + (.[0].path | tostring) ),
                 ( if ($targets | length) == 0 then "변경 대상이 하나도 없습니다." else empty end ),
                 ( $o.scope // [] | .[] | select((.frs // []) | length == 0)
                   | "요청 범위에 FR이 없는 항목이 있습니다: " + (.item | tostring) ),
                 ( $frIds[] | . as $id | select([$targets[] | (.frs // [])[] | select(. == $id)] | length == 0)
                   | "FR에 대응하는 변경 대상이 없습니다: " + ($id | tostring) ),
                 ( $targets[] | . as $t | ($t.frs // [])[] | . as $id | select([$frIds[] | select(. == $id)] | length == 0)
                   | "변경 대상이 요구사항에 없는 FR을 가리킵니다: " + ($t.path | tostring) + " → " + ($id | tostring) ),
                 ( $targets | group_by(.path) | .[] | select(length > 1)
                   | "같은 파일이 변경 대상에 두 번 들어 있습니다: " + (.[0].path | tostring) ),
                 ( [$targets, .steps.newExist.output // []] | transpose | .[] | . as $pair | $pair[0]
                   | if .changeType == "신규" and $pair[1] == true then "신규라고 했는데 이미 있는 파일입니다: " + (.path | tostring)
                     elif .changeType == "수정" and $pair[1] != true then "수정이라고 했는데 없는 파일입니다: " + (.path | tostring)
                     else empty end ),
                 ( $targets[] | select(.changeType == "수정") | .path as $p | select([$read[] | select(. == $p)] | length == 0)
                   | "수정 대상인데 내용을 읽어 두지 않은 파일입니다(참고 구현의 파일 목록에 없습니다): " + ($p | tostring) ),
                 ( $targets[] | select((.referencePath // "") != "") | .referencePath as $p | select([$read[] | select(. == $p)] | length == 0)
                   | "본뜰 참고 파일로 적었는데 읽어 둔 파일 목록에 없습니다: " + ($p | tostring) )
               ]
             | if length == 0 then "문제 없음" else map("- " + .) | join("\n") end }
      onSuccess: newReqDoc
      onFailure: FAIL

    # 요구사항 정의서 만들기 (LLM 없이. newAnalyze가 낸 데이터를 틀에 끼운다)
    - id: newReqDoc
      type: TOOL
      ref: writeFile
      input:
        filePath: '${ .input + "/01-requirements.md" }'
        fileContents: |
          ${ def c: tostring | gsub("\\|"; "/") | gsub("\r?\n"; " ");
             def lines: (. // []) | if length == 0 then "없음" else map("- " + tostring) | join("\n") end;
             (.steps.newAnalyze.output // {}) as $o
             | (.steps.newRef.output // {}) as $r
             | "# 요구사항 정의서\n\n"
               + "> Agent가 낸 데이터를 Workflow가 틀에 끼워 만든 문서입니다. 이 파일을 고쳐도 다음 단계에 반영되지 않습니다. 고칠 것은 승인 단계에서 '재분석'을 고르고 의견에 적으십시오.\n\n"
               + "## 배경/목적\n" + ($o.background // "") + "\n\n"
               + "## 요청 범위\n| 번호 | 요청서의 메뉴/기능 | 유형 | 다루는 FR |\n|---|---|---|---|\n"
               + ($o.scope // [] | to_entries | map("| " + (.key + 1 | tostring) + " | " + (.value.item | c) + " | 신규 개발 | " + (.value.frs // [] | join(", ")) + " |") | join("\n")) + "\n\n"
               + "## 확인한 사실\n"
               + "- 같은 기능이 이미 있는지: " + ($r.existing // "미확인") + "\n"
               + "- 참고 구현: " + ($r.referenceName // "") + "\n"
               + "- 참고 구현의 흐름: " + ($r.entry // "") + "\n\n"
               + "## 기능 요구사항\n"
               + ($o.requirements // [] | map("### " + (.id | tostring) + " " + (.title // "") + "\n- Given: " + (.given // "-") + "\n- When: " + (.when // "-") + "\n- Then: " + (.["then"] // "-")) | join("\n\n")) + "\n\n"
               + "## 비기능 요구사항\n" + ($o.nonFunctional | lines) + "\n\n"
               + "## 범위 제외 항목\n" + ($o.outOfScope | lines) + "\n\n"
               + "## 확인 필요 질문\n" + ((($r.questions // []) + ($o.questions // [])) | lines) + "\n" }
      onSuccess: newImpactDoc
      onFailure: FAIL

    # 영향도 분석서 만들기 (LLM 없이. 맨 위에 자동 검증 결과가 들어간다)
    - id: newImpactDoc
      type: TOOL
      ref: writeFile
      input:
        filePath: '${ .input + "/02-impact.md" }'
        fileContents: |
          ${ def c: tostring | gsub("\\|"; "/") | gsub("\r?\n"; " ");
             def lines: (. // []) | if length == 0 then "없음" else map("- " + tostring) | join("\n") end;
             (.steps.newAnalyze.output // {}) as $o
             | (.steps.newRef.output // {}) as $r
             | "# 영향도 분석서 (신규 개발)\n\n"
               + "> Agent가 낸 데이터를 Workflow가 틀에 끼워 만든 문서입니다. 이 파일을 고쳐도 다음 단계에 반영되지 않습니다. 고칠 것은 승인 단계에서 '재분석'을 고르고 의견에 적으십시오.\n\n"
               + "## 자동 검증 결과\n" + (.steps.newCheck.input.fileContents // "검증하지 않음") + "\n\n"
               + "## FR별 대응\n| FR | 요구사항 | 변경 대상 파일 |\n|---|---|---|\n"
               + ($o.requirements // [] | map(. as $f | "| " + ($f.id | c) + " | " + ($f.title // "" | c) + " | "
                   + ([($o.targets // [])[] | select([(.frs // [])[] | select(. == $f.id)] | length > 0) | .path | c] | join("<br>")) + " |") | join("\n")) + "\n\n"
               + "## 참고 구현: " + ($r.referenceName // "") + "\n"
               + "| 층 | 참고 구현의 파일 | 클래스.메서드 / 쿼리ID / 테이블 | 새 기능에 | 이유 |\n|---|---|---|---|---|\n"
               + ($o.layers // [] | map("| " + (.layer // "" | c) + " | " + (.referencePath // "" | c) + " | " + (.symbol // "" | c) + " | " + (.decision // "" | c) + " | " + (.reason // "" | c) + " |") | join("\n")) + "\n\n"
               + "## 변경 대상\n| 파일 | 유형 | 본뜰 참고 파일 | 변경 내용 | FR |\n|---|---|---|---|---|\n"
               + ($o.targets // [] | map("| " + (.path // "" | c) + " | " + (.changeType // "" | c) + " | " + (.referencePath // "" | c) + " | " + (.change // "" | c) + " | " + (.frs // [] | join(", ")) + " |") | join("\n")) + "\n\n"
               + "## 함께 쓰는 이름\n| 무엇 | 새 이름 | 참고 구현의 이름 |\n|---|---|---|\n"
               + ($o.sharedNames // [] | map("| " + (.what // "" | c) + " | " + (.name // "" | c) + " | " + (.from // "" | c) + " |") | join("\n")) + "\n\n"
               + "## 영향 받는 기존 기능\n" + ($o.impacts | lines) + "\n\n"
               + "## 위험 요소와 회귀 테스트 대상\n" + ($o.risks | lines) + "\n" }
      onSuccess: newApprove
      onFailure: FAIL

    # 요구사항과 구성을 본 사람이 다음에 할 일을 고른다 (재분석/참고구현재조사는 comment에 무엇을 고칠지 적는다)
    - id: newApprove
      type: APPROVAL
      approverRole: "PL"
      routes:
        진행: newDesign
        재분석: newAnalyze
        참고구현재조사: newRef
        중단: FAIL

    # 파일별 설계 (변경 대상 파일마다 새 대화로 LLM 1회, Tool 없음)
    #   일부 파일의 설계가 실패해도 검증으로 넘긴다. 실패한 파일은 04-design-check.md에 적히고, 사람이 재설계를 고를 수 있다.
    - id: newDesign
      type: AGENT
      ref: pilot-newdev-file-designer-agent
      forEach: "${ .steps.newAnalyze.output.targets }"
      input:
        request: "${ .steps.step00.output }"
        requirements: "${ .steps.newAnalyze.output.requirements }"
        target: "${ $item }"
        plan: "${ .steps.newAnalyze.output | with_entries(select(.key == \"targets\" or .key == \"sharedNames\")) }"
        referenceSource: |
          ${ ($item.referencePath // "") as $p
             | [.steps.newPack.input, .steps.newPack.output] | transpose
             | map(select(.[0].fileFullPath == $p) | .[1] | tostring) | .[0] // "" }
        currentSource: |
          ${ ($item.path // "") as $p
             | [.steps.newPack.input, .steps.newPack.output] | transpose
             | map(select(.[0].fileFullPath == $p) | .[1] | tostring) | .[0] // "" }
        feedback: |
          ${ [ (.steps.newDesignCheck.input.fileContents | select(. != null and . != "문제 없음")),
               .steps.newDesignApprove.output.comment ]
             | map(select(. != null and . != "")) | join("\n") }
      onSuccess: newDesignCheck
      onFailure: newDesignCheck

    # 설계를 코드로 검증 (LLM 없이). 걸린 것을 04-design-check.md에 적는다. 없으면 "문제 없음" 한 줄이다.
    #   줄바꿈 방식(CRLF/LF)이 달라서 못 찾는 일이 없게 양쪽에서 CR을 떼고 견준다.
    - id: newDesignCheck
      type: TOOL
      ref: writeFile
      input:
        filePath: '${ .input + "/04-design-check.md" }'
        fileContents: |
          ${ ([.steps.newPack.input, .steps.newPack.output] | transpose
               | map({key: .[0].fileFullPath, value: (.[1] | tostring | gsub("\r"; ""))}) | from_entries) as $src
             | (.steps.newAnalyze.output.targets // []) as $targets
             | (.steps.newDesign.output // [] | map(select(. != null))) as $ds
             | [ ( .steps.newDesign.error // empty | "설계를 만들지 못한 파일이 있습니다: " + tostring ),
                 ( $targets[] | .path as $p | select([$ds[] | select(.path == $p)] | length == 0)
                   | "설계가 없는 변경 대상입니다: " + ($p | tostring) ),
                 ( $ds[] | select(.changeType == "신규") | select((.referencePath // "") == "" and ((.adds // []) | length) == 0)
                   | "신규 파일인데 본뜰 참고 파일도 넣을 내용도 없습니다: " + (.path | tostring) ),
                 ( $ds[] | select(.changeType == "수정") | select((.edits // []) | length == 0)
                   | "수정 파일인데 바꿀 곳이 없습니다: " + (.path | tostring) ),
                 ( $ds[] | select(.changeType == "수정") | . as $d | ($d.edits // [])[] | select(.append != true) | . as $e
                   | (($e.before // "") | gsub("\r"; "")) as $b
                   | if $b == "" then "파일 끝에 덧붙이는 변경이 아닌데 변경 전이 비어 있습니다: " + ($d.path | tostring) + " / " + ($e.location // "")
                     else (($src[$d.path] // "") | split($b) | length - 1) as $n
                       | if $n == 1 then empty
                         else "변경 전이 지금 파일에 " + ($n | tostring) + "번 나옵니다(정확히 한 번이어야 합니다): " + ($d.path | tostring) + " / " + ($e.location // "") end
                     end )
               ]
             | if length == 0 then "문제 없음" else map("- " + .) | join("\n") end }
      onSuccess: newDesignDoc
      onFailure: FAIL

    # 설계서 만들기 (LLM 없이. 파일별 설계를 모아 틀에 끼운다)
    - id: newDesignDoc
      type: TOOL
      ref: writeFile
      input:
        filePath: '${ .input + "/04-design.md" }'
        fileContents: |
          ${ def c: tostring | gsub("\\|"; "/") | gsub("\r?\n"; " ");
             def code: "```\n" + ((. // "") | tostring) + "\n```\n";
             (.steps.newDesign.output // [] | map(select(. != null))) as $ds
             | "# 설계서 (신규 개발)\n\n"
               + "> 파일별 설계 데이터를 Workflow가 틀에 끼워 만든 문서입니다. 이 파일을 고쳐도 구현에 반영되지 않습니다. 고칠 것은 승인 단계에서 '재설계'를 고르고 의견에 적으십시오.\n\n"
               + "## 자동 검증 결과\n" + (.steps.newDesignCheck.input.fileContents // "검증하지 않음") + "\n\n"
               + "## 결정이 필요한 사항\n"
               + ([$ds[] | . as $d | ($d.questions // [])[] | "- " + tostring + " (" + ($d.path | tostring) + ")"] | if length == 0 then "없음" else join("\n") end) + "\n\n"
               + ( $ds | to_entries | map(.value as $d
                   | "## " + (.key + 1 | tostring) + ". " + ($d.path | tostring) + "\n"
                     + "- 변경 유형: " + ($d.changeType // "") + "\n"
                     + "- 본뜰 참고 파일: " + (if ($d.referencePath // "") == "" then "없음" else $d.referencePath end) + "\n"
                     + "- 해결하는 FR: " + ($d.frs // [] | join(", ")) + "\n"
                     + "- 하는 일: " + ($d.summary // "") + "\n"
                     + "- 확인 방법: " + ($d.verify // "") + "\n"
                     + ( if ($d.renames // []) | length == 0 then ""
                         else "\n### 이름 바꿈 (참고 → 신규)\n| 무엇 | 참고 | 신규 |\n|---|---|---|\n"
                           + ($d.renames | map("| " + (.what // "" | c) + " | " + (.from // "" | c) + " | " + (.to // "" | c) + " |") | join("\n")) + "\n" end )
                     + ( if ($d.removes // []) | length == 0 then ""
                         else "\n### 빼는 것\n" + ($d.removes | map("- " + tostring) | join("\n")) + "\n" end )
                     + ( $d.adds // [] | map("\n### 더하는 것: " + (.where // "") + "\n" + (.content | code)) | join("") )
                     + ( $d.edits // [] | map("\n### 바꿀 곳: " + (.location // "") + (if .append == true then " (파일 끝에 덧붙임)" else "" end) + "\n"
                           + (if (.reason // "") == "" then "" else "이유: " + .reason + "\n" end)
                           + (if .append == true then "" else "\n변경 전\n" + (.before | code) end)
                           + "\n변경 후\n" + (.after | code)) | join("") )
                   ) | join("\n") ) }
      onSuccess: newDesignApprove
      onFailure: FAIL

    # 설계를 본 사람이 다음에 할 일을 고른다 (재설계/재분석은 comment에 무엇을 고칠지 적는다)
    - id: newDesignApprove
      type: APPROVAL
      approverRole: "PL"
      routes:
        진행: newCopy
        재설계: newDesign
        재분석: newAnalyze
        중단: FAIL

    # 새 파일 만들기 1 (LLM 없이): 본뜰 참고 파일을 복사하면서 설계의 이름 바꿈 표대로 글자를 바꾼다.
    #   대상 파일이 이미 있으면 그 파일은 실패한다(덮어쓰지 않는다). 일부가 실패해도 다음으로 넘어가고, 결과는 04-tasks.md에 적힌다.
    - id: newCopy
      type: TOOL
      ref: copyFileWithReplace
      forEach: '${ .steps.newDesign.output | map(select(. != null and .changeType == "신규" and (.referencePath // "") != "")) }'
      input:
        sourcePath: "${ $item.referencePath }"
        targetPath: "${ $item.path }"
        replacements: "${ $item.renames // [] }"
      onSuccess: newCreate
      onFailure: newCreate

    # 새 파일 만들기 1-2 (LLM 없이): 본뜰 파일이 없는 새 파일은 설계가 글자 그대로 적어 준 내용(adds)을 그대로 저장한다.
    - id: newCreate
      type: TOOL
      ref: writeFile
      forEach: '${ .steps.newDesign.output | map(select(. != null and .changeType == "신규" and (.referencePath // "") == "")) }'
      input:
        filePath: "${ $item.path }"
        fileContents: '${ $item.adds // [] | map(.content // "") | join("\n") }'
      onSuccess: newEdit
      onFailure: newEdit

    # 있는 파일 고치기 1 (LLM 없이): 설계의 변경 전을 변경 후로 바꾼다. 변경 전이 파일에 정확히 한 번 있을 때만 바뀐다.
    - id: newEdit
      type: TOOL
      ref: replaceInFile
      forEach: |
        ${ [ .steps.newDesign.output[] | select(. != null and .changeType == "수정") | . as $d
             | ($d.edits // [])[] | select(.append != true) | . as $e
             | $d | with_entries(select(.key == "path")) | .before = ($e.before // "") | .after = ($e.after // "") ] }
      input:
        filePath: "${ $item.path }"
        oldText: "${ $item.before }"
        newText: "${ $item.after }"
      onSuccess: newAppend
      onFailure: newAppend

    # 있는 파일 고치기 2 (LLM 없이): 파일 끝에 덧붙이는 변경. 덧붙일 내용이 줄바꿈으로 시작하지 않으면 줄바꿈을 앞에 넣는다.
    - id: newAppend
      type: TOOL
      ref: appendFile
      forEach: |
        ${ [ .steps.newDesign.output[] | select(. != null and .changeType == "수정") | . as $d
             | ($d.edits // [])[] | select(.append == true) | . as $e
             | $d | with_entries(select(.key == "path")) | .after = ($e.after // "") ] }
      input:
        filePath: "${ $item.path }"
        fileContents: '${ $item.after | if startswith("\n") or startswith("\r") then . else "\n" + . end }'
      onSuccess: newRead
      onFailure: newRead

    # 새 파일 만들기 2 준비 (LLM 없이): 복사한 새 파일 가운데 빼거나 더할 것이 있는 파일을 줄 번호와 함께 읽어 둔다.
    #   복사에 실패한 파일(대상이 이미 있었던 파일 등)은 읽지 않는다. 그런 파일은 여기서부터 건드리지 않는다.
    - id: newRead
      type: TOOL
      ref: readFileLines
      forEach: |
        ${ ([.steps.newCopy.input // [], .steps.newCopy.output // []] | transpose
             | map(select(.[1] // "" | tostring | startswith("복사했습니다")) | .[0].targetPath)) as $copied
           | .steps.newDesign.output | map(select(. != null and .changeType == "신규" and (.referencePath // "") != ""
               and (((.removes // []) | length) > 0 or ((.adds // []) | length) > 0))
             | select(.path as $p | ($copied | map(select(. == $p)) | length) > 0)) }
      input:
        fileFullPath: "${ $item.path }"
      onSuccess: newDevelop
      onFailure: newDevelop

    # 새 파일 만들기 2 (읽어 둔 파일마다 새 대화로 한 번씩. Tool 없이 LLM 1회)
    #   이름 바꿈은 newCopy가 끝냈다. 여기서는 빼는 것과 더하는 것을 "몇 번째 줄을 어떻게"로 정하기만 한다. 파일은 newApply가 고친다.
    #   Agent에 Tool을 주고 직접 고치게 했을 때는 같은 호출을 되풀이하거나 몇 분씩 걸렸다(24.newdev-file-developer-agent.yml의 주석).
    #   일부 파일이 실패해도 다음으로 넘긴다.
    - id: newDevelop
      type: AGENT
      ref: pilot-newdev-file-developer-agent
      forEach: |
        ${ .steps.newDesign.output as $designs
           | [ [.steps.newRead.input // [], .steps.newRead.output // []] | transpose | .[]
               | select(.[1] != null and (.[1] | tostring | startswith("실패") | not)) | . as $r
               | $designs[] | select(. != null and .path == $r[0].fileFullPath)
               | {design: ., source: ($r[1] | tostring)} ] }
      input:
        design: "${ $item.design }"
        source: "${ $item.source }"
      onSuccess: newApply
      onFailure: newApply

    # 새 파일 만들기 3 (LLM 없이): 위에서 정한 줄 번호 변경을 파일에 적용한다.
    #   한 파일의 변경은 모두 맞을 때만 한꺼번에 적용된다(줄 번호나 확인 글자가 하나라도 틀리면 그 파일은 복사한 모습 그대로 남는다).
    #   자동으로 다시 시키지 않는다. 결과는 04-tasks.md에 적히고 사람이 본다.
    - id: newApply
      type: TOOL
      ref: editFileLines
      forEach: |
        ${ [ [.steps.newDevelop.input // [], .steps.newDevelop.output // []] | transpose | .[]
             | select(.[1] != null and ((.[1].edits // []) | length) > 0)
             | {path: .[0].design.path, edits: .[1].edits} ] }
      input:
        filePath: "${ $item.path }"
        edits: "${ $item.edits }"
      onSuccess: newTasksDoc
      onFailure: newTasksDoc

    # 태스크 목록 만들기 (LLM 없이. 파일별 구현 결과를 모은다. 설계 한 건 = 파일 하나 = 태스크 하나)
    #   상태: 수정 파일은 그 파일의 변경이 모두 적용됐으면 완료. 새 파일은 복사가 실패했으면 실패, 편집 Agent가 불렸으면 그 변경 목록을
    #   적용한 결과(적용됐으면 완료, 적용됐지만 괄호의 짝이 달라졌거나 변경 목록이 비었으면 확인 필요, 안 됐으면 실패), 불리지 않았으면(이름만 바꾸면 되는 파일,
    #   내용을 그대로 저장한 파일) 복사/저장만으로 완료다.
    - id: newTasksDoc
      type: TOOL
      ref: writeFile
      input:
        filePath: '${ .input + "/04-tasks.md" }'
        fileContents: |
          ${ def c: tostring | gsub("\\|"; "/") | gsub("\r?\n"; " ");
             (.steps.newDesign.output // [] | map(select(. != null))) as $ds
             | ( ([.steps.newCopy.input // [], .steps.newCopy.output // []] | transpose | map({key: .[0].targetPath, value: (.[1] | tostring)}))
                 + ([.steps.newCreate.input // [], .steps.newCreate.output // []] | transpose | map({key: .[0].filePath, value: (.[1] | tostring)}))
                 | from_entries ) as $copy
             | ([.steps.newDevelop.input // [], .steps.newDevelop.output // []] | transpose
                 | map({key: .[0].design.path, value: (.[1] // {failed: true})}) | from_entries) as $dev
             | ([.steps.newApply.input // [], .steps.newApply.output // []] | transpose
                 | map({key: .[0].filePath, value: (.[1] // "" | tostring)}) | from_entries) as $apply
             | ([ ([.steps.newEdit.input // [], .steps.newEdit.output // []] | transpose | .[]),
                  ([.steps.newAppend.input // [], .steps.newAppend.output // []] | transpose | .[])
                | .[0] + {result: (.[1] | tostring)} ]) as $edits
             | ($ds | map(. as $d
                 | ($edits | map(select(.filePath == $d.path) | .result)) as $er
                 | ($copy[$d.path] // "") as $cr
                 | ($dev[$d.path]) as $dv
                 | ($apply[$d.path] // "") as $ar
                 | (($d.referencePath // "") != "" and ((($d.removes // []) | length) > 0 or (($d.adds // []) | length) > 0)) as $needEdit
                 | {path: $d.path, type: ($d.changeType // ""),
                    status: ( if $d.changeType == "수정" then
                                ( if ($er | length) == 0 then "변경 없음"
                                  elif ($er | map(select(startswith("실패"))) | length) > 0 then "실패" else "완료" end )
                              elif ($cr | startswith("실패")) then "실패"
                              elif $dv == null then (if $needEdit then "실패" else "완료" end)
                              elif $dv.failed == true then "실패"
                              elif (($dv.edits // []) | length) == 0 then "확인 필요"
                              elif ($ar | startswith("고쳤습니다")) then (if ($ar | contains("주의:")) then "확인 필요" else "완료" end)
                              else "실패" end ),
                    summary: ( if $d.changeType == "수정" then ($er | join(" / "))
                               elif ($cr | startswith("실패")) then ($cr | split("\n") | .[0] // "")
                               elif $dv == null then (if $needEdit then "복사한 파일을 읽지 못해 빼는 것과 더하는 것을 적용하지 못했습니다" else ($cr | split("\n") | .[0] // "") end)
                               elif $dv.failed == true then "편집 Agent 호출이 실패했습니다. 파일은 이름만 바꿔 복사한 모습 그대로입니다"
                               elif (($dv.edits // []) | length) == 0 then (($dv.summary // "") + " (변경 목록이 비어 있어 아무것도 바꾸지 않았습니다)")
                               elif ($ar | startswith("고쳤습니다")) then (($dv.summary // "") + (if ($ar | contains("주의:")) then " / " + ($ar | split("\n") | map(select(startswith("주의:"))) | join(" ")) else "" end))
                               else "변경 목록을 적용하지 못했습니다. 파일은 이름만 바꿔 복사한 모습 그대로입니다(이유는 아래 '실패한 호출'). 하려던 변경: " + ($dv.summary // "") end ),
                    questions: ($dv.questions // [])})) as $rows
             | "# 태스크 목록 (신규 개발)\n\n"
               + "> 파일별 구현 결과를 Workflow가 모아 만든 문서입니다. 컴파일과 실행 검증은 하지 않았습니다. 사람이 확인해야 합니다.\n\n"
               + "| 번호 | 대상 파일 | 유형 | 상태 | 구현 요약 |\n|---|---|---|---|---|\n"
               + ($rows | to_entries | map("| TASK-" + (.key + 1 | tostring) + " | " + (.value.path | c) + " | " + (.value.type | c)
                   + " | " + (.value.status | c) + " | " + (.value.summary | c) + " |") | join("\n")) + "\n\n"
               + "## 결정이 필요한 사항과 보류한 이유\n"
               + ([$rows[] | . as $row | $row.questions[] | "- " + tostring + " (" + ($row.path | tostring) + ")"] | if length == 0 then "없음" else join("\n") end) + "\n\n"
               + "## 실패한 호출\n"
               + ([.steps.newCopy.error, .steps.newCreate.error, .steps.newEdit.error, .steps.newAppend.error, .steps.newRead.error, .steps.newDevelop.error, .steps.newApply.error] | map(select(. != null and . != "")) | if length == 0 then "없음" else join("\n") end) + "\n" }
      onSuccess: SUCCESS
      onFailure: FAIL

workflow:
  id: pilot-workflow
  description: 어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00-request.md 파일의 경로를(파일명 제외) 입력하라. 예)D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
  maxIterations: 100
  input: string
  output: 
    value: "${ .steps.step01.output }"
  
  # input: 수정아이디 경로. 예)D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
  steps:

    - id: step01
      type: AGENT
      ref: requirment-analyzer-agent
      input: 
        workDir: "${ .input }"
      onSuccess: step02
      onFailure: FAIL

    - id: step02
      type: AGENT
      ref: impact-analyzer-agent
      input: 
        workDir: "${ .input }"
      onSuccess: step03
      onFailure: FAIL
      
    - id: step03
      type: AGENT
      ref: architect-agent
      input: 
        workDir: "${ .input }"
      onSuccess: SUCCESS
      onFailure: FAIL
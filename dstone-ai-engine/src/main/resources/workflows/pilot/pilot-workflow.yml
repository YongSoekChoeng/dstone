# 어플리케이션 운영관리 Workflow입니다. 요청서(00-request.md)에서 시작해 요구사항 → 영향도 분석 → 리뷰 → 설계 → 구현까지 진행합니다.
#
# 흐름
#   step01 요구사항 분석 → step02 영향도 분석 → step03 리뷰(자동 판정) → step04 사람의 결정
#     step04에서 고르는 것        가는 곳
#     진행                        step05 (설계)
#     재분석                      step02 (Agent가 지적 사항을 반영해 영향도 분석을 다시 함)
#     재리뷰                      step03 (02-impact.md를 사람이 직접 고친 뒤, 리뷰만 다시 받음)
#     중단                        FAIL
#   step05 설계 → step06 승인/반려 → step07 구현
#
# step04는 선택지 방식 APPROVAL입니다(routes). 갈 곳이 넷이라 승인/반려 둘로는 나눌 수 없어서 이름을 골라 가게 했습니다.
# step03(리뷰)은 통과든 불통과든 step04로 갑니다. 리뷰 결과는 참고 자료이고, 어떻게 할지는 사람이 정합니다.
#
# 재분석할 때 지적 사항이 전달되는 길
#   step02의 input.feedback이 step03의 불통과 사유(.steps.step03.output.reason)와 step04에서 사람이 적은 의견
#   (.steps.step04.output.comment)을 모아서 넘깁니다. 처음 실행할 때는 둘 다 아직 없어서 빈 글자가 됩니다.
#   그래서 step04에서 "재분석"을 고를 때는 comment에 무엇을 고쳐야 하는지 적어 주는 것이 좋습니다.
#
# 같은 step04에 여러 번 돌아와도 됩니다. 결정은 한 번 쓰고 지우므로 올 때마다 사람에게 다시 묻습니다.
# 되돌아가는 횟수는 maxIterations가 막습니다(재분석 한 바퀴 = step02, step03, step04 세 번).
workflow:
  id: pilot-workflow
  description: 어플리케이션 운영관리 workflow. 고객의 요청이 담긴 00-request.md 파일의 경로를(파일명 제외) 입력하라. 예)D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
  maxIterations: 100
  input: string
  output: 
    # 실행된 step의 output을 step id별로 모은다. 각 Agent가 본문은 파일로 저장하고 요약만 돌려주므로 결과가 작다.
    value: "${ .steps | map_values(.output) }"
  
  # input: 수정아이디 경로. 예)D:/AppHome/testApp/workshop/changes/work001[log-error-fix]
  steps:
    
    # 요구사항 분석
    - id: step01
      type: AGENT
      ref: pilot-requirment-analyzer-agent
      input: 
        workDir: "${ .input }"
      onSuccess: step02
      onFailure: FAIL

    # 영향도 분석 (재분석으로 돌아왔을 때는 feedback에 리뷰 사유와 사람의 의견이 담긴다)
    - id: step02
      type: AGENT
      ref: pilot-impact-analyzer-agent
      input: 
        workDir: "${ .input }"
        feedback: '${ [.steps.step03.output.reason, .steps.step04.output.comment] | map(select(. != null and . != "")) | join("\n") }'
      onSuccess: step03
      onFailure: FAIL
      
    # 요구사항/영향도 분석문서 리뷰 (통과든 불통과든 사람에게 넘긴다)
    - id: step03
      type: SUPERVISOR
      ref: pilot-impact-analyzer-review-agent
      input:
        workDir: "${ .input }"
      onSuccess: step04
      onFailure: step04
      
    # 분석문서를 본 사람이 다음에 할 일을 고른다
    - id: step04
      type: APPROVAL
      approverRole: "PL"
      routes:
        진행: step05
        재분석: step02
        재리뷰: step03
        중단: FAIL
      
    # 아키텍처 설계
    - id: step05
      type: AGENT
      ref: pilot-architect-agent
      input: 
        workDir: "${ .input }"
      onSuccess: step06
      onFailure: FAIL
      
    # 설계문서 리뷰 후 승인
    - id: step06
      type: APPROVAL
      approverRole: "PL"
      onSuccess: step07
      onFailure: FAIL
      
    # 구현
    - id: step07
      type: AGENT
      ref: pilot-developer-agent
      input: 
        workDir: "${ .input }"
      onSuccess: SUCCESS
      onFailure: FAIL

# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 AGENT step 다음에 SUPERVISOR step이 이어지면서, 구조화된 Verdict(pass/reason)
# 판정이 실제로 성공/실패를 잘 가르는지 확인해보기 위한 테스트 전용 Workflow입니다(자세한 내용은
# runtime.step.AgentStepRunner.runSupervisor 참고).
#
# 두 step 모두 input을 생략했으므로 기본값인 {{previous.text}}를 받습니다. draft step(general-chat)은
# 사용자 메시지를, judge step(verdict-judge-agent)은 draft가 만든 응답 텍스트를 사용자 메시지로 받습니다.
# verdict-judge-agent는 그 텍스트에 "안녕"이라는 단어가 들어 있는지만 검사합니다 - 들어 있으면 pass=true가
# 되어 SUCCESS로, 없으면 pass=false가 되어 FAIL로 끝납니다. SUPERVISOR는 받은 텍스트를 그대로 넘기므로
# 성공 시 최종 결과는 draft의 응답이고, 판정 사유는 context.steps.judge.data.reason(실패면
# steps.judge.error)에 남습니다.
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-supervisor-verdict-gate
#   message   : "안녕하세요"로 시작하는 인사말을 한 문장 만들어줘.
#   variables : {"role": "친절한 상담원"}
# message를 "인사말 없이 오늘 날씨만 알려줘"처럼 바꿔보면, judge에서 FAIL로 끝나는 것도 확인할 수 있습니다.
workflow:
  id: sample-supervisor-verdict-gate
  description: AGENT가 만든 텍스트를 SUPERVISOR(Verdict pass/reason)가 판정해 성공/실패를 가르는 흐름 확인용 Workflow.
  maxIterations: 3
  steps:

    - id: draft
      type: AGENT
      ref: sample-general-chat
      onSuccess: judge

    - id: judge
      type: SUPERVISOR
      ref: sample-verdict-judge-agent
      onSuccess: SUCCESS
      onFailure: FAIL

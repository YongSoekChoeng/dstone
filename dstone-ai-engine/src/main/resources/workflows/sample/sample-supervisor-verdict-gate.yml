# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 AGENT step 다음에 SUPERVISOR step이 이어지면서, 구조화된 판정({pass, reason})이
# 실제로 성공/실패를 잘 가르는지 확인해보기 위한 테스트 전용 Workflow입니다(자세한 내용은
# runtime.step.SupervisorStepExecutor 참고).
#
# - draft: 요청의 input.message를 sample-general-chat에게 넣고 답(string)을 받습니다. input.role은 그
#   Agent prompt의 {role}을 채웁니다.
# - judge: draft의 답({{steps.draft.output}})을 sample-verdict-judge-agent에게 넣어 판정받습니다. 그 Agent는
#   텍스트에 "안녕"이라는 단어가 들어 있는지만 검사합니다 - 들어 있으면 pass=true가 되어 SUCCESS로,
#   없으면 pass=false가 되어 FAIL로 끝납니다. 판정은 steps.judge.output({pass, reason})에 남습니다.
# - 성공 시 최종 결과는 draft의 답입니다(output.value).
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-supervisor-verdict-gate
#   input     : {"message": "\"안녕하세요\"로 시작하는 인사말을 한 문장 만들어줘.", "role": "친절한 상담원"}
# message를 "인사말 없이 오늘 날씨만 알려줘"처럼 바꿔보면, judge에서 FAIL로 끝나는 것도 확인할 수 있습니다.
workflow:
  id: sample-supervisor-verdict-gate
  description: AGENT가 만든 텍스트를 SUPERVISOR(pass/reason)가 판정해 성공/실패를 가르는 흐름 확인용 Workflow.
  maxIterations: 3
  input:
    schema:
      type: object
      properties:
        message: { type: string, description: draft step Agent에게 보낼 요청 }
        role: { type: string, description: draft step Agent(sample-general-chat)의 역할 }
      required: [message, role]
  output:
    value: "{{steps.draft.output}}"
  steps:

    - id: draft
      type: AGENT
      ref: sample-general-chat
      input: "{{input.message}}"
      onSuccess: judge

    - id: judge
      type: SUPERVISOR
      ref: sample-verdict-judge-agent
      input: "{{steps.draft.output}}"
      onSuccess: SUCCESS
      onFailure: FAIL

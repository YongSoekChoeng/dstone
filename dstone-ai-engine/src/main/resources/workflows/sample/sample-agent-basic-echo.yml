# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 AGENT step 하나만으로 이루어진, Workflow의 가장 기본적인 형태를 확인해보기
# 위한 테스트 전용 Workflow입니다.
# - input: string - 요청의 input(글자 하나)이 그대로 {{input}}이 됩니다.
# - reply step은 {{input}}을 sample-basic-echo-agent에게 넣고, Agent의 답(string)이 steps.reply.output에 남습니다.
# - output.value로 그 답을 최종 결과로 돌려줍니다.
#
# 여기서 쓰는 sample-basic-echo-agent는 프롬프트 템플릿 변수도, Tool도 전혀 쓰지 않는 아주 단순한
# Agent라서 글자 하나만 보내면 항상 성공합니다.
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-agent-basic-echo
#   input     : 오늘 기분이 어때?
workflow:
  id: sample-agent-basic-echo
  description: AGENT step 1개만으로 구성된 가장 기본적인 Workflow. input에 글자 하나만 보내면 된다.
  maxIterations: 3
  input: string
  output:
    value: "{{steps.reply.output}}"
  steps:

    - id: reply
      type: AGENT
      ref: sample-basic-echo-agent
      input: "{{input}}"
      onSuccess: SUCCESS

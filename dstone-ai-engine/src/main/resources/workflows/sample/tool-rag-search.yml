# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 TOOL step 하나(searchDocuments, tools.rag.RagSearchTool)만으로, RAG를
# "LLM을 호출하지 않고 순수하게 검색만" 하는 경로를 확인해보기 위한 테스트 전용 Workflow입니다.
# common.rag.RagRetrievalChain을 AGENT의 ragEnabled Advisor 경로가 아니라 TOOL step에서
# 직접 호출하는 경우입니다(자세한 내용은 tools.rag.RagSearchTool 클래스의 주석을 참고하세요).
#
# dstone.ai.rag.enabled=false(기본값)라면 tools.rag.RagSearchTool이 "실패: RAG가
# 비활성화되어 있습니다..." 라는 텍스트를 돌려주고(ToolStepRunner가 "실패"로 시작하는 텍스트를
# 보고 실패로 판정합니다), 그래서 이 Workflow도 정상적으로 FAILED로 끝납니다 - RAG가 꺼져있을
# 때는 이렇게 동작하는 것이 맞습니다. 반대로 dstone.ai.rag.enabled=true인데 아직 검색 결과가
# 없다면 "검색 결과가 없습니다."라는 텍스트가 나오는데, 이건 "실패"로 시작하지 않으므로 오히려
# SUCCESS로 처리됩니다 - 참고 자료가 실제로 검색되는 것을 보고 싶다면, 먼저 dstone-boot의
# "문서 임베딩 관리" 화면(POST /api/ai/embed/documents)에서 문서를 하나 적재해 둔 뒤 다시
# 호출해보면 됩니다.
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: tool-rag-search
#   message   : (적재해 둔 문서에 실제로 들어있는 키워드를 넣으면 됩니다)
workflow:
  id: tool-rag-search
  description: TOOL step으로 RAG 검색만 직접 호출(LLM 없음). RAG가 꺼져있거나 적재된 문서가 없으면 FAIL이 정상이다.
  maxIterations: 2
  steps:

    - id: search
      type: TOOL
      ref: searchDocuments
      inputTemplate: '{"query":"{previous}"}'
      onSuccess: SUCCESS
      onFailure: FAIL

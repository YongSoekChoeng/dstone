# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 AGENT step 하나가 toolsEnabled=true로 설정된 Agent(tool-demo-agent)를 호출해서,
# LLM이 스스로 필요한 Tool을 고르고 불러 쓰는 tool-calling 루프가 Workflow 안에서도 똑같이 잘
# 동작하는지 확인해보기 위한 테스트 전용 Workflow입니다(api.controller.ChatController로 직접
# 호출하는 경로와 달리, 이 경로는 runtime.step.AgentStepRunner를 거쳐서 실행됩니다).
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: agent-tool-calling
#   message   : 지금 몇 시야? getCurrentDateTime으로 확인해줘.
# 응답에 현재 시각이 실제로 반영되어 있다면 tool-calling이 제대로 일어난 것입니다. dstone-ai-engine의
# 로그(log4j2.xml에서 org.springframework.ai 레벨을 DEBUG로 낮추면 더 자세히 볼 수 있습니다)나
# ConfigCallLog가 남기는 Tools 관련 로그를 보면 어떤 Tool이 호출됐는지도 확인할 수 있습니다.
workflow:
  id: agent-tool-calling
  description: toolsEnabled=true Agent의 자율 tool-calling 확인용 Workflow. "지금 몇 시야?" 같은 메시지로 호출한다.
  maxIterations: 3
  steps:

    - id: ask
      type: AGENT
      ref: tool-demo-agent
      onSuccess: SUCCESS

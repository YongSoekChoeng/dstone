# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 TOOL step 2개를 순서대로 이어서(validateSqlSyntax -> getCurrentDateTime),
# LLM을 호출하지 않고도 TOOL step 자체와 step 간의 연결(runtime.step.ToolStepRunner,
# runtime.tool.ToolExecutor)이 잘 동작하는지 확인해보기 위한 테스트 전용 Workflow입니다.
# 두 Tool 모두 화이트리스트 없이 항상 켜져 있는 Tool이라서(tools.sql.SqlSyntaxTool,
# tools.sample.DateTimeTool) API 비용이나 네트워크 연결 없이도 바로 돌려볼 수 있습니다.
#
# validate step은 사용자 메시지({{input.message}})를 sql 인자로 넘기므로, 이 Workflow를 호출할 때는
# message 자리에 SQL 문을 넣어야 합니다. now step은 인자가 필요 없어서 input을 생략했습니다(빈 인자 {}로
# 호출됩니다). 최종 결과는 마지막 step(now)의 text, 즉 현재 날짜/시간입니다.
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-tool-chain-basic
#   message   : SELECT 1 FROM dual
# message를 "SELECT * FROM WRONG SYNTAX ("처럼 문법이 깨진 SQL로 바꿔서 호출해보면, validate에서
# 바로 FAIL로 끝나는 것도 확인할 수 있습니다(이 Workflow에는 실패했을 때 다시 고쳐보는 재작성
# 루프가 없습니다 - 그런 루프가 궁금하다면 workflows/sample-loop-retry-until-valid.yml을 참고하세요).
workflow:
  id: sample-tool-chain-basic
  description: TOOL step 2개(validateSqlSyntax→getCurrentDateTime) 연속 실행 확인용 Workflow. LLM 비용 없이 항상 성공한다(SQL이 올바르면).
  maxIterations: 3
  steps:

    - id: validate
      type: TOOL
      ref: validateSqlSyntax
      input:
        sql: "{{input.message}}"
      onSuccess: now
      onFailure: FAIL

    - id: now
      type: TOOL
      ref: getCurrentDateTime
      onSuccess: SUCCESS
      onFailure: FAIL

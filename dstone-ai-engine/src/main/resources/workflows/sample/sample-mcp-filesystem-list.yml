# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# sample-tool-chain-basic.yml과 같은 패턴(TOOL step 2개 연속 실행, LLM 비용 없음)이지만, 여기서
# 부르는 두 Tool(list_directory, read_text_file)은 로컬 @AiTool이 아니라 mcp/sample/
# sample-filesystem-mcp.yml에 정의된 외부 MCP 서버의 Tool입니다. runtime.tool.ToolExecutor
# 입장에서는 로컬 Tool을 부를 때와 완전히 같은 경로(caller 화이트리스트 → ToolCallback.call())로
# 처리되므로, TOOL step도 MCP Tool을 LLM 없이 그대로 직접 호출할 수 있다는 걸 보여주는 것이 이
# Workflow의 목적입니다.
#
# 동작 흐름
# 1) list: message로 받은 디렉토리({{inputs.message}})의 목록을 list_directory로 가져옵니다.
#    list_directory는 "[FILE] notes.txt", "[DIR] sub"처럼 한 줄에 하나씩 답합니다.
#    output.parse: lines + pattern으로 "[FILE] "로 시작하는 줄만 남기고 파일명 부분만 꺼내서,
#    output.lines에 파일명 리스트(예: ["notes.txt", "todo.txt"])를 만듭니다.
# 2) read-notes: forEach: steps.list.output.lines라서, 찾아낸 파일 개수만큼 read_text_file을 동시에
#    호출합니다. 각 반복은 자기가 맡은 파일명을 {{fileName}}(itemVariable)으로 받아 경로를 만듭니다.
#    파일이 몇 개든 YAML을 고칠 필요가 없습니다.
# 3) Workflow의 최종 결과는 마지막 step(read-notes)의 text, 즉 읽어온 파일 내용들을 줄바꿈으로 이은 값입니다.
#    파일별 내용은 실행 상세 조회의 context.steps.read-notes.items에 따로 남습니다.
#
# MCP 서버가 노출하는 디렉토리(${APP_HOME}/${APP_NAME}/mcp/server-filesystem) 밖의 경로를 넣으면
# MCP 서버가 거부해서 list step이 FAIL로 끝납니다. 화이트리스트 밖 접근이 실제로 막히는지 확인하는
# 셈이므로 정상 동작입니다.
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다(message는 지금 실행 중인
# conf/env{-profile}.properties의 APP_HOME 값에 맞춰서 넣어야 합니다 - 예를 들어 Windows 로컬이면
# "D:/AppHome/framework/dstone/dstone-ai-engine/mcp/server-filesystem/sample"을, WSL이면
# "/app/dstone/dstone-ai-engine/mcp/server-filesystem/sample"을 넣으면 됩니다):
#   workflowId: sample-mcp-filesystem-list
#   message   : (지금 환경의 APP_HOME)/dstone-ai-engine/mcp/server-filesystem/sample
workflow:
  id: sample-mcp-filesystem-list
  description: 외부 MCP 서버(filesystem)의 Tool 2개(list_directory→read_text_file)를 TOOL step에서 LLM 없이 직접 호출하는 확인용 Workflow. 파일이 여러 개면 파일마다 읽는다.
  maxIterations: 3
  steps:

    - id: list
      type: TOOL
      ref: list_directory
      input:
        path: "{{inputs.message}}"
      output:
        parse: lines
        pattern: '^\[FILE\] (.+)$'
      onSuccess: read-notes
      onFailure: FAIL

    - id: read-notes
      type: TOOL
      ref: read_text_file
      forEach: steps.list.output.lines
      itemVariable: fileName
      input:
        path: "{{inputs.message}}/{{fileName}}"
      onSuccess: SUCCESS
      onFailure: FAIL

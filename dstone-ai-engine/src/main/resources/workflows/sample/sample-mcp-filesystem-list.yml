# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# sample-tool-chain-basic.yml과 같은 패턴(TOOL step 2개 연속 실행, LLM 비용 없음)이지만, 여기서
# 부르는 두 Tool(list_directory, read_text_file)은 로컬 @AiTool이 아니라 mcp/sample/
# sample-filesystem-mcp.yml에 정의된 외부 MCP 서버의 Tool입니다. runtime.tool.ToolExecutor
# 입장에서는 로컬 Tool을 부를 때와 완전히 동일한 경로(caller 화이트리스트 → ToolCallback.call())로
# 처리되므로, TOOL step도 MCP Tool을 LLM 없이 그대로 직접 호출할 수 있다는 걸 보여주는 것이 이
# Workflow의 목적입니다.
#
# list step의 inputTemplate('{"path":"{previous}"}')이 쓰는 {previous}는, Workflow가 처음
# 실행될 때는 message 원문 그대로입니다 - 그래서 message 자리에 mcp/server-filesystem 아래
# 디렉토리의 절대경로를 넣어서 호출해야 합니다(그 밖의 경로를 넣으면 MCP 서버가 거부해서 list
# step이 FAIL로 끝납니다 - 그것도 정상 동작입니다, 화이트리스트 밖 접근이 실제로 막히는지 확인하는
# 셈입니다). list step은 structuredOutput을 켜지 않았으므로(기본값 false) 지금처럼 원본 입력(message)을
# 그대로 다음 step에 넘깁니다 - list_directory가 실제로 찾아낸 목록 자체는 이 Workflow에서 쓰지
# 않기 때문입니다(목록을 실제로 써야 한다면 structuredOutput: true를 켜면 됩니다 - 2026-09-23
# docs/temp/dstone-ai-engine-refactory-20260923-1.md 예시 B 참고, 이 샘플은 아직 그 예시까지는
# 다루지 않습니다).
#
# read-notes step은 structuredOutput: true라서, read_text_file이 실제로 읽어온 파일 내용을
# 다음 step(여기서는 Workflow의 최종 resultText)으로 그대로 돌려받습니다 - inputTemplate에 적힌
# ${APP_HOME}/${APP_NAME}/mcp/server-filesystem/sample/notes.txt를 항상 고정으로 읽습니다(${...}는
# common.loader.YamlDefinitionLoader가 conf/env{-profile}.properties의 값으로 치환해 줍니다 -
# 실행 환경(Windows 로컬/WSL/k8s)마다 실제 경로가 자동으로 달라집니다).
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다(message는 지금 실행 중인
# conf/env{-profile}.properties의 APP_HOME 값에 맞춰서 넣어야 합니다 - 예를 들어 Windows
# 로컬이면 conf/env.properties의 APP_HOME이 D:/AppHome/framework/dstone이므로
# "D:/AppHome/framework/dstone/dstone-ai-engine/mcp/server-filesystem"을, WSL이면 conf/env-wsl.
# properties의 APP_HOME이 /app/dstone이므로 "/app/dstone/dstone-ai-engine/mcp/server-filesystem"을
# 넣으면 됩니다):
#   workflowId: sample-mcp-filesystem-list
#   message   : (지금 환경의 APP_HOME)/dstone-ai-engine/mcp/server-filesystem
workflow:
  id: sample-mcp-filesystem-list
  description: 외부 MCP 서버(filesystem)의 Tool 2개(list_directory→read_text_file)를 TOOL step에서 LLM 없이 직접 호출하는 확인용 Workflow.
  maxIterations: 3
  steps:

    - id: list
      type: TOOL
      ref: list_directory
      inputTemplate: '{"path":"{previous}"}'
      onSuccess: read-notes
      onFailure: FAIL

    - id: read-notes
      type: TOOL
      ref: read_text_file
      inputTemplate: '{"path":"${APP_HOME}/${APP_NAME}/mcp/server-filesystem/sample/notes.txt"}'
      structuredOutput: true   # read_text_file이 실제로 읽어온 파일 내용을 그대로 돌려받는다(원본 입력 에코 대신)
      onSuccess: SUCCESS
      onFailure: FAIL

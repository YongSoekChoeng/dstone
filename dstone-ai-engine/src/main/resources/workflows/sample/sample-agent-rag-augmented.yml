# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 AGENT step 하나가 ragEnabled=true로 설정된 Agent(rag-demo-agent)를 호출해서,
# RAG(검색으로 찾은 내용을 참고해 답하는 기능) Advisor가 Workflow 안에서도 똑같이 잘 붙는지
# 확인해보기 위한 테스트 전용 Workflow입니다.
#
# 제대로 테스트해보려면 먼저 dstone-boot의 "문서 임베딩 관리" 화면(POST /api/ai/embed/documents,
# dstone.ai.rag.enabled=true가 켜져 있어야 합니다)에서 문서를 하나 미리 적재해 두어야 합니다.
# 문서를 적재하기 전에 호출해도 실패하지는 않습니다 - rag-demo-agent.yml에 ragAllowEmptyContext=true로
# 설정되어 있어서, 검색 결과가 하나도 없으면 그냥 참고 문서 없이 일반적인 답변으로 넘어갑니다
# (자세한 동작은 common.rag.RagRetrievalChain.buildAdvisor 참고).
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-agent-rag-augmented
#   message   : 적재된 문서 중에 (문서에 실제로 있는 키워드)에 대해 설명해줘.
workflow:
  id: sample-agent-rag-augmented
  description: ragEnabled=true Agent의 RAG Advisor 증강 확인용 Workflow. 먼저 문서를 적재해야 참고자료가 실제로 붙는다.
  maxIterations: 3
  steps:

    - id: ask
      type: AGENT
      ref: sample-rag-demo-agent
      onSuccess: SUCCESS

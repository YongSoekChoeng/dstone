# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 structuredOutput=true인 AGENT step이 만든 data를, 뒤이은 TOOL step이
# {stepId.키} 형태로 가져다 쓰는 연결 흐름을 확인해보기 위한 테스트 전용 Workflow입니다
# (docs/09.dstone-ai-engine.md §9의 "AGENT step에 structuredOutput: true를 주면..." 예시와
# 같은 패턴입니다).
#
# extract step(structured-extract-agent, structuredOutput:true)이 runtime.status.StepPayload
# (primaryText, data)라는 정해진 형식으로 응답하면, runtime.workflow.WorkFlowExecutor가 그
# data를 "extract.키"라는 이름으로 묶어서(네임스페이싱) variables에 합쳐 넣습니다. 그래서
# 다음에 오는 validate step의 inputTemplate에서 {extract.sql}이라고 쓰면 그 값을 그대로 꺼내
# 쓸 수 있습니다({stepId.키} 형태의 토큰은 TOOL step의 inputTemplate에서만 쓸 수 있습니다 -
# Agent의 prompt:는 점(.)이 섞인 키를 받을 수 없기 때문입니다. 자세한 내용은
# runtime.agent.AgentExecutor.promptSafeVariables 참고).
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-structured-output-chain
#   message   : 이 테이블에서 이름이 김철수인 사람을 찾고 싶어. SELECT * FROM member WHERE name = '김철수' 이렇게 쓰면 되지?
workflow:
  id: sample-structured-output-chain
  description: structuredOutput=true AGENT step의 data를 다음 TOOL step이 {extract.sql}로 참조하는 흐름 확인용 Workflow.
  maxIterations: 3
  steps:

    - id: extract
      type: AGENT
      ref: sample-structured-extract-agent
      structuredOutput: true
      onSuccess: validate
      onFailure: FAIL

    - id: validate
      type: TOOL
      ref: validateSqlSyntax
      inputTemplate: '{"sql":"{extract.sql}"}'
      onSuccess: SUCCESS
      onFailure: FAIL

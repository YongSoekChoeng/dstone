# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 선택지 방식 APPROVAL(routes)과, 같은 APPROVAL step으로 되돌아오는 흐름을 확인해보기 위한
# 테스트 전용 Workflow입니다. LLM을 부르지 않아서(TOOL step과 APPROVAL step뿐) 비용 없이 바로 돌려볼 수 있습니다.
#
# sample-approval-pause-resume.yml의 APPROVAL은 승인/반려 두 갈래(onSuccess/onFailure)입니다.
# 여기서는 routes에 이름을 적어서, 사람이 그 이름 중 하나를 고르게 합니다. 갈 곳이 셋 이상이거나
# "승인/반려"로는 뜻이 드러나지 않을 때 이 방식을 씁니다.
#
# 동작 흐름
# 1) stamp: 현재 시각을 찍습니다(getCurrentDateTime).
# 2) choose: 사람이 고를 때까지 멈춥니다(WAITING_APPROVAL). 고를 수 있는 이름은 routes의 키입니다.
#      완료   → SUCCESS
#      다시   → stamp로 되돌아가 시각을 다시 찍고, 또 choose에서 멈춥니다
#      중단   → FAIL
# 3) 최종 결과는 마지막으로 찍은 시각과 사람의 결정({route, approver, comment})입니다.
#
# 확인할 점
# - "다시"를 고르면 choose에 또 와서 다시 묻습니다. 결정은 한 번 쓰고 지우기 때문입니다.
#   (지우지 않으면 지난번 "다시"를 또 읽어서 사람에게 묻지 않고 끝없이 돕니다.)
# - 직전 결정은 steps.choose.output에 남아 있어서 다음 step이 "${ .steps.choose.output.comment }"로 꺼내 쓸 수 있습니다.
# - routes에 없는 이름을 보내면 400으로 거절되고, 실행은 그대로 대기 상태로 남습니다.
# - routes를 적은 APPROVAL에는 onSuccess/onFailure를 적지 않습니다(함께 적으면 엔진이 켜질 때 막힙니다).
#
# API로 확인해보려면(dstone-ai-engine 기준):
#   POST /api/ai/workflow/sample-approval-routes-loop/execute { "input": "선택지 테스트" }
#     -> status가 WAITING_APPROVAL, executionId가 함께 온다.
#   GET /api/ai/workflow/executions/{executionId}
#     -> pendingApproval: {"stepId":"choose","approverRole":"team-lead","routes":["완료","다시","중단"]}
#   POST /api/ai/workflow/executions/{executionId}/decision { "route": "다시", "approver": "...", "comment": "..." }
# dstone-boot의 "관리자 > Workflow 실행 관리" 화면에서는 선택지 이름마다 버튼이 하나씩 보입니다.
workflow:
  id: sample-approval-routes-loop
  description: 선택지 방식 APPROVAL(routes)과 같은 승인 step으로 되돌아오는 흐름 확인용 Workflow. LLM 비용 없음.
  maxIterations: 10
  input: string
  output:
    value:
      stampedAt: "${ .steps.stamp.output }"
      decision: "${ .steps.choose.output }"
  steps:

    - id: stamp
      type: TOOL
      ref: getCurrentDateTime
      onSuccess: choose
      onFailure: FAIL

    - id: choose
      type: APPROVAL
      approverRole: "team-lead"
      routes:
        완료: SUCCESS
        다시: stamp
        중단: FAIL

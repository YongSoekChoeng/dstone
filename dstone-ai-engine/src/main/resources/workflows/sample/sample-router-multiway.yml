# common.registry.WorkFlowRegistry가 기동할 때 이 파일을 읽어서 id로 등록해 둡니다.
#
# 이 Workflow는 ROUTER step 하나로 세 갈래 분기가 잘 되는지 확인해보기 위한 테스트 전용
# Workflow입니다(자세한 내용은 common.definition.workflow.step.RouterStepDefinition,
# runtime.step.RouterStepExecutor 참고). ROUTER step은 onSuccess 대신 routes(route 이름 -> 다음 step id
# 매핑)를 씁니다 - sample-router-classifier-agent가 고른 route가 billing/technical/other 중 하나면
# 그에 맞는 종착 step으로 이동합니다. 엔진이 routes 이름만 고를 수 있게 스키마(enum)로 강제하므로,
# 목록에 없는 이름을 고른 답은 모양이 틀린 답으로 보고 classify step이 실패합니다.
#
# input은 object({message, role})입니다.
# - message: 분류할 고객 문의 원문. classify와 종착 step이 .input.message로 씁니다.
# - role: 종착 step이 부르는 sample-role-reply-agent의 input.role로 넘어가서, 그 Agent prompt의 {role}을 채웁니다.
#
# 세 종착 step은 모두 sample-role-reply-agent를 재사용합니다. input을 맵으로 적어서 Agent input({role, message})을 채우고,
# message에는 jq로 분류 결과를 앞에 붙여 "어느 route로 왔는지"가 답에 드러나게 했습니다.
# 최종 결과는 실제로 실행된 종착 step 하나의 답입니다(// 로 세 step 중 값이 있는 것을 고름).
#
# dstone-boot의 "Workflow 테스트" 화면에서는 이렇게 호출해보면 됩니다:
#   workflowId: sample-router-multiway
#   input     : {"message": "지난달 카드 요금이 잘못 청구된 것 같아요.", "role": "친절한 상담원"}
# message를 "로그인이 안 돼요"(technical로 분기) 또는 "회사 위치가 어디인가요"(other로 분기)로
# 바꿔서 호출해보면, 각각 다른 종착 step으로 가는 것을 확인할 수 있습니다.
workflow:
  id: sample-router-multiway
  description: ROUTER step(billing/technical/other 3갈래)이 실제로 서로 다른 step으로 분기하는지 확인용 Workflow.
  maxIterations: 3
  input:
    schema:
      type: object
      properties:
        message: { type: string, description: 분류할 고객 문의 원문 }
        role: { type: string, description: 종착 step Agent(sample-role-reply-agent)의 역할 }
      required: [message, role]
  output:
    value: "${ .steps.billingStep.output // .steps.technicalStep.output // .steps.otherStep.output }"
  steps:

    - id: classify
      type: ROUTER
      ref: sample-router-classifier-agent
      input: "${ .input.message }"
      routes:
        billing: billingStep
        technical: technicalStep
        other: otherStep

    - id: billingStep
      type: AGENT
      ref: sample-role-reply-agent
      input:
        role: "${ .input.role }"
        message: '${ "(분류: " + .steps.classify.output.route + ") " + .input.message }'
      onSuccess: SUCCESS

    - id: technicalStep
      type: AGENT
      ref: sample-role-reply-agent
      input:
        role: "${ .input.role }"
        message: '${ "(분류: " + .steps.classify.output.route + ") " + .input.message }'
      onSuccess: SUCCESS

    - id: otherStep
      type: AGENT
      ref: sample-role-reply-agent
      input:
        role: "${ .input.role }"
        message: '${ "(분류: " + .steps.classify.output.route + ") " + .input.message }'
      onSuccess: SUCCESS

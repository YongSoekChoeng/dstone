# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# forEachVariable(병렬 실행) 동작을 눈으로 확인하기 위한 테스트 전용 Workflow다.
# LLM을 쓰는 AGENT step 없이 TOOL step(validateSqlSyntax) 하나만으로 구성해서 API 비용/네트워크 의존 없이 바로 돌려볼 수 있다.
#
# validate-each가 forEachVariable: sqlList를 가지므로, WorkFlowExecutor가 variables.sqlList(List)의
# 항목 수만큼 이 step 하나를 동시에 실행한다(runtime.workflow.WorkFlowExecutor.runForEach 참고). 각 반복에서는
# 그 항목이 {item} 토큰으로 들어오므로 inputTemplate이 {"sql":"{item}"}이다.
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: foreach-parallel
#   message   : (아무 문자열이나 - api.controller.WorkFlowController가 필수값으로 검증하지만, 이
#               Workflow의 step은 {item}만 쓰고 message/{previous}는 쓰지 않는다)
#   variables : {"sqlList": ["SELECT 1 FROM dual", "SELEC 1 FROM dual"]}
# ("SELEC"은 SELECT의 오타 - JSQLParser가 실제로 거부하는 문법 오류다. "SELECT * FROM WRONG SYNTAX"처럼
# 얼핏 이상해 보여도 "WRONG 테이블을 SYNTAX로 별칭"으로 해석되어 문법상 유효로 통과하는 문자열은 이
# 예시로 쓰지 않는다 - 직접 실행해서 실제로 FAIL이 나는 걸 확인했다.)
# sqlList 안의 모든 SQL이 문법상 올바르면 최종 결과가 SUCCESS로, 하나라도 문법 오류면 FAIL로 끝나면서
# 어느 것이 실패했는지 [검증 결과] 뒤에 실패 사유가 붙어 나온다 - 두 항목이 실제로 각자 독립적으로
# 동시에 실행/판정된다는 것을 확인할 수 있다. 항목을 3개, 10개로 늘려도 YAML은 그대로 두면 된다.
workflow:
  id: foreach-parallel
  description: forEachVariable 동작 확인용 테스트 Workflow - TOOL step 하나를 sqlList 항목 수만큼 동시 실행한다.
  maxIterations: 5
  steps:

    - id: validate-each
      type: TOOL
      ref: validateSqlSyntax
      inputTemplate: '{"sql":"{item}"}'
      forEachVariable: sqlList
      onSuccess: SUCCESS
      onFailure: FAIL

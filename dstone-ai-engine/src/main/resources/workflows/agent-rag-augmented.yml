# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# AGENT step 하나가 ragEnabled=true인 Agent(rag-demo-agent)를 호출해서, RAG(검색-증강) Advisor가
# Workflow 안에서도 그대로 붙는지 확인하기 위한 테스트 전용 Workflow다.
#
# 의미 있게 테스트하려면 먼저 dstone-boot "문서 임베딩 관리" 화면(POST /api/ai/embed/documents,
# dstone.ai.rag.enabled=true 필요)에서 문서를 하나 적재해야 한다. 적재 전에 호출해도 실패하지는
# 않는다 - rag-demo-agent.yml의 ragAllowEmptyContext=true라서 검색 결과가 없으면 그냥 일반 답변으로
# 진행한다(common.rag.RagRetrievalChain.buildAdvisor 참고).
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: agent-rag-augmented
#   message   : 적재된 문서 중에 (문서에 실제로 있는 키워드)에 대해 설명해줘.
workflow:
  id: agent-rag-augmented
  description: ragEnabled=true Agent의 RAG Advisor 증강 확인용 Workflow. 먼저 문서를 적재해야 참고자료가 실제로 붙는다.
  maxIterations: 3
  steps:

    - id: ask
      type: AGENT
      ref: rag-demo-agent
      onSuccess: SUCCESS

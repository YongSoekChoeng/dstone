# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# AGENT step 하나만으로 구성된, Workflow의 가장 기본 형태를 확인하기 위한 테스트 전용 Workflow다.
# StepType.AGENT는 항상 성공으로 취급되므로 onFailure가 없다(common.definition.StepType 참고).
#
# basic-echo-agent(agents/basic-echo-agent.yml)는 프롬프트 템플릿 변수도, Tool도 전혀 쓰지 않는
# 전용 Agent라, message 하나만 보내면 항상 성공한다 - variables는 필요 없다. 프롬프트 템플릿 변수
# 렌더링 자체를 확인하려면 workflows/agent-model-override.yml처럼 별도 Agent를 참고하거나,
# agents/general-chat.yml을 직접 chat API로 호출해서 확인한다.
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: agent-basic-echo
#   message   : 오늘 기분이 어때?
#   variables : (비워도 됨)
workflow:
  id: agent-basic-echo
  description: AGENT step 1개만으로 구성된 가장 기본적인 Workflow. variables 없이 message만 보내면 된다.
  maxIterations: 3
  steps:

    - id: reply
      type: AGENT
      ref: basic-echo-agent
      onSuccess: SUCCESS

# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# AGENT step 하나가 toolsEnabled=true인 Agent(tool-demo-agent)를 호출해서, LLM이 스스로 Tool을 골라
# 부르는 tool-calling 루프가 Workflow 안에서도 그대로 동작하는지 확인하기 위한 테스트 전용 Workflow다
# (api.controller.ChatController로 직접 호출하는 것과 달리, 이건 runtime.step.AgentStepRunner를 거친다).
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: agent-tool-calling
#   message   : 지금 몇 시야? getCurrentDateTime으로 확인해줘.
# 응답에 현재 시각이 반영돼 있으면 tool-calling이 실제로 일어난 것이다. dstone-ai-engine 로그
# (log4j2.xml의 org.springframework.ai를 DEBUG로 낮추면 더 자세히) 나 ConfigCallLog의 Tools 관련
# 로그로도 어떤 Tool이 호출됐는지 확인할 수 있다.
workflow:
  id: agent-tool-calling
  description: toolsEnabled=true Agent의 자율 tool-calling 확인용 Workflow. "지금 몇 시야?" 같은 메시지로 호출한다.
  maxIterations: 3
  steps:

    - id: ask
      type: AGENT
      ref: tool-demo-agent
      onSuccess: SUCCESS

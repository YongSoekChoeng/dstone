# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# AGENT step -> SUPERVISOR step, 이 두 단계로 구조화된 Verdict(pass/reason) 판정이 실제로 성공/실패를
# 가르는지 확인하기 위한 테스트 전용 Workflow다(runtime.step.AgentStepRunner.runSupervisor 참고).
#
# draft step(general-chat)의 응답 텍스트가 그대로 judge step(verdict-judge-agent)의 입력(userMessage)이
# 된다(AGENT/SUPERVISOR step은 inputTemplate을 안 쓰고 항상 {previous}를 그대로 넘긴다).
# verdict-judge-agent는 그 텍스트에 "안녕"이 포함되는지만 본다 - 포함되면 pass=true로 SUCCESS,
# 아니면 pass=false로 FAIL로 끝난다.
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: supervisor-verdict-gate
#   message   : "안녕하세요"로 시작하는 인사말을 한 문장 만들어줘.
#   variables : {"role": "친절한 상담원"}
# message를 "인사말 없이 오늘 날씨만 알려줘"처럼 바꾸면 judge에서 FAIL로 끝나는 것도 확인할 수 있다.
workflow:
  id: supervisor-verdict-gate
  description: AGENT가 만든 텍스트를 SUPERVISOR(Verdict pass/reason)가 판정해 성공/실패를 가르는 흐름 확인용 Workflow.
  maxIterations: 3
  steps:

    - id: draft
      type: AGENT
      ref: general-chat
      onSuccess: judge

    - id: judge
      type: SUPERVISOR
      ref: verdict-judge-agent
      onSuccess: SUCCESS
      onFailure: FAIL

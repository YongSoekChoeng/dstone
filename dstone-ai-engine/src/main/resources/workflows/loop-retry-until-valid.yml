# common.registry.WorkFlowRegistry가 기동 시 이 파일을 읽어 id로 등록한다.
# TOOL step이 실패하면 AGENT step(fix-agent)으로 갔다가 다시 TOOL step으로 되돌아가는 onFailure 루프를
# 확인하기 위한 테스트 전용 Workflow다(StepDefinition.onFailure에 "이전 step의 id"를 적으면 루프가 되고,
# WorkFlowDefinition.maxIterations가 무한루프를 막는다는 게 이 Workflow의 핵심 - 예전 oracle-to-postgresql
# 예시의 validate<->fix 루프와 같은 패턴을, SQL 변환이라는 무거운 도메인 없이 검증/수정 그 자체만
# 보여주도록 단순화했다).
#
# validate(TOOL validateSqlSyntax)가 실패하면 fix(AGENT fix-agent)로 가서 그 실패 사유({previous}로
# 전달됨)를 근거로 SQL을 고치고, 다시 validate로 돌아간다. maxIterations=6이면
# validate(1,실패)->fix(2)->validate(3,성공) 처럼 재작성이 여러 번 걸려도 넉넉히 여유가 있다 - 그래도
# 못 고치면 결국 "최대 실행 횟수 초과"로 FAILED가 되는 것도 확인할 수 있다.
#
# dstone-boot "Workflow 테스트" 화면에서 이렇게 호출해보면 된다:
#   workflowId: loop-retry-until-valid
#   message   : SELECT * FORM member WHERE id = 1
# ("FORM"은 "FROM"의 오타 - fix-agent가 고치면 validate가 통과하면서 SUCCESS로 끝난다)
workflow:
  id: loop-retry-until-valid
  description: TOOL 검증 실패 -> AGENT 수정 -> TOOL 재검증, onFailure 루프 + maxIterations 상한 확인용 Workflow.
  maxIterations: 6
  steps:

    - id: validate
      type: TOOL
      ref: validateSqlSyntax
      inputTemplate: '{"sql":"{previous}"}'
      onSuccess: SUCCESS
      onFailure: fix

    - id: fix
      type: AGENT
      ref: fix-agent
      onSuccess: validate

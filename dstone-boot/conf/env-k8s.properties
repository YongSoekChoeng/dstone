################################################################
# kind(Kubernetes) Environment
# DB/Redis/RabbitMQ는 kind 클러스터 바깥(WSL 호스트)의 "매니지드 서비스"로 간주,
# kind 도커 네트워크의 브리지 게이트웨이 IP(172.18.0.1)로 접근한다.
# (docker network inspect kind 로 확인, 서브넷 172.18.0.0/16)
################################################################
APP_HOME=/app/dstone
APP_NAME=dstone-boot
APP_CONF_DIR=/app/dstone/dstone-boot/conf
DB_HOST=172.18.0.1
DB_PORT=3306
RABBITMQ_HOST=172.18.0.1
RABBITMQ_PORT=5672
REDIS_HOST=172.18.0.1
REDIS_PORT=6379
KAFKA_HOST=172.18.0.1
# (2026-09-07) Kafka는 9092(PLAINTEXT)를 로컬/WSL 네이티브 클라이언트 전용으로 광고(advertise)하도록 바꾸고,
# kind Pod 전용 리스너(DOCKER)를 9094로 새로 추가했다 — docs/cloud-architecture.md 참고.
KAFKA_PORT=9094
FILE_UPLOAD_ROOT=/app/dstone/dstone-boot/fileUp
